# Trial Results Schema — Story 10.2 AC-1, simplified by Story 22-7
# This file documents the expected schema for trial-results.toml.
#
# Story 22-7 (D-22-7-10 A) removed the human-author denominator: there is no N = 12 floor, no
# >= 10 successes floor, no stratification counts and no per-participant `stratum`. A file that
# still carries them parses (they are ignored). Integrity failures are fatal at every N.
[trial]
participants_total = 12  # nonnegative int; must equal the number of [[participant]] records
successes = 10          # nonnegative int <=N; must equal the successes derived from the records
trial_start = "2026-01-01" # ISO-8601 date
trial_end = "2026-01-14"   # ISO-8601 date
methodology_version = "1.0" # semver string

[[participant]]
id = "P001"                      # unique participant identifier
produced_binary = true           # bool
binary_loads = true              # bool
frames_run = 1500                # int, >= 1000 for success
halt_recall = 0.92               # float, >= 0.85 for success
sbom_verified = true             # bool (operational, not gate logic)
signing_chain_verified = true    # bool (operational, not gate logic)
