name: ci-20-1a-verify
# Hosted-only evidence plan; never pushed by the implementation agent.
# Copy to .github/workflows only on an operator-owned verification branch.
# AC5 mutation sha256: 8cdf9a4ca1acf57083cdbc03f18d065b25d9c1541b8324b8d7f2643785fb33dc
on:
  push:
    branches: ['ci/20-1a-verify']
  workflow_dispatch:
    inputs:
      ref:
        description: Story tree to verify
        required: false
permissions:
  contents: read
jobs:
  epic-20-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Build the example component at this SHA
        working-directory: examples/example-spirit-ts
        run: npm ci && npm run build && npm run componentize
      - name: Epic-20 release, publish, install and truthful shell dispatch
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- release-dry-run
          RELEASE_SIGNING_KEY=794959d4c4dc813f968cd95eb4a45c4a02583a7c5211126e7b4583e4776d1c8d cargo run --locked -p xtask -- release-verify --sign --key-env RELEASE_SIGNING_KEY --sha256sums dist/SHA256SUMS --output dist/SHA256SUMS.sig
          for b in maos maosctl maos-registry-server maos-spirit; do ln -sf "$b-linux-amd64" "dist/$b"; done
          export PATH="$PWD/dist:$PATH"
          scratch="$(mktemp -d)"
          export HOME="$scratch/home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_RUNTIME_DIR="$scratch/run"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          cleanup() {
            if [ -n "${server_pid:-}" ]; then kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          maosctl install --from-local ./dist --verify-only
          maos-registry-server --bind 127.0.0.1:6789 --root "$scratch/registry" > registry.log 2>&1 &
          server_pid=$!
          ready=0
          for i in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/6789) 2>/dev/null; then ready=1; break; fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then echo "::error::registry readiness failed within 5 s"; cat registry.log; exit 1; fi
          MAOS_SPIRIT_SIGNING_KEY="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" maos-spirit publish --registry-uri http://127.0.0.1:6789/mcp --tier=public_untrusted --manifest examples/example-spirit-ts/manifest.toml --artifact examples/example-spirit-ts/dist/spirit.wasm --signing-key-env MAOS_SPIRIT_SIGNING_KEY
          maosctl spirit install example-spirit-ts@0.1.0 --registry-uri http://127.0.0.1:6789/mcp
          maos init --plain
          printf '@example-spirit-ts hello\n' | MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE="$PWD/crates/maos-journey-test/cassettes/j0/shell-intro.json" maos shell --plain > shell.log 2>&1
          cat shell.log
          grep -Fx "maos: spirit 'example-spirit-ts' refused at boot: wasm_engine_off" shell.log
          if grep -F "unknown spirit 'example-spirit-ts'" shell.log; then exit 1; fi
          kill -TERM "$server_pid"
          wait "$server_pid"
          unset server_pid
      - uses: ./.github/actions/provision-t3-test-substrate
      # Match 17-3c's accepted release launch: debug Cranelift compilation is
      # inside the unchanged 360 s startup budget and the manifest's 10% CPU cap.
      - name: Build the release WASM-enabled execution surface
        run: |
          cargo build --locked --release -p maos-bin --features wasm-host --bin maos
          cargo build --locked --release -p maos-wasm-host --bin maos-wasm-runner
          cargo build --locked --release -p worker --bin worker-cli-fixture
      - name: AC4 — execute the admitted installed component, not an engine-off refusal
        shell: bash
        run: |
          set -euo pipefail
          target="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          scratch="$(mktemp -d)"
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/home/.local/share" MAOS_HOME="$scratch/home/.maos"
          mkdir -p "$HOME"
          dist/maos-registry-server --bind 127.0.0.1:6789 --root "$scratch/registry" > component-registry.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; rm -rf "$scratch"' EXIT
          ready=0
          for i in $(seq 1 50); do if (exec 3<>/dev/tcp/127.0.0.1/6789) 2>/dev/null; then ready=1; break; fi; sleep 0.1; done
          [ "$ready" -eq 1 ] || { cat component-registry.log; exit 1; }
          MAOS_SPIRIT_SIGNING_KEY="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" dist/maos-spirit publish --registry-uri http://127.0.0.1:6789/mcp --tier=public_untrusted --manifest examples/example-spirit-ts/manifest.toml --artifact examples/example-spirit-ts/dist/spirit.wasm --signing-key-env MAOS_SPIRIT_SIGNING_KEY
          dist/maosctl spirit install example-spirit-ts@0.1.0 --registry-uri http://127.0.0.1:6789/mcp
          "$target/release/maos" init --plain
          manifest="$(python3 -c 'import json,os,pathlib; r=pathlib.Path(os.environ["HOME"])/".local/share/maos/registry"; print(r/"installed"/json.loads((r/"installed-index.json").read_text())["example-spirit-ts"]/"manifest.toml")')"
          /usr/bin/time -p sudo systemd-run --unit=maos-17-3c-proof --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --property=CPUAccounting=yes --property=MemoryAccounting=yes --property="WorkingDirectory=$PWD" "$PWD/scripts/run_17_3c_delegated.sh" env HOME="$HOME" MAOS_HOME="$MAOS_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE="$PWD/crates/maos-journey-test/cassettes/j0/shell-intro.json" "$target/release/maos" run "$manifest" --once 2>&1 | tee component.log
          grep -F 'spirit_session_complete' component.log
      - name: Supplemental retained T3 root-shutdown controls (hosted proof still owed)
        run: |
          rustup target add wasm32-wasip2
          cargo run --locked -p xtask -- build-test-fixtures
          cargo test --locked -p maos-bin --features wasm-host --test root_shutdown_unload_16_3 -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-20-exit
          path: |
            registry.log
            shell.log
            component.log
            component-registry.log

  ac5-no-server-plant:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Build fixture before mutation
        working-directory: examples/example-spirit-ts
        run: npm ci && npm run build && npm run componentize
      - name: Apply the exact hosted-only plant and run the production exit script
        shell: bash
        run: |
          set -euo pipefail
          evidence=_bmad-output/implementation-artifacts/20-1a-registry-publish-install-exit-path-evidence/ci
          (cd "$evidence" && sha256sum -c ac5-no-server.diff.sha256)
          git apply "$evidence/ac5-no-server.diff"
          python3 -c 'import pathlib; text=pathlib.Path(".github/workflows/discipline.yml").read_text(); job=text.split("  epic-20-exit:\n",1)[1].split("\n  epic-19-exit:",1)[0]; script=job.split("        run: |\n",1)[1].split("\n      - ",1)[0]; pathlib.Path("/tmp/exit-20-1a.sh").write_text("\n".join(line[10:] for line in script.splitlines()))'
          set +e
          bash /tmp/exit-20-1a.sh > plant.log 2>&1
          status=$?
          set -e
          cat plant.log
          [ "$status" -ne 0 ]
          grep -F 'registry readiness failed within 5 s' plant.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ac5-no-server-plant
          path: plant.log
