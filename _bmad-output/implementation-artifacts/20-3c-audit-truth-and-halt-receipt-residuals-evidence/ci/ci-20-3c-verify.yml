# 20-3c landing 1 — branch-only hosted verification of the legs that need the T3
# substrate and cannot run on the dev host. NOT under .github/workflows: it is
# evidence, not a gate, and is copied there only on an operator-approved branch.
#
# Diff under test (sha256 b07547c92134f4b09da864a444c70c1ccb578a98766a8160274520bb9e60a43c):
#   t3-two-host-delegation-2b.diff — host A's emit row names the admitted emitter
#   (spirit_pid != 0); host B's verified-peer intake row and root-minted outcome
#   row keep pid 0 (AC6.3, never a fabricated local pid for a remote sender).
#
# Also run here: the T2 live escape-anomaly vector (AC7.3), which needs the real
# runner and is green-or-skipped on the dev host.
#
# Landing 2 adds the `kernel-l2` job: the AC2/AC3 witnesses on the hosted
# toolchain, then each recorded local plant re-applied from its cut diff
# (sha256 in `../landing-2/plant-cuts.sha256`, checked first) with the matching
# witness required to go RED. Cut diffs apply to the landing-2 tree only:
#   P1 47c0383a4a04bea98cec3d1a3b2f2da0411f7c872162f6d4459b6792c1df3630  restore drain_for_spirit in the swap gate (AC2.5)
#   P2 59a873413789137ba8ba728e38c41ede6b708e5737032984c500cc128d9b4c55  precheck judges the global pending set
#   P3 13237af274648421b28a8b88d64f3b09cd08c2df86fb856100c36e4086f7d9cd  post-swap monitor judges the pending set
#   P4 0b4d10ea8380400bc9c3f38a47dc352311f37ba561c8496104949dab89145fb4  no-runtime RateLimited arm is a no-op (AC3.4)
#   P5 174501f35eb2419df875c9894946ead3dd9c7d9c333613f11f033abcffaa72a2  spawned delivery error discarded again
#
# STATUS: LOCAL-ONLY PROOF. Neither `kernel-l2` nor `t3-legs` has ever been run:
# this file is not under .github/workflows and nothing hosted has executed it.
# The plant proof for P0-P5 is the local run recorded in `../landing-2/plants.md`
# and `../landing-2/plant-logs/`. Each plant leg below asserts the SPECIFIC
# witness named in plants.md is on a FAILED line (not merely "some non-zero
# exit"); that assertion is likewise unexercised until the file is run hosted.
# Not pushed; copied under .github/workflows only on an operator-approved branch.
name: ci-20-3c-verify
on:
  workflow_dispatch:
jobs:
  t3-legs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Verify the diff under test is the one recorded
        run: |
          git diff -- crates/maos-bin/tests/two_host_delegation_2b.rs | sha256sum
          # expected: b07547c92134f4b09da864a444c70c1ccb578a98766a8160274520bb9e60a43c
      - name: Build the worker CLI fixture
        run: cargo run -p xtask -- build-test-fixtures --only worker-cli-fixture
      - name: AC6.3 — cross-host delegation pid attribution (T3)
        run: cargo test -p maos-bin --test two_host_delegation_2b -- --test-threads=1
      - name: AC7.3 — live escape anomaly (T2)
        run: cargo test -p maos-bin --test live_escape_anomaly_17_10 -- --test-threads=1
  kernel-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EV: _bmad-output/implementation-artifacts/20-3c-audit-truth-and-halt-receipt-residuals-evidence/landing-2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: AC2/AC3 witnesses are green on the hosted toolchain
        run: >
          cargo test --locked --no-fail-fast -p maos-kernel-core
          --test routed_halt_swap_20_3b --test halt_carry_20_3c
          --test hot_swap_halt_continuity_corpus_integration
          --test context_budget_gate_18_5 --test audit_sink_truth_16_5
      - name: The recorded plant cuts are the ones under test
        run: cd "$EV" && sha256sum -c plant-cuts.sha256
      - name: Define the plant helper (a plant is detected only when its NAMED witness is red)
        run: |
          cat > "$RUNNER_TEMP/plant.sh" <<'EOF'
          # plant <cut> "<witness> [<witness>...]" <cargo test args...>
          # Applies the cut, runs the suite with --no-fail-fast (so every binary
          # runs), restores src, then requires the suite RED and every named
          # witness on a `test <path>::<witness> ... FAILED` line. A compile error
          # or an unrelated failure is NOT detection.
          plant() {
            cut="$1"; witnesses="$2"; shift 2
            log="$RUNNER_TEMP/${cut%.diff}.log"
            git apply "$EV/plant-cuts/$cut"
            rc=0
            cargo test --locked --no-fail-fast "$@" > "$log" 2>&1 || rc=$?
            git checkout -- crates/maos-kernel-core/src
            cat "$log"
            [ "$rc" -ne 0 ] || { echo "plant $cut not detected: suite green"; exit 1; }
            for w in $witnesses; do
              grep -Eq "^test (.*::)?$w \.\.\. FAILED" "$log" \
                || { echo "plant $cut: witness $w did not go red"; exit 1; }
            done
          }
          EOF
      - name: P1 (AC2.5) — the swap gate drains again => FR53 witness and carry vectors red
        run: |
          . "$RUNNER_TEMP/plant.sh"
          plant P1-ac2-restore-drain.diff \
            "active_halt_keeps_identity_and_replay_context_across_hot_swap an_incompatible_successor_refuses_the_swap_with_the_halt_intact swap_continuity_with_seeded_halts_carries_them_instead_of_draining chain_walk_carries_every_real_pending_halt_at_every_hop_with_zero_dropped" \
            -p maos-kernel-core --test routed_halt_swap_20_3b --test halt_carry_20_3c --test hot_swap_halt_continuity_corpus_integration
      - name: P2 — precheck judges the global pending set => (a)/(b) red
        run: |
          . "$RUNNER_TEMP/plant.sh"
          plant P2-ac2-precheck-global-set.diff \
            "another_spirits_pending_halt_changes_neither_verdict_nor_precheck precheck_verdict_equals_swap_verdict_for_zero_one_and_two_carried_halts" \
            -p maos-kernel-core --test halt_carry_20_3c
      - name: P3 — monitor judges the pending set => a resolved carried halt auto-reverts the swap
        run: |
          . "$RUNNER_TEMP/plant.sh"
          plant P3-ac2-monitor-pending-set.diff \
            "resolving_the_carried_halt_inside_the_monitor_window_is_not_a_loss" \
            -p maos-kernel-core --test halt_carry_20_3c
      - name: P4 (AC3.4) — no-runtime RateLimited arm is a no-op => the synchronous-journal vector red
        run: |
          . "$RUNNER_TEMP/plant.sh"
          plant P4-ac3-no-runtime-noop.diff \
            "a_429_with_no_runtime_journals_the_rate_limited_frame_synchronously" \
            -p maos-kernel-core --test context_budget_gate_18_5
      - name: P5 — delivery error discarded => the counted-drop vector red
        run: |
          . "$RUNNER_TEMP/plant.sh"
          plant P5-ac3-discard-delivery-error.diff \
            "a_429_whose_spawned_delivery_fails_is_counted_as_a_rate_limited_drop" \
            -p maos-kernel-core --test context_budget_gate_18_5
