# Branch-only Story 18-7 AC4 proof. Copy to .github/workflows on
# ci/18-7-verify only; never merge this workflow or a planted production tree.
name: 18-7-proven-red
on:
  push:
    branches: ["ci/18-7-verify"]
permissions:
  contents: read
jobs:
  proven-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: 18-7-proven-red
      - name: Record provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustc -Vv
          uname -a
          cat /etc/os-release
      - name: Build real operator processes
        run: cargo build --locked -p maos-bin --bin maos -p maos-cli --bin maosctl
      - name: Unplanted process control must pass
        run: cargo nextest run --locked -p maos-journey-test --test journey_skill_authoring_18_7 -E 'test(=live_author_revision_restart_and_rejection_preserve_the_payload)'
      - name: Apply the single AC1 persisted-payload plant
        run: |
          set -euo pipefail
          sha256sum -c _bmad-output/implementation-artifacts/18-7-evidence/ci/plant.diff.sha256
          git apply --check _bmad-output/implementation-artifacts/18-7-evidence/ci/plant.diff
          git apply _bmad-output/implementation-artifacts/18-7-evidence/ci/plant.diff
          git diff -- crates/maos-skill/src/store.rs
      - name: Rebuild the planted operator processes
        run: cargo build --locked -p maos-bin --bin maos -p maos-cli --bin maosctl
      - name: Same process witness must find missing persisted diff and evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo nextest run --locked -p maos-journey-test --test journey_skill_authoring_18_7 -E 'test(=live_author_revision_restart_and_rejection_preserve_the_payload)' > planted.log 2>&1
          rc=$?
          set -e
          cat planted.log
          test "$rc" -ne 0 || { echo '::error::AC1 payload plant survived'; exit 1; }
          grep -q 'durable proposal payload: diff missing' planted.log || { echo '::error::red was not the durable payload oracle'; exit 1; }
          echo '::notice title=18-7 AC1 PROVEN-RED::dropping persisted revision payload is detected by the real daemon witness'
      - name: Upload plant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 18-7-proven-red
          path: |
            planted.log
            _bmad-output/implementation-artifacts/18-7-evidence/ci/plant.diff
            _bmad-output/implementation-artifacts/18-7-evidence/ci/plant.diff.sha256
