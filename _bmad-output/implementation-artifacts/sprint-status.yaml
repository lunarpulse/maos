  epic-16-retrospective: done  # ⚠ **UPDATED by Story 16-6 preflight round 3 (2026-09-19) — TWO MORE ROWS NEWLY OWED HERE.** **(NEW) `one-daemon-one-door` (Story 16-1) passes for a reason unrelated to what it asserts:** the job's only build step is `cargo build --locked -p worker --bin worker-cli-fixture` (`.github/workflows/discipline.yml:3643-3655`), while `one_daemon_one_door_16_1.rs:54-68` resolves `maosctl` beside `CARGO_BIN_EXE_maos` and hard-asserts `path.is_file()`. `maos-cli` is a plain `[dependencies]` entry of maos-bin (`crates/maos-bin/Cargo.toml:44`, section header `:39`), so cargo builds its lib and never its `[[bin]] maosctl` (`crates/maos-cli/Cargo.toml:10-12`) — the job is green only because `Swatinem/rust-cache@v2` restores a `target/` some other job populated. 16-6 adds the missing `cargo build --locked -p maos-cli --bin maosctl` step to ITS OWN job (AC6) and declines to inherit the template's bug. **(NEW) `terminate_spirit` is not idempotent:** `HaltId::new(format!("term-{spirit_id}-{spirit_pid}-{timestamp_ns}"))` (`halt/termination.rs:44-45`) takes the timestamp from `SystemTime::now()` (`:34-37`) and `boot_nonce` reaches only the receipt body (`:65`, `:101`), so two calls for the same (pid, boot_nonce) mint two distinct `HaltId`s and write FOUR `EpistemicHalt` TL frames with mismatched `kind_str`, with no dedup anywhere. 16-6 makes the double call UNREACHABLE (AC2(g)(i)'s `hook_name == "on_unload"` guard on `check_hook_outcome`'s `handle_crash` spawn, `scheduler_loop.rs:573-595`) rather than making the function idempotent, because a (pid, boot_nonce)-keyed id is a receipt-grammar change with its own consumers. ⚠ Also recorded by round 3: omission from `EXPECTED_GATES` is silently allowed — `check_ship_gate_completeness` iterates `EXPECTED_GATES` and never `needs` (`xtask/src/check_ship_gate_completeness.rs:212-230`), and nothing asserts every workflow job is enrolled somewhere; and `HookDispatcher::build_kernel_ctx` (`crates/maos-kernel-core/src/scheduler/hook_dispatch.rs:146-177`) has exactly ONE occurrence in the crate — its own definition — so it joins the 13.1 phantom-kernel-surface family beside `for_spirit.rs`. PRIOR: ⚠ **UPDATED by Story 16-6 preflight round 2 (2026-09-19) — TWO OWED ROWS ARE NOW CLOSED AT ORIGIN.** **(ii) IS NO LONGER OWED HERE — 16-6 takes it** (§14 Q4 = Shape A, operator-ratified): the `(Loaded,Unloaded)` arm 16-6 adds is itself the `load` trigger for the `on_unload`-hook-failure receipt gap — `unload` flips state at `scheduler_loop.rs:483` before the fallible `check_hook_outcome?` at `:502`, and `kernel_invocation_allowed` (`maos-spirit-abi/src/lifecycle.rs:510-515`) returns TRUE for an empty `enabled_hooks`, so a default-manifest door load DOES dispatch the hook. 16-6 AC2(g) therefore ships the cleanup-ordering repair (receipt/revoke/drain/remove run even when the hook fails), so **cluster (a) closes WHOLE, not half**, and the false-success-on-retry shape closes with it. **The topology/standalone admission-order divergence is NO LONGER OWED HERE either — 16-6 takes it** (§14 Q5 = Shape A): one extracted function serves the door, the standalone arm and the topology arm, so the ordering is unified AND topology's `emit_vetter_key_event` gains its rejection row (`main.rs:4746-4748`, silent today). ⚠ **NEWLY OWED HERE (Story 16-6 §11 row 7, 2026-09-19): the manifest's `[sandbox] tier` is PARSED AND DISCARDED** — `effective_sandbox_tier` (`cap_policy/mod.rs:201-224`) seeds the manifest leg from `manifest_scopes[pid].declared_tier`, absent on first admit ⇒ `SandboxTier::DEFAULT_FLOOR`, and `admit_spirit`'s `&SandboxConfig` parameter is read only for `image_pin` (`security/mod.rs:403`); no reader of `SandboxConfig.tier` exists on the admission path. A manifest declaring `tier = "T3"` or `"T4"` is admitted at **T2**, so `SandboxTierUnsupported`/`T3AdmissionFailed` are unreachable from a manifest. 16-6 declines it by charter (repairing it changes the effective sandbox tier of every ship