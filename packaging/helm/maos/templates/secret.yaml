{{- if and .Values.secrets (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maos.fullname" . }}-env
  labels:
    {{- include "maos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{- if not (hasPrefix "MAOS_" $name) }}
  {{- fail (printf "secrets key %q is not a MAOS_* name" $name) }}
  {{- end }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
