# Story 5.5b — backfill review (2026-05-25): the gate's regex-based detection
# is unable to match `impl ProvidersSection { pub fn new ... }` and
# `impl McpSection { pub fn new ... }` because non-greedy `[\s\S]*?` in
# `new_impl_re()` consumes across impl-block boundaries when an earlier
# impl block's `pub fn new` is consumed first (see review §finding 17).
# Both types DO have valid `::new` constructors at
# `crates/maos-kernel-core/src/security/manifest.rs:1464` and `:1586` —
# the gate bug is the false negative. Allowlist these three pairs while
# the regex-based gate gets rebuilt against a proper Rust syn-walk; the
# real fix is tracked as a deferred-work item against Epic 6 toolchain
# hardening. NOT a real pub-field-constructor violation in Story 5.5b's code.
