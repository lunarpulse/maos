field_name = "primary"
reason = "Pre-existing GATE regex bug — `impl ProvidersSection { pub fn new }` exists at manifest.rs:1464 but the regex's non-greedy `[\\s\\S]*?` consumes the new_impl_re match across an earlier impl block. Allowlisted at Story 5.5b backfill review per §finding 17."

