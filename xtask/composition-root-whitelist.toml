# Whitelist for check-composition-root-completeness gate.
# Adapters listed here are EXEMPT from the "exactly one construction"
# assertion.  Each entry is a simple string (the adapter type name).
# Justifications are documented in inline comments above each entry.
#
# NOTE: the gate is a regex scan over the whole of `crates/maos-bin/src/main.rs`.
# That file holds the single production composition root (in `fn main`) AND a
# large set of embedded smoke/journey harnesses (`smoke_orchestrator_fanout_6_2`,
# `smoke_founder_loop_8_4`, the `dispatch` smoke entrypoints, `test_*` fns) plus
# per-Spirit live-MCP client setup.  Each harness / per-Spirit path builds its
# own ISOLATED composition root for test determinism — these are not duplicate
# shared-state instances, so the regex's duplicate-count heuristic over-reports.

# JournalAdapter — constructed multiple times in one-shot arms because
# each arm opens its own per-invocation Lifecycle Journal file.
# The journal is NOT shared global state; each one-shot arm is independent.
whitelist = [
    "JournalAdapter",
    "SecurityManagerAdapter",
    "SpiritSchedulerAdapter",

    # --- Story 8.1–8.14 additions (Epic 8 daemon + per-Spirit MCP + smokes) ---

    # TelemetryStreamAdapter — one instance in the production boot path
    # (`fn main`), plus one per embedded smoke/journey harness and test fn
    # (smoke-mira-nash, founder-loop, MockMcpClientPort tests). Each harness
    # needs its own telemetry stream so assertions observe only its own events.
    "TelemetryStreamAdapter",

    # CapabilityRegistryAdapter — single production instance in `fn main`;
    # additional instances are per-smoke-harness (each smoke run issues its own
    # capability tokens against an isolated registry) and in test scaffolding.
    "CapabilityRegistryAdapter",

    # MemoryManagerAdapter — single production instance in `fn main`; additional
    # instances back isolated smoke/journey runs that must not share working
    # memory with the production root or with each other.
    "MemoryManagerAdapter",

    # IacBusAdapter — single production instance in `fn main`; additional
    # instances are constructed by the founder-loop / orchestrator-fanout smoke
    # harnesses (`smoke_founder_loop_8_4`, `smoke_orchestrator_fanout_6_2`),
    # each wiring its own in-process IAC bus for an isolated Spirit topology.
    "IacBusAdapter",

    # InferencePortAdapter — production instance in `fn main`; the second site
    # is the Researcher live-MCP `call` path, a distinct component with its own
    # provider router, not a clone of the production inference port.
    "InferencePortAdapter",

    # McpClientAdapter — constructed once PER cognitive Spirit (Butler wraps its
    # calendar/slack/linear/figma servers; Researcher wraps web/arXiv/github/
    # citation). These are per-Spirit MCP clients, never a shared instance.
    "McpClientAdapter",

    # TransparencyLogAdapter — one instance in the main production boot path
    # (`fn main`, opens `audit_db_path` shared across services), plus one in the
    # `network`-gated cohort A2A daemon entrypoint
    # (`run_cohort_a2a_daemon_from_env`, opens the daemon config's own
    # `transparency_log_path` with its own boot nonce). These are mutually
    # exclusive process run-modes (main daemon vs cohort-A2A daemon), each with
    # its own DB path — NOT a duplicate shared-state instance. (Story 12.x cohort
    # mesh; surfaced by the first full-branch CI run over the Epic 11+12 line.)
    "TransparencyLogAdapter",

    # CrossTeamConsentAdapter — one instance in the collective-store setup path
    # and one in the cohort A2A daemon's crossing-port construction, where
    # Story 13.6's `with_erase_reconciliation` needs the consent projection to
    # authorize a two-sided erase. EXEMPTION PREMISE, and it is machine-checked:
    # the adapter is a pure projection over shared state — `struct
    # CrossTeamConsentAdapter { state: Arc<CohortManifestState> }`, exactly one
    # field, and both sites clone the SAME `bootstrap.state` Arc. Two instances
    # cannot diverge because neither owns anything to diverge with. If a field
    # is ever added, that premise dies and this exemption must be re-argued —
    # `cross_team_consent_adapter_is_a_pure_shared_state_projection`
    # (crates/maos-bin/tests/cross_team_consent_13_3.rs) reds when the shape
    # changes, so the exemption cannot rot silently. (Story 13.6 closure.)
    "CrossTeamConsentAdapter",
]
