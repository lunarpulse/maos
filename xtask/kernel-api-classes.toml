"maos_kernel_core::scheduler::maos_domain::ports::SpiritSchedulerPort"           = "supervision"
"maos_kernel_core::security::maos_domain::ports::SecurityManagerPort"            = "supervision"
"maos_kernel_core::memory::maos_domain::ports::MemoryManagerPort"                = "data-movement"
