cause = "The skill's TOML frontmatter has an `id` field that is empty or contains only whitespace. Every skill must have a non-empty identifier."
remediation = "Set the `id` field in the TOML frontmatter to a non-empty value. Example: `id = \"my-skill-name\"`. The ID must also conform to charset rules (lowercase alphanumeric, hyphens, dots)."
