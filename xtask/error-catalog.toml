[[error]]
code = "ESkillSchema::MissingFence"
cause = "The skill document is missing the `---` TOML frontmatter fence. The `maos.skill.v1` format requires a fenced TOML block at the top of the document."
remediation = "Add the TOML frontmatter fence at the top of the skill document. The document must start with `---` followed by TOML key-value pairs and end with `---` before the markdown body. Example:\n```\n---\nid = \"my-skill\"\nname = \"My Skill\"\nversion = \"1.0.0\"\n---\nSkill body here.\n```"
rust_path = "ESkillSchema::MissingFence"
source_file = "crates/maos-skill/src/errors.rs"
description = "maos.skill.v1 document missing the --- TOML frontmatter fence"
severity = "user"
recovery_class = "retry_with_correction"
owner = "maos-skill"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ESkillSchema::UnknownField"
cause = "The TOML frontmatter contains a field name that is not recognized by the skill schema. The schema uses `deny_unknown_fields` to reject any extraneous keys, preventing silent misconfiguration."
remediation = "Remove the unrecognized field from the TOML frontmatter. Check the skill schema documentation for the list of valid fields. Common mistakes: typos in field names (e.g. `verson` instead of `version`), or fields from a newer schema version not yet supported."
rust_path = "ESkillSchema::UnknownField"
source_file = "crates/maos-skill/src/errors.rs"
