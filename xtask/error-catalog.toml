cause = "The TOFU (Trust On First Use) pin for a peer spirit was explicitly invalidated — either because the peer restarted and generated a new identity, or because an operator manually revoked the pin."
remediation = "Re-establish trust with the peer by initiating a new first-contact handshake. If the peer restarted legitimately, accept the new pin. If the invalidation was unexpected, investigate whether the peer's identity was compromised before re-pinning."
