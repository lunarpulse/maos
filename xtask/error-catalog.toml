kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "EPinMismatch::NotPinned"
cause = "No TOFU pin exists for the target peer because first-contact has never been completed. The spirit attempted to communicate with a peer it has never established trust with."
remediation = "Initiate a first-contact handshake with the peer to establish and record the TOFU pin. Use `maos a2a trust <peer_id>` or the equivalent API call to perform initial trust establishment before attempting communication."
