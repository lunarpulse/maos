recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "EManifestSchemaConflict"
cause = "The spirit manifest contains both a `[class]` section and a `[cli_wrapper]` section. Per architecture §6.7 these are mutually exclusive — a spirit is either a native class-based spirit or a CLI wrapper, never both."
remediation = "Remove one of the conflicting sections from the manifest. If the spirit wraps an external CLI binary, keep `[cli_wrapper]` and remove `[class]`. If it is a native spirit, keep `[class]` and remove `[cli_wrapper]`."
rust_path = "CliWrapperAdmissionError::EManifestSchemaConflict"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "Manifest declares both [class] and [cli_wrapper] — mutually exclusive per architecture §6.7"
severity = "policy"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ECliBinaryNotFound"
cause = "The CLI wrapper spirit references an external binary (via the manifest's `binary` or `path` field) that does not exist at the declared filesystem path and is not discoverable on the system PATH."
remediation = "Install the required CLI binary and ensure it is either on PATH or referenced by absolute path in the manifest. Verify with `which <binary>` or `ls <declared_path>`. If running in a container, ensure the binary is included in the image."
rust_path = "CliWrapperAdmissionError::ECliBinaryNotFound"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "CLI binary not found on PATH or at the declared path"
severity = "infra"
