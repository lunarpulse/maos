# ---------------------------------------------------------------------------
# RegionError — crates/maos-domain/src/region.rs
# Story 9.4b AC-5 region-pinning (NFR-Comp-4 / PIPL §40)
# ---------------------------------------------------------------------------

[[error]]
code = "ERegionViolation"
cause = "A region-pinned read or write received data tagged for a different region, or foreign-origin data without a verifiable region tag. The enforcement path rejects it instead of trusting data outside the configured home region."
remediation = "Inspect the expected and found regions and the operation detail. Route the operation to data bound to the configured home region, or restore its verifiable region metadata from a trusted source. Do not relabel foreign data or disable pinning to force the operation through."
rust_path = "RegionError::ERegionViolation"
source_file = "crates/maos-domain/src/region.rs"
description = "Foreign-region data detected on a read/verify/enforcement path — region pinning fail-closed (NFR-Comp-4 / PIPL §40)"
severity = "security"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "1.0.0"

[[error]]
code = "ERegionTagInvalid"
cause = "An operator-supplied region tag is invalid after trimming whitespace and ASCII lowercasing: its length is outside 2..=32 bytes or it contains characters other than lowercase ASCII letters, digits, and hyphens."
remediation = "Correct the region tag in operator configuration or MAOS_REGION_HOME to 2..=32 ASCII characters from [a-z0-9-], then retry. Region tags are canonicalized by trimming and ASCII lowercasing; underscores, Unicode characters, and embedded spaces remain invalid."
rust_path = "RegionError::ERegionTagInvalid"
source_file = "crates/maos-domain/src/region.rs"
description = "Operator-supplied region tag failed the frozen ascii-v1 grammar (AC-12), rejected before any key derivation"
severity = "policy"
recovery_class = "fix_config"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "1.0.0"

[[error]]
code = "ETeamIdInvalid"
cause = "A team identifier is not already canonical lowercase ASCII [a-z0-9-] with a length of 2..=32 bytes. TeamId rejects uppercase letters, whitespace, Unicode, and other characters without normalizing signed identity material."
remediation = "Correct the team identifier at its authoritative configuration or manifest source to 2..=32 lowercase ASCII letters, digits, or hyphens, and regenerate any signatures over changed material. Do not silently trim or lowercase an existing signed team identifier."
rust_path = "TeamIdError::ETeamIdInvalid"
source_file = "crates/maos-domain/src/team.rs"
description = "Operator-supplied team id failed the frozen lowercase ASCII tenant-identity grammar (ADR-055)"
severity = "policy"
recovery_class = "fix_config"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "2.2.0"

