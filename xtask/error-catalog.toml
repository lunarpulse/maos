kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "EOutputShapeAdapterNotRegistered"
cause = "The spirit manifest references an `output_shape_version` whose adapter is not registered in the Spirit registry. The kernel cannot parse the CLI output without a matching adapter."
remediation = "Register the output-shape adapter in the Spirit registry before submitting the manifest. Implement the adapter for the declared `output_shape_version` and register it. Alternatively, change the manifest to reference an already-registered shape version."
rust_path = "CliWrapperAdmissionError::EOutputShapeAdapterNotRegistered"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "Output-shape adapter not registered in the Spirit registry"
severity = "policy"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ECliWrapperRequiresT3"
cause = "The Worker manifest's `[sandbox]` `tier` resolves to a tier other than `T3` (`T0`, `T1`, `T2` or `T4`). A `[cli_wrapper]` Worker runs only inside a verified T3 rootless container (`--network=none`, `--read-only`, `--cap-drop=ALL`, `--user=65534:65534`), whose only egress is the daemon's proxy socket at `/proxy/egress.sock`. Below `T3` no scoped egress or credential custody exists for a Worker; `T4` has no spawn path. `maos run` refuses the manifest at load, before any probe or spawn. `T3` is not the highest tier, and there is no `hardened` tier: the parser accepts only `T0`–`T4`."
remediation = "Set `tier = \"T3\"` in the manifest's `[sandbox]` table, or omit `[sandbox]` (a Worker requests `T3` by default). The operator must also grant `T3` for the manifest's `command` and `[author]` `name` in the `MAOS_HOST_GRANTS` file; otherwise admission fails with `ECliWrapperTierNotGranted`."
rust_path = "CliWrapperAdmissionError::ECliWrapperRequiresT3"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "Worker ([cli_wrapper]) manifest requested a sandbox tier other than T3; T3 is the only Worker path (below it no scoped egress exists, T4 has no spawn path)"
severity = "policy"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ECliProbeFailed"
cause = "The CLI wrapper ran its probe subprocess (typically `<binary> --version` or a custom probe command) and the subprocess exited with a non-zero code, produced unreadable output, or violated the adapter's declared probe protocol."
remediation = "Run the probe command manually outside MAOS to diagnose the failure: e.g. `<binary> --version`. Check that the binary starts correctly, has the right permissions, and that its output matches the adapter's expected probe format. This error is retryable — transient failures (e.g. a locked resource) may resolve on retry."
rust_path = "CliWrapperAdmissionError::ECliProbeFailed"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "CLI probe subprocess exited non-zero, stdio I/O failure, or adapter-declared probe protocol violated"
severity = "infra"
recovery_class = "retry"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ECliWrapperTierNotGranted"
cause = "The spirit manifest requests a sandbox tier (e.g. t3) that the host-side grant allowlist does not include. The kernel enforces fail-closed behavior — it will not silently downgrade to a lower tier."
remediation = "Add the requested sandbox tier to the host's grant allowlist configuration. Locate the grant allowlist (typically in the MAOS host config or deployment policy) and add the spirit's identity or class to the t3 grant list. Re-deploy after updating the allowlist."
rust_path = "CliWrapperAdmissionError::ECliWrapperTierNotGranted"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "Manifest requested sandbox tier not granted by host-side grant allowlist — fail-closed, no silent downgrade"
severity = "security"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.9.0"

[[error]]
code = "ERespawnWithContextUnsupported"
cause = "The spirit manifest sets `recovery_policy = \"respawn_with_context\"`, but this recovery mode is not yet implemented — it is deferred to Epic 10 / NFR-Rel-3 (HSIS). The kernel fails closed rather than silently ignoring the unsupported policy."
remediation = "Change the manifest's `recovery_policy` to a supported value (e.g. `\"respawn\"` or `\"halt\"`). The `respawn_with_context` mode will be available in a future release. Monitor the MAOS roadmap for Epic 10 delivery."
rust_path = "CliWrapperAdmissionError::ERespawnWithContextUnsupported"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "recovery_policy=respawn_with_context deferred to Epic 10 / NFR-Rel-3 HSIS — admission fails closed"
severity = "policy"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.9.0"

[[error]]
code = "EEgressProxyUnavailable"
cause = "The Worker manifest declares a non-empty `[cli_wrapper]` `egress`, but this `maos` root has no egress proxy: the platform is not Unix, no MAOS home could be resolved (`MAOS_HOME` and `HOME` unset), the proxy failed to start (`maos: egress proxy unavailable: …` on stderr at boot), or the root is shutting down. A Worker's only route to the network is that proxy, so admission refuses rather than spawn a Worker whose declared egress cannot be enforced."
remediation = "Run the Worker on Linux from a root that can resolve its MAOS home and create its private `egress` directory under it; check boot stderr for the `egress proxy unavailable` line and fix the reported cause. A Worker that needs no network can drop `egress` from its manifest instead."
rust_path = "CliWrapperAdmissionError::EEgressProxyUnavailable"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "A non-empty Worker egress policy requires an available daemon-owned proxy"
severity = "security"
recovery_class = "fix_config"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.1.0-alpha.1"

[[error]]
code = "EEgressNotGranted"
cause = "The Worker manifest's `[cli_wrapper]` `egress` lists a `host:port` destination that the operator's host grant for this `command` and `[author]` `name` does not permit. Manifest egress must be a subset of the grant's `permitted_egress_destinations`, where a bare host grants only `host:443`. `maos run` refuses the Worker at admission, before any probe or spawn; no destination is ever added from the manifest."
remediation = "Remove the destination from the manifest's `egress`, or have the operator add it to the matching `[[grant]]` entry's `permitted_egress_destinations` in the `MAOS_HOST_GRANTS` file (write `host:port` for any port other than 443), then rerun `maos run`."
rust_path = "CliWrapperAdmissionError::EEgressNotGranted"
source_file = "crates/maos-domain/src/cli_wrapper.rs"
description = "The Worker requests a host:port destination outside its host grant"
severity = "security"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.1.0-alpha.1"

