cause = "The CLI wrapper's actual output (observed during the probe or first invocation) does not match the `output_shape_version` declared in the manifest. Per ADR-021 the kernel enforces shape consistency at admission time to prevent downstream parsing failures."
remediation = "Update the manifest's `output_shape_version` to match the CLI binary's actual output format, or update the CLI binary to produce output matching the declared shape. Run the CLI manually and compare its output structure against the declared shape adapter."
rust_path = "CliWrapperAdmissionError::EOutputShapeAdapterMismatch"
