cause = "The skill-queue store encountered a filesystem error reading queue.json or creating, writing, syncing, or renaming its atomic replacement. A nonexistent queue file alone is treated as an empty queue, not this error."
remediation = "Inspect the underlying I/O error and the queue path, normally ~/.local/share/maos/skills/queue.json. Restore directory access, writable storage, and available space as appropriate, then retry; preserve the existing queue rather than replacing it with fabricated admission state."
