cause = "During a hot-swap, the successor spirit does not support the halt-protocol schema version that the predecessor used to serialize its halt state. This violates invariant I14 which requires halt-protocol continuity across swaps."
remediation = "Ensure the successor spirit's manifest declares support for the predecessor's halt-protocol version in its `halt_versions_supported` list. If the predecessor used halt protocol v2, the successor must list v2 (or a superset). Update the successor manifest and re-attempt the hot-swap."
