[[error]]
code = "ESkillSchema::InvalidIdCharset"
cause = "The skill's `id` field contains characters outside the allowed set. Only lowercase letters (a-z), digits (0-9), hyphens (-), and dots (.) are permitted."
remediation = "Rename the skill ID to use only allowed characters. Replace uppercase letters with lowercase, spaces/underscores with hyphens. Example: `My_Skill` → `my-skill`."
