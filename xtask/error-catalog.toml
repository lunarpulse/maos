cause = "The TOML content within the frontmatter fences failed to parse. This is caused by malformed TOML syntax (unclosed quotes, invalid escapes), a missing required field, or a field with the wrong value type (e.g. string where integer expected)."
remediation = "Validate the TOML frontmatter with a TOML linter (e.g. `taplo check`). Fix any syntax errors, add missing required fields, and ensure value types match the schema. Common issues: unquoted strings, missing commas in arrays, bare keys with special characters."
rust_path = "ESkillSchema::TomlParse"
source_file = "crates/maos-skill/src/errors.rs"
