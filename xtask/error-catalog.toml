cause = "The observed cryptographic fingerprint of a peer spirit does not match the previously pinned fingerprint (TOFU). This is a potential man-in-the-middle indicator — something is presenting a different identity than what was trusted on first contact."
remediation = "Do NOT blindly accept the new fingerprint. Investigate why the peer's fingerprint changed. If the peer was legitimately re-keyed, verify through an out-of-band channel and update the pin. If the change is unexplained, treat it as a potential security incident and escalate to the security team."
