# FR63 Typed Error Catalog — kernel-emitted E* invariant error set
#
# Source-of-truth for the E*-prefixed error taxonomy (preflight F1).
# CI gate: `cargo xtask error-catalog-check`
#
# Every E*-prefixed enum variant and E*-prefixed error enum in the scan
# directories MUST have a corresponding [[error]] entry with all required
# metadata and teaching fields. The check asserts the bijection:
#   - un-catalogued E* variant in source  → FAIL
#   - stale registry entry (source gone)  → FAIL
#   - missing metadata field              → FAIL
#   - committed JSON differs from generation → FAIL
# Generate docs/errors/error-catalog.json with `cargo xtask error-catalog-generate`.
# Edit teaching text here, never in the generated JSON.
#
# Field reference (NFR-Doc-2):
#   code            — stable user-facing E-prefixed identifier
#   cause           — concrete trigger grounded in the raising code
#   remediation     — actionable resolution distinct from cause/description
#   severity        — user | policy | security | infra | internal
#   recovery_class  — retry | retry_with_correction | reject | fix_config | escalate
#   owner           — crate that defines the variant
#   kernel_or_spirit — kernel | spirit | both
#   since_version   — semver when the variant was introduced

[meta]
catalog_version = "1.0.0"
since_story = "9-3"
fr_reference = "FR63"
# Directories scanned by the AST inventory (relative to workspace root).
scan_dirs = [
    "crates/maos-domain/src",
    "crates/maos-kernel-core/src",
    "crates/maos-compliance/src",
    "crates/maos-a2a-core/src",
    "crates/maos-skill/src",
]
# Lower-bound regression guard (F2): the catalog MUST contain at least this
# many entries.  The actual count is an output, not a target.
min_entry_count = 35

# ---------------------------------------------------------------------------
# IacBusError — crates/maos-domain/src/iac_bus_types.rs
# ---------------------------------------------------------------------------

[[error]]
code = "EIntentLineageBroken"
cause = "A cross-spirit IAC (inter-agent communication) frame arrived with an empty `intent_lineage` field, but its origin is non-human. Invariant I14 requires that all machine-originated frames carry a non-empty intent lineage to prevent consent-laundering — one spirit impersonating a human origin to bypass approval gates."
remediation = "Ensure the sending spirit populates the `intent_lineage` field on every outbound IAC frame. The lineage must trace back to the original human-approved intent. Review the sending spirit's IAC dispatch logic to confirm it propagates lineage from its own inbound frames."
rust_path = "IacBusError::EIntentLineageBroken"
source_file = "crates/maos-domain/src/iac_bus_types.rs"
description = "Cross-Spirit frame has empty intent_lineage on non-human origin (I14 consent-laundering guard)"
severity = "security"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
code = "ECrossWallRecallDenied"
cause = "Cross-wall log recall could not prove fresh directional consent: the grant is absent or reversed, the consent provider or state is unavailable or stale, or the remote read port is not configured."
remediation = "Inspect the refusal reason. Obtain a fresh grant for the requested team and log-recall direction, restore the consent provider or state if unavailable, and configure the remote read port before retrying. Do not bypass the consent check."
rust_path = "LogRecallError::ECrossWallRecallDenied"
source_file = "crates/maos-domain/src/log_recall.rs"
description = "Cross-wall log recall lacks a fresh directional consent grant"
severity = "security"
recovery_class = "reject"
owner = "maos-domain"
kernel_or_spirit = "kernel"
since_version = "0.5.0"

[[error]]
