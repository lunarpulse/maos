# Model-pin currency data for `xtask check-model-currency` (Story 17-5).
#
# This file is the gate's ONLY source of vendor facts: the gate reads repo-local
# files only and opens no socket, so it cannot learn that a vendor retired a
# model — a human updates this file when a vendor page changes (re-verified
# 2026-10-06 against the pages below), and the gate then reds every pin that
# fell behind. Policy owner:
# Winston (wave + pin policy); gate owner: Murat. Adding an id to `allowed` or
# moving one to `retired` is a policy edit, never a drive-by.
#
# Shape, per provider (the segment before the first `.` of a manifest
# `provider.complete` entry, e.g. `anthropic` in `anthropic.claude-sonnet-5-5`;
# the bare provider name is what `xtask/provider-pricing.toml` carries):
#   allowed  — ids a pin may name today.
#   retired  — ids a pin must NOT name: vendor-retired OR vendor-deprecated
#              (a deprecated pin is a countdown, not a currency). Every entry
#              carries a `replacement`, which MUST be in `allowed`.
#
# `replacement` is DISPLAY-ONLY guidance printed in the violation message (OD1,
# ratified): the gate never rewrites a manifest. Where the vendor names a
# different replacement it is cited in a comment; the value here is the
# tier-equivalent current id from `allowed` (haiku → haiku, sonnet → sonnet).
#
# An id in neither list is UNKNOWN and reds too — add it to `allowed` (policy)
# or fix the typo. A provider absent from this file is unknown the same way.
#
# Sources, fetched 2026-10-06 (this is the only network this story used):
#   Anthropic: platform.claude.com/docs/en/models/overview
#              platform.claude.com/docs/en/about-claude/model-deprecations
#   OpenAI:    developers.openai.com/api/docs/models
#              developers.openai.com/api/docs/deprecations
#
# ⚠ WATCH (operator ruling 2026-10-06: keep, re-sweep later) —
# `claude-haiku-4-5-20251001` is Active, but the vendor's earliest retirement
# date for it is 2026-10-15. It stays `allowed` until the vendor deprecates it.
# TRIGGER: the Anthropic deprecation notice for Claude Haiku 4.5 (model-
# deprecations page / developer email). That day it moves to `retired`
# (replacement: the vendor's named successor) and this gate reds every pin of
# it — hello-spirit, the 17-5 sweep targets, the price book and the `main.rs`
# default — which is the re-sweep. Not a pin the gate can pre-empt offline.

