[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS workspace automation — CI gates, linting, checks"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lib]
name = "xtask"
path = "src/lib.rs"

[dev-dependencies]
# Story 10.4a AC1 — proven-red vectors exercise the live kernel adapter + Loom-lite.
maos-kernel-core = { path = "../crates/maos-kernel-core" }
# Mock port interior mutability (rule rs-parking-lot: lock guards, no unwrap).
parking_lot = "0.12"

[dependencies]
tempfile = "3"
# Story 10.4a — check-migration-merkle re-derives oracles in-process from the
# SQLite corpus (canonical read + payload oracle) and, when a live Postgres is
# configured, runs the migration engine cross-check (re-derives BOTH backends).
maos-loom-lite = { path = "../crates/maos-loom-lite" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
maos-skill = { path = "../crates/maos-skill" }   # Story 7.4 — check-skill-schema round-trip gate
maos-eval = { path = "../crates/maos-eval" }     # Story 7.5b — nfr-onb-1-gate (stratification + cohort evaluator + seam)
clap = { version = "4.5", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml 0.9 is the de-facto Rust YAML 1.2 parser. In low-maintenance mode;
# migration to a maintained fork is a future concern but the crate works for
# the current coverage-matrix contract.
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
# chrono: date math for corpus-staleness. default-features=false avoids oldtime
# and serde integrations not needed at v0.1-alpha.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

maos-iac = { path = "../crates/maos-iac" }
maos-audit = { path = "../crates/maos-audit" }
maos-domain = { path = "../crates/maos-domain" }
# Story 10.4a — RTO drill gate needs the SQLite backup API for cold-restore
# timing (same bundled+backup features as maos-audit).
rusqlite = { version = "0.31", features = ["bundled", "backup"] }