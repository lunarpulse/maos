# D3/F3→B — per-gate phase disposition (v1.5-ship-gate graduation mechanism).
# The flat `gates` list above is the coverage-matrix validation set (NFR-Meta-3).
# The `[[ship_gate]]` table below records each Story-10.x ship gate's verdict
# disposition per phase, mechanizing the advisory→blocking cutover. The
# `check-ship-gate-completeness` lint and the `v1.5-ship-gate` aggregate job
# consume this to enforce that a gate's phase disposition is explicit and that
# the "WILL block at v1.5" promise is testable, not aspirational.
[[ship_gate]]
name = "check-pentest-gate"
disposition = { v1_0 = "blocking-when-present", v1_5 = "blocking-when-present" }

[[ship_gate]]
name = "check-third-party-trial"
disposition = { v1_0 = "blocking-when-present", v1_5 = "blocking-when-present", v2_0 = "blocking" }

# Story 11.1b (D10) — RELABELED: CLI-wrapper distributional; advisory.
# NOT the equivalence-binding gate. The authoritative binding row is
# check-wasm-form-equiv. Routing/default-deny (D15b + §A7 derive-and-reconcile):
# a PRESENT artifact MUST carry non-empty per-run hashes for both forms (the
# gate independently recomputes the U-statistic from them); an artifact WITHOUT
# hashes is an unrecognized measurement → ERROR (never advisory-green); a
# deterministic fixture (all hashes within a group identical) → ERROR (route to
# check-wasm-form-equiv). An ABSENT artifact passes advisory (engagement pending).
[[ship_gate]]
name = "check-cross-form-equiv"
disposition = { v1_0 = "advisory", v1_5 = "advisory" }

# Story 11.1b AC3 (D9/D10/D15a) — NEW tiered behavioral-oracle cross-form
# equivalence gate. THE authoritative equivalence-binding row for ADR-031.
# Deterministic tiered oracle (100% invariant / ≥75% cosmetic), live cargo
# test, both legs enforced by the xtask (base + equiv-fault-inject). Phased:
# ADVISORY at v1.0/v1.5 (a RED oracle emits a §A7.5 WOULD-HAVE-BLOCKED banner
# but does not fail the v1.0 ship-gate aggregate — matches check-red-team-gate);
# BLOCKING at v2.0 (a RED or absent/unmeasured oracle BLOCKS ship). The
# advisory-now/blocking-v2.0 graduation is machine-readable here, not prose-only.
[[ship_gate]]
name = "check-wasm-form-equiv"
disposition = { v1_0 = "advisory", v1_5 = "advisory", v2_0 = "blocking" }

[[ship_gate]]
name = "check-red-team-gate"
disposition = { v1_0 = "advisory", v1_5 = "blocking-when-present" }

[[ship_gate]]
name = "check-export-control"
disposition = { v1_0 = "blocking", v1_5 = "blocking" }

[[ship_gate]]
name = "check-fuzz-targets"
disposition = { v1_0 = "blocking", v1_5 = "blocking" }

[[ship_gate]]
name = "check-cna-registration"
disposition = { v1_0 = "blocking-when-present", v1_5 = "blocking" }

[[ship_gate]]
name = "check-ko-coverage"
disposition = { v1_0 = "blocking", v1_5 = "blocking" }


[[ship_gate]]
name = "windows-check"
disposition = { v1_0 = "advisory", v1_5 = "blocking" }

# Story 10.3 AC-2/AC-3 (NFR-Sec-5/6) — pre-merge fuzz BUILD prerequisite.
# `fuzz-build` runs the fuzz build for both targets under the nightly toolchain
# (selected via the rustup nightly channel, not an inline toolchain override); it
# is a `needs:` dependency of `v1-0-ship-gate` (the aggregate fails if it fails) so
# its disposition is recorded here for registry completeness.
[[ship_gate]]
name = "fuzz-build"
disposition = { v1_0 = "blocking", v1_5 = "blocking" }

# Story 10.3 NFR-Sec-5/6 — fuzz CPU-hour floor gate (release-time, NOT per-merge).
# `check-fuzz-floor` sums fuzz-ledger cpu_seconds over the trailing 90-day
# window and blocks the v1.0 GA release if the per-target (>=72 CPU-hr) or
# aggregate (>=1000 CPU-hr) floor is unmet. Advisory (warn-only) until the
# ledger spans >= 90 days of history — the bootstrap window in which the floor
# is logically unsatisfiable. Run via workflow_dispatch at release time; not a
# `v1-0-ship-gate` per-merge `needs:` entry (a merge must not block on nightly
# fuzz cadence).
[[ship_gate]]
name = "check-fuzz-floor"
disposition = { v1_0 = "blocking", v1_5 = "blocking" }

# Story 10.4a AC2 (NFR-Ops-10) — SQLite→Postgres migration triple-oracle gate.
