# The release-critical set `release-ready` must require, pinned INDEPENDENTLY of `aggregate.needs` and
# `release-ready.needs` (CI release-ready program W4). `check-ship-gate-completeness` refuses when
# `release-ready.needs` is not exactly `jobs`, or when the non-excluded steps of the consolidated `xtask-gates`
# job are not exactly `steps`, so a job or gate removed from BOTH workflow lists (or swapped for another one)
# is a red on the merge path, never a silent shrink of what a release candidate requires.
#
# Changing this file is the deliberate act: a job or step leaves it only with the plan's section 4 reason
# (`_bmad-output/planning-artifacts/ci-release-ready-program-2026-11-14.md`) and, for the excluded steps, a row in
# `RELEASE_READY_EXCLUDED` (`xtask/src/check_ship_gate_completeness.rs`). A job that leaves the merge path for a
# nightly run must leave this file with that reason; `nfr-rel-11-halt-receipt-999pct` and `expensive-tests` returned
# for GA and are pinned here AND in both workflow lists.
#
# `ci-test-producer` is not a direct need: the consumers (`workspace-test-suite`, the epic exits, the cgroup and
# wasm-host legs) need it, and a failed or skipped producer skips them, which `release-ready` reads as red.

