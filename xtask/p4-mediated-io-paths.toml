# P4 mediated-I/O exemption paths — workspace-relative directories and files
# that LEGITIMATELY hold direct external-I/O code as the kernel's mediated
# I/O zone. Paths with trailing `/` match the entire subtree.
#
# Story 2.2 AC4 — see `xtask/src/check_service_boundary.rs::check_p4_audit_chain`.

[exempt]
paths = [
  "crates/maos-kernel-core/src/capability/",
  "crates/maos-kernel-core/src/io/",
  "crates/maos-kernel-core/src/security/sandbox/",
  "crates/maos-kernel-core/src/journal/",
  "crates/maos-kernel-core/src/iac/transparency_log.rs",
  # Story 5.5d §A4 Debt 2b — operator-config TOML resolution (`~/.config/maos/operator.toml`)
  # is a startup-only mediated-I/O surface. The kernel boots once, reads the
  # operator's policy, and never returns to disk for this config. Adding a
  # full IoSubsystemPort::read_file_at_path surface would be a v0.7 deferred
  # work item per RegistrySection design notes.
  "crates/maos-kernel-core/src/security/operator_config.rs",
  # Story 6.2 AC5 — CliWrapperSpirit admission probe. `probe_and_verify_shape`
  # invokes the declared CLI subprocess once at admission to verify the
  # output-shape adapter version (ADR-021 fail-loud). The full FR52 runtime
  # subprocess invocation routes through the existing `security/sandbox/t3/`
  # exempt path (Story 5.5a); the admission-time probe lives in its own
  # mediated lane because it runs BEFORE the Spirit transitions to Loaded
  # (no T3 sandbox context yet established).
  "crates/maos-kernel-core/src/lifecycle/cli_wrapper/",
]
