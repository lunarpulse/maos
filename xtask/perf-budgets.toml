# Per-iteration counts of `crates/maos-bench/src/bin/tier_c_harness.rs` paths
# under `valgrind --tool=callgrind` (instructions, minus the empty path) and its
# counting allocator (allocations). `baseline` is the committed figure; a row
# without one reads ABSENT. A deliberate change re-baselines here, in the same
# commit, with the measured figure and the reason (ADR-068 §6).
# Hosted instruction baselines: run 41372839255, job 125046786606, 2026-11-02;
# debug rustc 1.99.1, Valgrind 3.22.0. Exact empty-subtracted per-iteration figures
# and provenance: 20-7 evidence/landing-1/plants.md. Measured Tier C rows bind;
# unmeasured metrics remain advisory. The opening 2% count tolerance is unchanged.

