# Story 20-7 AC3 — the ONE performance budget source (ADR-068 §5; story 20-7).
#
# No budget constant lives anywhere else: the maos-bench harnesses and benches
# (`crates/maos-bench/src/budgets.rs`), the kernel's NFR-Perf-3 guard test, the
# verdict command (`check-perf-verdict`) and Tier C (`check-perf-counts`) all
# read this file; `xtask/tests/perf_budgets_20_7.rs` scans for the literals.
#
# Tiers (ADR-068 §1): "C" = deterministic counts, every pull request, GitHub
# hosted, fork-safe; "W" = wall clock, trusted code only, the stable runner
# `maos-perf` (L2). `direction`: "max" = the value must stay at or under the
# budget (latency), "min" = at or over it (throughput). Units: "us"
# microseconds, "frames_per_s", "instructions" / "allocations" per iteration.
#
# Dispositions follow `gate-registry.toml`'s phase ladder (v1_0, v1_5, v2_0,
# v2_2; nearest at or before `protocol.phase` wins). Every Tier W row is
# ADVISORY (shadow, ADR-068 §7.2) until the stable runner has run >= 2 weeks and
# >= 20 `main` runs; AC11 flips them in one commit with the measured tolerances.
# Tolerances below are OPENING values (confidence rule 6), not measurements.

[protocol]
phase = "v1_5"                  # equals `gate_common::CURRENT_PHASE` (vector-pinned)
calibration_cv_max_pct = 2.0    # ADR-068 §5: fixed CPU / fsync workloads, 30 timings each
calibration_drift_max_pct = 3.0
mad_multiplier = 3.0            # ADR-068 §5: regression must also exceed 3 x baseline MAD
baseline_runs = 10              # ADR-068 §6: median of the last ten PASS runs on main
stale_hours = 48                # ADR-068 §6: newest ledger entry older than this is red

