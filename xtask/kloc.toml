# Per-crate KLOC budgets — production Rust code only.
# Excludes: target/, tests/, benches/, examples/, fuzz/, spirits/, *.md, doctests.
# Alarms and hard-fails are independent: a per-crate ceiling breach fails the build
# even if the aggregate alarm has not fired.
#
# Ceilings are reviewed at each epic retrospective.
#
