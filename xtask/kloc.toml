# Per-crate KLOC budgets — production Rust code only.
# Excludes: target/, tests/, benches/, examples/, fuzz/, spirits/, *.md, doctests.
# Alarms and hard-fails are independent: a per-crate ceiling breach fails the build
# even if the aggregate alarm has not fired.
#
# Ceilings are reviewed at each epic retrospective.
#
# -----------------------------------------------------------------------------
# Epic 5 retro §A4 Debt 3 — in-progress decomposition of `maos-kernel-core`
# -----------------------------------------------------------------------------
# `maos-kernel-core` measures ~21,370 LOC at HEAD (post-Story-5.5d), 3.56× over
# the 6,000 ceiling below. Per §A4 decision (2026-05-24): DECOMPOSE the crate
# across Epic 6/7 stories. DO NOT raise the ceiling — amending the ceiling to
# fit current size would invert ADR-038's purpose (the ceiling is the
# architectural discipline, not a measurement of current state).
#
# Phased extraction plan:
#   Phase 1 — Story 6.5 (gateway sub-modules)
#     extract `maos-iac`            (~3,350 LOC: TL + log_recall + bus routing)
#     extract `maos-manifest`       (~2,500 LOC: TOML parsing + section schemas)
#   Phase 2 — Story 6.1 prep (full IAC bus + DRR + retract primitive)
#     CORRECTED 2026-05-25: Original boundary at `capability/` directory level
#     created circular dependencies via `working_memory/orchestrator.rs` (depends
#     on halt, iac, journal, security) and `cap_audit/writer_task.rs` (depends on
#     iac::TL). New boundary extracts ONLY the pure capability surface:
#       cap_tokens, cap_quota, cap_audit (types + channel only),
#       working_memory (types + store only).
#     Extracted LOC: ~1,271 (was ~2,400). Status: DONE.
#   Phase 3 — Story 7.2 (full registry publish/install/yank + air-gapped import)
#     residual security/* fold      (~1,000 LOC moves into maos-manifest or
#                                    maos-sandbox depending on classifier)
#   Phase 4 — Story 7.x (TBD; scheduling depends on remaining size)
#     extract `maos-scheduler`      (~1,961 LOC)
#     extract `maos-memory`         (~1,659 LOC)
#     extract `maos-hot-swap`       (~1,317 LOC)
#     extract `maos-supervision`    (~569 LOC)
#
# At HEAD post-Phase-4 the residual `maos-kernel-core` is ~5,400 LOC (halt +
# inference + telemetry + revocation + journal + lifecycle + orchestrator +
# small glue modules + composition-root forwarders). Under the 6,000 ceiling.
#
# **[SUPERSEDED 2026-07-25 — see "Ceiling rule" below.]** The Epics-6/7 interim
# posture required any story ADDING to `maos-kernel-core` to first extract a
# candidate module netting to ≤0 added LOC, justified by "the gate's continuing
# failure on every CI run keeps the breach visible until decomposition lands".
# That premise is dead: the gate is GREEN (the Epic-10/12 retros re-based ceilings
# to measured residuals), and Phase 4 never ran. Retained here as history only.
# -----------------------------------------------------------------------------
# CEILING RULE (founder-ratified 2026-07-25; replaces "tight measured residual")
# -----------------------------------------------------------------------------
# Lunarpulse: "as the founder I am okay with incrementing the kernel size."
# Team discussion (Winston · Murat · John · Amelia · Mary) — UNANIMOUS that this
# licenses re-basing the CEILINGS and replacing this policy, and does NOT license
# relaxing the `kernel-core-baseline.toml` PIN or pre-approving any story's delta.
# The two are different mechanisms: the PIN is anti-DRIFT (it never forbade
# growth, only UNRECORDED growth); the CEILINGS are anti-GROWTH.
#
#   ceiling(crate) = measured_tokei_code + max(100, ceil(0.02 * measured))
#   _aggregate_hardfail = measured_aggregate + max(100, ceil(0.02 * measured))
#
# Recalculated ONLY at an epic retrospective, or under an explicitly authorized
# measured grant. NOT per story. Slack is operating capacity, NOT authorization:
# every kernel-core change still needs its measured FLAG-Winston grant and a
# HISTORY row. A crate that breaches before the next review needs a named grant
# or a decomposition — the formula is never silently re-run to fit.
#
# MIGRATION RULE (2026-07-25): this pass only ever RAISES. 13 of 29 governed
# crates moved; the other 16 already carry forward-declared budgets larger than
# the formula (e.g. maos-cap-registry 3000 at 0 measured) and were left alone.
# Lowering a ceiling is an architectural decision for a retrospective, never a
# side effect of a migration whose purpose was to RELIEVE constraint.
#
# WHY THIS REPLACED "tight measured residual, NOT round headroom":
#   • It left crates with 2–10 lines of unusable capacity (notify-push 2,
#     loom-lite 3, kernel-core 10), so ordinary work required a governance event.
#   • Story 13.5b alone triggered EIGHT ceiling re-base events.
#   • Those re-bases were bookkeeping for an ADVISORY gate: `kloc-check` ran
#     `continue-on-error: true` from 2026-06-11, so it could not fail a build.
#     The tight-residual rule is WHY it had to be advisory — nobody can ship
#     against a 2-line budget. With real reserve the gate becomes enforceable,
#     and it is flipped to BLOCKING in the same change.
#   • The Epic-5 decomposition plan this posture served was never arithmetically
#     sound: its named extractions total ~13,627 LOC against a crate then at
#     ~21,370, so the stated ~5,400 residual was unreachable by its own moves.
#     Phase 4 remains real architectural debt, tracked below — but it is NOT a
#     release gate disguised as a budget rule, and it must never block a
#     correctness or compliance repair.
