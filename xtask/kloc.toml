# CEILING RULE (founder-ratified 2026-07-25; replaces "tight measured residual")
# -----------------------------------------------------------------------------
# Lunarpulse: "as the founder I am okay with incrementing the kernel size."
# Team discussion (Winston · Murat · John · Amelia · Mary) — UNANIMOUS that this
# licenses re-basing the CEILINGS and replacing this policy, and does NOT license
# relaxing the `kernel-core-baseline.toml` PIN or pre-approving any story's delta.
# The two are different mechanisms: the PIN is anti-DRIFT (it never forbade
# growth, only UNRECORDED growth); the CEILINGS are anti-GROWTH.
#
#   ceiling(crate) = measured_tokei_code + max(100, ceil(0.02 * measured))
#   _aggregate_hardfail = measured_aggregate + max(100, ceil(0.02 * measured))
#
# Recalculated ONLY at an epic retrospective, or under an explicitly authorized
# measured grant. NOT per story. Slack is operating capacity, NOT authorization:
# every kernel-core change still needs its measured FLAG-Winston grant and a
# HISTORY row. A crate that breaches before the next review needs a named grant
# or a decomposition — the formula is never silently re-run to fit.
#
# MIGRATION RULE (2026-07-25): this pass only ever RAISES. 13 of 29 governed
# crates moved; the other 16 already carry forward-declared budgets larger than
# the formula (e.g. maos-cap-registry 3000 at 0 measured) and were left alone.
# Lowering a ceiling is an architectural decision for a retrospective, never a
# side effect of a migration whose purpose was to RELIEVE constraint.
#
# WHY THIS REPLACED "tight measured residual, NOT round headroom":
#   • It left crates with 2–10 lines of unusable capacity (notify-push 2,
#     loom-lite 3, kernel-core 10), so ordinary work required a governance event.
#   • Story 13.5b alone triggered EIGHT ceiling re-base events.
#   • Those re-bases were bookkeeping for an ADVISORY gate: `kloc-check` ran
#     `continue-on-error: true` from 2026-06-11, so it could not fail a build.
#     The tight-residual rule is WHY it had to be advisory — nobody can ship
#     against a 2-line budget. With real reserve the gate becomes enforceable,
#     and it is flipped to BLOCKING in the same change.
#   • The Epic-5 decomposition plan this posture served was never arithmetically
#     sound: its named extractions total ~13,627 LOC against a crate then at
#     ~21,370, so the stated ~5,400 residual was unreachable by its own moves.
#     Phase 4 remains real architectural debt, tracked below — but it is NOT a
#     release gate disguised as a budget rule, and it must never block a
#     correctness or compliance repair.
