# Story 8.8 — 3000 → 3050 (team consensus 2026-06-07: Winston + Murat + security
# red-team, under the most-spec-faithful + long-term-correct criterion). AC6's
# premise ("crate was 2644") was STALE: HEAD was 2942 (8.9 grew it), leaving 58
# lines headroom. The fail-closed G7 closure (shared `consent_decision` seam + two
# unconditional enforcement gates + response interpretation + error mapping)
# necessarily exceeds that. Per consensus, the band-fallback toggle was DELETED
# first (Option 2), then re-measured: actual = 3034. The ceiling is set to the
# tight measured residual (3050, ~16-line margin) — NOT round headroom for code
# we might add later. A submodule split was considered but does not reduce crate
# kloc (tokei sums all src under the crate). Ratified bump to 3050 for the A2A
# cross-Host security core.
#
# Story 8.13.1 — 3050 → 3144 (SURFACED per AC6, NOT a silent bump). Option A
# (receiver-side ConsentRupture emission) was ratified UNANIMOUSLY by party-mode
# (Winston + Murat + Amelia + John, 2026-06-08) as the only home where genuine
# `maos run` production code emits the cross-Host rupture (sender-side has no
