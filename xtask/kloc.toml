# the 6,000 ceiling below. Per §A4 decision (2026-05-24): DECOMPOSE the crate
# across Epic 6/7 stories. DO NOT raise the ceiling — amending the ceiling to
# fit current size would invert ADR-038's purpose (the ceiling is the
# architectural discipline, not a measurement of current state).
#
# Phased extraction plan:
#   Phase 1 — Story 6.5 (gateway sub-modules)
#     extract `maos-iac`            (~3,350 LOC: TL + log_recall + bus routing)
#     extract `maos-manifest`       (~2,500 LOC: TOML parsing + section schemas)
#   Phase 2 — Story 6.1 prep (full IAC bus + DRR + retract primitive)
#     CORRECTED 2026-05-25: Original boundary at `capability/` directory level
#     created circular dependencies via `working_memory/orchestrator.rs` (depends
#     on halt, iac, journal, security) and `cap_audit/writer_task.rs` (depends on
#     iac::TL). New boundary extracts ONLY the pure capability surface:
#       cap_tokens, cap_quota, cap_audit (types + channel only),
#       working_memory (types + store only).
#     Extracted LOC: ~1,271 (was ~2,400). Status: DONE.
#   Phase 3 — Story 7.2 (full registry publish/install/yank + air-gapped import)
#     residual security/* fold      (~1,000 LOC moves into maos-manifest or
#                                    maos-sandbox depending on classifier)
#   Phase 4 — Story 7.x (TBD; scheduling depends on remaining size)
#     extract `maos-scheduler`      (~1,961 LOC)
#     extract `maos-memory`         (~1,659 LOC)
#     extract `maos-hot-swap`       (~1,317 LOC)
#     extract `maos-supervision`    (~569 LOC)
#
# At HEAD post-Phase-4 the residual `maos-kernel-core` is ~5,400 LOC (halt +
# inference + telemetry + revocation + journal + lifecycle + orchestrator +
# small glue modules + composition-root forwarders). Under the 6,000 ceiling.
#
# **[SUPERSEDED 2026-07-25 — see "Ceiling rule" below.]** The Epics-6/7 interim
# posture required any story ADDING to `maos-kernel-core` to first extract a
# candidate module netting to ≤0 added LOC, justified by "the gate's continuing
# failure on every CI run keeps the breach visible until decomposition lands".
# That premise is dead: the gate is GREEN (the Epic-10/12 retros re-based ceilings
# to measured residuals), and Phase 4 never ran. Retained here as history only.
