# Story 20-12 AC1/AC2 — the test-cost register.
#
# `check-test-budget --junit <nextest junit>` reds any test binary whose time
# (Σ of its tests' junit `time` — review 2026-10-23; the first-start ->
# last-end span is reported only, it includes queue time) exceeds its budget,
# and the suite whose Σ over every binary exceeds `total_seconds`. Blocking at
# v1_0 since 18-0-green-main-ci-baseline (operator ruling R3, 2026-10-24):
# calibrated on the five post-20-12 main-run junits (`20-12-evidence/ci-after.json`
# + run 40080259088, `18-0-evidence/creation/test-budget-calibration.txt`). Before this file the
# workspace suite cost 1,871 s (17-8 log, libtest `finished in`), 67 % of it
# one test that ran a whole gate.
#
# A binary that legitimately needs longer gets an [[exception]] with a reason
# and an owner; an [[exception]] whose binary is absent from the junit is a
# finding (stale row). Every budget is finite and positive. Making the binary
# cheaper is always preferred to a row here.
#
# [[expensive]] registers every test binary holding `#[ignore = "expensive: …"]`
# tests (`check-test-cost` enforces both directions). `job` is the CI job that
# runs them and must run ignored tests: `expensive-tests` runs exactly the rows
# naming it (filter from `cargo run -p xtask -- check-test-cost
# --expensive-filter`); other rows name the dedicated job that provisions their
# substrate. Tests that only run `cargo tree`/`metadata`/`locate-project`/
# `pkgid` are `// cargo-query:` instead and need no row.

default_seconds = 30
total_seconds = 800

