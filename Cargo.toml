    "crates/maos-attrs",
    "crates/maos-spirit-derive",
    "crates/maos-eval",
    "crates/maos-bench",
    "crates/maos-spirit-cli",
    "examples/example-spirit",
    "spirits/butler",
    "spirits/researcher",
    "spirits/observer",
    "spirits/orchestrator",
    "spirits/worker",
    "spirits/architect",
    "spirits/reviewer",
    "spirits/mira",
