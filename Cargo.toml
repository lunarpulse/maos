[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/maos-a2a",
    "crates/maos-acp",
    "crates/maos-audit",
    "crates/maos-bin",
    "crates/maos-cli",
    "crates/maos-compliance",
    "crates/maos-control",
    "crates/maos-corpus-gen",
    "crates/maos-director-surface",
    "crates/maos-domain",
    "crates/maos-capability",
    "crates/maos-iac",
    "crates/maos-kernel-core",
    "crates/maos-manifest",
    "crates/maos-mcp",
    "crates/maos-registry",
    "crates/maos-persistence",
    "crates/maos-providers",
    "crates/maos-secrets",
    "crates/maos-skill",
    "crates/maos-spirit-abi",
    "crates/maos-spirit-hello",
    "crates/maos-spirit-sdk",
    "crates/maos-attrs",
    "crates/maos-spirit-derive",
    "crates/maos-eval",
    "crates/maos-bench",
    "crates/maos-spirit-cli",
    "examples/example-spirit",
    "spirits/butler",
]
default-members = []
exclude = ["templates", "templates/spirit-ts"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lunarpulse/maos"
rust-version = "1.88"
