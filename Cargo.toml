    "crates/maos-director-surface",
    "crates/maos-domain",
    "crates/maos-capability",
    "crates/maos-iac",
    "crates/maos-journey-test",
    "crates/maos-kernel-core",
    "crates/maos-manifest",
    "crates/maos-mcp",
    "crates/maos-loom-lite",
    "crates/maos-notify-push",
    "crates/maos-registry",
    "crates/maos-persistence",
    "crates/maos-pdp",
    "crates/maos-providers",
    "crates/maos-secrets",
    "crates/maos-siem",
    "crates/maos-sso",
