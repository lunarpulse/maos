repository = "https://github.com/lunarpulse/maos"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"

# ── Dev/test profile: the three crypto crates compiled optimised ─────────────
# Operator ruling 2026-09-24 (21-2, option D). In an unoptimised debug build
# ONE Ed25519 verify costs ~7.1 ms (measured 7,137 µs, deferred-work.md
# 2026-08-04), so every signature-heavy test measured the debug codegen of
# these crates rather than the product. check-multi-region-slo's round-trip
# verifies twice and was spending ~14 of its ~32 ms there. Measured on the same
# substrate, durability ON: debug p95 34,379 µs (RED vs the 30,000 floor) ->
# 17,656 µs with this override; the fault-inject mutation still discriminates
# (paired delta p50 14,978 µs). Scope is exactly these three crates, dev/test
# only (`test` inherits `dev`); the release profile is untouched. This removes
# a BUILD ARTIFACT from what is measured — it does not relax any floor, and
# Postgres commit durability stays inside the measured span.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Story 22-7 (E55): the Wasmtime/Cranelift COMPILER, compiled optimised in dev/test. `maos-wasm-runner`
# compiles the component on every start (the `cache` feature is excluded, see maos-wasm-host/Cargo.toml).
# The shipped componentized-JS domain Spirit (examples/incident-triage-ts, 12.6 MB) took 179 s to compile on
# one core with these crates at opt-level 0 and 13.9 s with them optimised (measured 2026-11-24, taskset -c 0),
# which made `maosctl ask` on that Spirit run out its `--wait` on the hosted 2-vCPU runner. Scope is the
# compile path only, dev/test only (`test` inherits `dev`); release is untouched and no behaviour changes.
[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-internal-core]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-native]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.gimli]
opt-level = 3

[profile.dev.package.object]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.bumpalo]
opt-level = 3

# Story 20-12 AC7 — test binaries were 22–100 MB of full DWARF and every
# in-place proven-red plant relinks one (638 s measured on a loaded host,
# 2026-10-23). Line tables keep file:line in panics and backtraces; unpacked
# split debuginfo leaves the DWARF in the object files instead of copying it
# into every linked binary (measured 20.2 -> 10.6 MB). This is the whole AC7
# build change: the default linker (rust-lld) is unchanged — the mold wrapper
# was removed at review (operator ruling 2026-10-23: no measured gain, and it
# changed release linking too). `test` inherits `dev`; release is untouched.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Story 18-4 landing: reduce package code duplication without raising the 32 MiB gate.
[profile.release.package.maos-bin]
codegen-units = 1
