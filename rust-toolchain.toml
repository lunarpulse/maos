# Pinned to 1.100.0 on 2026-11-14 for the v1.0.0-rc.2 candidate (rc.1 was pinned to 1.99.1;
# before that the file said `channel = "stable"`).
#
# Why a pin at all: hosted `stable` moved 1.99.1 -> 1.100.0 between discipline attempts on the
# rc.1 candidate 80b5b931 (2026-11-09 release) and broke ~20 CI jobs. A release candidate is
# proven on one compiler and then run through a ~26 h T3 chain and a tag run; they must all use
# the compiler the discipline run proved, so `stable` stays out of the candidate path.
#
# Why 1.100.0 and not 1.99.1: rustc/cargo 1.100.0 changed cargo's test-executable layout (test
# binaries live under `target/<profile>/build/<pkg>/<hash>/out/` instead of
# `target/<profile>/deps/`). The layout-agnostic harness (`tests/harness/layout.rs`, landed with
# the post-tag batch) resolves fixtures and sibling binaries under either layout and was proven
# locally on 1.99.1 and 1.100.0; hosted proof is the discipline run of the landing PR.
#
# Move the pin forward deliberately (a discipline run on the new compiler first), never by
# letting `stable` float. The `dtolnay/rust-toolchain` workflow steps still install `stable`;
# this file overrides it for every `cargo`/`rustc` run inside the repo (rustup >= 1.28.1
# auto-installs the channel, components and targets named here on first use).
# `targets` covers every non-nightly cross target a job compiles for: wasm32-wasip2
# (WASM guest fixtures), aarch64-apple-darwin (macos-check, release macOS),
# aarch64-unknown-linux-gnu (release/release-dry-run arm64), x86_64-unknown-linux-gnu
# (static T3 probe / worker-probe-fixture).
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
targets = [
    "wasm32-wasip2",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
