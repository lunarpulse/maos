[template]
cargo_generate_version = ">=0.18.0"
ignore = []

# NOTE: `crate_name` / `project-name` are RESERVED built-ins in cargo-generate >=0.19
# (fed by `--name`); declaring them as [placeholders] aborts generation on 0.23+.
# Do not re-add a `crate_name` placeholder here.
[placeholders]
class_name = { type = "string", prompt = "Spirit struct name (PascalCase, e.g., 'MySpirit')", regex = "^[A-Z][a-zA-Z0-9]+$" }

[template.scripts]
post-generate = '''
print("✅ Spirit scaffolded successfully!");
print("   Next: cd {{crate_name}} && cargo test --features maos-spirit-sdk/spirit_test");
'''
