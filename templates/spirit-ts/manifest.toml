[class]
name = "{{project-name}}"
version = "0.1.0"
abi = "1.0"
manifest_schema_version = 7
min_substrate_version = "0.1.0-alpha.1"
forms = ["wasm-component"]
artifact = "dist/spirit.wasm"
trust_tier = "public-untrusted"
description = "A MAOS WebAssembly-component Spirit scaffolded from templates/spirit-ts."

[capabilities.required.iac]
send = ["spirit:peer"]

[capabilities.required.log]
recall = true
fetch = true

[capabilities.required.skill]
author_self = true

[explanation_shape]
required_fields = ["reason"]

[intent_promotion_set]
allowed = ["standard"]

[swap_invariants]
preserve = ["example-state"]

[posture]
default = "assistive"
allowed_max = "assistive"

[output_shape]
required_fields = ["introduction"]

[budget]
context_window_size = 4096
time_cap_seconds = 360

[resources]
# This example's cap, not a platform default. Starting a componentized-JS guest is CPU-bound:
# under a 10% cap it took ~220 s to reach Ready (hosted run 43193905404, job 131099823857), past
# the 90 s the operator door allows one hot-swap attempt, so the swap ended `upgrade_failed`. At
# 100% the same start plus hot swap took 49.5 s (job 131099824049). The cap is still declared
# and enforced (delegated cgroup-v2 `cpu.max`); only its value is this example's own.
cpu_max_pct = 100
memory_max_mb = 768

[sandbox]
tier = "T2"

[author]
name = "TODO: your name"

[author.support]
# contact = "support@example.com"
# docs_url = "https://example.com/spirit-docs"
