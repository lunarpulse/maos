# WASM component fixture provenance / drift guard.
#
# Each committed component fixture below is pinned to BOTH its binary hash and the
# hash of the source inputs that produced it. `cargo run -p xtask --
# check-equiv-fixture-provenance` recomputes both from the live tree and FAILS
# on any mismatch:
#   - wasm_sha256 mismatch   → the .wasm blob was swapped without updating this
#                              manifest (binary/manifest desync);
#   - source_sha256 mismatch → a guest/logic source file drifted since the .wasm
#                              was built (stale blob/source desync);
# blob bytes and source bytes are pinned per commit; the toolchain is recorded;
# reproduction is a manual recipe (story 17-3b §Dev Notes), not a CI control.

[toolchain]
rustc = "rustc 1.98.1 (48a229cea 2026-09-01)"
wit_bindgen = "0.44.0"
target = "wasm32-wasip2"
wasi_imports = "wasi:*@0.2.9"

[[fixture]]
component = "echo_spirit_component.wasm"
wasm_sha256 = "221260bc014e54af8880a6d041d7f9be6158ebf4e3f4dda3ab0960130e938c74"
source_sha256 = "b78a43fcca3ed5d5fe94f3518fb7cf7a8744dd2188798e954eca1dbb1ab99418"
source = [
    "crates/maos-wasm-host/guests/echo-spirit/Cargo.toml",
    "crates/maos-wasm-host/guests/echo-spirit/src/lib.rs",
    "wit/spirit.wit",
]

