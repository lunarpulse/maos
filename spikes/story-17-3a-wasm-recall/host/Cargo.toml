[workspace]

[package]
name = "story-17-3a-recall-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "spike-runner"
path = "src/spike_runner.rs.txt"

[[bin]]
name = "recall-service"
path = "src/recall_service.rs.txt"

[[bin]]
name = "frame-driver"
path = "src/frame_driver.rs.txt"

[[bin]]
name = "spike-linker-1-2"
path = "src/spike_linker_1_2.rs.txt"

[[bin]]
name = "spike-linker-1-2-same"
path = "src/spike_linker_1_2_same.rs.txt"

[dependencies]
maos-domain = { path = "../../../crates/maos-domain" }
maos-iac = { path = "../../../crates/maos-iac" }
maos-spirit-abi = { path = "../../../crates/maos-spirit-abi" }
maos-wasm-host = { path = "../../../crates/maos-wasm-host" }
wasmtime = { version = "=46.0.3", features = ["component-model"] }
wasmtime-wasi = "=46.0.3"
serde = { version = "=1.0", features = ["derive"] }
serde_json = "=1.0"
thiserror = "=2.0.18"
libc = "=0.2.189"
