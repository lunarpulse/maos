# Story 10.4b — 2-Host bilateral deployment manifest pair.
# Host A = Mira (prod-edge diagnostic), Host B = Nash (dev-environment architect).
# v1.5 supported topology: 2-Host bilateral pair.
# 14-institution Cortex / 25-host churn = v2.0, NOT YET SUPPORTED.
#
# The pre-paired A2A peer cert fingerprints + ConsentAllowlists are NOT manifest
# fields (ADR-003 — the manifest is deployment-topology-agnostic); they live in
# the per-side A2APeerConfig constructed by the host operator at deploy time
# (see crates/maos-a2a-tcp/tests for the live bilateral pairing).

[topology]
name = "bilateral-2-host-mira-nash"

# Ordering is FILE ORDER — `priority_weight` was dead config the parser never
# read (j1-crosshost-1a AC1.2); unknown keys are now REJECTED.
#
# j1-crosshost-2b Q3 (round-table 2026-08-16, unanimous) — the two `host = …`
# keys that used to sit on these entries are DELETED, on 1a's own ratified
# precedent: a key is consumed or it is deleted. They were never a forward
# declaration of a two-host scene. `host` is only read for `[cli_wrapper]`
# members: `validate_remote_topology_target` REFUSES it on a CLASS Spirit, and
# mira/nash are class Spirits — so this file PARSED but could never LOAD, while
# the keys advertised remote routing that the parser rejects. Exactly 1a's
# `priority_weight` defect, missed in 1a's own pass.
#
# Nothing is lost: the header above already states that the bilateral join rides
# on the operator-supplied `A2APeerConfig` (ADR-003), not on manifest fields, and
# `j4-mira-nash.toml` is the same pair with no `host` keys and loads fine.
# Extending remote routing to class Spirits is a DIFFERENT mechanism belonging to
# the Mira/Nash scene; it is deliberately not built here.
[[topology.spirits]]
manifest = "../mira/manifest.toml"

[[topology.spirits]]
manifest = "../nash/manifest.toml"
