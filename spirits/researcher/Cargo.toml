[package]
name = "researcher"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "MAOS Researcher v0.5 — second cognitive reference Spirit + primary §9.5 distillation-pattern reference: participant-scoped log.recall walker (Story 4.4 LogRecallPort, NOT Butler's unscoped ranged_recall) + the kernel-enforced I11 distillate chain + the five-metric NFR-Aud-7 reference producer + a scalar.tap subscription. Story 8.2."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Spirit-side surface ONLY (zero kernel KLOC, Story 0.2 invariant): the SDK +
# ABI for the #[spirit] macro/hook, and the PURE domain ports/types Researcher
# composes — the participant-scoped LogRecallPort (Story 4.4), the I11
# DistillationPort, and the i7 scalar.tap telemetry types. NONE of these is
# `maos-kernel-core`/`maos-iac`; Researcher cognition never reaches into the kernel.
maos-spirit-sdk = { path = "../../crates/maos-spirit-sdk", features = ["local_runner"] }
maos-spirit-abi = { path = "../../crates/maos-spirit-abi" }
maos-domain = { path = "../../crates/maos-domain" }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
serde_json = "1"
unicode-segmentation = "1"

[dev-dependencies]
# Test-only kernel adapters used to PROVE the integration (participant-scoped
# log.recall + ScopeViolation, the I11 distillate chain, the scalar.tap
# subscription) against the REAL substrate. Dev-deps do not affect the
# `check-service-boundary` kernel surface (that gate inspects maos-kernel-core
# only — see Story 8.1 Dev Agent Record).
maos-spirit-sdk = { path = "../../crates/maos-spirit-sdk", features = ["local_runner", "mock", "spirit_test"] }
maos-kernel-core = { path = "../../crates/maos-kernel-core" }
maos-manifest = { path = "../../crates/maos-manifest" }
maos-eval = { path = "../../crates/maos-eval" }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tempfile = "3"
sha2 = "0.10"
toml = "0.8"
