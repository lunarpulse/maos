[package]
name = "reviewer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "MAOS Reviewer v0.8 — founder-loop reference Spirit: critiques the Architect's design proposal (deterministic / seeded / bit-identical at v0.8; no live LLM in CI — Decision E). rust-inproc [class], maps to SpiritRole::Worker (Decision C). Story 8.4."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
maos-spirit-sdk = { path = "../../crates/maos-spirit-sdk", features = ["local_runner"] }
maos-spirit-abi = { path = "../../crates/maos-spirit-abi" }
maos-domain = { path = "../../crates/maos-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
maos-spirit-sdk = { path = "../../crates/maos-spirit-sdk", features = ["local_runner", "mock", "spirit_test"] }
maos-manifest = { path = "../../crates/maos-manifest" }
sha2 = "0.10"
toml = "0.8"
