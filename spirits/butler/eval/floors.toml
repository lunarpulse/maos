# `prompt_sha256` below is the live result's digest of the run-1 cassette's per-entry prompt
# hashes (not the template hash, which xtask cannot see; protocol: `prompt_sha256`).
#
# The result file is the AC8 reference for future Haiku candidates. It lives OUTSIDE git, in the
# local evidence archive only (ruling B7a); the path and SHA-256 are recorded in `result_file`.
#
# Every Wilson lower bound is below its spec minimum (n = 12 and n = 15 halts), so each floor
# equals its spec minimum: no floor is below its spec minimum and no operator ruling is needed.
# `maos eval halt --class butler` reads this file and refuses a floor below the larger of its
# spec minimum, the compiled constant and the Wilson lower bound rounded down to 0.01.

