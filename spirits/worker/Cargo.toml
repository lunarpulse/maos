[package]
name = "worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "MAOS Worker v0.8 — founder-loop CliWrapperSpirit reference: a [cli_wrapper] manifest wrapping a real in-crate fixture-CLI binary that answers --maos-bridge-probe with its output_shape_version and echoes canned output, exercising the real Story-6.2 admission/probe/shape-assertion/FR40-journaling path end-to-end (content fixture-replayed; live multi-CLI stdio bridge deferred, Decision B). Story 8.4."

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "worker-cli-fixture"
path = "src/bin/worker-cli-fixture.rs"

[dependencies]
maos-domain = { path = "../../crates/maos-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
maos-kernel-core = { path = "../../crates/maos-kernel-core" }
maos-manifest = { path = "../../crates/maos-manifest" }
maos-spirit-abi = { path = "../../crates/maos-spirit-abi" }
sha2 = "0.10"
