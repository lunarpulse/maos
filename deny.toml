# cargo-deny policy — MAOS supply-chain hygiene
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# All entries below are `unmaintained` advisories (NOT `vulnerability` class) for
# transitive or frozen-ABI dependencies with no safe upgrade. Each is documented;
# none masks a security vulnerability. FLAG-Winston/John: ratify, and schedule the
# two migrations called out below.
ignore = [
    # serde_cbor 0.11.2 — archived/unmaintained. It is the canonical-CBOR encoder
    # for the FROZEN ComplianceClaim ABI (maos-compliance/canonical_cbor.rs) and
    # the CCAC N=600 ship-gate corpus, whose hashes are pinned. Migrating to the
    # author-recommended `ciborium` (already in-tree) changes canonical byte
    # ordering → re-pins every ComplianceClaim hash + NFR-Aud-9 corpus. That is a
    # dedicated story, not a CI-green patch. Tracked as deferred work.
    "RUSTSEC-2021-0127",
    # rustls-pemfile 2.2.0 — archived Aug 2025; pulled transitively by the rustls
    # TLS stack under maos-a2a-tcp. "No safe upgrade is available" (latest is a
    # thin wrapper over rustls-pki-types' PemObject). Migration = swap to
    # rustls-pki-types' PemObject API; deferred to an A2A-TLS hardening follow-up.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",  # Story 1a.3 — ring 0.17 (Rust crypto primitives; de-facto standard)
    "CDLA-Permissive-2.0",  # Story 1b.4 — webpki-roots via ureq (root CA certificates bundle)
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = [
    # Story 1b.1 — rusqlite bundled pulls in duplicate crate versions via
    # libsqlite3-sys transitive deps. Acceptable for bundled SQLite feature.
    { name = "getrandom" },
    { name = "hashbrown" },
    # half 1.8.x — pulled ONLY by serde_cbor 0.11.2 (1.8) vs ciborium (2.x).
    # Disappears the moment the serde_cbor→ciborium migration (RUSTSEC-2021-0127
    # above) lands. Skip until then.
    { name = "half" },
    # thiserror / thiserror-impl 1.x — pulled ONLY by `win32job` (a Windows-only
    # transitive dep of maos-kernel-core that still uses thiserror 1). Every MAOS
    # crate is already on thiserror 2.0; this cannot be unified until win32job
    # upgrades upstream. Not present on the deny graph's linux targets at runtime.
    { name = "thiserror" },
    { name = "thiserror-impl" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
