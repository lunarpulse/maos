# cargo-deny policy — MAOS supply-chain hygiene
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# All entries below are `unmaintained` advisories (NOT `vulnerability` class) for
# transitive or frozen-ABI dependencies with no safe upgrade. Each is documented;
# none masks a security vulnerability. FLAG-Winston/John: ratify, and schedule the
# two migrations called out below.
ignore = [
    # serde_cbor 0.11.2 — archived/unmaintained. It is the canonical-CBOR encoder
    # for the FROZEN ComplianceClaim ABI (maos-compliance/canonical_cbor.rs) and
    # the CCAC N=600 ship-gate corpus, whose hashes are pinned. Migrating to the
    # author-recommended `ciborium` (already in-tree) changes canonical byte
    # ordering → re-pins every ComplianceClaim hash + NFR-Aud-9 corpus. That is a
    # dedicated story, not a CI-green patch. Tracked as deferred work.
    "RUSTSEC-2021-0127",
    # rustls-pemfile 2.2.0 — archived Aug 2025; pulled transitively by the rustls
    # TLS stack under maos-a2a-tcp. "No safe upgrade is available" (latest is a
    # thin wrapper over rustls-pki-types' PemObject). Migration = swap to
    # rustls-pki-types' PemObject API; deferred to an A2A-TLS hardening follow-up.
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",  # Story 1a.3 — ring 0.17 (Rust crypto primitives; de-facto standard)
    "CDLA-Permissive-2.0",  # Story 1b.4 — webpki-roots via ureq (root CA certificates bundle)
    "Zlib",  # foldhash (Zlib-only; transitive via hashbrown/ahash) — OSI-approved
             # permissive license, functionally equivalent to MIT/BSD. Surfaced by
             # the first full-branch CI run over the Epic 11+12 line.
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = [
    # Story 1b.1 — rusqlite bundled pulls in duplicate crate versions via
    # libsqlite3-sys transitive deps. Acceptable for bundled SQLite feature.
    { name = "getrandom" },
    { name = "hashbrown" },
    # half 1.8.x — pulled ONLY by serde_cbor 0.11.2 (1.8) vs ciborium (2.x).
    # Disappears the moment the serde_cbor→ciborium migration (RUSTSEC-2021-0127
    # above) lands. Skip until then.
    { name = "half" },
    # thiserror / thiserror-impl 1.x — pulled ONLY by `win32job` (a Windows-only
    # transitive dep of maos-kernel-core that still uses thiserror 1). Every MAOS
    # crate is already on thiserror 2.0; this cannot be unified until win32job
    # upgrades upstream. Not present on the deny graph's linux targets at runtime.
    { name = "thiserror" },
    { name = "thiserror-impl" },
    # Story 10.4a collective tier — the Postgres/pgvector stack
    # (pgvector → postgres-protocol / postgres-types / tokio-postgres →
    # maos-loom-lite) brings a NEWER crypto+rand cluster that coexists with the
    # workspace's established one. Provenance (verified via `cargo deny check
    # bans` graph):
    #   sha2 0.11, digest 0.11, block-buffer 0.12, crypto-common 0.2,
    #   hmac 0.13, cpufeatures 0.3 (via chacha20 → rand 0.10), rand 0.10,
    #   rand_core 0.10  ← postgres-protocol subtree
    #   vs sha2 0.10 (ed25519-dalek/hkdf), hmac 0.12 (hkdf),
    #   rand 0.9 / rand_core 0.9 (opentelemetry_sdk + ulid)  ← workspace
    #   fallible-iterator: 0.3 (rusqlite 0.31) vs 0.2 (postgres-protocol)
    # None is a vulnerability — `advisories`, `licenses`, `sources` all pass;
    # this trips only the `multiple-versions` hygiene rule. Unifying would mean
    # upgrading the frozen-ABI crypto stack to sha2 0.11 / rand 0.10 across the
    # whole workspace: a dedicated v2.0 migration, not a CI-green patch.
    # FLAG-Winston/John: ratify; drop each entry as the upstreams converge.
    { name = "sha2" },
    { name = "digest" },
    { name = "block-buffer" },
    { name = "crypto-common" },
    { name = "hmac" },
    { name = "cpufeatures" },
    { name = "rand" },
    { name = "rand_core" },
    { name = "fallible-iterator" },
    # Story 11.4a enterprise PDP — the Cedar reference engine (cedar-policy,
    # in `maos-pdp`, user-space only; quarantined from kernel/domain by
    # check-dependency-closure) brings a parser/graph/serde cluster that
    # coexists with the workspace's established versions. Provenance (verified
    # via `cargo deny check bans`): cedar-policy-core → miette → {winnow,
    # toml, toml_datetime, serde_spanned, unicode-width, phf_shared} +
    # cedar-policy-core/build → {fixedbitset, petgraph, wasm-encoder, wast,
    # object} + arrayvec. None is a vulnerability — `advisories`, `licenses`,
    # `sources` all pass; this trips only the `multiple-versions` hygiene rule.
    # Unifying would mean upgrading workspace parser/serde stacks to match
    # cedar's: a dedicated migration, not a CI-green patch. FLAG-Winston/John:
    # ratify; drop each entry as the upstreams converge.
    { name = "arrayvec" },
    { name = "fixedbitset" },
    { name = "object" },
    { name = "petgraph" },
    { name = "phf_shared" },
    { name = "serde_spanned" },
    { name = "toml" },
    { name = "toml_datetime" },
    { name = "unicode-width" },
    { name = "wasm-encoder" },
    { name = "wast" },
    { name = "winnow" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
