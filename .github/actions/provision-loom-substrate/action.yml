name: Provision Loom substrate databases
description: |
  Story 13.6c — single-source the CREATE DATABASE step of the multi-team /
  multi-region Loom substrate.

  The Postgres `services:` block cannot be single-sourced: composite actions
  cannot define `services:` (a job-level key), GitHub Actions has no YAML
  anchors, and a `workflow_call` reusable workflow would restructure four jobs
  (D-8). Each job therefore declares its own `services:` block, held
  byte-identical (modulo POSTGRES_DB) by the service-block drift control
  (`check-loom-substrate-drift`, AC5).

  This action holds the OTHER half: idempotently creating the extra team /
  region databases beyond the service's `POSTGRES_DB`, so a fifth job cannot
  silently diverge in how it materializes the substrate. The connection-string
  env vars remain in each job's `env:` keys — that is the declarative contract
  the env-consistency drift control parses (AC5); this action is the
  imperative step that makes the databases those strings name actually exist.

inputs:
  extra-databases:
    description: |
      Whitespace-separated database names to create beyond the service's
      POSTGRES_DB (which already exists). Each is created idempotently.
    required: true

runs:
  using: composite
  steps:
    - name: Create extra Loom databases
      shell: bash
      env:
        PGPASSWORD: postgres
        EXTRA_DATABASES: ${{ inputs.extra-databases }}
      run: |
        set -euo pipefail
        # EH-2: an empty/whitespace-only list would provision no databases
        # while the job's exported env keys still satisfy the drift gate — a
        # dark substrate that stays CI-green. Invoking this action means at
        # least one extra database must be materialized; refuse otherwise.
        if [ -z "${EXTRA_DATABASES//[[:space:]]/}" ]; then
          echo "provision-loom-substrate: extra-databases is empty or whitespace-only — refusing to provision a substrate with no databases" >&2
          exit 1
        fi
        for db in $EXTRA_DATABASES; do
          # Reject anything that is not a plain Postgres identifier so a
          # future malformed entry cannot become a psql injection vector.
          if ! [[ "$db" =~ ^[a-z_][a-z0-9_]*$ ]]; then
            echo "provision-loom-substrate: refusing non-identifier database name '$db'" >&2
            exit 1
          fi
          if psql -h localhost -U postgres -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
            echo "provision-loom-substrate: database '$db' already exists"
          else
            createdb -h localhost -U postgres "$db"
            echo "provision-loom-substrate: created database '$db'"
          fi
        done
