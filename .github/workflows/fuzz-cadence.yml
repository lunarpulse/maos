# T2 nightly fuzzing — architecture 5-spirit-abi.md:185-197; PRD NFR-Sec-5/6.
# S1 reversal (operator, 2026-10-15): the Epic-12 weekly downgrade could not
# accrue the non-negotiable floor. Restore daily, 4h/target, runner-core workers.
# Measure libFuzzer counters, never duration × worker-count assertions.
# T1 remains build-only in discipline.yml; T3 is fuzz-prerelease.yml.
# Operator prerequisite: ops-provisioning-secrets-and-accounts provisions the
# fuzz-ledger branch, schema_version:1/records:[] file, and write access.
# Neither missing branches nor rejected pushes are successful collections.
name: fuzz-cadence
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  fuzz-run-t2:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manifest_parser
            fuzz_dir: crates/maos-manifest/fuzz
            rss_flag: ''
          - target: frame_deser
            fuzz_dir: crates/maos-domain/fuzz
            rss_flag: '-rss_limit_mb=0'
          - target: fuzz_exec_deps_parse_elf
            fuzz_dir: crates/maos-exec-deps/fuzz
            rss_flag: ''
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-25 --component rust-src
          cargo install cargo-fuzz --locked
      - name: T2 measured fuzz soak (4h, runner-core workers)
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
        run: bash scripts/run-fuzz-link.sh '${{ matrix.fuzz_dir }}' '${{ matrix.target }}' 14400 T2 nightly '${{ matrix.rss_flag }}'
      - name: Upload measured record
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-record-${{ matrix.target }}-${{ github.run_id }}
          path: out/record-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve worker logs and crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs-${{ matrix.target }}-${{ github.run_id }}
          path: out/
          retention-days: 90
  fuzz-ledger-collect:
    runs-on: ubuntu-latest
    needs: fuzz-run-t2
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FUZZ_LEDGER_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-record-*-${{ github.run_id }}
          merge-multiple: true
          path: records
      - name: Append records to fuzz-ledger.json
        run: bash scripts/collect-ledger.sh fuzz records
  check-fuzz-floor:
    runs-on: ubuntu-latest
    needs: fuzz-ledger-collect
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read ledger without replacing current gate code
        run: |
          rm -f fuzz-ledger.json
          if git fetch origin refs/heads/fuzz-ledger; then
            if git cat-file -e FETCH_HEAD:fuzz-ledger.json; then
              git show FETCH_HEAD:fuzz-ledger.json > fuzz-ledger.json
            fi
          else
            echo '::warning::fuzz-ledger unavailable; gate will report ABSENT (not a pass)'
          fi
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz CPU-hour floor gate
        run: cargo run -p xtask -- check-fuzz-floor --json
