name: container
on:
  push:
    tags: ['v*']
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      PUBLISH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for the signed tag release (never build from an unsigned download)
        id: release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packaging/wait-release.sh "$GITHUB_SHA" "$TAG"
          test -n "$MAOS_RELEASE_PUBKEY"
          cargo build --locked -p maos-cli -p xtask
          pubkey=$(target/debug/maosctl release-pubkey)
          test "$pubkey" != bedd2ba634da724027983f369149f108541f43e624a846438c01452ca7f469e7
          mkdir -p dist
          gh release download "$TAG" --dir dist
          # GitHub stores a release asset named with `~` under a name with `.` in its place
          # (rc.2: `maos-1.0.0~rc.2-1.aarch64.rpm` is stored and downloaded as
          # `maos-1.0.0.rc.2-1.aarch64.rpm`; run 43700484370 failed with `manifest entry ...
          # not found`). The signed manifest keeps the package-manager names, so restore each
          # tilde name before verifying. This only renames; `release-verify --verify` below
          # still checks the Ed25519 signature and the SHA-256 of every renamed file against
          # the signed manifest, so a wrong file under a restored name is refused. A GA name
          # (`maos-1.0.0-1.*.rpm`, `maos_1.0.0-1_*.deb`, no `~`) never enters this loop.
          while read -r _ name; do
            [[ "$name" == *"~"* && "$name" =~ ^[A-Za-z0-9_.~+-]+$ ]] || continue
            stored="${name//\~/.}"
            if [[ ! -e "dist/$name" && -f "dist/$stored" && ! -L "dist/$stored" ]]; then
              mv -- "dist/$stored" "dist/$name"
            fi
          done < dist/SHA256SUMS-packages
          target/debug/xtask release-verify --verify --sha256sums dist/SHA256SUMS --sig dist/SHA256SUMS.sig --artifacts-dir dist
          target/debug/xtask release-verify --verify --sha256sums dist/SHA256SUMS-packages --sig dist/SHA256SUMS-packages.sig --artifacts-dir dist
          echo "pubkey=$pubkey" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Always build and smoke without logging in
        run: |
          docker buildx build --load --platform linux/amd64 --build-arg RELEASE_PUBKEY="$pubkey" --build-arg SOURCE_SHA="$GITHUB_SHA" -t maos:tag .
          docker run --rm maos:tag --version
          docker run --rm maos:tag --help
          docker run --rm maos:tag init --plain
          # The runner must sit beside maos as an executable regular file. The distroless
          # image has no shell, so inspect the filesystem entry itself; this never runs it.
          cid="$(docker create maos:tag)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for exe in maos maosctl maos-wasm-runner; do
            docker cp "$cid:/usr/local/bin/$exe" - | tar -tv | grep -E '^-r[w-]x'
          done
      - name: Publication unavailable
        if: env.PUBLISH != 'true'
        run: |
          echo 'SKIPPED: Docker Hub publication, DOCKERHUB_* absent (ops-provisioning-secrets-and-accounts); GHCR publishes with GITHUB_TOKEN'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-container-release
          path: dist/
          retention-days: 1
  publication:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      pubkey: ${{ secrets.MAOS_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-container-release
          path: dist
      # GHCR needs no operator secret: it publishes on every tag with GITHUB_TOKEN. Docker Hub keeps
      # its credential gate (PUBLISH).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified multi-platform image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ env.PUBLISH == 'true' && format('{0}/maos:{1}', env.HUB_USER, github.ref_name) || '' }}
          build-args: |
            RELEASE_PUBKEY=${{ env.pubkey }}
            SOURCE_SHA=${{ github.sha }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the GHCR digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
      - name: Sign the Docker Hub digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$HUB_USER/maos@$DIGEST"
