name: container
# Publishes ONLY to GHCR (`ghcr.io/<owner>/maos`, owner lowercased) with the workflow's GITHUB_TOKEN;
# there is no Docker Hub path and no registry secret. A new package starts PRIVATE: the operator
# makes it public once in the GitHub UI (docs/runbooks/provisioning-checklist.md, "GHCR package").
#  * push of a `v*` tag  — builds, smokes and PUBLISHES; `latest` only for a GA tag (vX.Y.Z). It
#    never skips publication: if it cannot publish, the run fails (the v1.0.0 silent skip was the defect).
#  * workflow_dispatch   — rehearsal. `release_tag` names an EXISTING signed release whose assets
#    are built into the image. `publish=false` builds and smokes only; `publish=true` pushes the
#    non-release tag `main-<short-sha>` (never `latest`, never a version tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing signed release tag (vX.Y.Z, vX.Y.Z-rc.N, v0.x.y-alpha.N) whose assets are built into the image'
        type: string
        required: true
      publish:
        description: 'Push ghcr.io/<owner>/maos:main-<short-sha> (never latest, never a version tag). false = build and smoke only'
        type: boolean
        default: false
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.classify.outputs.publish }}
      tags: ${{ steps.classify.outputs.tags }}
      image: ${{ steps.classify.outputs.image }}
    env:
      MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Classify what this run publishes
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/maos"
          if [[ "$EVENT" == push ]]; then
            release_tag="$REF_NAME"
          else
            release_tag="$INPUT_TAG"
          fi
          # Same grammar as release.yml (`Classify the tag`).
          if [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then kind=rc
          elif [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then kind=ga
          elif [[ "$release_tag" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then kind=alpha
          else
            echo "refused: '$release_tag' is not vX.Y.Z, vX.Y.Z-rc.N or the v0.x.y-alpha.N line"; exit 1
          fi
          if [[ "$EVENT" == push ]]; then
            publish=true
            tags="$image:$release_tag"
            if [[ "$kind" == ga ]]; then tags="$tags,$image:latest"; fi
          else
            publish="$INPUT_PUBLISH"
            tags="$image:main-${GITHUB_SHA::7}"
          fi
          {
            echo "release_tag=$release_tag"
            echo "kind=$kind"
            echo "publish=$publish"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT kind=$kind publish=$publish tags=$tags"
      - name: Wait for the signed tag release (never build from an unsigned download)
        id: release
        env:
          TAG: ${{ steps.classify.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            packaging/wait-release.sh "$GITHUB_SHA" "$TAG"
          else
            # Rehearsal: the dispatched commit is not the tag's commit, so the run binding cannot
            # apply; the release must already exist. The signature check below still gates every byte.
            gh release view "$TAG" >/dev/null
          fi
          test -n "$MAOS_RELEASE_PUBKEY"
          cargo build --locked -p maos-cli -p xtask
          pubkey=$(target/debug/maosctl release-pubkey)
          test "$pubkey" != bedd2ba634da724027983f369149f108541f43e624a846438c01452ca7f469e7
          mkdir -p dist
          gh release download "$TAG" --dir dist
          # GitHub stores a release asset named with `~` under a name with `.` in its place
          # (rc.2: `maos-1.0.0~rc.2-1.aarch64.rpm` is stored and downloaded as
          # `maos-1.0.0.rc.2-1.aarch64.rpm`; run 43700484370 failed with `manifest entry ...
          # not found`). The signed manifest keeps the package-manager names, so restore each
          # tilde name before verifying. This only renames; `release-verify --verify` below
          # still checks the Ed25519 signature and the SHA-256 of every renamed file against
          # the signed manifest, so a wrong file under a restored name is refused. A GA name
          # (`maos-1.0.0-1.*.rpm`, `maos_1.0.0-1_*.deb`, no `~`) never enters this loop.
          while read -r _ name; do
            [[ "$name" == *"~"* && "$name" =~ ^[A-Za-z0-9_.~+-]+$ ]] || continue
            stored="${name//\~/.}"
            if [[ ! -e "dist/$name" && -f "dist/$stored" && ! -L "dist/$stored" ]]; then
              mv -- "dist/$stored" "dist/$name"
            fi
          done < dist/SHA256SUMS-packages
          target/debug/xtask release-verify --verify --sha256sums dist/SHA256SUMS --sig dist/SHA256SUMS.sig --artifacts-dir dist
          target/debug/xtask release-verify --verify --sha256sums dist/SHA256SUMS-packages --sig dist/SHA256SUMS-packages.sig --artifacts-dir dist
          echo "pubkey=$pubkey" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Always build and smoke without logging in
        run: |
          docker buildx build --load --platform linux/amd64 --build-arg RELEASE_PUBKEY="$pubkey" --build-arg SOURCE_SHA="$GITHUB_SHA" -t maos:tag .
          docker run --rm maos:tag --version
          docker run --rm maos:tag --help
          docker run --rm maos:tag init --plain
          # The runner must sit beside maos as an executable regular file. The distroless
          # image has no shell, so inspect the filesystem entry itself; this never runs it.
          cid="$(docker create maos:tag)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for exe in maos maosctl maos-wasm-runner; do
            docker cp "$cid:/usr/local/bin/$exe" - | tar -tv | grep -E '^-r[w-]x'
          done
      - name: Publication not requested
        if: steps.classify.outputs.publish != 'true'
        run: |
          echo 'NOT PUBLISHED: rehearsal dispatch with publish=false; the image was built and smoked only'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-container-release
          path: dist/
          retention-days: 1
  publication:
    needs: build-and-push
    if: needs.build-and-push.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      pubkey: ${{ secrets.MAOS_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-container-release
          path: dist
      # GHCR needs no operator secret: GITHUB_TOKEN with `packages: write` on this job only.
      # `id-token: write` is for keyless cosign signing.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to publish without the verified release key
        run: test -n "$pubkey"
      - name: Publish the verified multi-platform image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build-and-push.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            RELEASE_PUBKEY=${{ env.pubkey }}
            SOURCE_SHA=${{ github.sha }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the GHCR digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          test -n "$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"
