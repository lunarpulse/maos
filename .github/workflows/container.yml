name: container
on:
  push:
    tags: ['v*']
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      GH_TOKEN: ${{ github.token }}
      MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for the signed tag release (never build from an unsigned download)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            state=$(gh run list --workflow release.yml --commit "$GITHUB_SHA" --event push --json status,conclusion --jq '.[0] | .status + ":" + .conclusion')
            if [ "$state" = 'completed:success' ]; then break; fi
            if [[ "$state" == completed:* ]]; then echo "release failed: $state"; exit 1; fi
            sleep 20
          done
          test "$state" = 'completed:success'
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'maos-linux-*' --pattern SHA256SUMS --pattern SHA256SUMS.sig
          cargo build --locked -p maos-cli
          echo "pubkey=$(target/debug/maosctl release-pubkey)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Always build and smoke without logging in
        run: |
          docker buildx build --load --platform linux/amd64 --build-arg RELEASE_PUBKEY="$pubkey" --build-arg SOURCE_SHA="$GITHUB_SHA" -t maos:tag .
          docker run --rm maos:tag --version
          docker run --rm maos:tag --help
      - name: Publication unavailable
        if: env.PUBLISH != 'true'
        run: |
          echo 'SKIPPED: DOCKERHUB_* absent (ops-provisioning-secrets-and-accounts)'
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - name: Publish the verified multi-platform image
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ env.HUB_USER }}/maos:${{ github.ref_name }}
          build-args: |
            RELEASE_PUBKEY=${{ env.pubkey }}
            SOURCE_SHA=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: Sign both published digests
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_USER/maos@$DIGEST"
