  # Story 5.3 — NFR-Rel-1 crash detection ≤2s
  nfr-rel-1-crash-detection-2s:
    runs-on: ubuntu-24.04
    # ⚠ BOUNDED 2026-09-21 (Epic-16 retrospective). This job had NO
    # `timeout-minutes`, so it inherited GitHub's 6-HOUR default — and it has
    # been spending all six of them on every push since Epic 16:
    #   38c52811 (main, 2026-08-28) success in 2m01s
    #   ddb7441b  cancelled 09:52:03 -> 15:52:47  (6h)
    #   07873d5c  cancelled 12:57:34 -> 18:58:21  (6h)
    #   79fc910e  cancelled 15:33:37 -> 21:33:54  (6h)
    # It wedges in `hundred_sigkilled_workers_meet_both_floors_half_holding_a_
    # grandchild` AFTER printing a fully-green summary, so it looks healthy
    # right up to the kill. Six hours of runner time per push also starved the
    # queue for every other job in the run.
    #
    # 20 is 10x the 2m01s healthy time — the BACKSTOP, not the fix. The cause
    # was a harness race, fixed in worker_crash_corpus_16_3.rs: the corpus
    # SIGKILLed `hang-with-grandchild` Workers before their grandchild pid was
    # journaled (37/50 announced on 2 starved cores), so 6 grandchildren nobody
    # could name held 6 pumps' pipes forever and the runtime's drop waited on
    # them. The kill is now gated on the announcement; the starved repro passes
    # in 25.79s. (An earlier comment here blamed SpawnedBridge::drop — wrong;
    # withdrawn in deferred-work.md.)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run crash detector in-process panic test
        run: cargo test -p maos-kernel-core --test crash_detector_in_process_panic --release
      - name: Build worker CLI fixture (xtask build-test-fixtures, Story 20-12)
        run: cargo run -p xtask -- build-test-fixtures --release --only worker-cli-fixture
      - name: Run crash corpus (exactly one passing test)
        run: |
          run_corpus() {
            local log status
            log="$(mktemp)"
            set +e
            cargo test -p maos-bin --release --test worker_crash_corpus_16_3 -- --ignored 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ] && ! grep -Eq '^test result: ok\. 1 passed;' "$log"; then
              echo "worker crash corpus did not report exactly 1 passed" >&2
              status=1
            fi
            rm -f "$log"
            return "$status"
          }
          run_corpus

