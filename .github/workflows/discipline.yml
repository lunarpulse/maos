            const cs = '${{ needs.corpus-staleness.result }}';
            const cpc = '${{ needs.calibrate-per-commit.result }}';  // conditionally skipped until Story 0.4
            const cf47 = '${{ needs.check-fr47.result }}';
            const cwc = '${{ needs.check-workspace-count.result }}';
            const cpfc = '${{ needs.check-pub-field-constructors.result }}';
            const ccrc = '${{ needs.check-composition-root-completeness.result }}';
            const rct = '${{ needs.retract-corpus-tests.result }}';
            const cbrf = '${{ needs.check-bare-review-findings.result }}';
            const cdmu = '${{ needs.check-dev-model-used-populated.result }}';
            const sd715 = '${{ needs.smoke-discipline-7-1-5.result }}';
            const casc = '${{ needs.check-a2a-sender-completeness.result }}';
            const safc = '${{ needs.smoke-a2a-fail-closed-8-8.result }}';
            const ckb = '${{ needs.check-kernel-baseline.result }}';
            const ecg = '${{ needs.check-epic-close-green.result }}';
            const jht1 = '${{ needs.journey-hermetic-tier-1.result }}';
            // Pre-existing latent bug fixed by Story 8.16 (surfaced on the FIRST PR, run 27397275823):
            // `dt` is used in the advisory determinism-tests table row but was never declared, so the
            // github-script threw ReferenceError on every `pull_request` event (this step is PR-only,
            // and all prior CI ran on `push`, where it is skipped).
            const dt = '${{ needs.determinism-tests.result }}';
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const advisoryIcon = (r) => r === 'success' ? '✅' : (r === 'failure' ? '⚠️' : '⏭️');

            const body = `## MAOS Discipline Gate Results

            | Gate | Result |
            |------|--------|
            | reproducible-build | ${icon(rb)} ${rb} |
            | check-unsafe | ${icon(cu)} ${cu} |
            | check-empty-kernel | ${icon(cek)} ${cek} |
            | check-loom | ${icon(cl)} ${cl} |
            | check-service-boundary | ${icon(csb)} ${csb} |
            | kloc-check | ${icon(kc)} ${kc} |
            | abi-diff | ${icon(ad)} ${ad} |
            | gen-abi-docs | ${icon(gad)} ${gad} |
            | invariant-lock | ${icon(il)} ${il} |
            | check-corpus | ${icon(cc)} ${cc} |
            | maos-audit-read-only | ${icon(mar)} ${mar} |
            | check-judge-config | ${icon(cjc)} ${cjc} |
            | check-security-md | ${icon(csm)} ${csm} |
            | server-exit-drain | ${icon(sed)} ${sed} |
            | audit-spine-smoke | ${icon(ass)} ${ass} |
            | cap-token-verify-bench | ${icon(ctvb)} ${ctvb} |
            | cap-registry-smoke | ${icon(crs)} ${crs} |
            | fr4-1000-call-fixture | ${icon(fr4)} ${fr4} |
            | audit-query-fr4-smoke | ${icon(aqfs)} ${aqfs} |
            | maosctl-smoke | ${icon(ms)} ${ms} |
            | manifest-field-coverage | ${icon(mfc)} ${mfc} |
            | v01-evaluator-path | ${icon(v01)} ${v01} |
            | hello-spirit-tests | ${icon(hst)} ${hst} |
            | hello-spirit-bench | ${icon(hsb)} ${hsb} |
            | onb-nfr2-timing | ${icon(onb)} ${onb} |
            | example-spirit-tests | ${icon(est)} ${est} |
            | example-spirit-drift | ${icon(esd)} ${esd} |
            | example-spirit-ts-tests | ${icon(estts)} ${estts} |
            | spirit-test-tests | ${icon(stt)} ${stt} |
            | coverage-matrix-nfr-test-3 | ${icon(cmn3)} ${cmn3} |
            | lcas-corpus-tests | ${icon(lct)} ${lct} |
            | isolation-framework-tests | ${icon(ift)} ${ift} |
            | coverage-matrix | ${icon(cm)} ${cm} |
            | corpus-staleness | ${icon(cs)} ${cs} |
            | calibrate-per-commit | ${icon(cpc)} ${cpc} |
            | check-fr47 | ${icon(cf47)} ${cf47} |
            | check-workspace-count | ${icon(cwc)} ${cwc} |
            | check-pub-field-constructors | ${icon(cpfc)} ${cpfc} |
            | check-composition-root-completeness | ${icon(ccrc)} ${ccrc} |
            | smoke-discipline-7-1-5 | ${icon(sd715)} ${sd715} |
            | check-a2a-sender-completeness | ${icon(casc)} ${casc} |
            | smoke-a2a-fail-closed-8-8 | ${icon(safc)} ${safc} |
            | retract-corpus-tests | ${icon(rct)} ${rct} |
            | check-bare-review-findings | ${icon(cbrf)} ${cbrf} |
            | check-dev-model-used-populated | ${icon(cdmu)} ${cdmu} |
            | check-kernel-baseline | ${icon(ckb)} ${ckb} |
            | check-epic-close-green | ${icon(ecg)} ${ecg} |
            | journey-hermetic-tier-1 | ${icon(jht1)} ${jht1} |
            | determinism-tests (advisory)¹ | ${advisoryIcon(dt)} ${dt} |

            ¹ Advisory at v0.1-α per DF6 — does not block merge. Promotes to blocking when NFR-Sec-4 ships (v0.5).

            <!-- discipline-gate-comment -->`;

            // Upsert: find existing comment and update, or create new.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- discipline-gate-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail if any gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more discipline gates failed."
          exit 1
