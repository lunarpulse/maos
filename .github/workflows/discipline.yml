      # invokes (resolved as a daemon-sibling). Without it, maosctl is absent in CI
      # and the smoke aborts at `maosctl import`.
      - run: cargo build -p maos-bin -p maos-spirit-cli -p maos-cli
      - run: MAOS_ONE_SHOT=smoke-registry-7-2 cargo run -p maos-bin

  # Story 7.2 AC4 — FR59 ≤5min yank-propagation latency gate.
  fr59-yank-propagation-5min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-registry --test fr59_yank_propagation_within_5min_test -- --nocapture

  # Story 7.2 AC3 — FR60 air-gap import bundle corpus.
  air-gap-import-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-cli -p maos-spirit-cli
      - run: cargo test -p maos-registry --test import_air_gap_test -- --nocapture
      - run: cargo test -p maos-spirit-cli --features fixture_replay -- --nocapture

  # Story 7.3 AC5 — NFR-Aud-9 CCAC N=600 ship gate (P0 ship-blocker).
  # Replays the committed ccac-v1.0 corpus through the maos-compliance evaluator:
  # per-class floor ≥27/30, 100/100 context-drift rejected, ±2% cross-validation
  # across 3 reference contexts. NON-continue-on-error: a regression hard-fails CI.
  ccac-n600-ship-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-compliance --test ccac_ship_gate_test -- --nocapture

  # Story 7.3 AC6 — Layer-1.5 observability: v1.0 admission-verification demo.
  smoke-compliance-7-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin -p maos-spirit-cli
      - run: MAOS_ONE_SHOT=smoke-compliance-7-3 cargo run -p maos-bin

  # Story 7.4 AC6 — skill ecosystem observability smoke (6 deterministic JSON lines)
  smoke-skill-7-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin
      - name: Run smoke-skill-7-4 and assert 6 JSON lines + exit 0
        run: |
          out="$(MAOS_ONE_SHOT=smoke-skill-7-4 cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 6 || { echo "expected 6 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"total":210' || { echo "LCAS total != 210"; exit 1; }

  # Story 7.4 AC6 — maos.skill.v1 schema posture gate
  check-skill-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-skill-schema
        run: cargo run -p xtask -- check-skill-schema --json

  # Story 7.5a AC6 — ABI Stability Triple observability smoke (5 deterministic JSON lines)
  smoke-abi-7-5a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin
      - name: Run smoke-abi-7-5a and assert 5 JSON lines + exit 0
        run: |
          out="$(MAOS_ONE_SHOT=smoke-abi-7-5a cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 5 || { echo "expected 5 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"ESubstrateTooOld"' || { echo "missing ESubstrateTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"EAbiTooOld"' || { echo "missing EAbiTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"outcome":"in_sync"' || { echo "STABILITY.md not in sync"; exit 1; }

  # Story 7.5a AC3 — STABILITY.md generated-from-workspace; --check fails on drift (NFR-Maint-4)
  check-stability-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run stability-matrix --check
        run: cargo run -p xtask -- stability-matrix --check --json

  # Story 7.5a AC3 — BREAKING.md dated-entry + Migration taxonomy CI-grep-enforced (NFR-Maint-7)
  check-breaking-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
