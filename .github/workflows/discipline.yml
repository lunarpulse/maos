          echo "  xtask-gates: ${{ needs.xtask-gates.result }}"
          exit 1

  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      # Story 18-0 AC2 (D-18-0-04) — the blocking supply-chain gate.
      - cargo-deny
      - xtask-gates
      - smoke-suite
