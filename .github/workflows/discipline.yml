  # Story 4.4 — NFR-Aud-7 five-metric distillation gate
  nfr-aud-7-distillate-five-metrics-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run distillate five-metrics floor test
        run: cargo test -p maos-eval --test distillate_five_metrics_floor
      # Story 18-3 AC2.3 / CR-3 — the Researcher's five metrics over the frozen
      # corpus `researcher-distill-corpus-v0`, replayed keyless (committed
      # completions + frozen judge verdicts); exit 0 = all five NFR-Aud-7 floors
      # held and all five negative controls detected.
      - name: Build the root
        run: cargo build --locked -p maos-bin --bin maos
      - name: maos eval distill --class researcher (Story 18-3 AC2.3 / CR-3)
        shell: bash
        run: |
          set +e
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY MAOS_INFERENCE_MODE MAOS_REPLAY_CASSETTE
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          target/debug/maos eval distill --class researcher > eval-distill.out 2> eval-distill.err
          rc=$?
          cat eval-distill.out eval-distill.err
          if [ "$rc" -eq 0 ] && ! jq -Rse '[split("\n")[] | fromjson? | select(type == "object" and .event == "eval_distill")] | length == 1 and .[0].pass == true' eval-distill.out > /dev/null; then
            rc=1
            echo "::error title=NFR-Aud-7 eval distill::exit 0 without one eval_distill line carrying pass == true"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=NFR-Aud-7 eval distill::rc=${rc} $(tail -n 3 eval-distill.err | paste -sd' ' -)"
          else
            echo "::notice title=NFR-Aud-7 eval distill::rc=0, pass=true"
          fi
          exit "$rc"
      # Story 18-3 AC4.2 (D-18-3-08 B) — the Digest class: traceability and
      # secret leakage on its production distillate.
      - name: Digest-class traceability + secret leakage (Story 18-3 AC4.2)
        run: cargo test --locked -p maos-digest --test five_metric_digest_18_3

