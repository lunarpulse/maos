      - run: cargo test -p maos-registry --test fr59_yank_propagation_within_5min_test -- --nocapture

  # Story 7.2 AC3 — FR60 air-gap import bundle corpus.
  air-gap-import-corpus:
    runs-on: ubuntu-latest
