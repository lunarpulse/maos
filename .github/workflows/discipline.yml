name: discipline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TOKEI_VERSION: "14.0.0"
  CARGO_DENY_VERSION: "0.19.4"
  CARGO_PUBLIC_API_VERSION: "0.51.0"

jobs:
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Build (first pass)
        run: cargo build --locked --all-targets --workspace
      - name: Capture first-pass artifact hashes
        run: |
          mkdir -p /tmp/build-artifacts-1
          find target/debug/deps/ -name '*.rlib' -exec sha256sum {} \; | sort > /tmp/build-artifacts-1/rlibs.sha256
          if [ -f target/debug/maos-bin ]; then
            sha256sum target/debug/maos-bin > /tmp/build-artifacts-1/bin.sha256
          fi
      - name: Clean build artifacts
        run: cargo clean
      - name: Build (second pass for reproducibility)
        run: cargo build --locked --all-targets --workspace
      - name: Capture second-pass artifact hashes
        run: |
          mkdir -p /tmp/build-artifacts-2
          find target/debug/deps/ -name '*.rlib' -exec sha256sum {} \; | sort > /tmp/build-artifacts-2/rlibs.sha256
          if [ -f target/debug/maos-bin ]; then
            sha256sum target/debug/maos-bin > /tmp/build-artifacts-2/bin.sha256
          fi
      - name: Verify byte-identical artifacts
        run: |
          echo "=== RLIB byte-identity check ==="
          if ! diff /tmp/build-artifacts-1/rlibs.sha256 /tmp/build-artifacts-2/rlibs.sha256; then
            echo "NFR-Test-2 / reproducible-build violation: rlib artifacts differ between consecutive builds"
            exit 1
          fi
          if [ -f /tmp/build-artifacts-1/bin.sha256 ]; then
            if ! diff /tmp/build-artifacts-1/bin.sha256 /tmp/build-artifacts-2/bin.sha256; then
              echo "NFR-Test-2 / reproducible-build violation: binary artifacts differ between consecutive builds"
              exit 1
            fi
          fi
          echo "Byte-identity verified: artifacts match across two consecutive builds."
      - name: Grep for nightly-only features
        run: |
          set +e
          violations=0
          # Check for #![feature(...)] gates in Rust source.
          if grep -rn '#!\[feature(' crates/ xtask/ --include='*.rs'; then
            echo "NFR-Test-2 / reproducible-build violation: nightly feature referenced at listed locations"
            violations=1
          fi
          # Check for cargo +nightly references in code/config/scripts only.
          # Excludes:
          #   - .md   (docs may describe the forbidden pattern as spec text)
          #   - .github/  (this very grep step defines the pattern as a string
          #                literal; a recursive scan over .yml would self-match)
          # A workflow that actually invoked `cargo +nightly` would fail at run
          # time on a stable runner regardless, so the .github exclusion is safe.
          if grep -rn --exclude-dir=.github 'cargo +nightly' . --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.toml'; then
            echo "NFR-Test-2 / reproducible-build violation: cargo +nightly referenced at listed locations"
            violations=1
          fi
          # Check for RUSTC_BOOTSTRAP. Same scope rationale as above.
          if grep -rn --exclude-dir=.github 'RUSTC_BOOTSTRAP' . --include='*.rs' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.sh'; then
            echo "NFR-Test-2 / reproducible-build violation: RUSTC_BOOTSTRAP referenced at listed locations"
            violations=1
          fi
          if [ "$violations" -ne 0 ]; then
            exit 1
          fi
          echo "No nightly-only features detected."
      - name: Install cargo-deny
        run: |
          # Mirrors the tokei install pattern (kloc-check job): cargo-installed
          # rather than curl-from-release-tarball. The previous recipe failed
          # because cargo-deny's tarball extracts to a versioned subdirectory
          # (`cargo-deny-${V}-x86_64-unknown-linux-musl/cargo-deny`), not to
          # the binary at root. Switching to `cargo install` retires the
          # release-tarball assumption class — see retro post-mortem.
          cargo install --locked --version ${CARGO_DENY_VERSION} cargo-deny
      - name: cargo deny check
        run: cargo deny check

  check-unsafe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-unsafe
        run: cargo run -p xtask -- check-unsafe --json

  kloc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install tokei
        run: |
          # tokei v14.0.0 ships no pre-built release assets (the previous
          # curl-from-release-tarball path now 404s). cargo install builds from
          # source (~30s); subsequent runs hit the Swatinem/rust-cache layer
          # and skip the build. --locked pins to the registry-published
          # Cargo.lock for reproducibility.
          cargo install --locked --version ${TOKEI_VERSION} tokei
      - name: Run kloc-check
        run: cargo run -p xtask -- kloc-check --json

  abi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: |
          cargo install cargo-public-api --version ${CARGO_PUBLIC_API_VERSION}
      - name: Run abi-diff
        run: cargo run -p xtask -- abi-diff --base abi-baseline/v1-pre-bump.txt --json

  check-empty-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-empty-kernel
        run: cargo run -p xtask -- check-empty-kernel --json

  check-loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-loom
        run: cargo run -p xtask -- check-loom --json

  check-fr47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-fr47
        run: cargo run -p xtask -- check-fr47 --json

  check-workspace-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-workspace-count
        run: cargo run -p xtask -- check-workspace-count --json

  check-mock-not-in-release:
    runs-on: ubuntu-latest
    needs: reproducible-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Build maos-bin in release mode
        run: cargo build --release -p maos-bin --locked
      - name: Run check-mock-not-in-release
        run: cargo run -p xtask --release -- check-mock-not-in-release --binary target/release/maos --json

  check-service-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-service-boundary
        run: cargo run -p xtask -- check-service-boundary --json

  # Per-push invariant-lock validation. Journal persistence is a separate
  # workflow (.github/workflows/journal-append.yml) per DF16 (Option c). This
  # job validates the tri-requirement (diff + corpus-delta + phase-commitment)
  # plus the reviewer count and regression check, but does NOT call
  # --write-journal. The flag is the explicit separation between "validate"
  # and "persist" introduced when DF16 was resolved.
  invariant-lock:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Detect changed files
        run: git diff --name-only HEAD~1 > /tmp/changed-files.txt
      - name: Run invariant-lock (validate-only; journal persistence is in journal-append.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --pr-number is included only on pull_request events (clap rejects empty
          # integer on push: main, where there is no associated PR). The reviewer-
          # count check still runs on PRs as designed; on push: main it is skipped.
          # --sha and --write-journal are deliberately omitted: this is the
          # per-push validation gate, not the merge-time persister.
          pr_arg=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_arg="--pr-number ${{ github.event.pull_request.number }}"
          fi
          cargo run -p xtask -- invariant-lock \
            --changed-files /tmp/changed-files.txt \
            $pr_arg \
            --json

  check-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-corpus
        run: cargo run -p xtask -- check-corpus --json

  check-judge-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-judge-config
        run: cargo run -p xtask -- check-judge-config --json

  check-security-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-security-md
        run: cargo run -p xtask -- check-security-md --json

  server-exit-drain:
    # Story 2.5 AC1 — verifies cap-audit drain on SIGTERM in both one-shot
    # and long-running server paths. The drain block is identical in both
    # arms of main.rs, so row persistence is tested via the one-shot path
    # (which generates cap-audit rows deterministicly), and the server
    # path is structurally validated for drain-block reachability.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install sqlite3 (test harness dependency)
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Run server-exit-drain
        run: bash tests/integration/server_exit_drain.sh

  audit-spine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run audit-spine-smoke
        run: bash tests/integration/audit_spine_smoke.sh

  cap-token-verify-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run cap-token-verify bench (fail-on-regress mode)
        run: cargo bench -p maos-kernel-core --bench cap_token_verify_p99 -- --test

  cap-registry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run cap-registry-smoke
        run: bash tests/integration/cap_registry_smoke.sh

  fr4-1000-call-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run FR4 1000-call mediation fixture
        run: cargo test -p maos-kernel-core --test fr4_1000_call_fixture

  audit-query-fr4-smoke:
    # Story 1b.5b AC4 — end-to-end `maosctl audit query` mechanical
    # verification path. Seeds the on-disk Transparency Log via the
    # one-shot hello-Spirit binary, then asserts the FR4 NDJSON schema
    # via jq. Complementary to `fr4-1000-call-fixture` (kernel-side
    # mediation) — this gate exercises the read-side surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install jq (smoke harness dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run audit-query FR4 smoke
        run: bash tests/integration/audit_query_fr4_smoke.sh

  maosctl-smoke:
    # Story 1b.5c AC1 — end-to-end `maosctl` lifecycle smoke. Drives all
    # five v0.1 verbs (install/run/start/stop/unload) against the
    # reference `hello-spirit` and asserts each side-effect mechanically
    # (FR58 JSON on run; one Lifecycle Journal NDJSON line per lifecycle
    # verb; exit 2 + zero journal mutation on unknown-spirit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install jq (smoke harness dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run maosctl lifecycle smoke
        run: bash tests/integration/maosctl_smoke.sh

  manifest-field-coverage:
    # Story 1b.5c AC3 — NFR-Test-13 manifest-field coverage gate. Walks
    # the fixture tree under `crates/maos-kernel-core/tests/fixtures/manifest/`
    # and asserts ≥3 cases per (section, field) tuple in the live
    # MANIFEST_FIELDS allowlist; orphan fixtures fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run NFR-Test-13 manifest-field coverage gate
        run: cargo test -p maos-kernel-core --test manifest_field_coverage --locked

  v01-evaluator-path:
    # Story 1b.5c AC4 — composite v0.1 release-tag gate. Runs the full
    # 1b.5a + 1b.5b + 1b.5c evaluator path in one sequential bash
    # script. Blocks the v0.1 release tag per the AC text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install jq (smoke harness dependency)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run v0.1 evaluator path composite script
        run: bash tests/integration/v01_evaluator_path.sh

  hello-spirit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run hello-Spirit tests
        run: cargo test -p maos-spirit-hello --locked

  hello-spirit-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run hello-Spirit P95 latency bench (fail-on-regress mode)
        run: cargo bench -p maos-kernel-core --bench hello_spirit_p95 -- --test

  example-spirit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run example-Spirit tests (template-baked output, v0.3 NFR-Onb-1 prerequisite)
        run: cargo test -p example-spirit --locked
      - name: Run local_runner smoke tests (maos-spirit-sdk, gated feature)
        run: cargo test -p maos-spirit-sdk --features local_runner --locked

  example-spirit-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run example-spirit drift check (template vs. baked output sync)
        run: cargo run -p xtask -- example-spirit-regen --check --json

  spirit-test-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run spirit_test SDK seed smoke tests (Story 2.4 v0.3 prerequisite)
        run: cargo test -p maos-spirit-sdk --features spirit_test --test spirit_test_smoke --locked

  lcas-corpus-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run LCAS corpus smoke tests (Story 2.4 NFR-Test-6 substrate)
        run: cargo test -p maos-spirit-sdk --features spirit_test --test lcas_smoke --locked

  isolation-framework-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run cross-Spirit isolation framework smoke tests (Story 2.4 NFR-Sec-14 substrate)
        run: cargo test -p maos-spirit-sdk --features spirit_test --test isolation_smoke --locked

  onb-nfr2-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run NFR-Onb-2 5-minute evaluator path script
        run: bash tests/integration/onb_nfr2_timing.sh

  coverage-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run coverage-matrix
        run: cargo run -p xtask -- coverage-matrix --json

  corpus-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run corpus-staleness
        run: cargo run -p xtask -- corpus-staleness --json

  calibrate-per-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check for calibration corpus
        id: check-corpus
        run: |
          if [ -f tests/corpora/calibration-seed-v0.1.jsonl ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Run calibrate
        if: steps.check-corpus.outputs.exists == 'true'
        run: cargo run -p xtask -- calibrate --corpus calibration-seed-v0.1 --n 100 --p 0.95 --json

  # Determinism integration tests for maos-corpus-gen — non-blocking at v0.1-α per DF6
  # (deferred-work.md). Promotes to blocking when NFR-Sec-4 redaction filter ships (v0.5).
  # The job always reports success at the GitHub Actions level; the underlying test
  # outcome is surfaced via the `test_result` job output so the aggregate comment can
  # show "advisory ⚠️" without flipping the overall workflow status to failure.
  determinism-tests:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.surface.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run determinism integration tests (advisory at v0.1-α per DF6)
        id: dtests
        continue-on-error: true
        run: cargo test -p maos-corpus-gen --test determinism_integration
      - name: Surface advisory outcome
        id: surface
        run: |
          if [ "${{ steps.dtests.outcome }}" = "failure" ]; then
            echo "::warning::DF6: determinism integration tests failed — advisory at v0.1-α; promotes to blocking when NFR-Sec-4 ships"
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "Determinism integration tests passed."
            echo "result=success" >> $GITHUB_OUTPUT
          fi

  aggregate:
    runs-on: ubuntu-latest
    needs: [reproducible-build, check-unsafe, check-empty-kernel, check-loom, check-service-boundary, kloc-check, abi-diff, invariant-lock, check-corpus, check-judge-config, check-security-md, server-exit-drain, audit-spine-smoke, cap-token-verify-bench, cap-registry-smoke, fr4-1000-call-fixture, audit-query-fr4-smoke, maosctl-smoke, manifest-field-coverage, v01-evaluator-path, hello-spirit-tests, hello-spirit-bench, onb-nfr2-timing, coverage-matrix, corpus-staleness, calibrate-per-commit, determinism-tests, check-fr47, check-workspace-count, example-spirit-tests, example-spirit-drift, spirit-test-tests, lcas-corpus-tests, isolation-framework-tests]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Build results table
        id: results
        run: |
          echo "rb=${{ needs.reproducible-build.result }}" >> $GITHUB_OUTPUT
          echo "cu=${{ needs.check-unsafe.result }}" >> $GITHUB_OUTPUT
          echo "cek=${{ needs.check-empty-kernel.result }}" >> $GITHUB_OUTPUT
          echo "cl=${{ needs.check-loom.result }}" >> $GITHUB_OUTPUT
          echo "csb=${{ needs.check-service-boundary.result }}" >> $GITHUB_OUTPUT
          echo "kc=${{ needs.kloc-check.result }}" >> $GITHUB_OUTPUT
          echo "ad=${{ needs.abi-diff.result }}" >> $GITHUB_OUTPUT
          echo "il=${{ needs.invariant-lock.result }}" >> $GITHUB_OUTPUT
          echo "cc=${{ needs.check-corpus.result }}" >> $GITHUB_OUTPUT
          echo "cjc=${{ needs.check-judge-config.result }}" >> $GITHUB_OUTPUT
          echo "csm=${{ needs.check-security-md.result }}" >> $GITHUB_OUTPUT
          echo "sed=${{ needs.server-exit-drain.result }}" >> $GITHUB_OUTPUT
          echo "ass=${{ needs.audit-spine-smoke.result }}" >> $GITHUB_OUTPUT
          echo "ctvb=${{ needs.cap-token-verify-bench.result }}" >> $GITHUB_OUTPUT
          echo "crs=${{ needs.cap-registry-smoke.result }}" >> $GITHUB_OUTPUT
          echo "fr4=${{ needs.fr4-1000-call-fixture.result }}" >> $GITHUB_OUTPUT
          echo "aqfs=${{ needs.audit-query-fr4-smoke.result }}" >> $GITHUB_OUTPUT
          echo "ms=${{ needs.maosctl-smoke.result }}" >> $GITHUB_OUTPUT
          echo "mfc=${{ needs.manifest-field-coverage.result }}" >> $GITHUB_OUTPUT
          echo "v01=${{ needs.v01-evaluator-path.result }}" >> $GITHUB_OUTPUT
          echo "hst=${{ needs.hello-spirit-tests.result }}" >> $GITHUB_OUTPUT
          echo "hsb=${{ needs.hello-spirit-bench.result }}" >> $GITHUB_OUTPUT
          echo "onb=${{ needs.onb-nfr2-timing.result }}" >> $GITHUB_OUTPUT
          echo "est=${{ needs.example-spirit-tests.result }}" >> $GITHUB_OUTPUT
          echo "esd=${{ needs.example-spirit-drift.result }}" >> $GITHUB_OUTPUT
          echo "stt=${{ needs.spirit-test-tests.result }}" >> $GITHUB_OUTPUT
          echo "lct=${{ needs.lcas-corpus-tests.result }}" >> $GITHUB_OUTPUT
          echo "ift=${{ needs.isolation-framework-tests.result }}" >> $GITHUB_OUTPUT
          echo "cm=${{ needs.coverage-matrix.result }}" >> $GITHUB_OUTPUT
          echo "cs=${{ needs.corpus-staleness.result }}" >> $GITHUB_OUTPUT
          echo "cpc=${{ needs.calibrate-per-commit.result }}" >> $GITHUB_OUTPUT
          echo "cf47=${{ needs.check-fr47.result }}" >> $GITHUB_OUTPUT
          echo "cwc=${{ needs.check-workspace-count.result }}" >> $GITHUB_OUTPUT
      - name: Check for failures
        id: status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "overall=failure" >> $GITHUB_OUTPUT
          else
            echo "overall=success" >> $GITHUB_OUTPUT
          fi
      - name: Post/update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const rb = '${{ needs.reproducible-build.result }}';
            const cu = '${{ needs.check-unsafe.result }}';
            const cek = '${{ needs.check-empty-kernel.result }}';
            const cl = '${{ needs.check-loom.result }}';
            const csb = '${{ needs.check-service-boundary.result }}';
            const kc = '${{ needs.kloc-check.result }}';
            const ad = '${{ needs.abi-diff.result }}';
            const il = '${{ needs.invariant-lock.result }}';
            const cc = '${{ needs.check-corpus.result }}';
            const cjc = '${{ needs.check-judge-config.result }}';
            const csm = '${{ needs.check-security-md.result }}';
            const sed = '${{ needs.server-exit-drain.result }}';
            const ass = '${{ needs.audit-spine-smoke.result }}';
            const ctvb = '${{ needs.cap-token-verify-bench.result }}';
            const crs = '${{ needs.cap-registry-smoke.result }}';
            const fr4 = '${{ needs.fr4-1000-call-fixture.result }}';
            const aqfs = '${{ needs.audit-query-fr4-smoke.result }}';
            const ms = '${{ needs.maosctl-smoke.result }}';
            const mfc = '${{ needs.manifest-field-coverage.result }}';
            const v01 = '${{ needs.v01-evaluator-path.result }}';
            const hst = '${{ needs.hello-spirit-tests.result }}';
            const hsb = '${{ needs.hello-spirit-bench.result }}';
            const onb = '${{ needs.onb-nfr2-timing.result }}';
            const est = '${{ needs.example-spirit-tests.result }}';
            const esd = '${{ needs.example-spirit-drift.result }}';
            const stt = '${{ needs.spirit-test-tests.result }}';
            const lct = '${{ needs.lcas-corpus-tests.result }}';
            const ift = '${{ needs.isolation-framework-tests.result }}';
            const cm = '${{ needs.coverage-matrix.result }}';
            const cs = '${{ needs.corpus-staleness.result }}';
            const cpc = '${{ needs.calibrate-per-commit.result }}';  // conditionally skipped until Story 0.4
            const cf47 = '${{ needs.check-fr47.result }}';
            const cwc = '${{ needs.check-workspace-count.result }}';
            const dt = '${{ needs.determinism-tests.outputs.test_result }}';  // advisory at v0.1-α per DF6
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const advisoryIcon = (r) => r === 'success' ? '✅' : (r === 'failure' ? '⚠️' : '⏭️');

            const body = `## MAOS Discipline Gate Results

            | Gate | Result |
            |------|--------|
            | reproducible-build | ${icon(rb)} ${rb} |
            | check-unsafe | ${icon(cu)} ${cu} |
            | check-empty-kernel | ${icon(cek)} ${cek} |
            | check-loom | ${icon(cl)} ${cl} |
            | check-service-boundary | ${icon(csb)} ${csb} |
            | kloc-check | ${icon(kc)} ${kc} |
            | abi-diff | ${icon(ad)} ${ad} |
            | invariant-lock | ${icon(il)} ${il} |
            | check-corpus | ${icon(cc)} ${cc} |
            | check-judge-config | ${icon(cjc)} ${cjc} |
            | check-security-md | ${icon(csm)} ${csm} |
            | server-exit-drain | ${icon(sed)} ${sed} |
            | audit-spine-smoke | ${icon(ass)} ${ass} |
            | cap-token-verify-bench | ${icon(ctvb)} ${ctvb} |
            | cap-registry-smoke | ${icon(crs)} ${crs} |
            | fr4-1000-call-fixture | ${icon(fr4)} ${fr4} |
            | audit-query-fr4-smoke | ${icon(aqfs)} ${aqfs} |
            | maosctl-smoke | ${icon(ms)} ${ms} |
            | manifest-field-coverage | ${icon(mfc)} ${mfc} |
            | v01-evaluator-path | ${icon(v01)} ${v01} |
            | hello-spirit-tests | ${icon(hst)} ${hst} |
            | hello-spirit-bench | ${icon(hsb)} ${hsb} |
            | onb-nfr2-timing | ${icon(onb)} ${onb} |
            | example-spirit-tests | ${icon(est)} ${est} |
            | example-spirit-drift | ${icon(esd)} ${esd} |
            | spirit-test-tests | ${icon(stt)} ${stt} |
            | lcas-corpus-tests | ${icon(lct)} ${lct} |
            | isolation-framework-tests | ${icon(ift)} ${ift} |
            | coverage-matrix | ${icon(cm)} ${cm} |
            | corpus-staleness | ${icon(cs)} ${cs} |
            | calibrate-per-commit | ${icon(cpc)} ${cpc} |
            | check-fr47 | ${icon(cf47)} ${cf47} |
            | check-workspace-count | ${icon(cwc)} ${cwc} |
            | determinism-tests (advisory)¹ | ${advisoryIcon(dt)} ${dt} |

            ¹ Advisory at v0.1-α per DF6 — does not block merge. Promotes to blocking when NFR-Sec-4 ships (v0.5).

            <!-- discipline-gate-comment -->`;

            // Upsert: find existing comment and update, or create new.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- discipline-gate-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail if any gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more discipline gates failed."
          exit 1
