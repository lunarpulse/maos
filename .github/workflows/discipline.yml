  # the suite in REPLAY mode (no secrets, no network — cassette/MockMcp only),
  # so the JB-7 guards + j0/j1/j4/researcher/butler deterministic floors gate
  # every PR. The secret-gated live re-record stays nightly-only.
  journey-hermetic-tier-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # The PTY journey tests spawn the real `maos` binary, resolved via
      # `target/debug/maos` (CARGO_BIN_EXE_maos is unset — the binary lives in a
      # SEPARATE package, maos-bin, so Cargo does not inject it for this crate's
      # integration tests). `cargo test -p maos-journey-test` does NOT build that
      # sibling binary, so it MUST be built first — exactly what nightly does
      # (journey-nightly.yml builds the workspace before the suite). Omitting this
      # makes maos_bin() panic "maos binary not found" → exit 101.
      # Also pre-build `worker-cli-fixture` (separate `worker` package): building
      # maos-bin alone does not produce it, and the journey suite spawns the real
      # `maos` binary from target/debug (see above). (The founder-loop journey smoke
      # that originally needed it was retired by Story 9.6; the build is retained as
      # a defensive pre-build.)
      - name: Build the maos binary + worker-cli-fixture (debug — journey tests spawn target/debug)
        run: cargo build --locked -p maos-bin --bin maos && cargo build --locked -p worker --bin worker-cli-fixture
      - name: Hermetic journey suite (replay mode — JB-7 guards + deterministic floors)
        run: cargo test -p maos-journey-test --locked

  smoke-discipline-7-1-5:
    runs-on: ubuntu-latest
    needs: [check-review-findings-resolved, check-dev-record-completeness, check-bare-review-findings, check-dev-model-used-populated]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: MAOS_ONE_SHOT=smoke-discipline-7-1-5 cargo run --release -p maos-bin

  # Story 7.2 AC6 — end-to-end v1.0 binding round-trip (publish → search →
  # install → yank → audit → import).
  smoke-registry-7-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # maos-cli produces the `maosctl` binary the smoke's step-8 air-gap import
      # invokes (resolved as a daemon-sibling). Without it, maosctl is absent in CI
      # and the smoke aborts at `maosctl import`.
      - run: cargo build -p maos-bin -p maos-spirit-cli -p maos-cli
      - run: MAOS_ONE_SHOT=smoke-registry-7-2 cargo run -p maos-bin

  # Story 7.2 AC4 — FR59 ≤5min yank-propagation latency gate.
  fr59-yank-propagation-5min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-registry --test fr59_yank_propagation_within_5min_test -- --nocapture

  # Story 7.2 AC3 — FR60 air-gap import bundle corpus.
  air-gap-import-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-cli -p maos-spirit-cli
      - run: cargo test -p maos-registry --test import_air_gap_test -- --nocapture
      - run: cargo test -p maos-spirit-cli --features fixture_replay -- --nocapture

  # Story 7.3 AC5 — NFR-Aud-9 CCAC N=600 ship gate (P0 ship-blocker).
  # Replays the committed ccac-v1.0 corpus through the maos-compliance evaluator:
  # per-class floor ≥27/30, 100/100 context-drift rejected, ±2% cross-validation
  # across 3 reference contexts. NON-continue-on-error: a regression hard-fails CI.
  ccac-n600-ship-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-compliance --test ccac_ship_gate_test -- --nocapture

  # Story 7.3 AC6 — Layer-1.5 observability: v1.0 admission-verification demo.
  smoke-compliance-7-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin -p maos-spirit-cli
      - run: MAOS_ONE_SHOT=smoke-compliance-7-3 cargo run -p maos-bin

  # Story 7.4 AC6 — skill ecosystem observability smoke (6 deterministic JSON lines)
  smoke-skill-7-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin
      - name: Run smoke-skill-7-4 and assert 6 JSON lines + exit 0
        run: |
          out="$(MAOS_ONE_SHOT=smoke-skill-7-4 cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 6 || { echo "expected 6 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"total":210' || { echo "LCAS total != 210"; exit 1; }

  # Story 7.4 AC6 — maos.skill.v1 schema posture gate
  check-skill-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-skill-schema
        run: cargo run -p xtask -- check-skill-schema --json

  # Story 7.5a AC6 — ABI Stability Triple observability smoke (5 deterministic JSON lines)
  smoke-abi-7-5a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build -p maos-bin
      - name: Run smoke-abi-7-5a and assert 5 JSON lines + exit 0
        run: |
          out="$(MAOS_ONE_SHOT=smoke-abi-7-5a cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 5 || { echo "expected 5 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"ESubstrateTooOld"' || { echo "missing ESubstrateTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"EAbiTooOld"' || { echo "missing EAbiTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"outcome":"in_sync"' || { echo "STABILITY.md not in sync"; exit 1; }

  # Story 7.5a AC3 — STABILITY.md generated-from-workspace; --check fails on drift (NFR-Maint-4)
  check-stability-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run stability-matrix --check
        run: cargo run -p xtask -- stability-matrix --check --json

  # Story 7.5a AC3 — BREAKING.md dated-entry + Migration taxonomy CI-grep-enforced (NFR-Maint-7)
  check-breaking-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-breaking-md
        run: cargo run -p xtask -- check-breaking-md --json

  # Story 10.1a AC4 — xtask CI lint: asserts expected gate job names are present
  # in the v1.0-ship-gate aggregate job's needs: array.
  check-ship-gate-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-ship-gate-completeness
        run: cargo run -p xtask -- check-ship-gate-completeness --json

  # Story 7.5b AC9 — NFR-Onb-1 30-min first-Spirit validation gate (discipline rail).
  # Stratification + cohort evaluator + Butler-corpus seam over committed example
  # artifacts; FAILs loudly on drift. Verdicts are provisional until Story 8.1's
  # canonical Butler corpus lands (the resolver auto-prefers it).
  nfr-onb-1-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run nfr-onb-1-gate --check
        run: cargo run -p xtask -- nfr-onb-1-gate --check --json

  # Story 7.5b AC8 — smoke-onb-1-7-5b: the ONE end-to-end dry-run self-trial.
  # Scaffolds a Spirit, runs it through LocalRunner against the fixture corpus,
  # scores it, emits one outcome, evaluates N=1 → provisional. Wiring proof,
  # explicitly NOT the N=12 gate (the test asserts N=1 ∧ provisional).
  smoke-onb-1-7-5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run smoke-onb-1-7-5b self-trial
        run: cargo test -p maos-eval --test onb_1_self_trial -- --nocapture


  # Story 10.1b AC1 — Pen-test gate: conditional per calibrate-per-commit pattern.
  # When summary.toml exists, parse and assert p0_open == 0 && p1_open == 0.
  # When absent, pass with advisory annotation (pen-test engagement pending).
  check-pentest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check pen-test results
        run: cargo run -p xtask -- check-pentest-gate --json

  # Story 10.1b AC3 — Coverage matrix completeness: no v1.0 NFR has empty gates.
  check-coverage-matrix-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check coverage matrix completeness
        run: cargo run -p xtask -- check-coverage-matrix-completeness --json

  # Story 10.1b AC2 — OWASP freeze hash-check: SHA-256 from gate-registry.toml.
  # Hash stored in the invariant-locked registry so any OWASP doc edit requires
  # a registry update, which is auditable and protected by review.
  check-owasp-freeze-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify OWASP freeze immutability
        run: |
          EXPECTED_HASH=$(grep '^owasp_freeze_hash' xtask/gate-registry.toml | sed 's/.*= "\(.*\)"/\1/')
          ACTUAL_HASH=$(sha256sum docs/pen-test/owasp-risk-rating-v1.0-frozen.md | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "::error::OWASP freeze hash mismatch! Expected: $EXPECTED_HASH, Actual: $ACTUAL_HASH"
            echo "  If the OWASP doc was intentionally updated, update owasp_freeze_hash in xtask/gate-registry.toml"
            exit 1
          fi
          echo "OWASP freeze hash verified: $ACTUAL_HASH"

  # Story 10.2 AC1 — third-party trial N=12 gate (conditional: advisory-if-absent).
  check-third-party-trial:
    runs-on: ubuntu-latest
    env:
      # P14: the v2.0 default-deny (require producer-signed attestations) only
      # fires when MAOS_SHIP_PHASE=v2_0. Default to v1_5 (advisory) until the repo
      # flips this variable to v2_0 at the v2.0 ship gate — the flip is a config
      # change, not a code change, and the proven-red tests exercise the v2_0 path.
      MAOS_SHIP_PHASE: ${{ vars.MAOS_SHIP_PHASE || 'v1_5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check third-party trial results
        run: |
          if [ -f docs/third-party-trial/results/trial-results.toml ]; then
            cargo run -p xtask -- check-third-party-trial
          else
            echo "::warning::Third-party trial pending — trial-results.toml absent"
            echo "## ⚠️ Third-Party Trial Gate: ADVISORY" >> "$GITHUB_STEP_SUMMARY"
            echo "Trial has not yet been executed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story 10.2 AC2 — CLI-wrapper cross-form distributional equivalence gate (ADVISORY per ADR-040).
  check-cross-form-equiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check cross-form equivalence results
        run: |
          if [ -f docs/cross-form/results/cross-form-results.json ]; then
            cargo run -p xtask -- check-cross-form-equiv
          else
            echo "::warning::Cross-form equivalence pending — cross-form-results.json absent"
            echo "## ⚠️ Cross-Form Equivalence Gate: ADVISORY" >> "$GITHUB_STEP_SUMMARY"
            echo "Cross-form equivalence testing has not yet been executed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story 10.2 AC3 — adversarial red-team 80-scenario gate (v1.5 phase, advisory-until-engagement).
  check-red-team-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check red-team gate results
        run: |
          if [ -f docs/red-team/results/red-team-results.toml ]; then
            cargo run -p xtask -- check-red-team-gate
          else
            echo "::warning::Red-team engagement pending — red-team-results.toml absent"
            echo "## ⚠️ Red-Team Gate: ADVISORY" >> "$GITHUB_STEP_SUMMARY"
            echo "Red-team engagement has not yet been executed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story 10.4a AC2 (NFR-Ops-10) — SQLite→Postgres migration triple-oracle gate
  # (v1.5 phase, advisory-until-engagement).
  check-migration-merkle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check migration Merkle gate results
        run: |
          if [ -f tests/corpora/migration-corpus-1e6.sqlite ] || [ -n "${MAOS_TEST_POSTGRES:-}" ]; then
            cargo run -p xtask -- check-migration-merkle
          else
            echo "::warning::Migration corpus absent — generate via 'cargo run --release -p maos-loom-lite --example generate_migration_corpus -- --out tests/corpora/migration-corpus-1e6.sqlite'"
            echo "## ⚠️ Migration Gate: ADVISORY (corpus absent)" >> "$GITHUB_STEP_SUMMARY"
          fi
  # Story 10.3 AC-1 (NFR-Comp-1) — export-control classification gate.
  # ECCN doc present + STABILITY.md §Export non-stub + crypto enumeration.
  check-export-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check export-control classification
        run: cargo run -p xtask -- check-export-control --json

  # Story 11.1a AC1/D4 — maos-host public-API baseline gate (ADR-031 Spirit
  # Host Port). Pinned against abi-baseline/maos-host-v1.txt; removed items
  # RED, added items reported but GREEN (F2: NOT the vacuous "empty abi-diff
  # in a non-scanned crate" pattern — this is a dedicated baseline for a
  # crate abi-diff never touches).
  check-host-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: |
          cargo install cargo-public-api --version ${CARGO_PUBLIC_API_VERSION}
      - name: Run check-host-surface
        run: cargo run -p xtask -- check-host-surface --json

  # Story 10.4a / 11.1a — dependency-closure gate: kernel-core + domain
  # trees exclude the Postgres/pgvector stack AND the WASM runtime stack
  # (wasmtime/wasmtime-wasi/wit-bindgen, ADR-031/ADR-041 isolation).
  check-dependency-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-dependency-closure
        run: cargo run -p xtask -- check-dependency-closure --json

  # Story 11.1a AC2/AC3/AC4 — WASM host adapter BEHAVIORAL tests. The four
  # xtask gates above (check-host-surface / check-dependency-closure /
  # check-export-control / check-kernel-baseline) guard the SHAPE of 11.1a
  # (API surface, dependency isolation, packaging); this job guards the
  # BEHAVIOR — the real guest ADR-032 round-trip (AC3), the fuel/T2 kill
  # matrix (AC4), and the frame_bridge lower/lift conversions for all 15
  # FrameKinds (AC2). Without it the 11.1a test suite never executes in CI
  # at all — the CONCERNS finding from the Murat trace audit (2026-07-01).
  # The T2 column (t2_sandbox_kill.rs) self-skips without CAP_SYS_ADMIN,
  # mirroring the kernel's own sandbox_enforcement_linux.rs pattern.
  wasm-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-host-tests-${{ hashFiles('**/Cargo.lock') }}
      - name: Build forbidden-syscall-probe fixture (AC4 T2 column)
        run: cargo build --release --manifest-path crates/maos-wasm-host/test-fixtures/forbidden-syscall-probe/Cargo.toml
      - name: Run maos-host + maos-wasm-host test suites
        run: cargo test -p maos-host -p maos-wasm-host --locked

  # Story 10.3 AC-5 (NFR-Ops-4) — CNA registration gate (blocking-when-present).
  check-cna-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check CNA registration
        run: cargo run -p xtask -- check-cna-registration --json

  # Story 10.3 AC-2/AC-3 (NFR-Sec-5/6) — fuzz-target existence gate (mechanics).
  check-fuzz-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check fuzz targets
        run: cargo run -p xtask -- check-fuzz-targets --json

  # Story 10.3 AC-2/AC-3 — pre-merge fuzz BUILD gate (preflight F3: build-only).
  # The 24h T1/T2/T3 runs are operational (docs/runbooks/fuzz-cadence.md); this
  # gate only asserts the harnesses compile against libfuzzer-sys + nightly.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install cargo-fuzz --locked
      - name: Build manifest parser fuzz target
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-manifest/fuzz manifest_parser
      - name: Build wire-protocol fuzz target
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-domain/fuzz frame_deser

  # Story 10.3 AC-4 (NFR-Doc-6) — Korean localization ship gate.
  # KO_COVERAGE_MIN=100 turns the coverage promise into a mechanical gate;
  # glossary-lock enforces locked-term preservation across all ko files.
  check-ko-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci
      - name: Korean canonical-coverage gate (KO_COVERAGE_MIN=100)
        working-directory: docs-site
        run: KO_COVERAGE_MIN=100 npm run gate:ko-coverage
      - name: Korean glossary-lock gate
        working-directory: docs-site
        run: npm run gate:glossary-lock


  # Story 10.4b (NFR-Sec-13) — live bilateral A2A consent + binding_checked gate.
  check-live-bilateral-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-live-bilateral-consent
        run: cargo test -p maos-a2a-tcp --test t_10_4b_live_bilateral -- --test-threads=1

  # Story 10.4b (NFR-Rel-9) — rotation real-timing RotationDrillReport gate.
  check-rotation-real-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-rotation-real-timing
        run: cargo test -p maos-a2a-tcp --test t_10_4b_rotation_real_timing -- --test-threads=1

  # Story 10.4c — J4 §13.1 Mira-Nash Observer colocation-latency gate.
  # Real in-kernel scalar.tap measurement via `kernel_measurement` feature.
  # Gate scalar: cross-task delivery latency P95 ≤ 10ms. De-flaking: warmup
  # discard, N≥200 post-warmup, pinned tokio workers (D2).
  # The mutation test (bench-fault-inject) runs separately to verify falsifiability.
  # AC3/D5 (review D1): ADVISORY at v1.0 — the gate test prints a "WOULD BLOCK
  # at v1.5" banner on over-budget instead of failing (v1_0=advisory). The
  # load-bearing falsifier is the mutation test step below. Graduation to
  # v1_5=blocking is a disposition flip in gate-registry.toml.
  check-j4-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-j4-latency (real measurement)
        run: |
          # Real in-kernel scalar.tap measurement with kernel_measurement feature.
          cargo test -p maos-bench --features kernel_measurement --test t_10_4c_j4_latency_gate -- --nocapture
          echo "check-j4-latency: PASSED (real in-kernel scalar.tap measurement; Story 10.4c)."
      - name: Run Gate 1 integrity tests
        run: |
          cargo test -p maos-bench --features kernel_measurement --test t_10_4c_j4_gate_integrity -- --nocapture
          echo "check-j4-latency: Gate 1 integrity tests PASSED."
      - name: Run mutation test (bench-fault-inject)
        run: |
          output=$(cargo test -p maos-bench --features bench-fault-inject --test t_10_4c_j4_mutation -- --nocapture 2>&1)
          echo "$output"
          # Review P4: assert the mutation tests actually RAN. A dropped/typo'd
          # --features bench-fault-inject would compile this target to ZERO tests
          # and `cargo test` would exit 0 — a silent vacuous GREEN. Require ≥1
          # passed test so the AC2 falsifier cannot vanish without alarm.
          echo "$output" | grep -Eq "test result: ok\. [1-9][0-9]* passed" \
            || { echo "FAIL: mutation tests did not run (0 tests — is --features bench-fault-inject set?)"; exit 1; }
          echo "check-j4-latency: mutation test PASSED (injection moves the number → RED)."
      - name: Verify bench-fault-inject absent from release graph (D3)
        run: |
          if cargo tree -p maos-bench -e features --release 2>&1 | grep -q "bench-fault-inject"; then
            echo "FAIL: bench-fault-inject present in release feature graph"
            exit 1
          fi
          echo "check-j4-latency: bench-fault-inject absent from release graph (D3 verified)."

  # Story 10.4c AC5 (D8) — FF-J6 CI guard. Mechanically enforces the J6
  # cold-start latency harness revival trigger: FAILS if a J6 latency binding
  # (assertion / binding AC / user-facing claim) appears while the J6 harness is
  # still CUT (not_measured). Blocking — a J6 latency claim requires the harness.
  check-ff-j6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run FF-J6 guard
        run: cargo run -p xtask -- check-ff-j6

  # Story 10.4b — mobile push fires on Mira halt over the real MobilePushHttp
  # transport (operator-facing halt wire).
  check-mobile-push-on-halt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-mobile-push-on-halt
        run: cargo test -p maos-notify-push --test t_10_4b_mobile_push_halt

  # Story 10.5 AC3 — Windows binary + sandbox compile and install verification.
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # R1/AC3: a REAL build on Windows, not just `cargo check`. This is the only
      # place the kernel's unsafe Windows sandbox FFI actually compiles for its
      # target (the dev host cannot cross-build it — ring/libsqlite3-sys need a
      # Windows C toolchain).
      - name: Build Windows kernel-core + CLI (real compile)
        run: cargo build -p maos-kernel-core -p maos-cli
      # R4: execute the unsafe FFI spawn path at runtime (was compile-only) —
      # now including ENFORCEMENT negative controls (memory commit cap actually
      # kills an over-budget child; low-integrity label actually applies). Run
      # single-threaded: each memory test commits ~1 GiB and the tests spawn
      # restricted-token child processes, so serialize for determinism.
      - name: Run Windows sandbox enforcement tests
        run: cargo test -p maos-kernel-core --test sandbox_enforcement_windows -- --nocapture --test-threads=1
      # R5: the JetBrains/ACP bridge tests were wired into NO CI job. Run them here.
      - name: Run ACP JetBrains bridge test
        run: cargo test -p maos-acp --test jetbrains_bridge_test
      - name: Run JetBrains ACP server e2e
        run: cargo test -p maos-bin --test jetbrains_acp_server
      - name: Verify Windows local release signature path
        run: cargo test -p maos-cli install_verify_local_release_artifact -- --exact

  # Story 10.5 AC1 (NFR-Test-10) — skill-format conformance gate.
  check-skill-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-skill-conformance
        run: cargo run -p xtask -- check-skill-conformance
      # Story 10.5 H2 (§A2 re-review): mechanically enforce the gate's failure
      # branches in CI, not dev-pass-only. These invert the pass condition
      # (false booleans / malformed TOML / corrupt fixture / defeated proven-red
      # guard) and assert the gate goes red — so weakening check-skill-conformance
      # can no longer stay green.
      - name: Run skill-conformance proven-red vectors (H2)
        run: cargo test -p xtask --test story_10_5_proven_red -- --test-threads=1

  # Story 11.1b AC3 — tiered behavioral-oracle cross-form equivalence gate.
  # The binding row for ADR-031: deterministic tiered oracle, live cargo test
  # (base + equiv-fault-inject legs), advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED
  # banner) and blocking at v2.0. Runs the equiv harness as real subprocesses
  # over real pipes. Review findings #3/#5- CI/#13: the xtask INVOKES the live
  # oracle and parses its output (not a stub); the native twin is built to the
  # standalone-workspace path the harness resolves; the anti-canned leg runs
  # with a ≥1-test guard; the fault-inject feature is excluded from release.
  check-wasm-form-equiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-wasm-form-equiv-${{ hashFiles('**/Cargo.lock') }}
      # Finding #5: build the native twin in its OWN standalone workspace. It
      # emits native-twin/target/release/equiv-native-twin, which the harness
      # resolves directly (require_binary probes the standalone target dir, with
      # a build-on-demand fallback). No copy to the main target/ is needed.
      - name: Build equiv-fixture native twin
        run: cargo build --release --manifest-path crates/maos-wasm-host/guests/equiv-fixture/native-twin/Cargo.toml
      # Finding #3: the xtask invokes the live oracle as `cargo test` (BOTH the
      # base tiered-oracle leg and the equiv-fault-inject anti-canned leg) and
      # parses `test result:` lines — it is not an unconditional-pass stub. Its
      # exit code enforces the disposition (advisory banner at v1.0/v1.5;
      # BLOCKING at v2.0) and hard-fails if either leg compiles to ZERO tests.
      - name: Run check-wasm-form-equiv gate (live tiered oracle + disposition)
        run: |
          set -o pipefail
          # stdout (the gate JSON) → file + console; stderr (cargo build noise,
          # WOULD-HAVE-BLOCKED banner) → console only. NO `2>&1`: on a cache-COLD
          # run the merged "Compiling …" output would pollute the file and break
          # the tripwire's JSON parse (Epic-12 retro fix, 2026-07-14).
          cargo run -p xtask -- check-wasm-form-equiv --json | tee /tmp/equiv-gate.json
      # Finding #13 (J4 pattern, cf. discipline.yml:2374): assert the
      # equiv-fault-inject anti-canned leg actually added and ran feature-only
      # tests, not merely the shared base harness. A cfg-attribute regression
      # must be RED even if the base leg still reports nonzero tests.
      - name: Anti-canned tripwire guard (equiv-fault-inject leg added tests)
        run: |
          python3 - <<'PY'
          import json, sys
          # Extract the gate JSON line robustly instead of assuming the whole file
          # parses — hardens the tripwire against any stray stdout / build noise
          # on a cache-cold run (Epic-12 retro fix, 2026-07-14).
          data = None
          for raw in open("/tmp/equiv-gate.json"):
              line = raw.strip()
              if line.startswith("{") and "base_passed" in line:
                  data = json.loads(line)
          if data is None:
              print("FAIL: no check-wasm-form-equiv JSON found in /tmp/equiv-gate.json")
              sys.exit(1)
          base = int(data.get("base_passed", 0))
          fault = int(data.get("fault_inject_passed", 0))
          if fault <= base:
              print(f"FAIL: equiv-fault-inject did not add tests (base_passed={base}, fault_inject_passed={fault})")
              sys.exit(1)
          print(f"check-wasm-form-equiv: anti-canned tripwire RAN (fault_inject_passed={fault} > base_passed={base}).")
          PY
      # Finding #13 (D7): the fault-inject feature MUST be absent from the
      # release feature graph so it can never weaken a shipped build.
      - name: Verify equiv-fault-inject absent from release graph (D7)
        run: |
          if cargo tree -p maos-wasm-host -e features --release 2>&1 | grep -q "equiv-fault-inject"; then
            echo "FAIL: equiv-fault-inject present in release feature graph"
            exit 1
          fi
          echo "check-wasm-form-equiv: equiv-fault-inject absent from release graph (D7 verified)."
      # Finding #21: WASM fixture drift/provenance guard. Pins each committed
      # equiv-*.wasm to its binary + source SHA-256; fails if a source edit left
      # a stale .wasm blob the gate would otherwise keep consuming.
      - name: Verify equiv WASM fixture provenance (no stale .wasm drift)
        run: cargo run -p xtask -- check-equiv-fixture-provenance --json

  # Story 11.2a (AC5, D10) — cross-region convergent replication gate.
  # ONE gate / ONE disposition / FIVE independently-falsifiable legs:
  # reattestation-mediated, convergence-oracle, region-identity, ap-degrade,
  # kernel-abi-diff. Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner);
  # blocking at v2.0 (absent/unmeasured → BLOCK).
  check-cross-region-consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-cross-region-consensus-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-cross-region-consensus gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-cross-region-consensus --json 2>&1 | tee /tmp/cross-region-gate.json

  # Story 11.2b (AC5, D5) — multi-region SLO gate. ONE gate / ONE disposition /
  # FIVE independently-falsifiable legs with PER-LEG independence (each leg reads
  # its own oracle — NOT appended to the consensus gate's single-binary
  # broadcast). Legs: three-region-convergence, roundtrip-slo (+slo-fault-inject),
  # halt-presence, live-read-region-identity (+chokepoint), kernel-abi-diff.
  # Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-multi-region-slo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-multi-region-slo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-multi-region-slo gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-multi-region-slo --json 2>&1 | tee /tmp/multi-region-slo-gate.json
      # Story 11.2b (F7) SHIP-BLOCKER: slo-fault-inject MUST NOT leak into the
      # release feature graph (a release build with fault injection active would
      # inject spurious latency into a production measurement path). Mirrors the
      # j4-latency / wasm-form-equiv cargo-tree absence idiom.
      - name: slo-fault-inject absent from release feature graph
        run: |
          if cargo tree -p maos-bench -e features --release 2>&1 | grep -q "slo-fault-inject"; then
            echo "FAIL: slo-fault-inject leaked into the maos-bench release feature graph (Story 11.2b ship-blocker)"
            exit 1
          fi
          echo "OK: slo-fault-inject absent from the release feature graph"

  # Story 11.3 (AC5, D8) — scale-envelope 25/30-host churn gate. ONE gate /
  # Story 12.1 — signed cohort manifest and real N=3/N=8 pairwise mesh.
  check-cohort-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-cohort-mesh-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-cohort-mesh gate
        run: cargo run -p xtask -- check-cohort-mesh --json
  # ONE disposition / FOUR independently-falsifiable legs with PER-LEG
  # independence (mesh-identity-reconcile, detection-latency, blast-recovery-
  # rto, kernel-abi-diff — each reads its OWN `cargo test` oracle). Advisory
  # at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-scale-churn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-scale-churn-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-scale-churn gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-scale-churn --json 2>&1 | tee /tmp/scale-churn-gate.json
      # Story 11.3 (D6/L7) SHIP-BLOCKER: churn-fault-inject MUST NOT leak into
      # the release feature graph (mirrors the slo-fault-inject / bench-fault-
      # inject cargo-tree absence idiom).
      - name: churn-fault-inject absent from release feature graph
        run: |
          if cargo tree -p maos-a2a-tcp -e features --release 2>&1 | grep -q "churn-fault-inject"; then
            echo "FAIL: churn-fault-inject leaked into the maos-a2a-tcp release feature graph (Story 11.3 ship-blocker)"
            exit 1
          fi
          echo "OK: churn-fault-inject absent from the release feature graph"
  # Story 11.4a (AC5, F6/D6) — enterprise PDP integration gate (Cedar
  # in-process; real per-commit tripwire — no advisory-skipped live leg). Per-
  # leg independence (real-evaluation, deny-proven-red, issue-path-deny,
  # fail-closed, ceiling-and-zero-config, kernel-abi-diff, release-graph-
  # absence). Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-enterprise-pdp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-enterprise-pdp-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-enterprise-pdp gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-enterprise-pdp --json 2>&1 | tee /tmp/enterprise-pdp-gate.json
  # Story 11.4c (AC6) — enterprise identity + at-rest + SIEM gate.
  # Per-leg OIDC/provenance/KMS/SIEM/fail-closed/release-guard oracle.
  # Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-enterprise-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-enterprise-identity-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-enterprise-identity gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-enterprise-identity --json 2>&1 | tee /tmp/enterprise-identity-gate.json

  # Story 11.5 (AC4/D7) — Frozen-Kernel Conformance Suite infrastructure gate.
  # Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-fkcs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-fkcs-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-fkcs gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-fkcs --json 2>&1 | tee /tmp/fkcs-gate.json

  # Story 11.7 (AC4/D2) — v2.0 third-party trial attestation producer gate.
  # Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-trial-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-trial-attestation-${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-trial-attestation gate (green path)
        run: |
          set -o pipefail
          cargo run -p xtask -- check-trial-attestation --json 2>&1 | tee /tmp/trial-attestation-gate.json
      # P6/§A6: the proven-red vectors (the falsifier legs each watched RED-then-GREEN)
      # and the real-harness tests (D2 — derive_reload_facts_from_local_runner over a
      # real LocalRunner, derive_halt_recall_from_onboarding_score over the real
      # scorer, recompute_cargo_tree_locked over the real workspace). CI must run
      # these, not just the green gate JSON, or the §A6 "watch each leg red" guarantee
      # is not delivered.
      - name: Run trial-attestation proven-red + real-harness tests
        run: |
          cargo test -p maos-eval --features trial-attestation
          cargo test -p xtask --test trial_attestation_proven_red -- --test-threads=1
          cargo test -p xtask --test story_10_2_proven_red -- trial_gate --test-threads=1
  # Story 11.4b (AC5) — ADR-024 sandbox-escape structural detector gate
  # (out-of-kernel read-only TL consumer; per-leg independence). The live-seccomp
  # leg builds the forbidden-syscall-probe fixture first (real seccomp SIGSYS
  # substrate). Advisory at v1.0/v1.5 (WOULD-HAVE-BLOCKED banner); blocking at v2.0.
  check-escape-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-escape-detector-${{ hashFiles('**/Cargo.lock') }}
      - name: Build forbidden-syscall-probe fixture (real seccomp substrate)
        run: cargo build --release --manifest-path crates/maos-escape-detector/test-fixtures/forbidden-syscall-probe/Cargo.toml
      - name: Run check-escape-detector gate
        run: |
          set -o pipefail
          cargo run -p xtask -- check-escape-detector --json 2>&1 | tee /tmp/escape-detector-gate.json
  # Story 10.1a AC4 — v1.0 Ship-Gate Aggregate: fan-in of all automated ship-gate sub-jobs.
  # All sub-gates are continue-on-error: false. The aggregate uses if: always() with
  # explicit result checks to prevent skip-propagation false positives.
  v1-0-ship-gate:
    runs-on: ubuntu-latest
    needs:
      - ccac-n600-ship-gate
      - nfr-rel-3-hsis-95pct
      - check-stability-matrix
      - check-breaking-md
      - check-pentest-gate
      - check-coverage-matrix-completeness
      - check-owasp-freeze-hash
      - check-third-party-trial
      - check-cross-form-equiv
      - check-red-team-gate
      - check-export-control
      - check-host-surface
      - check-dependency-closure
      - check-cna-registration
      - check-fuzz-targets
      - fuzz-build
      - check-ko-coverage
      - windows-check
      - check-migration-merkle
      - check-live-bilateral-consent
      - check-rotation-real-timing
      - check-j4-latency
      - check-mobile-push-on-halt
      - check-ff-j6
      - check-skill-conformance
      - wasm-host-tests
      - check-wasm-form-equiv
      - check-cross-region-consensus
      - check-multi-region-slo
      - check-scale-churn
      - check-cohort-mesh
      - check-enterprise-pdp
      - check-enterprise-identity
      - check-fkcs
      - check-trial-attestation
      - check-escape-detector
      - check-env-contract
    if: always()
    steps:
      - name: Ship gate results summary
        run: |
          echo "=== v1.0 Ship Gate Results ==="
          echo ""
          echo "| Gate | Status | Evidence |"
          echo "|------|--------|----------|"
          echo "| ccac-n600-ship-gate | ${{ needs.ccac-n600-ship-gate.result }} | cargo test -p maos-compliance --test ccac_ship_gate_test |"
          echo "| check-breaking-md | ${{ needs.check-breaking-md.result }} | cargo run -p xtask -- check-breaking-md |"
          echo "| check-ship-gate-completeness | ${{ needs.check-ship-gate-completeness.result }} | cargo run -p xtask -- check-ship-gate-completeness |"
          echo "| check-pentest-gate | ${{ needs.check-pentest-gate.result }} | cargo run -p xtask -- check-pentest-gate |"
          echo "| check-coverage-matrix-completeness | ${{ needs.check-coverage-matrix-completeness.result }} | cargo run -p xtask -- check-coverage-matrix-completeness |"
          echo "| check-owasp-freeze-hash | ${{ needs.check-owasp-freeze-hash.result }} | sha256sum --check docs/pen-test/owasp-risk-rating-v1.0-frozen.md.sha256 |"
          echo "| check-third-party-trial | ${{ needs.check-third-party-trial.result }} | cargo run -p xtask -- check-third-party-trial |"
          echo "| check-cross-form-equiv | ${{ needs.check-cross-form-equiv.result }} | cargo run -p xtask -- check-cross-form-equiv |"
          echo "| check-red-team-gate | ${{ needs.check-red-team-gate.result }} | cargo run -p xtask -- check-red-team-gate |"
          echo "| check-export-control | ${{ needs.check-export-control.result }} | cargo run -p xtask -- check-export-control |"
          echo "| check-host-surface | ${{ needs.check-host-surface.result }} | cargo run -p xtask -- check-host-surface |"
          echo "| check-dependency-closure | ${{ needs.check-dependency-closure.result }} | cargo run -p xtask -- check-dependency-closure |"
