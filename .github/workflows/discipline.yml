      - name: Run check-dev-record-completeness
        run: cargo run -p xtask -- check-dev-record-completeness --json

  # Story 7.1.5 — assert ZERO bare `_No review findings._` placeholders remain
  check-bare-review-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-bare-review-findings
        run: cargo run -p xtask -- check-bare-review-findings --json

  # Story 7.1.5 — assert every story file has a populated `dev_model_used:` frontmatter field
  check-dev-model-used-populated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-dev-model-used-populated
        run: cargo run -p xtask -- check-dev-model-used-populated --json

