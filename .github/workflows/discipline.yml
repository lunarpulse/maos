  # Story 10.5 AC1 (NFR-Test-10) — skill-format conformance gate.
  check-skill-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
