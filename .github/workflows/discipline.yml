      - name: Run revocation pipeline integration tests
        run: cargo test -p maos-kernel-core --test revocation_applier_pipeline --release

  # Story 20-3a AC11 — t3-escape-corpus-v1 runs in verified T3: 25 v0 scenarios =
  # 24 executed + 1 withdrawn by name with its recorded reason
  # (runtime_escape_runtime_version_disclosure_005: image composition, not a
  # containment boundary — methodology-attestation.json `withdrawn`).
  # Claims: host files/PIDs and OCI sockets unreachable, rootfs read-only,
  # dropped capabilities, bounded PIDs, outbound IPv4/IPv6/DNS blocked; NOT
  # universal escape resistance or a T2 claim. Every kind-8 assertion uses
  # D-10's confirmed-write observed-effect marker. M3 additionally checks socket
  # custody (0600 refused / 0666 reachable). A SKIP on this capable runner fails.
  t3-escape-corpus:
    strategy:
      fail-fast: false
      # 20-12 AC4 — KEPT at both x64 T3 images: containment is each image's kernel + OCI runtime (the subject).
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: t3-escape-corpus-${{ matrix.image }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Build the static containment probe (all executable vectors)
        run: >-
          RUSTFLAGS='-C target-feature=+crt-static'
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          --manifest-path crates/maos-eval/test-fixtures/t3-network-escape-probe/Cargo.toml
      - name: Run the T3 escape corpus and every executable scenario
        shell: bash
        run: |
          set +e
          cargo test --locked -p maos-eval --test t3_escape_corpus --test t3_network_escape_executor --test t3_escape_workflow --release -- --nocapture 2>&1 | tee t3-escape.log
          rc=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import collections, json, pathlib, re
          root = pathlib.Path("crates/maos-eval/fixtures/t3-escape-corpus-v1")
          expected = {json.loads(p.read_text())["scenario_id"] for p in root.glob("*/*.json")}
          withdrawn = {row["id"] for row in json.loads((root / "methodology-attestation.json").read_text())["withdrawn"]}
          declared = {json.loads(p.read_text())["scenario_id"] for p in pathlib.Path("crates/maos-eval/fixtures/t3-escape-corpus-v0").glob("*/*.json")}
          log = pathlib.Path("t3-escape.log").read_text()
          executed = re.findall(r"^T3-ESCAPE-EXECUTED (\S+) block_observed=true kind8=1 ", log, re.M)
          counts = collections.Counter(executed)
          if expected | withdrawn != declared or expected & withdrawn:
              raise SystemExit(f"T3 accounting failed: executable+withdrawn must equal the {len(declared)} declared v0 scenarios")
          if set(counts) != expected or any(n != 1 for n in counts.values()):
              raise SystemExit(f"T3 accounting failed: executed={len(executed)}/{len(expected)} missing={sorted(expected-set(counts))} extra={sorted(set(counts)-expected)} duplicates={dict(counts)}")
          if re.search(r"^SKIP[: ]|^T3-ESCAPE-UNEXECUTED ", log, re.M):
              raise SystemExit("T3 capable runner printed SKIP or an unexecuted scenario")
          if "T3-NETWORK-MATRIX socket0600=refused socket0666=reachable" not in log:
              raise SystemExit("T3 socket custody matrix did not execute")
          print(f"T3-ESCAPE-ACCOUNTING executed={len(counts)}/{len(expected)} withdrawn={len(withdrawn)} {sorted(withdrawn)} unexecuted=0")
          PY
          exit "$rc"

  # Story 5.5a — T3 image signature verification corpus
  nfr-sec-1-t3-image-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run T3 image-verify tests
        run: cargo test -p maos-kernel-core --test sandbox_t3_image_verify --release

  # Story 5.5a, unmasked by Story 17-1 AC4(c) — the live T3 boundary
  # (`sandbox_t3_spawn_linux`: nonroot uid/gid, separate network namespace,
  # names-only runtime argv, guard cleanup) on both x64 T3 images. The job id
  # is historical; the payload is a script on the signed digest-pinned image.
  t3-smoke-busybox:
    strategy:
      fail-fast: false
      # 20-12 AC4 — KEPT at both x64 T3 images: the live T3 boundary (uid/gid, netns) is each image's runtime.
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: t3-smoke-${{ matrix.image }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Run the live T3 boundary test
        shell: bash
        run: |
          set +e
          cargo test --locked -p maos-kernel-core --test sandbox_t3_spawn_linux --release -- --nocapture 2>&1 | tee t3-smoke.log
          rc=${PIPESTATUS[0]}
          grep -E 'panicked at' t3-smoke.log | head -3 | while IFS= read -r line; do
            echo "::error title=T3 smoke (${{ matrix.image }})::${line}"
          done
          if grep -q '^SKIP[: ]' t3-smoke.log; then rc=1; echo "::error title=T3 smoke (${{ matrix.image }})::a SKIP line was printed"; fi
          echo "::notice title=T3 smoke (${{ matrix.image }})::rc=${rc} $(grep '^test result' t3-smoke.log)"
          exit "$rc"

  # Story 17-1 AC1 / D-11 — the Epic-17 exit lines on both x64 T3 images.
  # Lines 1 and 1b run the real T3 Worker topology and its audit query, then an
  # independent Transparency Log read (`scripts/epic_17_exit_line1.py`). Line 3
  # (17-6) and line 2 (17-3c) are carried verbatim; line 2b (17-3d) reads line
  # 2's store through the FR4 view (`scripts/epic_17_exit_line2b.py`). A red line
  # is fixed at its origin, never masked. No macOS image: the `macos-check` job
  # is the only macOS job.
  # Story 20-15: Ubuntu 24.04 is the oldest shipped runtime. Build once per
  # architecture; each package/features invocation keeps its own archive (never
  # a workspace-feature-unified substitute). Artifacts are scoped to this run.
  ci-test-producer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            image: ubuntu-24.04
          - arch: arm64
            image: ubuntu-24.04-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MAOS_FIXTURE_TRANSPORT: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Install pinned WASM fixture assembler
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.259.0
      - name: Build invocation-family nextest archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-test-archives" "$RUNNER_TEMP/ci-test-files"
          cargo nextest archive --locked -p maos-bin --features network,wasm-host \
            --test spawned_scope_17_3c --test worker_resource_limits_17_2 \
            --test live_escape_anomaly_17_10 --test recall_17_3d --test participant_recall_17_8 \
            --test consent_gate_21_7 \
            --test smoke_cli_wrapper_8_12 \
            --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst"
          cargo nextest archive --locked -p maos-bin --features network \
            --test worker_terminal_facts_17_7 --test cli_wrapper_exhaustion_17_9 \
            --test observer_live_17_4 --test observer_activity_corpus_17_4 \
            --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network.tar.zst"
          cargo nextest archive --locked -p maos-kernel-core \
            --test cgroup_ceiling_smoke --test sandbox_enforcement_linux --test bridge_t2_route_17_6 \
            --archive-file "$RUNNER_TEMP/ci-test-archives/kernel.tar.zst"
          cargo nextest archive --locked -p maos-wasm-host --test t2_sandbox_kill \
            --archive-file "$RUNNER_TEMP/ci-test-archives/wasm-host-t2.tar.zst"
          cargo nextest archive --locked -p maos-escape-detector \
            --archive-file "$RUNNER_TEMP/ci-test-archives/escape-detector.tar.zst"
          cargo nextest archive --locked -p maos-host -p maos-wasm-host \
            --archive-file "$RUNNER_TEMP/ci-test-archives/host-wasm-host.tar.zst"
          cargo nextest archive --locked \
            --manifest-path crates/maos-wasm-host/guests/equiv-fixture/native-twin/Cargo.toml \
            --archive-file "$RUNNER_TEMP/ci-test-archives/native-twin.tar.zst"
      - name: Build the release CLI invocation families
        run: |
          set -euo pipefail
          cargo build --locked --release -p maos-bin -p maos-wasm-host \
            --features maos-bin/wasm-host --bin maos --bin maos-wasm-runner
          tar -C / -cf "$RUNNER_TEMP/ci-test-files/release-epic17.tar" \
            "${GITHUB_WORKSPACE#/}/target/release/maos" \
            "${GITHUB_WORKSPACE#/}/target/release/maos-wasm-runner"
          cargo build --locked --release -p maos-bin --features wasm-host --bin maos
          cargo build --locked --release -p maos-wasm-host --bin maos-wasm-runner
          cargo build --locked --release -p maos-cli --bin maosctl
          tar -C / -cf "$RUNNER_TEMP/ci-test-files/release-wasm-host.tar" \
            "${GITHUB_WORKSPACE#/}/target/release/maos" \
            "${GITHUB_WORKSPACE#/}/target/release/maos-wasm-runner" \
            "${GITHUB_WORKSPACE#/}/target/release/maosctl"
      - name: Build the fixtures and debug exit binaries
        run: |
          set -euo pipefail
          cargo build --locked -p maos-bin --bin maos
          cargo run --locked -p xtask -- build-test-fixtures --only forbidden-syscall-probe,escape-forbidden-syscall-probe,maos-wasm-runner,maos-wasm-runner-fault-inject,echo_spirit.wasm,routed_relay.wasm,recall_probe.wasm,lifecycle_probe.wasm,compat_echo_2_0.wasm,equiv-native-twin,maosctl,worker-cli-fixture,maos-spirit
          mkdir -p target/tmp
          rustc --edition=2021 -C opt-level=1 --crate-name cgroup_ceiling_fixture \
            crates/maos-kernel-core/tests/fixtures/native/cgroup_ceiling.rs \
            -o target/tmp/cgroup-ceiling-fixture
          if [ '${{ matrix.arch }}' = x64 ]; then
            RUSTFLAGS='-C target-feature=+crt-static' cargo build --locked \
              -p worker --bin worker-probe-fixture --target x86_64-unknown-linux-gnu
          fi
      - name: Pack exact producer fixtures, tools and identity
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, tarfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-test-files'
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          manifest_path = root / 'target/maos-fixtures/manifest.json'
          manifest = json.loads(manifest_path.read_text())
          # The rewrite below re-emits exactly these keys; any other would be dropped.
          assert set(manifest) == {'schema', 'command', 'fixtures'}, sorted(manifest)
          assert manifest['schema'] == 3, manifest['schema']
          # Archive extraction can replace the profile's runner with a different
          # family build. Keep the fixture's verified bytes at an immutable path;
          # profile_binary entries (maosctl/worker fixtures) stay profile-coupled.
          runner = manifest['fixtures']['maos-wasm-runner']
          stable_runner = root / 'target/maos-fixtures/maos-wasm-runner'
          shutil.copy2(runner['path'], stable_runner)
          runner['path'] = str(stable_runner)
          entries = [f'    {json.dumps(name)}: {json.dumps(entry, separators=(",", ":"))}'
                     for name, entry in sorted(manifest['fixtures'].items())]
          manifest_path.write_text(
              '{\n  "schema": 3,\n  "command": ' + json.dumps(manifest['command']) +
              ',\n  "fixtures": {\n' + ',\n'.join(entries) + '\n  }\n}\n')
          paths = {manifest_path, root / 'target/debug/maos',
                   root / 'target/debug/maos-wasm-runner',
                   root / 'target/tmp/cgroup-ceiling-fixture'}
          for name, entry in manifest['fixtures'].items():
              assert entry.get('tree') == tree and entry.get('artifact'), (name, entry)
              artifact = subprocess.check_output(
                  ['git', 'hash-object', '--no-filters', '--', entry['path']], cwd=root, text=True).strip()
              assert artifact == entry['artifact'], (name, entry)
              paths.add(pathlib.Path(entry['path']))
          if os.environ['BUNDLE_ARCH'] == 'x64':
              paths.add(root / 'target/x86_64-unknown-linux-gnu/debug/worker-probe-fixture')
          with tarfile.open(bundle / 'fixtures-debug.tar', 'w') as archive:
              for path in sorted(paths):
                  assert path.is_file(), str(path)
                  archive.add(path, arcname=str(path).lstrip('/'), recursive=False)
          with tarfile.open(bundle / 'tools.tar', 'w') as archive:
              for name in ('cargo-nextest', 'wasm-tools'):
                  path = shutil.which(name)
                  assert path, name
                  archive.add(path, arcname=name, recursive=False)
                  if name == 'cargo-nextest':
                      # The packed binary's own report; consumers compare the extracted one.
                      nextest = subprocess.check_output([path, 'nextest', '--version'], text=True).splitlines()[0]
                      assert nextest.startswith('cargo-nextest 0.9.149 '), nextest
          identity = dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          arch=os.environ['BUNDLE_ARCH'], workspace=str(root), tree=tree,
                          nextest=nextest)
          (bundle / 'producer.json').write_text(json.dumps(identity) + '\n')
          PY
      - name: Upload same-run architecture archives
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-archives-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-archives/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload same-run architecture fixtures and binaries
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-files-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-files/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  epic-17-exit:
    needs: [ci-test-producer]
    strategy:
      fail-fast: false
      # 20-12 AC4 — KEPT at both x64 T3 images: the Epic-17 exit lines are product claims per shipped T3 image.
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    env:
      RUSTC: /bin/false
      CARGO_BUILD_RUSTC: /bin/false
      CARGO: /bin/false
      MAOS_FIXTURE_DIR: ${{ github.workspace }}/target/maos-fixtures
      MAOS_FIXTURE_TRANSPORT: '1'
      EPIC17_TERMINAL_SUITE_TESTS: 35
      EPIC17_TERMINAL_REQUIRED_TESTS: |
        root_crash::root_crash_retains_stopped_container_and_purge_reports_it
        root_crash::purge_cgroup_native_binding_and_dead_creator_twins
        runtime_scenes::client_first_stop_snapshots_only_a_terminal_state
        runtime_scenes::fallback_oom_marker_persists_classified_fault_through_worker_binding
        runtime_scenes::ownership_is_by_cid_never_by_requested_name
        s1_immediate_exit_terminal_facts
        s2_intentional_exit_137_is_not_a_signal
        s3_external_sigkill_requires_pidfd_fact
        s4_oom_marker_is_not_payload_evidence_alone
        startup_scenes::root_signal_during_init_joins_owned_cid_before_forced_exit
        stub_scenes::bearer_create_diagnostic_and_runtime_arguments_do_not_echo_secret
        stub_scenes::concurrent_facts_and_teardown_share_snapshot_and_verdict
        stub_scenes::deadlines_hung_exists_is_typed_and_bounded
        stub_scenes::deadlines_hung_rm_is_bounded
        stub_scenes::deadlines_kill_is_bounded_and_verdict_is_shared
        stub_scenes::deadlines_remove_failure_is_typed
        stub_scenes::init_pidfile_invalid_forms_refuse_and_remove_only_receipt_cid
        stub_scenes::launch_refuses_nonempty_and_wrong_mode_state_before_runtime
        stub_scenes::ownership_create_timeout_cleans_the_receipt_cid
        stub_scenes::ownership_receipt_authority_refuses_foreign_and_disagreement
        supervisor_scenes::binding_revokes_bearer_before_unconfirmed_stop_and_root_retains_lease
        supervisor_scenes::bridge_finalized_exit_rows_round_trip_through_fr4_audit_query
        supervisor_scenes::clean_exit_marker_completes_from_persisted_bridge_output
        supervisor_scenes::deadlines_root_stop_tears_down_n_cids_under_one_deadline
        supervisor_scenes::failed_create_and_finalized_exit_rows_never_echo_bearer
        supervisor_scenes::fallback_client_exit_persists_nonzero_fault_through_binding_classifier
        supervisor_scenes::late_attachment_after_stop_tears_down_once
        supervisor_scenes::sandbox_applied_report_survives_journal_reopen
        supervisor_scenes::unexpected_client_echild_finalizer_first_persists_one_truncated_fault
        supervisor_scenes::unexpected_client_observer_first_persists_one_truncated_fault
        unload_scenes::s5_on_unload_over_budget_keeps_planned_container_ownership
        unload_scenes::s5_on_unload_panic_before_stop_keeps_planned_container_ownership
        unload_scenes::s5_budget_oracle_counts_exceeded_kind_not_a_delayed_warning
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-archives-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-archives
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-files-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-files
      - name: Restore exact producer workspace files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-test-tools"
          tar -C "$RUNNER_TEMP/ci-test-tools" -xf "$RUNNER_TEMP/ci-test-files/tools.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          producer = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-test-files/producer.json').read_text())
          nextest = subprocess.check_output([os.environ['RUNNER_TEMP'] + '/ci-test-tools/cargo-nextest', 'nextest', '--version'], text=True).splitlines()[0]
          expected = dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          arch='x64', workspace=str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()),
                          tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                          nextest=nextest)
          assert producer == expected, (producer, expected)
          PY
          echo "$RUNNER_TEMP/ci-test-tools" >> "$GITHUB_PATH"
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/fixtures-debug.tar"
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/release-epic17.tar"
      # ubuntu-26.04's /tmp is a quota-limited tmpfs (actions/runner-images#14777).
      - name: Keep build and image temporaries off /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Build the Worker root and the static probe fixture
        run: |
          test -x target/debug/maos
          test -x target/debug/maosctl
          test -x target/x86_64-unknown-linux-gnu/debug/worker-probe-fixture
      - name: Record T3 runtime versions
        run: |
          podman version
          conmon --version
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}'
          podman info --format '{{.Host.CgroupManager}}'
          uname -r
      - name: Build terminal-facts scene prerequisites
        run: |
          test -x target/debug/worker-cli-fixture
      - name: Epic-17 exit line 4 — retained T3 terminal facts (Story 17-7)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network
          NEXTEST_ARCHIVE_TESTS: worker_terminal_facts_17_7
          MAOS_CGROUP_CANARY_ARCHIVE: ${{ runner.temp }}/ci-test-archives/maos-bin-network-wasm.tar.zst
        run: |
          set +e
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-7-terminal --timeout 1800 --rootless-canary -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::worker_terminal_facts_17_7)" 2>&1 | tee "$RUNNER_TEMP/worker-terminal-facts.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          required_tests=()
          while IFS= read -r test_name; do
            if [ -n "$test_name" ]; then required_tests+=(--required-test "$test_name"); fi
          done <<< "${EPIC17_TERMINAL_REQUIRED_TESTS}"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code 0 --expected-count "${EPIC17_TERMINAL_SUITE_TESTS}" "${required_tests[@]}" "$RUNNER_TEMP/worker-terminal-facts.log" || rc=1
          if grep -Eq 'SKIP|(^|[[:space:]])0 tests run:|tests? run: .*, [1-9][0-9]* skipped' "$RUNNER_TEMP/worker-terminal-facts.log"; then
            rc=1
            echo "::error title=Epic-17 exit line 4 (${{ matrix.image }})::SKIP, ignored, or zero tests"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-17-terminal-${{ matrix.image }}
          path: ${{ runner.temp }}/worker-terminal-facts.log
          if-no-files-found: warn
      # Story 17-9 (AC5.5, D-17-9-FW-06 A) — a CLI-wrapper spawn whose Worker
      # pid's issuance window is exhausted REFUSES on the local and the remote
      # path through the post-bind guard (never a tokenless proceed), while an
      # absent `proc.exec` grant keeps D1's proceed posture. Same provisioned
      # T3 substrate and delegated rootless unit as line 4; every test name and
      # marker is required; SKIP, ignored and zero-test runs are refused.
      - name: CLI-wrapper spawn refuses on issuance-quota exhaustion (Story 17-9)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network
          NEXTEST_ARCHIVE_TESTS: cli_wrapper_exhaustion_17_9
          MAOS_CGROUP_CANARY_ARCHIVE: ${{ runner.temp }}/ci-test-archives/maos-bin-network-wasm.tar.zst
        run: |
          set +e
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-7-cli-quota-17-9 --timeout 1800 --rootless-canary -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::cli_wrapper_exhaustion_17_9)" 2>&1 | tee "$RUNNER_TEMP/cli-wrapper-exhaustion.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          required_tests=()
          for name in remote_exhaustion_refuses_before_workload \
                      local_exhaustion_refuses_before_workload \
                      absent_grant_keeps_d1_tokenless_proceed_posture \
                      absent_grant_is_policy_denied_even_with_spent_quota; do
            required_tests+=(--required-test "$name")
          done
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code 0 --expected-count 4 "${required_tests[@]}" "$RUNNER_TEMP/cli-wrapper-exhaustion.log" || rc=1
          for marker in 'CLI-QUOTA-17-9 remote exhaustion refused before workload' \
                        'CLI-QUOTA-17-9 local exhaustion refused before workload' \
                        'CLI-QUOTA-17-9 absent grant D1 completed without token' \
                        'CLI-QUOTA-17-9 absent grant policy denial precedes quota'; do
            grep -qF -- "$marker" "$RUNNER_TEMP/cli-wrapper-exhaustion.log" || { rc=1; echo "::error title=17-9 CLI quota (${{ matrix.image }})::missing marker '${marker}'"; }
          done
          if grep -Eq 'SKIP|(^|[[:space:]])0 tests run:|tests? run: .*, [1-9][0-9]* skipped' "$RUNNER_TEMP/cli-wrapper-exhaustion.log"; then
            rc=1
            echo "::error title=17-9 CLI quota (${{ matrix.image }})::SKIP, ignored, or zero tests"
          fi
          [ "$rc" -eq 0 ] || grep -E 'panicked at' "$RUNNER_TEMP/cli-wrapper-exhaustion.log" | head -5 | while IFS= read -r line; do
            echo "::error title=17-9 CLI quota (${{ matrix.image }})::${line}"
          done
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-17-cli-quota-${{ matrix.image }}
          path: ${{ runner.temp }}/cli-wrapper-exhaustion.log
          if-no-files-found: warn
      # Story 17-4 (CR-6) — exit line 5: Observer live beside Butler in one
      # root (AC1) and the 20-scenario activity corpus with its oracle (AC4).
      # `maosctl` is a sibling package's binary resolved beside `maos`, so it
      # is prebuilt above. The executed-count guard refuses SKIP, nextest-skipped
      # (ignored) and zero-test runs — the required names cover 6 of 19 tests; a
      # run that leaves no summary.json did not reach the oracle and fails. Copy
      # Cargo's fixed scratch output beside the CI log.
      - name: Epic-17 exit line 5 — Observer live scene + activity corpus (Story 17-4)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network
          NEXTEST_ARCHIVE_TESTS: observer_live_17_4 observer_activity_corpus_17_4
          EPIC17_LINE5_REQUIRED_TESTS: |
            observer_activity_corpus_production_path
            overflow_counts_exact_loss_and_preserves_first_plus_suffix
            real_corpus_meets_all_scenario_floors
            observer_serves_and_reports_a_door_loaded_butler_live
            a_door_loaded_observer_reports_like_the_root_one
            once_roots_with_an_observer_exit_cleanly_without_activity_lines
        run: |
          set +e
          rm -rf target/tmp/observer-activity-17-4
          rm -rf "$RUNNER_TEMP/observer-activity-17-4"
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E 'binary_id(maos-bin::observer_activity_corpus_17_4)' 2>&1 | tee "$RUNNER_TEMP/observer-17-4.log"
          corpus_rc=${PIPESTATUS[0]}
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E 'binary_id(maos-bin::observer_live_17_4)' 2>&1 | tee -a "$RUNNER_TEMP/observer-17-4.log"
          rc=${PIPESTATUS[0]}
          if [ "$corpus_rc" -ne 0 ]; then rc=$corpus_rc; fi
          required_tests=()
          while IFS= read -r test_name; do
            if [ -n "$test_name" ]; then required_tests+=(--required-test "$test_name"); fi
          done <<< "${EPIC17_LINE5_REQUIRED_TESTS}"
          # Suites run in target-name order: the corpus (16), then the scene (3).
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 16 --expected-count 3 "${required_tests[@]}" "$RUNNER_TEMP/observer-17-4.log" || rc=1
          if grep -Eq 'SKIP|(^|[[:space:]])0 tests run:|tests? run: .*, [1-9][0-9]* skipped' "$RUNNER_TEMP/observer-17-4.log"; then
            rc=1
            echo "::error title=Epic-17 exit line 5 (${{ matrix.image }})::SKIP, ignored, or zero tests"
          fi
          if [ -d target/tmp/observer-activity-17-4 ]; then
            cp -a target/tmp/observer-activity-17-4 "$RUNNER_TEMP/" || rc=1
          fi
          if [ ! -s "$RUNNER_TEMP/observer-activity-17-4/summary.json" ]; then
            rc=1
            echo "::error title=Epic-17 exit line 5 (${{ matrix.image }})::no summary.json — the corpus oracle never completed"
          fi
          grep -E '^aggregate \|' "$RUNNER_TEMP/observer-17-4.log" | while IFS= read -r line; do
            echo "::notice title=Epic-17 exit line 5 (${{ matrix.image }})::${line}"
          done
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-17-observer-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/observer-17-4.log
            ${{ runner.temp }}/observer-activity-17-4/
          if-no-files-found: warn
      # The runner refuses SKIP lines from its children; this step also refuses
      # one from the runner itself, and requires its positive kind-8 verdict, so
      # a runner that skips or returns early cannot pass (AC4 proof).
      - name: Epic-17 exit lines 1 and 1b — Worker sandbox, egress refusal, audit query
        shell: bash
        run: |
          set +e
          python3 scripts/epic_17_exit_line1.py --maos target/debug/maos \
            --probe target/x86_64-unknown-linux-gnu/debug/worker-probe-fixture \
            --output "$RUNNER_TEMP/epic-17-exit-line1" --image ${{ matrix.image }} 2>&1 | tee "$RUNNER_TEMP/line1.out"
          rc=${PIPESTATUS[0]}
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/line1.out"; then rc=1; echo "::error title=Epic-17 exit line 1 (${{ matrix.image }})::a SKIP line was printed"; fi
          if [ "$rc" -eq 0 ] && ! grep -q '^::notice title=Epic-17 exit lines 1/1b .*3 Kernel-origin kind-8 rows' "$RUNNER_TEMP/line1.out"; then
            rc=1
            echo "::error title=Epic-17 exit line 1 (${{ matrix.image }})::the runner exited 0 without its verified kind-8 verdict"
          fi
          exit "$rc"
      - name: Build the forbidden-syscall probes (line 3 prerequisite; xtask build-test-fixtures, Story 20-12)
        run: test -s target/maos-fixtures/manifest.json
      - name: Epic-17 exit line 3 — T2 kill (Story 17-6)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-wasm-host
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: t2_sandbox_kill
        run: |
          set +e
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/wasm-host-t2.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture -E 'binary_id(maos-wasm-host::t2_sandbox_kill)' 2>&1 | tee "$RUNNER_TEMP/t2.log"
          rc=${PIPESTATUS[0]}
          grep -E 'panicked at|rule 11' "$RUNNER_TEMP/t2.log" | head -3 | while IFS= read -r line; do
            echo "::error title=Epic-17 exit line 3 (${{ matrix.image }})::${line}"
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/t2.log"; then rc=1; echo "::error title=Epic-17 exit line 3 (${{ matrix.image }})::a SKIP line was printed"; fi
          echo "::notice title=Epic-17 exit line 3 (${{ matrix.image }})::rc=${rc} $(grep 'tests run:' "$RUNNER_TEMP/t2.log")"
          exit "$rc"
      - name: Componentize the TypeScript Spirit (line 2 prerequisite)
        working-directory: examples/example-spirit-ts
        run: npm ci && npm run build && npm run componentize
      # The T2 WASM runner places itself in a delegated cgroup v2 subtree and
      # refuses without one (17-3c; never a production fallback). Like podman
      # for T3, this job originates that precondition: the verbatim launch runs
      # inside the same dedicated Delegate=yes unit the 17-3c proof uses.
      - name: Epic-17 exit line 2 — the TypeScript Spirit launch (Story 17-3c)
        shell: bash
        run: |
          set +e
          sudo systemd-run --unit=maos-17-3c-proof --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --property=CPUAccounting=yes --property=MemoryAccounting=yes \
            --property="WorkingDirectory=$PWD" \
            "$PWD/scripts/run_17_3c_delegated.sh" target/release/maos run examples/example-spirit-ts/manifest.toml --once 2>&1 | tee "$RUNNER_TEMP/line2.log"
          rc=${PIPESTATUS[0]}
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/line2.log"; then rc=1; echo "::error title=Epic-17 exit line 2 (${{ matrix.image }})::a SKIP line was printed"; fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-17 exit line 2 (${{ matrix.image }})::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line2.log" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-17 exit line 2 (${{ matrix.image }})::rc=0"
          fi
          exit "$rc"
      # Same audit store as line 2: its systemd unit runs with the passwd HOME
      # and no MAOS_/XDG_DATA_HOME overrides, so the query is pinned to that
      # environment. `--spirit` resolves the TS Spirit's
      # latest (boot_nonce, spirit_pid) and renders FR4: a tokenless recall row
      # exits non-zero. Story 17-8 AC1 re-states the line under participant
      # scope: the --once seed is a frame the Spirit RECEIVED, so its fetch
      # succeeds. The checker requires exactly R1 log.recall -> R2 log.fetch
      # before the turn's 17-3c rows and no refusal or channel row.
      - name: Epic-17 exit line 2b — the TypeScript Spirit's recall rows (Story 17-8 AC1)
        shell: bash
        run: |
          set +e
          env -u MAOS_HOME -u MAOS_AUDIT_DB -u XDG_DATA_HOME HOME="$(getent passwd "$(id -u)" | cut -d: -f6)" \
            target/release/maos audit query --spirit example-spirit-ts --format plain > "$RUNNER_TEMP/line2b.log" 2> "$RUNNER_TEMP/line2b.err"
          rc=$?
          cat "$RUNNER_TEMP/line2b.log" "$RUNNER_TEMP/line2b.err"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-17 exit line 2b (${{ matrix.image }})::maos audit query exited ${rc}: $(tail -n 2 "$RUNNER_TEMP/line2b.err" | paste -sd' ' -)"
            exit "$rc"
          fi
          python3 scripts/epic_17_exit_line2b.py "$RUNNER_TEMP/line2b.log" | tee "$RUNNER_TEMP/line2b.verdict"
          rc=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [ "$rc" -eq 0 ]; then echo "::notice title=Epic-17 exit line 2b (${{ matrix.image }})::${line}"
            else echo "::error title=Epic-17 exit line 2b (${{ matrix.image }})::${line}"; fi
          done < "$RUNNER_TEMP/line2b.verdict"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-17-exit-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/epic-17-exit-line1/
            ${{ runner.temp }}/line1.out
            ${{ runner.temp }}/t2.log
            ${{ runner.temp }}/line2.log
            ${{ runner.temp }}/line2b.log
            ${{ runner.temp }}/line2b.err
          if-no-files-found: warn

  # Story 18-1 AC1.5 (D-18-1-11 A) — the Epic-18 hermetic exit job: exit line 1
  # verbatim (epic-18 exit block, line 1) on a keyless runner — fresh HOME,
  # MAOS_HOME and XDG_DATA_HOME, no provider key, MAOS_OLLAMA_URL unset — and
  # its proven-red twin: the same line over a planted-violation cassette (the
  # seed completion without `options`) that must exit non-zero naming the
  # field. One image: exit line 1 is not an image claim. Story 18-2 CR-4 adds
  # exit line 2 verbatim (`maos eval halt --class butler`, the signed sidecar
  # uploaded) and its proven-red twin: the committed drift-blind cassette must
  # exit 1 with `halt_recall_overall 0.800 below floor 0.90` (D-18-2-02 B).
  # Story 18-3 CR-3 adds exit line 3 verbatim (the Researcher's survey through
  # the Inference Port: the binding witness, a `researcher_survey` event with
  # findings/open_questions/confidence_map/bibliography and one completion per
  # cassette entry) and its proven-red twin (the same line over an EMPTY
  # cassette must exit non-zero, refused naming `exhausted`), and closes TIA-6
  # (`deferred-work.md:1248`): `maosctl spirit benchmark butler` verifies the
  # sidecar exit line 2 just wrote, under the same scratch HOME. Story 18-4
  # (AC1.4) adds exit line 4 verbatim — 21 simulated days of the acceptance
  # fixture; the ledger-informed belief_variance halt must fire on a day ≤ 21
  # with the pooled rate still ≥ 0.6 (upstream), one digest per simulated day —
  # and its steady twin: the same line over the steady fixture must run 21 days
  # with NO halt (the standing red for line 4: a rule that ignores the window
  # halts the steady director on day 1).
  epic-18-exit:
    needs: [ci-test-producer]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC: /bin/false
      CARGO_BUILD_RUSTC: /bin/false
      CARGO: /bin/false
      MAOS_FIXTURE_DIR: ${{ github.workspace }}/target/maos-fixtures
      MAOS_FIXTURE_TRANSPORT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-files-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-files
      - name: Restore exact producer workspace files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-test-tools"
          tar -C "$RUNNER_TEMP/ci-test-tools" -xf "$RUNNER_TEMP/ci-test-files/tools.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          producer = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-test-files/producer.json').read_text())
          nextest = subprocess.check_output([os.environ['RUNNER_TEMP'] + '/ci-test-tools/cargo-nextest', 'nextest', '--version'], text=True).splitlines()[0]
          expected = dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          arch='x64', workspace=str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()),
                          tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                          nextest=nextest)
          assert producer == expected, (producer, expected)
          PY
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/fixtures-debug.tar"
      - name: Build the root
        run: test -x target/debug/maos
      # Story 18-3 CR-3 (TIA-6) — the registry reader the line-2 sidecar is served by.
      - name: Build maosctl
        run: test -x target/debug/maosctl
      - name: Epic-18 exit line 1 — Butler's proposal through the Inference Port (Story 18-1)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j-butler/on-idle-halt.json maos run spirits/butler/manifest.toml --once > "$RUNNER_TEMP/line1.out" 2> "$RUNNER_TEMP/line1.err"
          rc=$?
          cat "$RUNNER_TEMP/line1.out" "$RUNNER_TEMP/line1.err"
          if [ "$rc" -eq 0 ] && ! grep -q '"event":"butler_notification".*"options":\[' "$RUNNER_TEMP/line1.out"; then
            rc=1
            echo "::error title=Epic-18 exit line 1::exit 0 without a notification carrying the completion's options"
          fi
          if [ "$rc" -eq 0 ] && ! grep -q '"event":"halt"' "$RUNNER_TEMP/line1.out"; then
            rc=1
            echo "::error title=Epic-18 exit line 1::exit 0 without the belief_variance halt"
          fi
          if [ "$rc" -eq 0 ] && ! grep -q 'butler inference seam wired' "$RUNNER_TEMP/line1.err"; then
            rc=1
            echo "::error title=Epic-18 exit line 1::exit 0 but Butler never bound the Inference Port (the arithmetic path also emits options and the halt)"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-18 exit line 1::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line1.err" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-18 exit line 1::rc=0"
          fi
          exit "$rc"
      - name: Epic-18 exit line 1 twin — a planted-violation cassette must exit non-zero (Story 18-1)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          twin="$RUNNER_TEMP/on-idle-halt-missing-options.json"
          python3 - crates/maos-journey-test/cassettes/j-butler/on-idle-halt.json "$twin" <<'PY'
          import json, sys
          cassette = json.load(open(sys.argv[1]))
          completion = json.loads(cassette["entries"][0]["response"]["text"])
          del completion["options"]
          cassette["entries"][0]["response"]["text"] = json.dumps(completion)
          json.dump(cassette, open(sys.argv[2], "w"))
          PY
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE="$twin" maos run spirits/butler/manifest.toml --once > "$RUNNER_TEMP/twin.out" 2> "$RUNNER_TEMP/twin.err"
          rc=$?
          cat "$RUNNER_TEMP/twin.out" "$RUNNER_TEMP/twin.err"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Epic-18 exit line 1 twin::the planted violation exited 0 — the shape/proposal gate is not a control"
            exit 1
          fi
          if ! grep -q 'pass refused.*options' "$RUNNER_TEMP/twin.err"; then
            echo "::error title=Epic-18 exit line 1 twin::rc=${rc} but the refusal does not name the missing field: $(tail -n 3 "$RUNNER_TEMP/twin.err" | paste -sd' ' -)"
            exit 1
          fi
          echo "::notice title=Epic-18 exit line 1 twin::rc=${rc}, refused naming \`options\`"
      - name: Epic-18 exit line 2 — maos eval halt replays the Butler halt corpus (Story 18-2)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY MAOS_INFERENCE_MODE MAOS_REPLAY_CASSETTE
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          maos eval halt --class butler > "$RUNNER_TEMP/line2.out" 2> "$RUNNER_TEMP/line2.err"
          rc=$?
          cat "$RUNNER_TEMP/line2.out" "$RUNNER_TEMP/line2.err"
          if [ "$rc" -eq 0 ] && ! grep -q '"event":"eval_halt"' "$RUNNER_TEMP/line2.out"; then
            rc=1
            echo "::error title=Epic-18 exit line 2::exit 0 without the eval_halt line"
          fi
          if [ "$rc" -eq 0 ] && ! grep -q '"completions_consumed":30' "$RUNNER_TEMP/line2.out"; then
            rc=1
            echo "::error title=Epic-18 exit line 2::exit 0 but the run did not consume one completion per row"
          fi
          if ! cp "$MAOS_HOME"/registry/spirits/butler/*/benchmark.signed.json "$RUNNER_TEMP/line2.benchmark.signed.json"; then
            rc=1
            echo "::error title=Epic-18 exit line 2::no signed benchmark sidecar in registry storage"
          fi
          # Story 18-3 CR-3 (TIA-6): the two binaries meet — maosctl reads and
          # verifies the sidecar maos eval halt wrote, same scratch HOME.
          target/debug/maosctl spirit benchmark butler > "$RUNNER_TEMP/line2.maosctl.out" 2> "$RUNNER_TEMP/line2.maosctl.err"
          bench_rc=$?
          cat "$RUNNER_TEMP/line2.maosctl.out" "$RUNNER_TEMP/line2.maosctl.err"
          if [ "$bench_rc" -ne 0 ]; then
            rc=1
            echo "::error title=Epic-18 exit line 2::maosctl spirit benchmark butler rc=${bench_rc} $(tail -n 3 "$RUNNER_TEMP/line2.maosctl.err" | paste -sd' ' -)"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-18 exit line 2::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line2.err" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-18 exit line 2::rc=0"
          fi
          exit "$rc"
      - name: Epic-18 exit line 2 twin — the drift-blind cassette must miss overall recall (Story 18-2)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY MAOS_INFERENCE_MODE MAOS_REPLAY_CASSETTE
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          maos eval halt --class butler --cassette spirits/butler/tests/fixtures/halt-corpus-v0.3.drift-blind.json > "$RUNNER_TEMP/line2-twin.out" 2> "$RUNNER_TEMP/line2-twin.err"
          rc=$?
          cat "$RUNNER_TEMP/line2-twin.out" "$RUNNER_TEMP/line2-twin.err"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Epic-18 exit line 2 twin::the drift-blind cassette exited 0 — the overall-recall floor is not a control"
            exit 1
          fi
          if ! grep -q 'halt_recall_overall 0.800 below floor 0.90' "$RUNNER_TEMP/line2-twin.err"; then
            echo "::error title=Epic-18 exit line 2 twin::rc=${rc} but the refusal does not name the overall-recall floor: $(tail -n 3 "$RUNNER_TEMP/line2-twin.err" | paste -sd' ' -)"
            exit 1
          fi
          echo "::notice title=Epic-18 exit line 2 twin::rc=${rc}, halt_recall_overall 0.800 below floor 0.90"
      - name: Epic-18 exit line 3 — Researcher replays through the Inference Port (Story 18-3)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j-researcher/survey-distill.json maos run spirits/researcher/manifest.toml --once > "$RUNNER_TEMP/line3.out" 2> "$RUNNER_TEMP/line3.err"
          rc=$?
          cat "$RUNNER_TEMP/line3.out" "$RUNNER_TEMP/line3.err"
          entries="$(jq '.entries | length' crates/maos-journey-test/cassettes/j-researcher/survey-distill.json)"
          # 18-7 adds one authoring completion after the three survey claims.
          survey_entries=$((entries - 1))
          if [ "$rc" -eq 0 ] && ! grep -q 'researcher inference seam wired' "$RUNNER_TEMP/line3.err"; then
            rc=1
            echo "::error title=Epic-18 exit line 3::exit 0 but the Researcher never bound the Inference Port"
          fi
          if [ "$rc" -eq 0 ] && ! jq -Rse --argjson n "$survey_entries" '[split("\n")[] | fromjson? | select(type == "object" and .event == "researcher_survey")] | length == 1 and $n > 0 and (.[0] | has("findings") and has("open_questions") and has("confidence_map") and has("bibliography") and .completions_consumed == $n)' "$RUNNER_TEMP/line3.out" > /dev/null; then
            rc=1
            echo "::error title=Epic-18 exit line 3::exit 0 without one researcher_survey event carrying findings/open_questions/confidence_map/bibliography and completions_consumed == ${survey_entries} (${entries} total including authoring)"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-18 exit line 3::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line3.err" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-18 exit line 3::rc=0, completions_consumed=${survey_entries}, total_completions=${entries}"
          fi
          exit "$rc"
      - name: Epic-18 exit line 3 twin — an empty cassette must exit non-zero (Story 18-3)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          twin="$RUNNER_TEMP/survey-distill-empty.json"
          if ! jq '.entries = []' crates/maos-journey-test/cassettes/j-researcher/survey-distill.json > "$twin"; then
            echo "::error title=Epic-18 exit line 3 twin::could not build the empty cassette"
            exit 1
          fi
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE="$twin" maos run spirits/researcher/manifest.toml --once > "$RUNNER_TEMP/line3-twin.out" 2> "$RUNNER_TEMP/line3-twin.err"
          rc=$?
          cat "$RUNNER_TEMP/line3-twin.out" "$RUNNER_TEMP/line3-twin.err"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Epic-18 exit line 3 twin::the empty cassette exited 0 — a fallback still answers without a completion"
            exit 1
          fi
          # The replay port prints `CASSETTE EXHAUSTED` on its own; the
          # refusal line itself must name the cause (TIA-3) — that is what
          # proves the pass failed closed on the exhausted cassette.
          if ! grep -qE 'researcher on_idle pass refused: .*exhausted' "$RUNNER_TEMP/line3-twin.err"; then
            echo "::error title=Epic-18 exit line 3 twin::rc=${rc} but the refusal does not name the exhausted cassette: $(tail -n 3 "$RUNNER_TEMP/line3-twin.err" | paste -sd' ' -)"
            exit 1
          fi
          echo "::notice title=Epic-18 exit line 3 twin::rc=${rc}, refused naming \`exhausted\`"
      - name: Epic-18 exit line 4 — 21 compressed days and the variance-led halt (Story 18-4)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j-butler/on-idle-halt.json maos run spirits/butler/manifest.toml --clock compressed:21d --acceptance tests/fixtures/j-butler/acceptance-21d.jsonl > "$RUNNER_TEMP/line4.out" 2> "$RUNNER_TEMP/line4.err"
          rc=$?
          cat "$RUNNER_TEMP/line4.out" "$RUNNER_TEMP/line4.err"
          if [ "$rc" -eq 0 ] && ! grep -q 'butler inference seam wired' "$RUNNER_TEMP/line4.err"; then
            rc=1
            echo "::error title=Epic-18 exit line 4::exit 0 but Butler never bound the Inference Port"
          fi
          halt_day="$(jq -rs '[.[] | select(.event == "halt" and .render == "halted on belief_variance" and .day <= 21 and .diagnostic.rate >= 0.6) | .day] | if length == 1 then .[0] else "none" end' "$RUNNER_TEMP/line4.out")"
          if [ "$rc" -eq 0 ] && [ "$halt_day" = "none" ]; then
            rc=1
            echo "::error title=Epic-18 exit line 4::exit 0 without exactly one belief_variance halt on a day <= 21 at a pooled rate >= 0.6"
          fi
          if [ "$rc" -eq 0 ] && ! jq -es --argjson d "$halt_day" '([.[] | select(.event == "acceptance_day")] | length) == ($d - 1) and ([.[] | select(.event == "morning_digest")] | length) == $d and ([.[] | select(.event == "scene_complete" and .halt_day == $d)] | length) == 1' "$RUNNER_TEMP/line4.out" > /dev/null; then
            rc=1
            echo "::error title=Epic-18 exit line 4::the scene did not decide one offer and render one digest per simulated day up to the halt"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-18 exit line 4::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line4.err" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-18 exit line 4::rc=0, halted on day ${halt_day}"
          fi
          exit "$rc"
      - name: Epic-18 exit line 4 twin — the steady director must never halt (Story 18-4)
        shell: bash
        run: |
          set +e
          export PATH="$PWD/target/debug:$PATH"
          scratch="$(mktemp -d)"
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY
          export HOME="$scratch" MAOS_HOME="$scratch" XDG_DATA_HOME="$scratch/xdg"
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_STRICT=1 MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j-butler/on-idle-halt.json maos run spirits/butler/manifest.toml --clock compressed:21d --acceptance tests/fixtures/j-butler/acceptance-21d-steady.jsonl > "$RUNNER_TEMP/line4-twin.out" 2> "$RUNNER_TEMP/line4-twin.err"
          rc=$?
          cat "$RUNNER_TEMP/line4-twin.out" "$RUNNER_TEMP/line4-twin.err"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-18 exit line 4 twin::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line4-twin.err" | paste -sd' ' -)"
            exit 1
          fi
          if ! jq -es '([.[] | select(.event == "halt")] | length) == 0 and ([.[] | select(.event == "acceptance_day")] | length) == 21 and ([.[] | select(.event == "scene_complete" and .halt_day == null)] | length) == 1' "$RUNNER_TEMP/line4-twin.out" > /dev/null; then
            echo "::error title=Epic-18 exit line 4 twin::the steady director halted or the scene ran short — the halt does not lead on the director's uncertainty"
            exit 1
          fi
          echo "::notice title=Epic-18 exit line 4 twin::rc=0, 21 days, no halt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-18-exit
          path: |
            ${{ runner.temp }}/line1.out
            ${{ runner.temp }}/line1.err
            ${{ runner.temp }}/twin.out
            ${{ runner.temp }}/twin.err
            ${{ runner.temp }}/line2.out
            ${{ runner.temp }}/line2.err
            ${{ runner.temp }}/line2.benchmark.signed.json
            ${{ runner.temp }}/line2.maosctl.out
            ${{ runner.temp }}/line2.maosctl.err
            ${{ runner.temp }}/line2-twin.out
            ${{ runner.temp }}/line2-twin.err
            ${{ runner.temp }}/line3.out
            ${{ runner.temp }}/line3.err
            ${{ runner.temp }}/line3-twin.out
            ${{ runner.temp }}/line3-twin.err
            ${{ runner.temp }}/line4.out
            ${{ runner.temp }}/line4.err
            ${{ runner.temp }}/line4-twin.out
            ${{ runner.temp }}/line4-twin.err
          if-no-files-found: warn

  # Story 19-4 AC1.3 (D-19-4-10 A, D19-3 A) — the Epic-19 hermetic exit job.
  # OWN-BUILD (not a 20-15 consumer): the exit line is `cargo run -p xtask --
  # demo-j1`, which builds the workspace itself, so `CARGO=/bin/false` could not
  # run it verbatim. The exit block is unchanged; the job provisions the T3
  # substrate first (D19-3 A — every Worker runs under real T3) and sets
  # MAOS_REPLAY_STRICT=1, which reaches the daemon child because `demo-j1` spawns
  # it without `env_clear`. Line 1 must exit 0 with every EXECUTED beat ok, the
  # four 19-4 beats executed, and `tier2-live-agent-signed` the ONLY ABSENT beat
  # (`two-host-signed-run` renders INDETERMINATE, never ABSENT). Its proven-red
  # twin (AC2.6) runs the same line over the clear-judgement twin cassette
  # (section 2 judged 0.31 ≤ 0.5): three frames, no halt, and `demo-j1` must exit
  # non-zero naming `ambiguity-halt-within-2-frames`. The AC5 resume vector
  # (`epic_halt_resume_19_4`: halt → door resolve → resumed section) runs last.
  # 20-1a AC5: mechanism-proven, with a fresh publisher key; not J6 independence.
  epic-20-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - name: Build the example component at this SHA
        working-directory: examples/example-spirit-ts
        run: npm ci && npm run build && npm run componentize
      # The default artifact now boots a T2 sandboxed component inside the shell
      # dispatch, so the existing harness substrate precedes that step.
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Epic-20 release, publish, install and truthful shell dispatch
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- release-dry-run
          RELEASE_SIGNING_KEY=794959d4c4dc813f968cd95eb4a45c4a02583a7c5211126e7b4583e4776d1c8d cargo run --locked -p xtask -- release-verify --sign --key-env RELEASE_SIGNING_KEY --sha256sums dist/SHA256SUMS --output dist/SHA256SUMS.sig
          # Story 21-9: the default artifact is the daemon plus its named sibling
          # runner. `maos` resolves `maos-wasm-runner` beside its canonical path
          # (dist/maos-linux-amd64), so the unsuffixed runner link is required.
          for b in maos maosctl maos-registry-server maos-spirit maos-wasm-runner; do ln -sf "$b-linux-amd64" "dist/$b"; done
          export PATH="$PWD/dist:$PATH"
          scratch="$(mktemp -d)"
          export HOME="$scratch/home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_RUNTIME_DIR="$scratch/run"
          mkdir -p "$HOME/.config/maos" "$XDG_RUNTIME_DIR"
          printf '[registry]\ndevelopment_http = true\n' > "$HOME/.config/maos/operator.toml"
          cleanup() {
            if [ -n "${server_pid:-}" ]; then kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          maosctl install --from-local ./dist --verify-only
          # `--verify-only` covers the daemon; the runner's exact bytes are bound to
          # the same signed SHA256SUMS here, and the sums are recorded for the run.
          (cd dist && grep -E '^[0-9a-f]{64}  (maos|maos-wasm-runner)-linux-amd64$' SHA256SUMS | tee "$OLDPWD/release-artifact-sha.log" | sha256sum -c -)
          [ "$(wc -l < release-artifact-sha.log)" -eq 2 ]
          maos-registry-server --dev-http --bind 127.0.0.1:6789 --root "$scratch/registry" > registry.log 2>&1 &
          server_pid=$!
          ready=0
          for i in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/6789) 2>/dev/null; then ready=1; break; fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then echo "::error::registry readiness failed within 5 s"; cat registry.log; exit 1; fi
          MAOS_SPIRIT_SIGNING_KEY="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" maos-spirit publish --registry-uri http://127.0.0.1:6789/mcp --tier=public_untrusted --manifest examples/example-spirit-ts/manifest.toml --artifact examples/example-spirit-ts/dist/spirit.wasm --signing-key-env MAOS_SPIRIT_SIGNING_KEY
          maosctl spirit install example-spirit-ts@0.1.0 --registry-uri http://127.0.0.1:6789/mcp
          maos init --plain
          # Story 21-9 / 17-3c: the shell dispatch runs the SIGNED dist/maos (beside its
          # signed sibling runner) under the existing delegated unit; the helper script
          # requires the exact maos-17-3c-proof service cgroup. systemd-run --pipe keeps
          # the unit's stdout and stderr on separate pipes, so they are captured apart.
          shell_rc=0
          printf '@example-spirit-ts hello\n' | sudo systemd-run --unit=maos-17-3c-proof --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --property=CPUAccounting=yes --property=MemoryAccounting=yes --property="WorkingDirectory=$PWD" "$PWD/scripts/run_17_3c_delegated.sh" env HOME="$HOME" XDG_DATA_HOME="$XDG_DATA_HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE="$PWD/crates/maos-journey-test/cassettes/j0/shell-intro.json" "$PWD/dist/maos" shell --plain > shell.out 2> shell.err || shell_rc=$?
          echo "--- shell stdout ---"; cat shell.out
          echo "--- shell stderr ---"; cat shell.err
          cat shell.out shell.err > shell.log
          # Story 21-9 AC1/AC5: the default signed artifact serves the installed
          # Spirit. Success means exit 0, a non-empty log carrying the host-initialized
          # line (the sibling runner was found), AND exactly one real guest reply line
          # `example-spirit-ts: echo: hello` on stdout before `maos: shell exiting`
          # from this same invocation and NO other `example-spirit-ts:` stdout line;
          # a delivery acknowledgment is NOT that reply.
          # Any engine-off/boot/dispatch refusal or unknown-spirit line fails the job.
          # The explicit engine-free refusal is a separate build shape
          # (--no-default-features --features network) in example-spirit-ts-tests.
          [ "$shell_rc" -eq 0 ]
          [ -s shell.log ]
          grep -F "maos: Spirit host (WASM component form, ADR-031) initialized" shell.log
          awk 'index($0,"example-spirit-ts:")==1 { total++; if (!exited && $0=="example-spirit-ts: echo: hello") exact++ } $0=="maos: shell exiting" { exited=1 } END { exit !(total==1 && exact==1 && exited) }' shell.out
          if grep -E "wasm_engine_off|refused at boot|dispatch refused|session refused|unknown spirit|WASM Spirit form disabled|cannot resolve daemon binary" shell.log; then exit 1; fi
          kill -TERM "$server_pid"
          wait "$server_pid"
          unset server_pid
      # No fresh binary is built for the guest exercise: the AC4 witness below runs
      # the exact signed dist/maos (+ its named sibling dist runner), re-verified
      # against the signed SHA256SUMS. Only the worker fixture is built here.
      - name: Build the worker CLI fixture
        run: |
          cargo build --locked --release -p worker --bin worker-cli-fixture
      - name: AC4 — execute the admitted installed component, not an engine-off refusal
        shell: bash
        run: |
          set -euo pipefail
          # Replay-fixture witness (MAOS_INFERENCE_MODE=replay), not a live-inference run.
          (cd dist && grep -E '^[0-9a-f]{64}  (maos|maos-wasm-runner)-linux-amd64$' SHA256SUMS | sha256sum -c -)
          scratch="$(mktemp -d)"
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/home/.local/share" MAOS_HOME="$scratch/home/.maos"
          mkdir -p "$HOME/.config/maos"
          printf '[registry]\ndevelopment_http = true\n' > "$HOME/.config/maos/operator.toml"
          dist/maos-registry-server --dev-http --bind 127.0.0.1:6789 --root "$scratch/registry" > component-registry.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; rm -rf "$scratch"' EXIT
          ready=0
          for i in $(seq 1 50); do if (exec 3<>/dev/tcp/127.0.0.1/6789) 2>/dev/null; then ready=1; break; fi; sleep 0.1; done
          [ "$ready" -eq 1 ] || { cat component-registry.log; exit 1; }
          MAOS_SPIRIT_SIGNING_KEY="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" dist/maos-spirit publish --registry-uri http://127.0.0.1:6789/mcp --tier=public_untrusted --manifest examples/example-spirit-ts/manifest.toml --artifact examples/example-spirit-ts/dist/spirit.wasm --signing-key-env MAOS_SPIRIT_SIGNING_KEY
          dist/maosctl spirit install example-spirit-ts@0.1.0 --registry-uri http://127.0.0.1:6789/mcp
          "$PWD/dist/maos" init --plain
          manifest="$(python3 -c 'import json,os,pathlib; r=pathlib.Path(os.environ["MAOS_HOME"])/"registry"; print(r/"installed"/json.loads((r/"installed-index.json").read_text())["example-spirit-ts"]/"manifest.toml")')"
          /usr/bin/time -p sudo systemd-run --unit=maos-17-3c-proof --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --property=CPUAccounting=yes --property=MemoryAccounting=yes --property="WorkingDirectory=$PWD" "$PWD/scripts/run_17_3c_delegated.sh" env HOME="$HOME" MAOS_HOME="$MAOS_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE="$PWD/crates/maos-journey-test/cassettes/j0/shell-intro.json" "$PWD/dist/maos" run "$manifest" --once 2>&1 | tee component.log
          grep -F 'spirit_session_complete' component.log
          # Component exchange, from the attributable session report the CLI prints:
          # at least one turn completed (delivered/denied counters are recorded, not
          # asserted, since the report does not tie them to the example's reply).
          python3 -c 'import json,sys; ev=[json.loads(l) for l in open("component.log") if l.startswith("{\"event\":\"spirit_session_complete\"")]; assert len(ev)==1, ev; r=ev[0]["report"]; print("session-report", {k:r[k] for k in ("turns","delivered_frames","denied_frames")}); assert r["turns"]>=1, r'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-20-exit
          path: |
            registry.log
            release-artifact-sha.log
            shell.log
            shell.out
            shell.err
            component.log
            component-registry.log

  epic-19-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAOS_REPLAY_STRICT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - uses: ./.github/actions/provision-t3-test-substrate
      - name: Epic-19 exit line 1 — demo-j1 replays the founder loop (Story 19-4)
        shell: bash
        run: |
          set +e
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY MAOS_LIVE_AGENT
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j1/founder-loop.json cargo run -p xtask -- demo-j1 > "$RUNNER_TEMP/line1.out" 2> "$RUNNER_TEMP/line1.err"
          rc=$?
          cat "$RUNNER_TEMP/line1.out" "$RUNNER_TEMP/line1.err"
          for beat in epic-decomposed-n-frames ambiguity-halt-within-2-frames digest-cites-source-refs halt-resume-referential-identity; do
            if ! grep -qE "^  ok +${beat} +PROVEN_BLOCKING" "$RUNNER_TEMP/line1.out"; then
              rc=1
              echo "::error title=Epic-19 exit line 1::beat ${beat} did not render ok"
            fi
          done
          if grep -qE '^  FAIL ' "$RUNNER_TEMP/line1.out"; then
            rc=1
            echo "::error title=Epic-19 exit line 1::an executed beat rendered FAIL"
          fi
          absent="$(grep -E '^  -- +[a-z0-9-]+ +ABSENT ' "$RUNNER_TEMP/line1.out" | awk '{print $2}' | sort -u | paste -sd' ' -)"
          if [ "$absent" != "tier2-live-agent-signed" ]; then
            rc=1
            echo "::error title=Epic-19 exit line 1::ABSENT set is '${absent}', expected exactly tier2-live-agent-signed"
          fi
          if ! grep -qE '^  (--|ok) +two-host-signed-run +(INDETERMINATE|PROVEN_BLOCKING|PROVEN_LIVE_SIGNED) ' "$RUNNER_TEMP/line1.out"; then
            rc=1
            echo "::error title=Epic-19 exit line 1::two-host-signed-run must render INDETERMINATE or PROVEN, never ABSENT"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Epic-19 exit line 1::rc=${rc} $(tail -n 3 "$RUNNER_TEMP/line1.err" | paste -sd' ' -)"
          else
            echo "::notice title=Epic-19 exit line 1::rc=0, every executed beat ok, ABSENT = {tier2-live-agent-signed}"
          fi
          exit "$rc"
      - name: Epic-19 exit line 1 twin — a clear judgement must red the ambiguity beat (Story 19-4 AC2.6)
        shell: bash
        run: |
          set +e
          unset MAOS_OLLAMA_URL MAOS_ANTHROPIC_API_KEY MAOS_OPENAI_API_KEY MAOS_LIVE_AGENT
          MAOS_INFERENCE_MODE=replay MAOS_REPLAY_CASSETTE=crates/maos-journey-test/cassettes/j1/founder-loop.clear-twin.json cargo run -p xtask -- demo-j1 > "$RUNNER_TEMP/twin.out" 2> "$RUNNER_TEMP/twin.err"
          rc=$?
          cat "$RUNNER_TEMP/twin.out" "$RUNNER_TEMP/twin.err"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Epic-19 exit line 1 twin::the clear-judgement twin exited 0 — the ambiguity halt is not a control"
            exit 1
          fi
          if ! grep -q 'executed beat(s) did not hold: .*ambiguity-halt-within-2-frames' "$RUNNER_TEMP/twin.out" "$RUNNER_TEMP/twin.err"; then
            echo "::error title=Epic-19 exit line 1 twin::rc=${rc} but the failure does not name ambiguity-halt-within-2-frames: $(tail -n 3 "$RUNNER_TEMP/twin.err" | paste -sd' ' -)"
            exit 1
          fi
          if ! grep -qE '^  ok +epic-decomposed-n-frames ' "$RUNNER_TEMP/twin.out"; then
            echo "::error title=Epic-19 exit line 1 twin::the twin did not dispatch all three sections — it red for a reason other than the missing halt"
            exit 1
          fi
          echo "::notice title=Epic-19 exit line 1 twin::rc=${rc}, three frames, ambiguity-halt-within-2-frames FAIL"
      - name: Build maosctl and the worker CLI fixture (the AC5 vector resolves over the door)
        run: cargo build -p maos-cli --bin maosctl && cargo run -p xtask -- build-test-fixtures --only worker-cli-fixture
      - name: Run the halt → door resolve → resumed-section vector (Story 19-4 AC5)
        run: cargo test --color never -p maos-bin --test epic_halt_resume_19_4 -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic-19-exit
          path: |
            ${{ runner.temp }}/line1.out
            ${{ runner.temp }}/line1.err
            ${{ runner.temp }}/twin.out
            ${{ runner.temp }}/twin.err
          if-no-files-found: warn

