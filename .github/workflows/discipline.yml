          cargo test -p xtask --test j1_crosshost_2b_proven_red
          cargo test -p maos-bin --test cohort_daemon_smoke_13_5c -- --test-threads=1
          cargo test -p maos-bin --test bounded_postures_2b -- --test-threads=1
      # j1-crosshost-1b AC2.11-2.12 — the demo's beat-ledger assertions live in an
      # in-`src` `#[cfg(test)]` module (`xtask/src/tests/demo_j1_tests.rs`, reached
      # via `include!`), and NO job runs `cargo test -p xtask` unscoped: every
      # invocation names a test or a `--test` target, so those 40-odd assertions were
      # executed by no CI job at all. Enrolled here rather than left as a suggestion,
      # because one of them is this story's own control that the refusal beat no
      # longer renders ABSENT — a claim about whether the narrated artifact tells the
      # truth about its own work.
      - name: Run the demo beat-ledger assertions (1b AC2.11-2.12)
        run: cargo test -p xtask demo_j1 -- --test-threads=1
      # j1-crosshost-1b AC2.5 — `--test consent_refusal_1b` on the line below IS the
      # control. The gate is a static oracle: it has never observed a frame being
      # refused and cannot, it greps source text. The behaviour is proven by THIS
      # step, a different mechanism in a different file, so this line is the only
      # thing connecting the linter to the judge. Delete it and the gate still finds
      # the right words in `consent_refusal_1b.rs` and goes green while the test
      # never runs. The gate's `completion-vectors-enrolled` leg DERIVES the required
      # set from every `crates/*/tests/*_{1a,1b,2a,2b,2e,19_1,19_3}.rs` and checks
      # `-p <crate> --test <stem>` in ONE command, so a new J1 test file that is not
      # named here — under its own crate — reds the gate by construction, not by
      # remembering. Story 19-4 D-19-4-11 A widened the walk past `crates/maos-bin`:
      # the two J1-lane files outside it (`maos-iac`'s duplicate-discrimination
      # negative, `maos-cli`'s cohort-sign regressions) are enrolled below. The `_2c`
      # lane is `check-j1-two-host-signed-run` leg 10's, not this job's.
      - name: Run the frame-borne delegation + consent-refusal legs (AC2.4-2.5, AC3.1-3.4; 1b AC1; 19-4 AC6.2)
        run: |
          cargo test -p maos-iac --test mailbox_a2a_router_installer_1a
          cargo test -p maos-bin --test delegation_leg_1a --test topology_delegation_1a --test consent_refusal_1b -- --test-threads=1
          cargo test -p maos-iac --test transparency_duplicate_discrimination_2b
          cargo test -p maos-cli --test cohort_sign_2e
      # j1-crosshost-2a AC1.8 — the completion-oracle vectors and the worker-manifest
      # reader. Enrolled HERE, on a job that is already BindingClass::Blocking, in
      # `gate-registry.toml`, and a `needs` of the aggregate — rather than in a sixth
      # green box. `--test-threads=1` is mandatory: `MAOS_HOME` is process-global
      # (D16), so `-p maos-bin` is red under default parallel flags.
      #
      # The gate's own `completion-vectors-enrolled` leg READS this file and reds if
      # either `--test` name below disappears, which is what makes AC1.9's
      # enrollment falsifier able to fire at all.
      - name: Run the completion-oracle + worker-manifest legs (2a AC1.1-1.6, AC2, AC3.3, AC4.1)
        run: |
          # Review 2a-P1 — `worker_completion_2a`'s fixture-immunity vector resolves
          # `worker-cli-fixture` at RUNTIME (exe-sibling, then $PATH), and nothing
          # else in this job builds package `worker`'s bin: without this line the
          # enrolled step is red on every fresh runner (reproduced 39/40 locally on
          # a clean target dir; the journey job carries the same pre-build).
          cargo build -p worker --bin worker-cli-fixture
          cargo test -p maos-bin --test worker_completion_2a -- --test-threads=1
          cargo test -p maos-bin --test worker_manifests_2a -- --test-threads=1
      # j1-crosshost-1b AC2.6 — close the `smoke_cli_wrapper_8_12` null control. The
      # Tier-1 claim "CI physically cannot spawn a paid agent" held by env-var
      # omission, not by an executed assertion: this file had ZERO CI invocation.
      # Enrolled by EXACT TEST NAME, not by file (the `discipline.yml:2599` idiom):
      # the file's other test, `maos_run_cli_wrapper_worker_spawns_real_subprocess`,
      # needs `worker-cli-fixture` on PATH and would red on a fresh runner. This one
      # needs no secret and no network — it writes its own 2-line /bin/sh fake
      # `codex` and asserts the REFUSAL path.
      - name: Run the CI-cannot-spawn-a-paid-agent control (1b AC2.6)
        # §A6 review P7 — Rust's harness exits 0 when an `--exact` filter
        # matches ZERO tests, so a renamed test would silently re-kill this
        # control. The grep guard makes the rename RED instead of dead.
        run: |
          grep -q 'fn ci_local_split_refuses_a_granted_real_agent_without_the_live_flag' crates/maos-bin/tests/smoke_cli_wrapper_8_12.rs
          cargo test -p maos-bin --test smoke_cli_wrapper_8_12 ci_local_split_refuses_a_granted_real_agent_without_the_live_flag -- --exact
      # Story 19-1 AC2.3 / D-19-1-10 A — the `_19_1.rs` suffix puts every
      # `crates/maos-bin/tests/*_19_1.rs` in the derived set, so both targets below are
      # REQUIRED here by `completion-vectors-enrolled`. `epic_dispatch_19_1` is the T3
      # three-Worker epic run (substrate provisioned above; `worker-cli-fixture` built
      # by `build-test-fixtures`); `epic_args_19_1` holds the `--epic` parse vectors.
      # Own-build job: no 20-15 archive is consumed.
      # Story 19-3 AC3.2 / D-19-3-10 A — `_19_3.rs` joins the suffix set, so
      # `worker_workspace_19_3` (the T3 workspace + effect-oracle vectors) is REQUIRED
      # here too; AC3's sequence/distinct-pid clauses stay `epic_dispatch_19_1`'s.
      - name: Run the epic dispatch loop, --epic parse vectors and workspace effect oracle (19-1 AC1, AC2; 19-3 AC2.4, AC3.2)
        run: cargo test --color never -p maos-bin --test epic_dispatch_19_1 --test epic_args_19_1 --test worker_workspace_19_3 -- --test-threads=1

  # j1-crosshost-2c AC5.1/AC5.2 — the two-host signed-run judge. ONE always-Blocking
  # hermetic job. Deliberately NO `services:` block: the substrate-drift gate rejects
  # an unregistered service-bearing gate job, and this gate needs no substrate — the
  # paid run's evidence is a capture artifact it validates when present and refuses to
  # let anything claim when absent.
  #
  # The `--test` names below ARE the control. The gate's `two-host-vectors-enrolled`
  # leg DERIVES the required set from `crates/*/tests/*_2c.rs`, so a new `_2c.rs` file
  # that is not named here reds the gate by construction rather than by remembering.
  # `-p maos-bin` is not enrolled here: it is red under default parallel flags (D16)
  # and this story adds no `maos-bin` test target.
  check-j1-two-host-signed-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # §A6 review D-1 (2026-08-18): the AC2.1 stranger's path
      # (tools/verify-audit-bundle/verify.py) requires a Python Ed25519
      # backend; the Blocking lane's substrate must be guaranteed, not hoped for.
      - name: Ensure the stranger's Python Ed25519 backend (AC2.1)
        run: python3 -c "import cryptography" || python3 -m pip install --user cryptography
      # `j1-crosshost-2e` AC1.4 (F5). Installing the backend above and never
      # EXECUTING the script is how a one-argument canonicalization defect
      # survived to be found by hand: `verify.py` escaped non-ASCII to \uXXXX
      # while Rust emits raw UTF-8, so every bundle with one non-ASCII byte
      # failed despite a valid signature — and runbook Phase 7.4 makes this
      # verification a MANDATORY ABORT, i.e. the paid two-host run died here
      # AFTER both agents were billed. The fixture is the committed T6 bundle
      # (12 non-ASCII bytes) under its published pubkey; it is the only signed
      # run this project has performed.
      - name: Execute the stranger's path against the committed T6 bundle (2e AC1.4)
        run: |
          python3 tools/verify-audit-bundle/verify.py \
            _bmad-output/test-artifacts/j1-tier2-evidence/j1-tier2-bundle.json \
            61f4f495dba703e74aff7d42b4286a1a914a89b592a98bf76ed3656c81107766
      - name: Run check-j1-two-host-signed-run
        run: cargo run -p xtask -- check-j1-two-host-signed-run --json
      - name: Run j1-crosshost-2c proven-red vectors (AC5.1)
        run: cargo test -p xtask --test j1_crosshost_2c_proven_red -- --test-threads=1
      - name: Run the signing-identity + two-host reconciliation controls (AC1, AC2)
        run: |
          cargo test -p maos-cli --test signing_identity_2c -- --test-threads=1
          cargo test -p maos-cli --test two_host_reconcile_2c -- --test-threads=1
          cargo test -p maos-audit --test two_host_bundle_2c -- --test-threads=1
      - name: Run the fault-semantics controls (AC3)
        run: |
          cargo test -p maos-a2a-core --test fault_typing_2c -- --test-threads=1
          cargo test -p maos-a2a-core --test digest_reply_durability_2c -- --test-threads=1
          cargo test -p maos-a2a-tcp --test t_2c_fault_windows -- --test-threads=1
          cargo test -p maos-a2a-tcp --test t_2c_pin_journal -- --test-threads=1
          cargo test -p maos-cohort --lib a_failed_commit_leaves_the_digest_reply_retryable_never_duplicate
      - name: Run the stored-row scan + credential-posture controls (AC4)
        run: cargo test -p maos-cli --test credential_posture_2c -- --test-threads=1
      # The census this story moved from 10 typed codes to 12 is machine-checked
      # here, not in a comment. `-p maos-bin` needs `--test-threads=1` (D16).
      - name: Run the NACK-code census (AC3.2)
        run: cargo test -p maos-bin --test bounded_postures_2b -- --test-threads=1

  # Story 8.16 §A4 — kernel-core line-count single source of truth.
  # Story 16-0 — plus a pinned file set and a per-file content hash, so a kernel
  # edit that does not move the line count can no longer pass (drift D2).
  check-kernel-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # AC2's falsifier is Story 15-4's REAL seccomp commit, resolved through
          # the annotated tag `kernel-pin-falsifier-15-4`. A depth-1 clone cannot
          # resolve it and the test fails LOUD rather than skipping. Precedent:
          # `check-fkcs` below. `fetch-depth: 5` would "work" today — the commit
          # is 2 behind HEAD — and would silently break next week; a full-history
          # checkout also fetches the tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          # AC4's reflow vector runs `rustfmt` (the binary, not `cargo fmt` — its
          # tempdir copy has no Cargo.toml). Without this the vector fails loud;
          # an absent toolchain component must never be a silent pass.
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-kernel-baseline
        run: cargo run -p xtask -- check-kernel-baseline --json
      # Named explicitly: no job in this workflow runs `cargo test -p xtask`
      # unscoped (see the note at the top of the xtask jobs), so a test file that
      # is not named in its own step is a test nothing runs.
      - name: Run the Story 16-0 kernel-pin content-hash suite
        run: cargo test -p xtask --test kernel_pin_content_hash_16_0


  # Pre-merge coverage for the HERMETIC journey suite. The full
  # `maos-journey-test` crate runs only in journey-nightly.yml (scheduled),
  # never here — so push/PR CI was green while a Story-8.15 self-contradiction
  # (j0 polled the PTY with raw Instant::now(), violating its own JB-7/H4
  # no-wallclock guard) sat latent until the first nightly fired. This job runs
  # the suite in REPLAY mode (no secrets, no network — cassette/MockMcp only),
  # so the JB-7 guards + j0/j1/j4/researcher/butler deterministic floors gate
  # every PR. The secret-gated live re-record stays nightly-only.
  journey-hermetic-tier-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # Story 17-1 — journey_j1's delegated Worker runs under real T3.
      - uses: ./.github/actions/provision-t3-test-substrate
      # The PTY journey tests spawn the real `maos` binary, resolved via
      # `target/debug/maos` (CARGO_BIN_EXE_maos is unset — the binary lives in a
      # SEPARATE package, maos-bin, so Cargo does not inject it for this crate's
      # integration tests). `cargo test -p maos-journey-test` does NOT build that
      # sibling binary, so it MUST be built first — exactly what nightly does
      # (journey-nightly.yml builds the workspace before the suite). Omitting this
      # makes maos_bin() panic "maos binary not found" → exit 101.
      # Also pre-build `worker-cli-fixture` (separate `worker` package): building
      # maos-bin alone does not produce it, and the journey suite spawns the real
      # `maos` binary from target/debug (see above). (The founder-loop journey smoke
      # that originally needed it was retired by Story 9.6; the build is retained as
      # a defensive pre-build.)
      - name: Build the maos binary + worker-cli-fixture (debug — journey tests spawn target/debug)
        run: cargo build --locked -p maos-bin --bin maos && cargo build --locked -p maos-cli --bin maosctl && cargo build --locked -p worker --bin worker-cli-fixture
      # Includes journey_forget_18_6 (FR45 cascade) and
      # journey_skill_authoring_18_7 (live author/revise, door admission, restart).
      - name: Hermetic journey suite (replay mode — cognitive production paths)
        run: cargo test -p maos-journey-test --locked
      - name: Live skill port security witnesses (18-7, ten tests)
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --locked --color never -p maos-bin --test skill_port_18_7 2>&1 | tee skill-port-18-7.log
          grep -q '10 tests run: 10 passed' skill-port-18-7.log

  # Story 7.2 AC4 — FR59 ≤5min yank-propagation latency gate.
  fr59-yank-propagation-5min:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-registry --test fr59_yank_propagation_within_5min_test -- --nocapture

  # Story 7.2 AC3 — FR60 air-gap import bundle corpus.
  air-gap-import-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Build registered siblings for the publisher package suite
        run: cargo run --locked -p xtask -- build-test-fixtures --only maosctl,maos-registry-server,maos-spirit
      - run: cargo test -p maos-registry --test import_air_gap_test -- --nocapture
      - run: cargo test -p maos-spirit-cli --features fixture_replay -- --nocapture

  # Story 7.3 AC5 — NFR-Aud-9 CCAC N=600 ship gate (P0 ship-blocker).
  # Replays the committed ccac-v1.0 corpus through the maos-compliance evaluator:
  # per-class floor ≥27/30, 100/100 context-drift rejected, ±2% cross-validation
  # across 3 reference contexts. NON-continue-on-error: a regression hard-fails CI.
  ccac-n600-ship-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test -p maos-compliance --test ccac_ship_gate_test -- --nocapture

  # Story 10.1a AC4 — xtask CI lint: asserts expected gate job names are present
  # in the v1.0-ship-gate aggregate job's needs: array.
  #
  # Story 13.6e (AC5) — and the ledger consumer. It downloads the four
  # ledger-set gates' published `product_claim` artifacts and refuses a ship
  # badge asserted over `NOT_PROVEN` evidence, closing this gate's ownerless
  # "never validates anything CI produced" gap. `needs:` + `if: always()` so it
  # runs after the producers whatever they returned — a RED producer's ledger is
  # the one worth reading.
  check-ship-gate-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - check-cross-region-consensus
      - check-multi-region-slo
      - check-multi-tenant-loom
      - check-reza-production-path
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # Same key as the job that SIGNED the ledgers: this step re-verifies every
      # signed leg, and without the key a PROVEN_LIVE_SIGNED leg reprojects to
      # INDETERMINATE and the whole ledger set is rejected (run 36058940696).
      - name: Install the CI-only evidence audit key
        uses: ./.github/actions/install-ci-evidence-key
        with:
          key: ${{ secrets.CI_EVIDENCE_AUDIT_KEY }}
      - name: Download evidence ledgers from the ledger-set gates
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-ledger-*
          path: tests/reports/
          merge-multiple: true
      - name: Run check-ship-gate-completeness
        # This is the ONLY job that downloads the ledger artifacts, so it is the
        # only one that may demand them. Other jobs invoke this gate for its
        # enrolment legs and report `ledger_consumed: false`.
        env:
          MAOS_LEDGER_ARTIFACTS: tests/reports
        run: cargo run -p xtask -- check-ship-gate-completeness --json

  # Story 7.5b AC8 — smoke-onb-1-7-5b: the ONE end-to-end dry-run self-trial.
  # Scaffolds a Spirit, runs it through LocalRunner against the fixture corpus,
  # scores it, emits one outcome, evaluates N=1 → provisional. Wiring proof,
  # explicitly NOT the N=12 gate (the test asserts N=1 ∧ provisional).
  smoke-onb-1-7-5b:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run smoke-onb-1-7-5b self-trial
        run: cargo test -p maos-eval --test onb_1_self_trial -- --nocapture


  # Story 10.1b AC2 — OWASP freeze hash-check: SHA-256 from gate-registry.toml.
  # Hash stored in the invariant-locked registry so any OWASP doc edit requires
  # a registry update, which is auditable and protected by review.
  check-owasp-freeze-hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify OWASP freeze immutability
        run: |
          EXPECTED_HASH=$(grep '^owasp_freeze_hash' xtask/gate-registry.toml | sed 's/.*= "\(.*\)"/\1/')
          ACTUAL_HASH=$(sha256sum docs/pen-test/owasp-risk-rating-v1.0-frozen.md | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "::error::OWASP freeze hash mismatch! Expected: $EXPECTED_HASH, Actual: $ACTUAL_HASH"
            echo "  If the OWASP doc was intentionally updated, update owasp_freeze_hash in xtask/gate-registry.toml"
            exit 1
          fi
          echo "OWASP freeze hash verified: $ACTUAL_HASH"

  # Story 10.4a AC2 (NFR-Ops-10) — SQLite→Postgres migration triple-oracle gate.
  # ABSENT blocks at v1_5 (20-3a R1), so the job does not wait for a corpus to
  # appear (20-3a R1 option A, operator ruling 2026-10-16). It regenerates the
  # pinned 10⁶-row corpus with its deterministic generator (`MANIFEST.toml`
  # `generator` + `seed`; ~2.8 GB, ~25 s locally) and runs the gate against it:
  # the gate re-derives sha256, Merkle root, payload oracle and row count and
  # compares them with the manifest pins, so generator or schema drift reds it.
  # It runs without a Postgres service: the loom-substrate drift gate requires
  # every `services.postgres` gate job to be a registered substrate contract,
  # and those contracts define the evidence-ledger set, so the gate reports
  # `partial: true` (live cross-backend run skipped) rather than widening that
  # set. One CI run with a Postgres 16 service (job 117059607470, PR #9)
  # measured PROVEN_BLOCKING, partial=false; follow-up recorded in deferred-work.
  check-migration-merkle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Generate the pinned migration corpus (deterministic generator)
        run: >-
          cargo run --locked --release -p maos-loom-lite --example generate_migration_corpus --
          --out "$RUNNER_TEMP/migration-corpus-1e6.sqlite"
      - name: Check migration Merkle gate results
        env:
          MAOS_MIGRATION_CORPUS: ${{ runner.temp }}/migration-corpus-1e6.sqlite
        run: cargo run -p xtask -- check-migration-merkle --json
  # Story 10.3 AC-1 (NFR-Comp-1) — export-control classification gate.
  # ECCN doc present + STABILITY.md §Export non-stub + crypto enumeration.
  check-export-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check export-control classification
        run: cargo run -p xtask -- check-export-control --json

  # Story 11.1a AC1/D4 — maos-host public-API baseline gate (ADR-031 Spirit
  # Host Port). Pinned against abi-baseline/maos-host-v1.txt; removed items
  # RED, added items reported but GREEN (F2: NOT the vacuous "empty abi-diff
  # in a non-scanned crate" pattern — this is a dedicated baseline for a
  # crate abi-diff never touches).
  check-host-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: |
          cargo install cargo-public-api --version ${CARGO_PUBLIC_API_VERSION}
      - name: Run check-host-surface
        run: cargo run -p xtask -- check-host-surface --json

  # Story 11.1a AC2/AC3/AC4 — WASM host adapter BEHAVIORAL tests. The four
  # xtask gates above (check-host-surface / check-dependency-closure /
  # check-export-control / check-kernel-baseline) guard the SHAPE of 11.1a
  # (API surface, dependency isolation, packaging); this job guards the
  # BEHAVIOR — the real guest ADR-032 round-trip (AC3), the fuel/T2 kill
  # matrix (AC4), and the frame_bridge lower/lift conversions for all 15
  # FrameKinds (AC2). Without it the 11.1a test suite never executes in CI
  # at all — the CONCERNS finding from the Murat trace audit (2026-07-01).
  # Story 17-6 (AC1, AC3, AC4; epic-17 exit line 3): the T2 suites run on all FOUR
  # shipped Linux images (x64 + arm, R17-50). Every GitHub-hosted Ubuntu image
  # is declared capable of T2 (rule 11(b)): `CI` is set, so a refused T2 spawn
  # PANICS in the helpers — no suite can pass by skipping. `ubuntu-latest` is
  # never used here (it moves to 26.04 in Oct–Nov 2026; the images are pinned).
  # Job logs are 403 without a token, so each verdict is a public annotation.
  # Story 17-2 T5 — real delegated domain and an independently enforced
  # Delegate=no negative control. Both matrices are pinned (never ubuntu-latest).
  cgroup-ceiling-delegated:
    needs: [ci-test-producer]
    strategy:
      fail-fast: false
      # 20-12 AC4 — KEPT at four images: cgroup v2 delegation is the image's systemd + kernel (the subject).
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    env:
      RUSTC: /bin/false
      CARGO_BUILD_RUSTC: /bin/false
      CARGO: /bin/false
      MAOS_FIXTURE_DIR: ${{ github.workspace }}/target/maos-fixtures
      MAOS_FIXTURE_TRANSPORT: '1'
      MAOS_CGROUP_CEILING_FIXTURE: ${{ github.workspace }}/target/tmp/cgroup-ceiling-fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-archives-${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-archives
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-files-${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-files
      - name: Restore exact producer workspace files
        env:
          BUNDLE_ARCH: ${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-test-tools"
          tar -C "$RUNNER_TEMP/ci-test-tools" -xf "$RUNNER_TEMP/ci-test-files/tools.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          producer = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-test-files/producer.json').read_text())
          nextest = subprocess.check_output([os.environ['RUNNER_TEMP'] + '/ci-test-tools/cargo-nextest', 'nextest', '--version'], text=True).splitlines()[0]
          expected = dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          arch=os.environ['BUNDLE_ARCH'], workspace=str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()),
                          tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                          nextest=nextest)
          assert producer == expected, (producer, expected)
          PY
          echo "$RUNNER_TEMP/ci-test-tools" >> "$GITHUB_PATH"
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/fixtures-debug.tar"
      - uses: ./.github/actions/provision-t3-test-substrate
        if: ${{ !endsWith(matrix.image, '-arm') }}
      - name: Install pinned WASM fixture assembler
        run: test -x "$RUNNER_TEMP/ci-test-tools/wasm-tools"
      - name: Fetch locked standalone fixture dependencies for offline session tests
        run: test -s target/maos-fixtures/manifest.json
      - name: Build the session-suite fixtures (xtask build-test-fixtures, Story 20-12)
        run: test -s target/maos-fixtures/manifest.json
      - name: Exercise helper boundary regressions
        run: python3 -m unittest scripts.tests.test_cgroup_ceiling_17_2
      - name: Native cgroup-v2 smoke — four real cases
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-kernel-core
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: cgroup_ceiling_smoke
        run: |
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-delegated --timeout 1800 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/kernel.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --run-ignored ignored-only --no-capture --test-threads 1 -E "binary_id(maos-kernel-core::cgroup_ceiling_smoke)" 2>&1 | tee "$RUNNER_TEMP/cgroup-smoke.log"; test ${PIPESTATUS[0]} -eq 0'
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code 0 --expected-count 4 \
            --required-test native_child_is_placed_before_guest_and_resource_limits_bite \
            --required-test same_spirit_simultaneous_native_spawns_have_distinct_owned_leaves \
            --required-test creation_limit_write_and_exec_failures_release_owned_leaves \
            --required-test killed_leader_cleanup_kills_its_surviving_descendant "$RUNNER_TEMP/cgroup-smoke.log"
      - name: Real admitted session suite — 24 cases, serial
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: spawned_scope_17_3c
          EPIC17_SPAWNED_REQUIRED_TESTS: |
            eight_real_admitted_forms_use_trusted_sender_policy_not_echoed_claims
            forged_guest_provenance_is_restamped_by_the_kernel
            a_delivery_needs_its_iac_send_grant
            wasm_delivery_is_refused_when_its_issuance_window_is_exhausted
            kernel_only_cross_host_oversized_and_foreign_retract_frames_are_refused
            guest_floods_end_in_typed_failures_not_a_wedged_session
            guest_diagnostics_are_bounded_per_session
            runner_refusal_exits_before_ready_are_typed_and_not_crashes
            a_once_session_that_never_completes_its_turn_is_not_success
            hostile_metadata_fails_before_serialization_under_real_t2
            hostile_aliased_strings_fail_before_serialization_under_real_t2
            one_aliased_string_under_the_hostcall_budget_clears_the_canonical_call
            actual_runner_sigsys_reaches_escape_consumer_but_planned_stop_does_not
            repeated_mailbox_exports_survive_idle_without_an_active_task_or_stall
            a_new_turn_after_idle_restarts_the_progress_window
            configured_enterprise_and_mixed_scope_refusals_are_atomic_for_both_forms
            resource_downgrade_memory_only_is_persisted_for_each_fast_t2_restart
            memory_only_t2_live_child_has_exact_rlimits_and_mode_truthful_journal
            resource_downgrade_no_resource_or_fd_only_t2_spawn_emits_no_row
            resource_downgrade_strict_cpu_pid_and_failed_t2_spawns_emit_no_row
            resource_downgrade_append_panic_follows_live_child_observer_installation
            admitted_t2_echo_enforces_exact_live_caps_in_delegated_mode
            fast_t2_crash_then_restart_orders_one_downgrade_after_crash
        run: |
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-delegated --timeout 2400 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::spawned_scope_17_3c)" 2>&1 | tee "$RUNNER_TEMP/spawned-17-3c.log"; test ${PIPESTATUS[0]} -eq 0'
          required_tests=()
          while IFS= read -r test_name; do
            if [ -n "$test_name" ]; then required_tests+=(--required-test "$test_name"); fi
          done <<< "${EPIC17_SPAWNED_REQUIRED_TESTS}"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code 0 --expected-count 24 "${required_tests[@]}" "$RUNNER_TEMP/spawned-17-3c.log"
      - name: Build the actual Worker CLI fixture before the in-unit canary (x64)
        if: ${{ !endsWith(matrix.image, '-arm') }}
        run: test -x target/debug/worker-cli-fixture
      - name: Rootless T3 Worker resource enforcement (x64)
        if: ${{ !endsWith(matrix.image, '-arm') }}
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: worker_resource_limits_17_2
          MAOS_CGROUP_CANARY_ARCHIVE: ${{ runner.temp }}/ci-test-archives/maos-bin-network-wasm.tar.zst
        run: |
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-delegated --timeout 1800 --rootless-canary -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::worker_resource_limits_17_2)" 2>&1 | tee "$RUNNER_TEMP/worker-resource.log"; test ${PIPESTATUS[0]} -eq 0'
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code 0 --expected-count 2 --required-test real_maos_worker_applies_independent_t3_limits_and_observes_exhaustion --required-test fd_request_above_inherited_hard_limit_refuses_before_worker_payload "$RUNNER_TEMP/worker-resource.log"

