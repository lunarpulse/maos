      - name: Ship gate results summary
        run: |
          echo "=== v1.0 Ship Gate Results ==="
          echo ""
          echo "| Gate | Status | Evidence |"
          echo "|------|--------|----------|"
          echo "| ccac-n600-ship-gate | ${{ needs.ccac-n600-ship-gate.result }} | cargo test -p maos-compliance --test ccac_ship_gate_test |"
          echo "| check-breaking-md | ${{ needs.check-breaking-md.result }} | cargo run -p xtask -- check-breaking-md |"
          echo "| check-ship-gate-completeness | ${{ needs.check-ship-gate-completeness.result }} | cargo run -p xtask -- check-ship-gate-completeness |"
          echo "| check-pentest-gate | ${{ needs.check-pentest-gate.result }} | cargo run -p xtask -- check-pentest-gate |"
          echo "| check-coverage-matrix-completeness | ${{ needs.check-coverage-matrix-completeness.result }} | cargo run -p xtask -- check-coverage-matrix-completeness |"
          echo "| check-owasp-freeze-hash | ${{ needs.check-owasp-freeze-hash.result }} | sha256sum --check docs/pen-test/owasp-risk-rating-v1.0-frozen.md.sha256 |"
          echo ""
      - name: Fail if any sub-gate failed or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "v1.0 ship gate FAILED: one or more sub-gates did not pass."
          echo "  ccac-n600-ship-gate: ${{ needs.ccac-n600-ship-gate.result }}"
          echo "  nfr-rel-3-hsis-95pct: ${{ needs.nfr-rel-3-hsis-95pct.result }}"
          echo "  check-stability-matrix: ${{ needs.check-stability-matrix.result }}"
          echo "  check-breaking-md: ${{ needs.check-breaking-md.result }}"
          echo "  check-ship-gate-completeness: ${{ needs.check-ship-gate-completeness.result }}"
          echo "  check-pentest-gate: ${{ needs.check-pentest-gate.result }}"
          echo "  check-coverage-matrix-completeness: ${{ needs.check-coverage-matrix-completeness.result }}"
          echo "  check-owasp-freeze-hash: ${{ needs.check-owasp-freeze-hash.result }}"
          exit 1
