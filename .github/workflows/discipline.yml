  example-spirit-ts-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [check-workspace-count]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Build, test, and componentize the TypeScript scaffold (Story 17-3b AC1)
        shell: bash
        run: |
          set +e
          (
            cd examples/example-spirit-ts
            npm ci &&
              npm test &&
              npm run build &&
              npm run componentize
          ) 2>&1 | tee example-spirit-ts.log
          rc=${PIPESTATUS[0]}
          vitest_verdict="$(
            sed -E $'s/\x1B\\[[0-?]*[ -/]*[@-~]//g' example-spirit-ts.log |
              tr -d '\r' |
              grep -E '^[[:space:]]*Tests[[:space:]]+' |
              paste -sd';' -
          )"
          if [ "$rc" -eq 0 ] && [ -z "$vitest_verdict" ]; then
            echo "::error title=TypeScript scaffold::rc=0 vitest=not reported"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=TypeScript scaffold::rc=0 vitest=$vitest_verdict"
          else
            echo "::error title=TypeScript scaffold::rc=$rc vitest=${vitest_verdict:-not run}"
          fi
          exit "$rc"
      - name: Record TypeScript component outcome
        shell: bash
        run: |
          component=examples/example-spirit-ts/dist/spirit.wasm
          if [ ! -s "$component" ]; then
            echo "::error title=TypeScript component artifact::missing or empty $component"
            exit 1
          fi
          echo "::notice title=TypeScript component artifact::bytes=$(stat -c%s "$component") sha256=$(sha256sum "$component" | cut -d' ' -f1)"
      - name: Upload TypeScript component
        uses: actions/upload-artifact@v4
        with:
          name: example-spirit-ts-component
          path: examples/example-spirit-ts/dist/spirit.wasm
          if-no-files-found: error
      # Story 22-7 AC1: the worked domain example (examples/incident-triage-ts) is built the same way and
      # its component is what `domain_spirit_22_7` below publishes, installs and asks.
      - name: Build, test, and componentize the domain example (Story 22-7)
        shell: bash
        run: |
          set +e
          (
            cd examples/incident-triage-ts
            npm ci &&
              npm test &&
              npm run build &&
              npm run componentize
          ) 2>&1 | tee incident-triage-ts.log
          rc=${PIPESTATUS[0]}
          vitest_verdict="$(
            sed -E $'s/\x1B\\[[0-?]*[ -/]*[@-~]//g' incident-triage-ts.log |
              tr -d '\r' |
              grep -E '^[[:space:]]*Tests[[:space:]]+' |
              paste -sd';' -
          )"
          if [ "$rc" -eq 0 ] && [ -z "$vitest_verdict" ]; then
            echo "::error title=Domain example::rc=0 vitest=not reported"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Domain example::rc=0 vitest=$vitest_verdict"
          else
            echo "::error title=Domain example::rc=$rc vitest=${vitest_verdict:-not run}"
          fi
          exit "$rc"
      - name: Record domain component outcome
        shell: bash
        run: |
          component=examples/incident-triage-ts/dist/spirit.wasm
          if [ ! -s "$component" ]; then
            echo "::error title=Domain component artifact::missing or empty $component"
            exit 1
          fi
          echo "::notice title=Domain component artifact::bytes=$(stat -c%s "$component") sha256=$(sha256sum "$component" | cut -d' ' -f1)"
      - name: Upload domain component
        uses: actions/upload-artifact@v4
        with:
          name: incident-triage-ts-component
          path: examples/incident-triage-ts/dist/spirit.wasm
          if-no-files-found: error
      - name: Build the release WASM runner
        shell: bash
        run: |
          set +e
          cargo build --locked --release -p maos-wasm-host --bin maos-wasm-runner 2>&1 | tee runner-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Release WASM runner build::rc=0"
          else
            echo "::error title=Release WASM runner build::rc=$rc"
          fi
          exit "$rc"
      - name: Drive the TypeScript component through the release runner
        shell: bash
        run: |
          set +e
          MAOS_TS_COMPONENT=$PWD/examples/example-spirit-ts/dist/spirit.wasm cargo test --locked --release -p maos-wasm-host --test ts_component_17_3b -- --ignored --nocapture 2>&1 | tee ts-component-driver.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=TypeScript component driver::rc=0 $(grep 'TS-COMPONENT-OUTCOME' ts-component-driver.log | paste -sd';' -)"
          else
            echo "::error title=TypeScript component driver::rc=$rc"
          fi
          exit "$rc"
      - name: Build maosctl for the admission door test
        shell: bash
        run: |
          set +e
          cargo build --locked -p maos-cli --bin maosctl 2>&1 | tee maosctl-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=maosctl build::rc=0"
          else
            echo "::error title=maosctl build::rc=$rc"
          fi
          exit "$rc"
      # Story 21-9 AC4/AC5: the engine-free refusal witness is an EXPLICIT build
      # shape (`--no-default-features --features network`), not the default. The
      # default shape (engine on) has its own, different witness below; neither
      # may stand in for the other. The named test only exists in the
      # engine-free compile, so its `... ok` line is the proof this shape ran.
      - name: Assert explicit engine-free WASM admission refusal
        shell: bash
        run: |
          set +e
          cargo test --locked -p maos-bin --no-default-features --features network --test wasm_form_admission_17_3b -- --nocapture 2>&1 | tee wasm-admission-engine-free.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            for name in gate_manifest_enforces_wasm_component_form_and_tier_before_engine_refusal \
                        maos_run_refuses_wasm_component_manifests_by_named_engine_state \
                        maosctl_load_returns_wasm_engine_refusal_and_preserves_roster \
                        maosctl_upgrade_refuses_wasm_successor_before_replacing_the_loaded_spirit; do
              grep -q "^test $name \.\.\. ok$" wasm-admission-engine-free.log || { echo "::error title=Engine-free WASM admission::$name did not run and pass"; rc=1; }
            done
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Engine-free WASM admission::rc=0 $(grep -E 'wasm_engine_off|test result' wasm-admission-engine-free.log | paste -sd';' -)"
          else
            echo "::error title=Engine-free WASM admission::rc=$rc"
          fi
          exit "$rc"
      - name: Build WASM skill witness fixtures
        run: |
          rustup target add wasm32-wasip2
          cargo run --locked -p xtask -- build-test-fixtures
      - name: Assert explicit engine-free installed-component boot refusal
        shell: bash
        run: |
          set +e
          cargo test --locked -p maos-bin --no-default-features --features network --test installed_spirit_dispatch_20_1 -- --nocapture 2>&1 | tee installed-dispatch-engine-free.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            grep -q '^test installed_component_dispatch_reports_typed_boot_refusal \.\.\. ok$' installed-dispatch-engine-free.log || { echo "::error title=Engine-free installed dispatch::refusal witness did not run and pass"; rc=1; }
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Engine-free installed dispatch::rc=0 $(grep 'test result' installed-dispatch-engine-free.log | paste -sd';' -)"
          else
            echo "::error title=Engine-free installed dispatch::rc=$rc"
          fi
          exit "$rc"
      # Default features (engine on): no opt-in `--features wasm-host`. The
      # engine-free-only tests must be ABSENT here, so a default run can never be
      # satisfied by the refusal witness. The installed Spirit's reply on the
      # signed default artifact is `epic-20-exit` line 9; the host-level execution
      # of the component is that job's `maos run --once` leg.
      - name: Assert default WASM admission and unsupported in-process surface refusals
        shell: bash
        run: |
          set +e
          # The runner places an installed component in a delegated cgroup v2 subtree and refuses
          # without one (17-3c; the example declares `cpu_max_pct`), so the suite runs inside the
          # harness's dedicated Delegate=yes unit, never an undelegated job shell.
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-example-spirit-ts --timeout 1500 -- cargo test --locked -p maos-bin --test wasm_form_admission_17_3b --test wasm_skill_authoring_20_8 --test installed_spirit_dispatch_20_1 -- --nocapture 2>&1 | tee wasm-admission-default.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            for name in gate_manifest_enforces_wasm_component_form_and_tier_before_engine_refusal \
                        maosctl_load_returns_wasm_engine_refusal_and_preserves_roster \
                        maosctl_upgrade_refuses_wasm_successor_before_replacing_the_loaded_spirit \
                        boot_rechecks_manifest_component_publisher_and_claim; do
              grep -q "^test $name \.\.\. ok$" wasm-admission-default.log || { echo "::error title=Default WASM admission::$name did not run and pass"; rc=1; }
            done
            if grep -qE '^test (maos_run_refuses_wasm_component_manifests_by_named_engine_state|installed_component_dispatch_reports_typed_boot_refusal) ' wasm-admission-default.log; then
              echo "::error title=Default WASM admission::an engine-free-only witness ran in the default shape"
              rc=1
            fi
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Default WASM admission::rc=0 $(grep 'test result' wasm-admission-default.log | paste -sd';' -)"
          else
            echo "::error title=Default WASM admission::rc=$rc"
          fi
          exit "$rc"
      # Story 22-7 AC1 (witness b): the SHIPPED domain Spirit answers `maosctl ask`. The test publishes
      # examples/incident-triage-ts/manifest.toml and the component built above, installs it, boots
      # `maos serve` from kit/spirit-author/host.toml.example and asks four texts. The shipped manifest keeps
      # the template's caps, which need a delegated cgroup, so it runs in the harness's Delegate=yes unit
      # (the harness passes a fixed environment: the component path crosses as `env NAME=VALUE`).
      - name: Domain Spirit answers maosctl ask under a delegated cgroup (Story 22-7)
        shell: bash
        run: |
          set +e
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-domain-spirit --timeout 1500 -- env MAOS_DOMAIN_COMPONENT="$PWD/examples/incident-triage-ts/dist/spirit.wasm" cargo test --locked -p maos-bin --test domain_spirit_22_7 -- --ignored --nocapture 2>&1 | tee domain-spirit-22-7.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            grep -q '^test the_shipped_domain_spirit_answers_maosctl_ask \.\.\. ok$' domain-spirit-22-7.log || { echo "::error title=Domain Spirit::the witness did not run and pass"; rc=1; }
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=Domain Spirit::rc=0 $(grep 'test result' domain-spirit-22-7.log | paste -sd';' -)"
          else
            echo "::error title=Domain Spirit::rc=$rc"
          fi
          exit "$rc"

