          echo "mfc=${{ needs.manifest-field-coverage.result }}" >> $GITHUB_OUTPUT
          echo "v01=${{ needs.v01-evaluator-path.result }}" >> $GITHUB_OUTPUT
          echo "hst=${{ needs.hello-spirit-tests.result }}" >> $GITHUB_OUTPUT
          echo "hsb=${{ needs.hello-spirit-bench.result }}" >> $GITHUB_OUTPUT
          echo "onb=${{ needs.onb-nfr2-timing.result }}" >> $GITHUB_OUTPUT
          echo "est=${{ needs.example-spirit-tests.result }}" >> $GITHUB_OUTPUT
