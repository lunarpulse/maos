        run: cargo test -p maos-eval --test onb_1_self_trial -- --nocapture


  # Story 10.1b AC1 — Pen-test gate: conditional per calibrate-per-commit pattern.
  # When summary.toml exists, parse and assert p0_open == 0 && p1_open == 0.
