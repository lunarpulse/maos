  # (deferred-work.md). Promotes to blocking when NFR-Sec-4 redaction filter ships (v0.5).
  # The job always reports success at the GitHub Actions level; the underlying test
  # outcome is surfaced via the `test_result` job output so the aggregate comment can
  # show "advisory ⚠️" without flipping the overall workflow status to failure.
  determinism-tests:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.surface.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run determinism integration tests (advisory at v0.1-α per DF6)
        id: dtests
        continue-on-error: true
        run: cargo test -p maos-corpus-gen --test determinism_integration
      - name: Surface advisory outcome
        id: surface
        run: |
          if [ "${{ steps.dtests.outcome }}" = "failure" ]; then
            echo "::warning::DF6: determinism integration tests failed — advisory at v0.1-α; promotes to blocking when NFR-Sec-4 ships"
