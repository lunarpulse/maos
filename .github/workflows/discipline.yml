  # Scaffolds a Spirit, runs it through LocalRunner against the fixture corpus,
  # scores it, emits one outcome, evaluates N=1 → provisional. Wiring proof,
  # explicitly NOT the N=12 gate (the test asserts N=1 ∧ provisional).
  smoke-onb-1-7-5b:
    runs-on: ubuntu-latest
