  check-coverage-matrix-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check coverage matrix completeness
        run: cargo run -p xtask -- check-coverage-matrix-completeness --json

  # Story 10.1b AC2 — OWASP freeze hash-check: SHA-256 from gate-registry.toml.
  # Hash stored in the invariant-locked registry so any OWASP doc edit requires
  # a registry update, which is auditable and protected by review.
  check-owasp-freeze-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify OWASP freeze immutability
        run: |
          EXPECTED_HASH=$(grep '^owasp_freeze_hash' xtask/gate-registry.toml | sed 's/.*= "\(.*\)"/\1/')
          ACTUAL_HASH=$(sha256sum docs/pen-test/owasp-risk-rating-v1.0-frozen.md | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "::error::OWASP freeze hash mismatch! Expected: $EXPECTED_HASH, Actual: $ACTUAL_HASH"
            echo "  If the OWASP doc was intentionally updated, update owasp_freeze_hash in xtask/gate-registry.toml"
            exit 1
          fi
          echo "OWASP freeze hash verified: $ACTUAL_HASH"
  # Story 10.1a AC4 — v1.0 Ship-Gate Aggregate: fan-in of all automated ship-gate sub-jobs.
  # All sub-gates are continue-on-error: false. The aggregate uses if: always() with
  # explicit result checks to prevent skip-propagation false positives.
  v1-0-ship-gate:
    runs-on: ubuntu-latest
    needs:
