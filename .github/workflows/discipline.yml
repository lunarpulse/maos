  # Story 10.2 D3/F3→B — v1.5 Ship-Gate Aggregate: the phase-graduation mechanism.
  # Mirrors v1.0-ship-gate membership but enforces gates whose registry disposition
  # flips to "blocking-when-present" at v1.5 (currently: check-red-team-gate).
  # This job exists NOW (advisory at v1.0 — all sub-gates pass advisory) so the
  # v1.5 cutover is a disposition flip in gate-registry.toml, not an infrastructure
  # fire-drill. Promoted to the top-level aggregate needs once phase == v1.5.
  v1-5-ship-gate:
    runs-on: ubuntu-latest
    needs:
      - v1-0-ship-gate
      - check-red-team-gate
      - check-cross-form-equiv
      - check-third-party-trial
      - check-enterprise-identity
      - check-fkcs
      - check-trial-attestation
    if: always()
    steps:
      - name: v1.5 ship gate summary
        run: |
          echo "=== v1.5 Ship Gate Results ==="
          echo ""
          echo "| Gate | Status | Disposition @ v1.5 |"
          echo "|------|--------|---------------------|"
          echo "| v1-0-ship-gate | ${{ needs.v1-0-ship-gate.result }} | blocking (inherited) |"
          echo "| check-red-team-gate | ${{ needs.check-red-team-gate.result }} | blocking-when-present |"
          echo "| check-cross-form-equiv | ${{ needs.check-cross-form-equiv.result }} | advisory |"
          echo "| check-third-party-trial | ${{ needs.check-third-party-trial.result }} | blocking-when-present |"
          echo "| check-enterprise-identity | ${{ needs.check-enterprise-identity.result }} | advisory |"
          echo "| check-fkcs | ${{ needs.check-fkcs.result }} | advisory |"
          echo "| check-trial-attestation | ${{ needs.check-trial-attestation.result }} | advisory |"
          echo ""
          echo "Phase disposition source: xtask/gate-registry.toml [[ship_gate]] entries."
      - name: Fail if any v1.5-blocking gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "v1.5 ship gate FAILED: one or more v1.5-blocking sub-gates did not pass."
          echo "  check-red-team-gate: ${{ needs.check-red-team-gate.result }}"
          exit 1
