          cargo test -p maos-bin --no-default-features --test verb_table_15_3 -- --test-threads=1

  # Story 20-12 AC1 — every test binary in the workspace suite's nextest junit
  # keeps its Σ per-test time under its `xtask/test-budgets.toml` budget
  # (default 30 s, total 300 s). Reads the junit `workspace-test-suite`
  # uploads; runs even when the suite went red (a red suite still has a cost to
  # judge) but not when it was cancelled. In `aggregate.needs` (AC4) and
  # `v1-0-ship-gate.needs`; BLOCKING at v1_0 in `gate-registry.toml` since
  # 18-0-green-main-ci-baseline (operator ruling R3 2026-10-24: four calibrated
  # exceptions, total 800 s, from `20-12-evidence/ci-after.json` + run 40080259088).
  check-test-budget:
    needs: [workspace-test-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: workspace-test-suite-junit
          path: workspace-junit
      - name: Run check-test-budget on the workspace junit
        run: cargo run -p xtask -- check-test-budget --junit workspace-junit/junit.xml --json
      # 18-0 AC6: runs after a red gate step too (the vectors prove the gate can red).
      - name: Run the 20-12 AC1 proven-red vectors
        if: ${{ !cancelled() }}
        run: cargo test -p xtask --test check_test_budget_proven_red

  # Per-push invariant-lock validation. Journal persistence is a separate
  # workflow (.github/workflows/journal-append.yml) per DF16 (Option c). This
  # job validates the tri-requirement (diff + corpus-delta + phase-commitment)
  # plus the regression check, but does NOT call
  # --write-journal. The flag is the explicit separation between "validate"
  # and "persist" introduced when DF16 was resolved.
  invariant-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Bind guaranteed claims to executing tests and corpus evidence
        run: cargo test --locked -p xtask --test invariant_claims_20_3b
      - name: Detect changed files (full event range)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base=HEAD~1 ;; esac
          echo "INVARIANT_LOCK_BASE=$base" >> "$GITHUB_ENV"
          git diff --name-only "$base" HEAD > /tmp/changed-files.txt
      - name: Run invariant-lock (validate-only; journal persistence is in journal-append.yml)
        run: |
          # --sha, --write-journal and --pr-number are deliberately omitted: this is the
          # per-push validation gate, not the merge-time persister.
          cargo run -p xtask -- invariant-lock \
            --changed-files /tmp/changed-files.txt \
            --json
      - name: cassette-age-gate
        # `cassette_dir` is a `--cassette-dir` flag whose default already points at
        # crates/maos-journey-test/cassettes; passing the path positionally is a clap
        # `unexpected argument` error. Rely on the default (or use --cassette-dir).
        run: cargo run -p xtask -- cassette-age-gate --json

  # Story 21-10 (D-21-10-04 A) — one direct `cargo test -p <pkg> --test <bin> <name> -- --exact`
  # step per invariant ledger proof, with the corpus path in the step env: the only step shape
  # `invariant-lock`'s claim gate accepts for `claim: guaranteed`.
  invariant-ledger-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
