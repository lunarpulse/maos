      - maos-audit-read-only
      - cap-token-verify-bench
      - hello-spirit-bench
      - example-spirit-tests
      - founder-loop-bench
      - example-spirit-ts-tests
      - coverage-matrix-nfr-test-3
      - spirit-test-tests
