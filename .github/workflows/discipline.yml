  check-ship-gate-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-ship-gate-completeness
        run: cargo run -p xtask -- check-ship-gate-completeness --json

  # Story 7.5b AC9 — NFR-Onb-1 30-min first-Spirit validation gate (discipline rail).
  # Stratification + cohort evaluator + Butler-corpus seam over committed example
  # artifacts; FAILs loudly on drift. Verdicts are provisional until Story 8.1's
  # canonical Butler corpus lands (the resolver auto-prefers it).
  nfr-onb-1-gate:
    runs-on: ubuntu-latest
