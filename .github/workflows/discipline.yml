          fi
          [ "$fail" -eq 0 ] || grep -E 'panicked at' "$RUNNER_TEMP/participant-17-8.log" | head -5 | while IFS= read -r line; do
            echo "::error title=17-8 participant recall (${{ matrix.image }})::${line}"
          done
          echo "::notice title=17-8 participant recall (${{ matrix.image }})::rc=$rc fail=$fail $(grep 'tests run:' "$RUNNER_TEMP/participant-17-8.log" | paste -sd' ' -)"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 8 "${required[@]}" "$RUNNER_TEMP/participant-17-8.log" || fail=1
          exit "$fail"
      # Story 21-7 AC1 — the production consent granter and gate at the built `maos` binary,
      # Postgres-free (the boot line is asserted), three installed recall-probe components under
      # real T2 in the same delegated envelope: exact pass count, test name present, no SKIP.
      - name: Production consent granter and gate at the binary, no Postgres (Story 21-7)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: consent_gate_21_7
        run: |
          set +e
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-wasm-consent --timeout 2400 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::consent_gate_21_7)" 2>&1 | tee "$RUNNER_TEMP/consent-21-7.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          fail=0
          [ "$rc" -eq 0 ] || { echo "::error title=21-7 consent gate (${{ matrix.image }})::nextest rc=$rc"; fail=1; }
          grep -Eq '(^|[[:space:]])1 tests? run: 1 passed([,[:space:]]|$)' "$RUNNER_TEMP/consent-21-7.log" || { echo "::error title=21-7 consent gate (${{ matrix.image }})::missing '1 test run: 1 passed'"; fail=1; }
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/consent-21-7.log"; then
            grep '^SKIP[: ]' "$RUNNER_TEMP/consent-21-7.log" | while IFS= read -r line; do
              echo "::error title=21-7 consent gate (${{ matrix.image }})::${line}"
            done
            fail=1
          fi
          got=$(grep -c '^CONSENT-GATE-EVIDENCE ' "$RUNNER_TEMP/consent-21-7.log")
          [ "$got" -eq 1 ] || { echo "::error title=21-7 consent gate (${{ matrix.image }})::evidence line seen $got times, want 1"; fail=1; }
          grep '^CONSENT-GATE-EVIDENCE ' "$RUNNER_TEMP/consent-21-7.log" | while IFS= read -r line; do
            echo "::notice title=21-7 consent gate (${{ matrix.image }})::$line"
          done
          [ "$fail" -eq 0 ] || grep -E 'panicked at' "$RUNNER_TEMP/consent-21-7.log" | head -5 | while IFS= read -r line; do
            echo "::error title=21-7 consent gate (${{ matrix.image }})::${line}"
          done
          echo "::notice title=21-7 consent gate (${{ matrix.image }})::rc=$rc fail=$fail $(grep 'tests run:' "$RUNNER_TEMP/consent-21-7.log" | paste -sd' ' -)"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 1 --required-test production_consent_granter_and_gate_without_postgres "$RUNNER_TEMP/consent-21-7.log" || fail=1
          exit "$fail"
      - uses: actions/download-artifact@v4
        with:
          name: example-spirit-ts-component
          path: examples/example-spirit-ts/dist
      - name: Build the actual feature-enabled CLI and release runner
        run: |
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/release-wasm-host.tar"
          test -x target/release/maos
          test -x target/release/maos-wasm-runner
          test -x target/release/maosctl
      - name: Actual CPU-capped TS CLI with delegated controllers and attributed receipts
        shell: bash
        run: |
          version=${{ matrix.image }}
          version=${version#ubuntu-}
          version=${version%-arm}
          arch=x86_64
          if [[ '${{ matrix.image }}' == *-arm ]]; then arch=aarch64; fi
          # The verdict is also a public annotation: job logs need a token the
          # agent host does not have (17-3a T6 convention).
          set +e
          sudo systemd-run --unit=maos-17-3c-proof --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --property=CPUAccounting=yes --property=MemoryAccounting=yes \
            --property="WorkingDirectory=$PWD" \
            "$PWD/scripts/run_17_3c_delegated.sh" /usr/bin/python3 -I \
            "$PWD/scripts/prove_17_3c.py" --binary "$PWD/target/release/maos" \
            --output "$RUNNER_TEMP/17-3c-proof" --expected-os "$version" --expected-arch "$arch" \
            2>&1 | tee "$RUNNER_TEMP/17-3c-proof.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=17-3c proof (${{ matrix.image }})::$(grep -m1 '^TS-ADMITTED-PROOF ' "$RUNNER_TEMP/17-3c-proof.log")"
          else
            msg=$(grep -m1 -A3 '17-3c proof FAILED' "$RUNNER_TEMP/17-3c-proof.log" || tail -n 8 "$RUNNER_TEMP/17-3c-proof.log")
            msg=${msg:0:1500}; msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=17-3c proof (${{ matrix.image }}) rc=${rc}::${msg}"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admitted-17-3c-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/spawned-17-3c.log
            ${{ runner.temp }}/recall-17-3d.log
            ${{ runner.temp }}/participant-17-8.log
            ${{ runner.temp }}/17-3c-proof/
            ${{ runner.temp }}/17-3c-proof.log
          if-no-files-found: error

  # RETIRED 2026-09-07 by Story 15-3 per ADR-065: the `check-cna-registration`
  # job stood here (Story 10.3 AC-5, NFR-Ops-4). The gate ran its LIVE
  # content-validating arm, not the absent-PASS arm, so its two `SECURITY.md`
  # controls — no `<TO-BE-PUBLISHED>` GPG placeholder, and a real `1.0.x`
  # supported-versions row — were re-homed into `check-security-md` with their
  # own proven-red tests BEFORE the deletion. No control went dark.

  # Story 10.3 AC-2/AC-3 (NFR-Sec-5/6) — fuzz-target existence gate (mechanics).
  check-fuzz-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Check fuzz targets
        run: cargo run -p xtask -- check-fuzz-targets --json

  # Story 10.3 AC-2/AC-3 — pre-merge fuzz BUILD gate (preflight F3: build-only).
  # The 24h T1/T2/T3 runs are operational (docs/runbooks/fuzz-cadence.md); this
  # gate only asserts the harnesses compile against libfuzzer-sys + nightly.
  fuzz-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install cargo-fuzz --locked
      - name: Build manifest parser fuzz target
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-manifest/fuzz manifest_parser
      - name: Build wire-protocol fuzz target
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-domain/fuzz frame_deser
      - name: Build exec-deps ELF parser fuzz target
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-exec-deps/fuzz fuzz_exec_deps_parse_elf
      - name: Build capability-token fuzz target (I1)
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-kernel-core/fuzz cap_token_verify
      - name: Build digest-chain fuzz target (I11)
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-kernel-core/fuzz i11_digest_chain
      - name: Build cross-host consent fuzz target (I8)
        run: cargo +nightly fuzz build --fuzz-dir crates/maos-a2a-core/fuzz i8_consent_intent

  # Story 10.3 AC-4 (NFR-Doc-6) — Korean localization ship gate.
  # KO_COVERAGE_MIN=100 turns the coverage promise into a mechanical gate;
  # glossary-lock enforces locked-term preservation across all ko files.
  check-ko-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci
      - name: Korean canonical-coverage gate (KO_COVERAGE_MIN=100)
        working-directory: docs-site
        run: KO_COVERAGE_MIN=100 npm run gate:ko-coverage
      - name: Korean glossary-lock gate
        working-directory: docs-site
        run: npm run gate:glossary-lock


  # Story 10.4b (NFR-Sec-13) — live bilateral A2A consent + binding_checked gate.
  check-live-bilateral-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-live-bilateral-consent
        run: cargo test -p maos-a2a-tcp --test t_10_4b_live_bilateral -- --test-threads=1

  # Story 10.4b / 14-2 (NFR-Sec-13 rotation chaos; NFR-Rel-9 mislabel corrected
  # by 14-2 — the 30s/90s propagation floors are NFR-Sec-13's chaos scope, not
  # NFR-Rel-9's token-validation axis) — rotation real-timing gate.
  check-rotation-real-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # Story 14-2 (AC5.2/AC5.5.a): the bare `cargo test` step became the
      # leg-structured gate in the SAME change that #[ignore]-gated the
      # drill's tests — one without the other would make this hard-failing
      # job run ZERO tests and pass vacuously.
      - name: Run check-rotation-real-timing
        run: cargo run -p xtask -- check-rotation-real-timing --json

  # Story 10.4c — J4 §13.1 Mira-Nash Observer colocation-latency gate.
  # Real in-kernel scalar.tap measurement via `kernel_measurement` feature.
  # Gate scalar: cross-task delivery latency P95 ≤ 10ms. De-flaking: warmup
  # discard, N≥200 post-warmup, pinned tokio workers (D2).
  # The mutation test (bench-fault-inject) runs separately to verify falsifiability.
  # AC3/D5 (review D1): ADVISORY at v1.0 — the gate test prints a "WOULD BLOCK
  # at v1.5" banner on over-budget instead of failing (v1_0=advisory). The
  # load-bearing falsifier is the mutation test step below. Graduation to
  # v1_5=blocking is a disposition flip in gate-registry.toml.
  check-j4-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run check-j4-latency (real measurement)
        run: |
          # Real in-kernel scalar.tap measurement with kernel_measurement feature.
          # Budget advisory until 20-7 / ADR-068; sample-count/integrity/mutation stay blocking.
          cargo test -p maos-bench --features kernel_measurement --test t_10_4c_j4_latency_gate -- --nocapture
          echo "check-j4-latency: measurement completed; budget ADVISORY (binding: 20-7)."
      - name: Run Gate 1 integrity tests
        run: |
          cargo test -p maos-bench --features kernel_measurement --test t_10_4c_j4_gate_integrity -- --nocapture
          echo "check-j4-latency: Gate 1 integrity tests PASSED."
      - name: Run mutation test (bench-fault-inject)
        run: |
          output=$(cargo test -p maos-bench --features bench-fault-inject --test t_10_4c_j4_mutation -- --nocapture 2>&1)
          echo "$output"
          # Review P4: assert the mutation tests actually RAN. A dropped/typo'd
          # --features bench-fault-inject would compile this target to ZERO tests
          # and `cargo test` would exit 0 — a silent vacuous GREEN. Require ≥1
          # passed test so the AC2 falsifier cannot vanish without alarm.
          echo "$output" | grep -Eq "test result: ok\. [1-9][0-9]* passed" \
            || { echo "FAIL: mutation tests did not run (0 tests — is --features bench-fault-inject set?)"; exit 1; }
          echo "check-j4-latency: mutation test PASSED (injection moves the number → RED)."
      - name: Verify bench-fault-inject absent from release graph (D3)
        run: |
          # Invert to expose the root package's enabled default features as well.
          graph=$(cargo tree -p maos-bench -e features --invert maos-bench)
          if grep -q "bench-fault-inject" <<< "$graph"; then
            echo "FAIL: bench-fault-inject present in release feature graph"
            exit 1
          fi
          echo "check-j4-latency: bench-fault-inject absent from release graph (D3 verified)."

  # Story 10.4c AC5 (D8) — FF-J6 CI guard. Mechanically enforces the J6
  # cold-start latency harness revival trigger: FAILS if a J6 latency binding
  # (assertion / binding AC / user-facing claim) appears while the J6 harness is
  # still CUT (not_measured). Blocking — a J6 latency claim requires the harness.
  check-ff-j6:
