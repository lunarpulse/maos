      CARGO: /bin/false
      MAOS_FIXTURE_DIR: ${{ github.workspace }}/target/maos-fixtures
      MAOS_FIXTURE_TRANSPORT: '1'
      MAOS_CGROUP_CEILING_FIXTURE: ${{ github.workspace }}/target/tmp/cgroup-ceiling-fixture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-archives-${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-archives
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-files-${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-test-files
      - name: Restore exact producer workspace files
        env:
          BUNDLE_ARCH: ${{ endsWith(matrix.image, '-arm') && 'arm64' || 'x64' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-test-tools"
          tar -C "$RUNNER_TEMP/ci-test-tools" -xf "$RUNNER_TEMP/ci-test-files/tools.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          producer = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-test-files/producer.json').read_text())
          nextest = subprocess.check_output([os.environ['RUNNER_TEMP'] + '/ci-test-tools/cargo-nextest', 'nextest', '--version'], text=True).splitlines()[0]
          expected = dict(sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                          arch=os.environ['BUNDLE_ARCH'], workspace=str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()),
                          tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                          nextest=nextest)
          assert producer == expected, (producer, expected)
          PY
          echo "$RUNNER_TEMP/ci-test-tools" >> "$GITHUB_PATH"
          tar -C / -xf "$RUNNER_TEMP/ci-test-files/fixtures-debug.tar"
      - name: Build the T2/WASM fixtures — probes, runners, guests, native twin, maosctl (xtask build-test-fixtures, Story 20-12)
        run: test -s target/maos-fixtures/manifest.json
      - name: Epic-17 exit line 3 — T2 kill and narrow-prctl proof (Story 17-6 AC1/AC3)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-wasm-host
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: t2_sandbox_kill
        run: |
          set +e
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/wasm-host-t2.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture -E 'binary_id(maos-wasm-host::t2_sandbox_kill)' 2>&1 | tee "$RUNNER_TEMP/t2.log"
          rc=${PIPESTATUS[0]}
          grep -o 'T2-OUTCOME .*' "$RUNNER_TEMP/t2.log" | while IFS= read -r line; do
            echo "::notice title=T2 exit line 3 (${{ matrix.image }})::${line#T2-OUTCOME }"
          done
          grep -E 'panicked at|rule 11' "$RUNNER_TEMP/t2.log" | head -3 | while IFS= read -r line; do
            echo "::error title=T2 exit line 3 (${{ matrix.image }})::${line}"
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/t2.log"; then
            echo "::error title=T2 exit line 3 (${{ matrix.image }})::a SKIP line was printed — a T2 suite must run, never skip, in CI"
            rc=1
          fi
          echo "::notice title=T2 exit line 3 (${{ matrix.image }})::rc=${rc} $(grep 'tests run:' "$RUNNER_TEMP/t2.log")"
          exit "$rc"
      - name: Kernel T2 suites — sandbox enforcement + the launch primitive's route (Story 17-6 AC5)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-kernel-core
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: sandbox_enforcement_linux bridge_t2_route_17_6
        run: |
          set +e
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/kernel.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture -E 'binary_id(maos-kernel-core::sandbox_enforcement_linux) | binary_id(maos-kernel-core::bridge_t2_route_17_6)' 2>&1 | tee "$RUNNER_TEMP/kernel-t2.log"
          rc=${PIPESTATUS[0]}
          route=$(grep -o 'BRIDGE-T2-ROUTE T[0-9]: [A-Za-z]*[^(]*' "$RUNNER_TEMP/kernel-t2.log" | sed 's/BRIDGE-T2-ROUTE //' | sort | paste -sd';' -)
          echo "::notice title=Bridge T2 route (${{ matrix.image }})::${route}"
          grep -E 'panicked at|rule 11' "$RUNNER_TEMP/kernel-t2.log" | head -3 | while IFS= read -r line; do
            echo "::error title=Kernel T2 suites (${{ matrix.image }})::${line}"
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/kernel-t2.log"; then rc=1; echo "::error title=Kernel T2 suites (${{ matrix.image }})::a SKIP line was printed"; fi
          echo "::notice title=Kernel T2 suites (${{ matrix.image }})::rc=${rc} $(grep 'tests run:' "$RUNNER_TEMP/kernel-t2.log" | paste -sd' ' -)"
          exit "$rc"
      - name: Escape-detector suite on a real T2 kill (Story 17-6 AC4)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-escape-detector
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: ""
        run: |
          set +e
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/escape-detector.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture -E 'binary_id(/^maos-escape-detector(::|$)/)' 2>&1 | tee "$RUNNER_TEMP/escape.log"
          rc=${PIPESTATUS[0]}
          grep -E 'panicked at|rule 11' "$RUNNER_TEMP/escape.log" | head -3 | while IFS= read -r line; do
            echo "::error title=Escape detector (${{ matrix.image }})::${line}"
          done
          echo "::notice title=Escape detector (${{ matrix.image }})::rc=${rc} $(grep -oE 'ESCAPE-[A-Z-]*MEASURED[^ ]*( [a-z_]+=[0-9.]+)*' "$RUNNER_TEMP/escape.log" | paste -sd';' -)"
          exit "$rc"
      # Guests and standalone fixtures are restored from the producer; a missing
      # fixture must fail rather than fetching dependencies or compiling locally.
      - name: Fetch locked standalone fixture dependencies for offline process gates
        run: test -s target/maos-fixtures/manifest.json
      - name: Run maos-host + maos-wasm-host test suites
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-host maos-wasm-host
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: ""
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/host-wasm-host.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer -E 'binary_id(/^maos-(host|wasm-host)(::|$)/)'
      - name: Install the pinned component fixture assembler
        run: test -x "$RUNNER_TEMP/ci-test-tools/wasm-tools"
      # The remap root is the fixture's own workspace, which has no
      # `.config/nextest.toml`: nextest's defaults kill no test, so only fail-fast
      # is turned off (the repo config would not parse against this package graph).
      - name: Standalone native-twin fixture tests (Story 17-3c)
        env:
          NEXTEST_ARCHIVE_PACKAGES: equiv-native-twin
          NEXTEST_ARCHIVE_FEATURES: ""
          NEXTEST_ARCHIVE_TESTS: ""
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/native-twin.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE/crates/maos-wasm-host/guests/equiv-fixture/native-twin" --extract-overwrite --color never --no-fail-fast -E 'binary_id(/^equiv-native-twin(::|$)/)'
      - name: Real admitted native/WASM verdict, hostile lifting, idle, and SIGSYS gates
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: spawned_scope_17_3c
        run: |
          set +e
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-wasm-host --timeout 2400 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::spawned_scope_17_3c)" 2>&1 | tee "$RUNNER_TEMP/spawned-17-3c.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          fail=0
          [ "$rc" -eq 0 ] || { echo "::error title=17-3c process gates (${{ matrix.image }})::nextest rc=$rc"; fail=1; }
          grep -Eq '(^|[[:space:]])24 tests run: 24 passed([,[:space:]]|$)' "$RUNNER_TEMP/spawned-17-3c.log" || { echo "::error title=17-3c process gates (${{ matrix.image }})::missing '24 tests run: 24 passed'"; fail=1; }
          for spec in 'SCOPED-VERDICT :8' 'GOVERNED-ATOMIC :10' 'HOSTILE-LIFTING :2' 'HOSTILE-LIFTING-CONTROL :1' \
                      'RUNNER-SIGSYS :2' 'REPEATED-MAILBOX :1' 'HOSTILE-PROVENANCE :1' 'HOSTILE-REFUSALS :1' \
                      'HOSTILE-FLOODS :1' 'HOSTILE-DIAGNOSTICS :1' 'HOSTILE-EXITS :1' 'HOSTILE-ONCE :1' \
                      'HOSTILE-IAC-SEND :1' 'WASM-IAC-SEND :1'; do
            prefix=${spec%:*}; want=${spec##*:}
            got=$(grep -oF -- "$prefix" "$RUNNER_TEMP/spawned-17-3c.log" | wc -l)
            [ "$got" -eq "$want" ] || { echo "::error title=17-3c process gates (${{ matrix.image }})::marker '${prefix}' seen $got times, want $want"; fail=1; }
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/spawned-17-3c.log"; then
            grep '^SKIP[: ]' "$RUNNER_TEMP/spawned-17-3c.log" | while IFS= read -r line; do
              echo "::error title=17-3c process gates (${{ matrix.image }})::${line}"
            done
            fail=1
          fi
          # No required names here: an ignored test would only show as nextest-skipped.
          if grep -Eq 'SKIP|(^|[[:space:]])0 tests run:|tests? run: .*, [1-9][0-9]* skipped' "$RUNNER_TEMP/spawned-17-3c.log"; then
            echo "::error title=17-3c process gates (${{ matrix.image }})::SKIP, ignored, or zero tests"
            fail=1
          fi
          grep -E 'SCOPED-VERDICT |GOVERNED-ATOMIC |HOSTILE-|WASM-IAC-SEND |RUNNER-SIGSYS |REPEATED-MAILBOX ' "$RUNNER_TEMP/spawned-17-3c.log" | while IFS= read -r line; do
            echo "::notice title=17-3c admitted runtime (${{ matrix.image }})::$line"
          done
          if [ "$fail" -ne 0 ]; then
            grep -E 'panicked at' "$RUNNER_TEMP/spawned-17-3c.log" | while IFS= read -r line; do
              echo "::error title=17-3c process gates (${{ matrix.image }})::${line}"
            done
          fi
          echo "::notice title=17-3c process gates (${{ matrix.image }})::rc=$rc fail=$fail"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 24 "$RUNNER_TEMP/spawned-17-3c.log" || fail=1
          exit "$fail"
      # Story 17-10 (AC1.1, AC3.2) — the live escape-anomaly tail under real T2:
      # a real runner SIGSYS is surfaced by the RUNNING tail within 1 s, exactly
      # once through the final scan; a planned stop surfaces nothing. Exact pass
      # count, both test names, no SKIP, markers annotated.
      - name: Live escape-anomaly consumer under real T2 (Story 17-10)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: live_escape_anomaly_17_10
        run: |
          set +e
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-wasm-escape-tail --timeout 1800 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::live_escape_anomaly_17_10)" 2>&1 | tee "$RUNNER_TEMP/live-escape-17-10.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          fail=0
          [ "$rc" -eq 0 ] || { echo "::error title=17-10 escape tail (${{ matrix.image }})::nextest rc=$rc"; fail=1; }
          grep -Eq '(^|[[:space:]])2 tests run: 2 passed([,[:space:]]|$)' "$RUNNER_TEMP/live-escape-17-10.log" || { echo "::error title=17-10 escape tail (${{ matrix.image }})::missing '2 tests run: 2 passed'"; fail=1; }
          required=()
          for name in real_sigsys_surfaces_exactly_one_anomaly_within_bound \
                      planned_stop_surfaces_no_anomaly; do
            required+=(--required-test "$name")
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/live-escape-17-10.log"; then
            grep '^SKIP[: ]' "$RUNNER_TEMP/live-escape-17-10.log" | while IFS= read -r line; do
              echo "::error title=17-10 escape tail (${{ matrix.image }})::${line}"
            done
            fail=1
          fi
          for marker in 'ESCAPE-TAIL-17-10 sigsys ' 'ESCAPE-TAIL-17-10 planned-stop '; do
            got=$(grep -cF -- "$marker" "$RUNNER_TEMP/live-escape-17-10.log")
            [ "$got" -eq 1 ] || { echo "::error title=17-10 escape tail (${{ matrix.image }})::marker '${marker}' seen $got times, want 1"; fail=1; }
          done
          grep -F 'ESCAPE-TAIL-17-10 ' "$RUNNER_TEMP/live-escape-17-10.log" | while IFS= read -r line; do
            echo "::notice title=17-10 escape tail (${{ matrix.image }})::$line"
          done
          [ "$fail" -eq 0 ] || grep -E 'panicked at' "$RUNNER_TEMP/live-escape-17-10.log" | head -5 | while IFS= read -r line; do
            echo "::error title=17-10 escape tail (${{ matrix.image }})::${line}"
          done
          echo "::notice title=17-10 escape tail (${{ matrix.image }})::rc=$rc fail=$fail $(grep 'tests run:' "$RUNNER_TEMP/live-escape-17-10.log")"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 2 "${required[@]}" "$RUNNER_TEMP/live-escape-17-10.log" || fail=1
          exit "$fail"
      # Story 17-3d — mediated in-band recall end to end: the real release
      # runner under T2 in the same delegated envelope, exact pass count and
      # every test name present (no SKIP, no zero-test pass). Story 17-8
      # migrated it to participant scope: the seed and SSO vectors are R1 -> R2
      # (the seed is a received frame), and its consent vector moved to the
      # participant_recall_17_8 step below (V6-V10).
      - name: In-band recall through the admitted session (Story 17-3d)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: recall_17_3d
        run: |
          set +e
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-wasm-recall --timeout 2400 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::recall_17_3d)" 2>&1 | tee "$RUNNER_TEMP/recall-17-3d.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          fail=0
          [ "$rc" -eq 0 ] || { echo "::error title=17-3d recall (${{ matrix.image }})::nextest rc=$rc"; fail=1; }
          grep -Eq '(^|[[:space:]])20 tests run: 20 passed([,[:space:]]|$)' "$RUNNER_TEMP/recall-17-3d.log" || { echo "::error title=17-3d recall (${{ matrix.image }})::missing '20 tests run: 20 passed'"; fail=1; }
          required=()
          for name in checked_in_researcher_admits_both_scopes_and_native_port_rows_pass_fr4 \
                      configured_sso_preserves_r1_r2_order_and_never_recalls_identity_asserted \
                      context_18_5_report_status_and_journaled_kinds_32_33_reach_wasm_handle_frame \
                      context_18_5_wasm_guest_cannot_forge_kernel_pressure_or_limit_to_peer \
                      cross_boot_same_pid_is_not_recalled_and_fetch_is_scope_violation \
                      denied_promotion_counts_without_terminating_wasm_session \
                      empty_page_has_one_token_bearing_call_and_no_receipt \
                      exhausted_quota_has_receipt_without_tokenless_fallback_call \
                      junk_after_tag_closes_once_with_typed_protocol_end \
                      kernel_quota_rows_and_mcp_refusals_never_cross_the_guest_recall_boundary \
                      operator_deny_overrides_manifest_and_has_receipt_only \
                      oversized_fetch_reply_is_typed_and_next_call_same_turn_still_works \
                      own_frame_second_turn_recalls_kernel_minted_id_kind_intent_and_fetches_stored_payload \
                      own_receipt_and_authorization_ids_are_never_recalled_and_fetch_is_scope_violation \
                      seed_fetch_succeeds_r1_r2_precede_authorization_without_receipt_and_fr4_succeeds \
                      sixty_fifth_recall_closes_channel_once_with_typed_protocol_end \
                      skill_author_call_after_sixty_four_recalls_exhausts_same_budget \
                      tagged_record_between_exports_closes_once_with_typed_protocol_end \
                      ungranted_manifest_denies_with_receipt_only \
                      unknown_tag_closes_once_with_typed_protocol_end; do
            required+=(--required-test "$name")
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/recall-17-3d.log"; then
            grep '^SKIP[: ]' "$RUNNER_TEMP/recall-17-3d.log" | while IFS= read -r line; do
              echo "::error title=17-3d recall (${{ matrix.image }})::${line}"
            done
            fail=1
          fi
          [ "$fail" -eq 0 ] || grep -E 'panicked at' "$RUNNER_TEMP/recall-17-3d.log" | head -5 | while IFS= read -r line; do
            echo "::error title=17-3d recall (${{ matrix.image }})::${line}"
          done
          echo "::notice title=17-3d recall (${{ matrix.image }})::rc=$rc fail=$fail $(grep 'tests run:' "$RUNNER_TEMP/recall-17-3d.log")"
          python3 scripts/run_cgroup_ceiling_17_2.py check-log --exit-code "$rc" --expected-count 20 "${required[@]}" "$RUNNER_TEMP/recall-17-3d.log" || fail=1
          exit "$fail"
      # Story 17-8 — participant recall and consent envelopes for BOTH forms
      # (native Researcher through MediatedLogRecall, WASM recall-probe through
      # the admitted session): AC1's table V1-V16 and AC4's same-frame
      # V6 -> V7 / V6 -> V8 sequences, in their own delegated unit and log,
      # exact pass count, every test name, no SKIP, no zero-test pass.
      - name: Participant recall and consent envelopes, both forms (Story 17-8)
        shell: bash
        env:
          NEXTEST_ARCHIVE_PACKAGES: maos-bin
          NEXTEST_ARCHIVE_FEATURES: network,wasm-host
          NEXTEST_ARCHIVE_TESTS: participant_recall_17_8
        run: |
          set +e
          set -o pipefail
          python3 scripts/run_cgroup_ceiling_17_2.py run --mode delegated --unit maos-17-2-wasm-participant --timeout 2400 -- \
            bash -euo pipefail -c 'cargo-nextest nextest run --archive-file "$RUNNER_TEMP/ci-test-archives/maos-bin-network-wasm.tar.zst" --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --extract-overwrite --color never --profile archive-consumer --no-capture --test-threads 1 -E "binary_id(maos-bin::participant_recall_17_8)" 2>&1 | tee "$RUNNER_TEMP/participant-17-8.log"; test ${PIPESTATUS[0]} -eq 0'
          rc=$?
          fail=0
          [ "$rc" -eq 0 ] || { echo "::error title=17-8 participant recall (${{ matrix.image }})::nextest rc=$rc"; fail=1; }
          grep -Eq '(^|[[:space:]])8 tests run: 8 passed([,[:space:]]|$)' "$RUNNER_TEMP/participant-17-8.log" || { echo "::error title=17-8 participant recall (${{ matrix.image }})::missing '8 tests run: 8 passed'"; fail=1; }
          required=()
          for name in cross_wall_remote_artifact_is_identically_emitter_scoped_with_or_without_side_tables \
                      direct_recipient_ids_roles_dedup_multiaddress_and_gate_rejection_both_forms \
                      drr_addressed_and_nonfirst_recipients_both_forms \
                      earlier_boot_same_pid_recipient_is_out_of_scope_both_forms \
                      header_only_including_oversized_and_withheld_envelopes_both_forms \
                      sender_owned_frames_ignore_received_consent_in_native_and_wasm \
                      valid_consent_then_real_gate_rupture_withholds_same_frame_both_forms \
                      valid_consent_then_same_frame_expires_between_report_barriers_both_forms; do
            required+=(--required-test "$name")
          done
          if grep -q '^SKIP[: ]' "$RUNNER_TEMP/participant-17-8.log"; then
            grep '^SKIP[: ]' "$RUNNER_TEMP/participant-17-8.log" | while IFS= read -r line; do
              echo "::error title=17-8 participant recall (${{ matrix.image }})::${line}"
            done
