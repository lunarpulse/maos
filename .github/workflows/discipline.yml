            const dt = '${{ needs.determinism-tests.result }}';
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const advisoryIcon = (r) => r === 'success' ? '✅' : (r === 'failure' ? '⚠️' : '⏭️');

            const body = `## MAOS Discipline Gate Results

            | Gate | Result |
            |------|--------|
            | reproducible-build | ${icon(rb)} ${rb} |
            | check-unsafe | ${icon(cu)} ${cu} |
            | check-empty-kernel | ${icon(cek)} ${cek} |
            | check-loom | ${icon(cl)} ${cl} |
