name: discipline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Added 2026-09-21 (Epic-16 retrospective). Five consecutive pushes to `main`
# left FIVE full 162-job runs queued simultaneously — 810 jobs contending for
# the same runners, so no run could finish and every verdict was hours away.
# I had to cancel four by hand.
#
# ⚠ `cancel-in-progress` is deliberately TRUE ONLY FOR PULL REQUESTS. A
# superseded PR run is worthless, but a superseded `main` run is NOT: the
# release precondition looks for the `release-ready` check-run (release
# candidates), the `aggregate` check-run (alpha) or both (GA) with
# `completed/success` ON THE TAGGED SHA (`check_release_precondition.rs`,
# `required_check_names`). Cancelling main runs would
# silently leave tag-able commits with no verdict at all — turning a
# queue optimisation into a release-blocking hole. Main runs therefore always
# run to completion, and the group key falls back to the SHA so they never
# cancel one another.
concurrency:
  group: discipline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  TOKEI_VERSION: "14.0.0"
  CARGO_DENY_VERSION: "0.19.4"
  CARGO_PUBLIC_API_VERSION: "0.51.0"
  MAOS_SECRETS_BACKEND: env
  # Best-effort hardening against transient crates.io network flakes, which
  # spuriously failed many cargo jobs in one run (orchestrator-tests died
  # downloading the locked `chrono` crate). CARGO_NET_RETRY (cargo net.retry)
  # raises the retry count for "spurious" network errors during fetches.
  # CAVEAT: harm-reduction, not a guaranteed cure — cargo's spurious-error
  # classification may not cover every curl code, and a persistent outage
  # won't be retried away. The reliable fix for a one-off blip is to re-run
  # the failed jobs.
  CARGO_NET_RETRY: "10"

# ── Job ceilings (2026-09-21, Epic-16 retrospective) ─────────────────────────
# EVERY job carries `timeout-minutes`. GitHub Actions has no workflow-level
# default, so a job without one inherits SIX HOURS — and
# nfr-rel-1-crash-detection-2s spent all six on every push from ddb7441b to
# 79fc910e while starving the queue for its siblings. A hang must read as a
# fast red, distinguishable from a run (E16-A2).
#
# RULE for the 104 ceilings added in that pass: max(30, 3x the job's MEASURED
# duration on 79fc910e, rounded up to 5). All 104 had a completed run to measure
# (fetched across every page of the jobs API). The 30-minute floor exists
# because those were warm-rust-cache runs; a cold rebuild is invisible in them.
# Ceilings that pre-date this pass keep their own recorded rationale.
# ⚠ A job that hits its ceiling is a HANG TO DIAGNOSE, not a ceiling to raise —
# workspace-test-suite's 45 -> 90 raise was exactly that mistake
# (butler_8_14b_mcp_drivers hangs; the suite is not slow).

jobs:
  # Story 18-0 AC2 (D-18-0-04, ruled 2026-10-24) — the supply-chain gate is
  # BLOCKING. Until 18-0, `cargo deny check` ran as the last steps of the
  # ADVISORY `reproducible-build` job, whose `continue-on-error` reported the
  # job `success` to `aggregate` while the deny step failed (run 40080259088),
  # so a red advisory DB never reached the fan-in. Its own job, no
  # `continue-on-error`, in `aggregate.needs` only (no gate-registry row, the
  # 15-3 enrolment precedent). Policy: `deny.toml`.
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # Review 2026-10-25: the pinned prebuilt binary (the nextest precedent)
      # instead of compiling cargo-deny from source on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      # Review DC (2026-10-25): a transient advisory-DB fetch failure retries
      # (3 tries, bounded); the check then runs on the fetched DB, so a newly
      # published advisory still reds the job (intended).
      - name: cargo deny fetch (bounded retry)
        run: |
          for try in 1 2 3; do
            if cargo deny fetch db; then exit 0; fi
            echo "cargo deny fetch failed (try $try of 3)"
            if [ "$try" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: cargo deny check
        run: cargo deny check --disable-fetch

  # CI release-ready program W2 (2026-11-15; `_bmad-output/planning-artifacts/ci-release-ready-program-2026-11-14.md`
  # §6) — the deterministic xtask gates are NAMED STEPS of this ONE hosted job. xtask is built once (`build-xtask`)
  # and every gate step runs that build; before W2 each gate below was its own job (27 jobs, each a checkout +
  # toolchain + cache restore + its own xtask build).
  #
  # Membership rule: the old job's only work was `cargo run -p xtask -- <gate>` (plus xtask-only proven-red test
  # steps), the gate is one `xtask prepush` already runs locally (`xtask/src/prepush.rs` GATES; the steps keep that
  # order), it judges committed files only, and it needed no secret, service, matrix runner, extra toolchain or
  # feature, artifact or `needs` edge. A gate another job `needs` (check-workspace-count, check-corpus) keeps its own job, so consolidation puts no new
  # edge in front of any other job.
  #
  # Identity is unchanged: step `name` == `id` == the gate's registry / old job name, running the old command and
  # printing the old `--json`. `check-ship-gate-completeness` enrols the EXPECTED_GATES that live here by step name
  # (`xtask/src/check_ship_gate_completeness.rs`, CONSOLIDATED_JOB).
  #
  # EVERY gate runs even when an earlier one is red: each gate step is `if: !cancelled() && <xtask built>`, never
  # `continue-on-error`, so a red gate is a red step and a red job. The last step lists every step whose outcome was
  # not `success` and fails the job. No retry. The per-step outcomes are also job `outputs`, so `aggregate`,
  # `v1-0-ship-gate`, `v1-5-ship-gate` and the PR comment can read ONE gate's result, not only the job's.
  xtask-gates:
    runs-on: ubuntu-24.04
    # 27 gates + 2 xtask test targets, sequential after one cold xtask build (the old jobs summed to about 3,000
    # job-seconds; plan §6). 45 keeps the 30-minute floor with headroom for that build.
    timeout-minutes: 45
    outputs:
      build-xtask: ${{ steps.build-xtask.outcome }}
      check-stability-matrix: ${{ steps.check-stability-matrix.outcome }}
      check-serde-error-handling: ${{ steps.check-serde-error-handling.outcome }}
      check-manifest-schema-version: ${{ steps.check-manifest-schema-version.outcome }}
      check-skill-schema: ${{ steps.check-skill-schema.outcome }}
      check-coverage-matrix-completeness: ${{ steps.check-coverage-matrix-completeness.outcome }}
      check-test-cost: ${{ steps.check-test-cost.outcome }}
      check-test-cost-vectors: ${{ steps.check-test-cost-vectors.outcome }}
      check-env-contract: ${{ steps.check-env-contract.outcome }}
      check-unsafe: ${{ steps.check-unsafe.outcome }}
      check-service-boundary: ${{ steps.check-service-boundary.outcome }}
      check-breaking-md: ${{ steps.check-breaking-md.outcome }}
      check-pub-field-constructors: ${{ steps.check-pub-field-constructors.outcome }}
      check-dependency-closure: ${{ steps.check-dependency-closure.outcome }}
      coverage-matrix: ${{ steps.coverage-matrix.outcome }}
      check-empty-kernel: ${{ steps.check-empty-kernel.outcome }}
      check-loom: ${{ steps.check-loom.outcome }}
      check-fr47: ${{ steps.check-fr47.outcome }}
      check-a2a-sender-completeness: ${{ steps.check-a2a-sender-completeness.outcome }}
      check-judge-config: ${{ steps.check-judge-config.outcome }}
      check-security-md: ${{ steps.check-security-md.outcome }}
      check-security-md-vectors: ${{ steps.check-security-md-vectors.outcome }}
      example-spirit-drift: ${{ steps.example-spirit-drift.outcome }}
      corpus-staleness: ${{ steps.corpus-staleness.outcome }}
      check-pentest-gate: ${{ steps.check-pentest-gate.outcome }}
      check-third-party-trial: ${{ steps.check-third-party-trial.outcome }}
      check-red-team-gate: ${{ steps.check-red-team-gate.outcome }}
      nfr-onb-1-gate: ${{ steps.nfr-onb-1-gate.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask-gates-${{ hashFiles('**/Cargo.lock') }}
      - name: Build xtask once (every gate step runs this build)
        id: build-xtask
        run: cargo build -p xtask
      # Story 7.5a AC3 — STABILITY.md generated-from-workspace; --check fails on drift (NFR-Maint-4).
      - name: check-stability-matrix
        id: check-stability-matrix
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- stability-matrix --check --json
      # Story 6.2 AC1 Task 0.2 — Epic 4 retro §A6 / Epic 5 §A3 carry-forward closure: the gate enforces typed
      # serde::Error handling (no .unwrap() / no Display-via-anyhow); `xtask/src/check_serde_error_handling.rs`.
      # HARD-FAIL since Story 7.1.7 (baseline-reset). The 300 pre-existing sites are FROZEN in
      # xtask/serde-error-allowlist.toml; the gate now fails only on NEW `serde_json::*` +
      # `.unwrap()/.expect()/.unwrap_or_*()` sites beyond that set. Full remediation of the frozen sites is tracked
      # as a follow-up (Story 8.x).
      - name: check-serde-error-handling
        id: check-serde-error-handling
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-serde-error-handling --json
      # Epic 6 §A4 (retro 2026-05-28) — keeps MANIFEST_SCHEMA_VERSION + MIN/MAX constants self-consistent and
      # blocks hardcoded `manifest_schema_version` comparisons in `maos-manifest` production code (Story 7.5a's
      # ABI Stability Triple consumes these constants directly).
      - name: check-manifest-schema-version
        id: check-manifest-schema-version
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-manifest-schema-version --json
      # Story 7.4 AC6 — maos.skill.v1 schema posture gate.
      - name: check-skill-schema
        id: check-skill-schema
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-skill-schema --json
      # Story 10.1b AC3 — coverage matrix completeness: no v1.0 NFR has empty gates.
      - name: check-coverage-matrix-completeness
        id: check-coverage-matrix-completeness
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-coverage-matrix-completeness --json
      # Story 20-12 AC2 — no test compiles the tree. A cargo spawn (`Command::new("cargo")`, `env!`/`var`/
      # `var_os("CARGO")`), `rustc` or `trybuild` under any workspace member's tests dir reds here unless the line
      # above says `// expensive: <reason>`, its tests are `#[ignore = "expensive: …"]` and the binary is registered in
      # `xtask/test-budgets.toml [[expensive]]` under a job that runs ignored tests — or, for a cargo tree/metadata/
      # locate-project/pkgid query, `// cargo-query: <reason>` (stays in the default run). Hermetic: it reads
      # committed sources only. Proven-red vectors run right after it.
      - name: check-test-cost
        id: check-test-cost
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-test-cost --json
      # 18-0 AC6: runs after a red gate step too (the vectors prove the gate can red).
      - name: check-test-cost proven-red vectors (20-12 AC2)
        id: check-test-cost-vectors
        if: ${{ !cancelled() }}
        run: cargo test -p xtask --test check_test_cost_proven_red
      # Story 12.6 — blocking registry coverage for maos-bin/src only; Story 12.7 widens this workspace-wide.
      - name: check-env-contract
        id: check-env-contract
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-env-contract --json
      - name: check-unsafe
        id: check-unsafe
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-unsafe --json
      - name: check-service-boundary
        id: check-service-boundary
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-service-boundary --json
      # Story 7.5a AC3 — BREAKING.md dated-entry + Migration taxonomy CI-grep-enforced (NFR-Maint-7).
      - name: check-breaking-md
        id: check-breaking-md
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-breaking-md --json
      - name: check-pub-field-constructors
        id: check-pub-field-constructors
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-pub-field-constructors --json
      # Story 10.4a / 11.1a — dependency-closure gate: the kernel-core + domain trees exclude the Postgres/pgvector
      # stack AND the WASM runtime stack (wasmtime/wasmtime-wasi/wit-bindgen, ADR-031/ADR-041 isolation).
      - name: check-dependency-closure
        id: check-dependency-closure
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-dependency-closure --json
      - name: coverage-matrix
        id: coverage-matrix
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- coverage-matrix --json
      - name: check-empty-kernel
        id: check-empty-kernel
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-empty-kernel --json
      - name: check-loom
        id: check-loom
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-loom --json
      - name: check-fr47
        id: check-fr47
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-fr47 --json
      # Story 8.8 AC3 — cross-Host A2A sender-completeness (GREEN-at-HEAD precondition for the fail-closed flip;
      # never flipped-while-red).
      - name: check-a2a-sender-completeness
        id: check-a2a-sender-completeness
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-a2a-sender-completeness --json
      - name: check-judge-config
        id: check-judge-config
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-judge-config --json
      - name: check-security-md
        id: check-security-md
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-security-md --json
      - name: check-security-md proven-red vectors
        id: check-security-md-vectors
        if: ${{ !cancelled() }}
        run: cargo test -p xtask check_security_md::tests -- --test-threads=1
      # The template drift check covers the Rust and TypeScript templates (`templates-regen --check`).
      - name: example-spirit-drift
        id: example-spirit-drift
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- templates-regen --check --json
      - name: corpus-staleness
        id: corpus-staleness
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- corpus-staleness --json
      # Story 10.1b AC1 — pen-test gate: conditional per calibrate-per-commit pattern. When summary.toml exists,
      # parse and assert p0_open == 0 && p1_open == 0. When absent, report ABSENT (not a pass), advisory at v1_5.
      - name: check-pentest-gate
        id: check-pentest-gate
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-pentest-gate --json
      # Story 10.2 AC1, simplified by Story 22-7 — third-party trial gate (conditional: advisory-if-absent); no N floor.
      # Story 15-3 AC2(b): the ship-phase env block that stood on the old job is retired. A GitHub *repository
      # variable* could move this one gate's ship phase with no code change, and `check-env-contract` can never see
      # it (it scans only the maos-bin src tree), so it was a third phase source no instrument could audit. The
      # variable's name is recorded in ADR-065 rather than here: AC1's oracle counts FILES carrying the token, so
      # repeating it would defeat the check that it is gone. The phase is now `gate_common::CURRENT_PHASE`, and
      # advancing it at the v2.0 ship gate is a one-line code change under review.
      - name: check-third-party-trial
        id: check-third-party-trial
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-third-party-trial
      # Story 10.2 AC3 — adversarial red-team 80-scenario gate (v1.5 phase, advisory-until-engagement).
      - name: check-red-team-gate
        id: check-red-team-gate
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- check-red-team-gate --json
      # Story 7.5b AC9 — NFR-Onb-1 30-min first-Spirit validation gate (discipline rail). Stratification + cohort
      # evaluator + Butler-corpus seam over committed example artifacts; FAILs loudly on drift. Verdicts are
      # provisional until Story 8.1's canonical Butler corpus lands (the resolver auto-prefers it).
      - name: nfr-onb-1-gate
        id: nfr-onb-1-gate
        if: ${{ !cancelled() && steps.build-xtask.outcome == 'success' }}
        run: cargo run -p xtask -- nfr-onb-1-gate --check --json
      - name: Report every gate result; fail if any did not pass
        if: ${{ !cancelled() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          # Steps without an `id` (checkout, toolchain, cache, this step) carry a generated `__…` key: not gates.
          gates="$(jq -c 'with_entries(select(.key | startswith("__") | not))' <<< "$STEPS_JSON")"
          # An empty or reshaped context must never read as green: the build step is always in it.
          if ! jq -e 'has("build-xtask")' <<< "$gates" > /dev/null; then
            echo "::error title=xtask-gates::the steps context does not carry build-xtask; refusing a vacuous pass"
            exit 1
          fi
          {
            echo "| Step | Outcome |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$gates"
          } >> "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r 'to_entries[] | select(.value.outcome != "success") | "\(.key)=\(.value.outcome)"' <<< "$gates")"
          if [ -n "$failed" ]; then
            echo "xtask-gates: every gate ran; these steps did not pass:"
            while IFS= read -r line; do
              echo "  $line"
              echo "::error title=xtask-gates::$line"
            done <<< "$failed"
            exit 1
          fi
          echo "xtask-gates: all $(jq 'length' <<< "$gates") steps passed"

  # CI release-ready program W2 (2026-11-15) — the 15 shell/smoke jobs that each rebuilt `maos-bin` (plan §3: 16
  # jobs, 5,239 job-seconds) are NAMED STEPS of this ONE job. `maos-bin` is built once per profile in ONE shared
  # `target/` (release + fixture_replay, release, debug); the later steps' own `cargo build` / `cargo run` find those
  # artifacts fresh. No smoke assertion changed: every step runs the old job's command or script verbatim, and step
  # `name` == `id` == the old job name. `onb-nfr2-timing` is NOT part of it: its assertion IS a `cargo clean` cold
  # build plus its timing, which cannot share a build.
  #
  # Isolation: before W2 each smoke had a pristine runner, so nothing under HOME / XDG (Transparency Log, journals,
  # the operator door's control.json) could leak from one smoke into the next. Every smoke step therefore starts
  # under a fresh HOME, with CARGO_HOME / RUSTUP_HOME pinned to the real ones first so the toolchain and the registry
  # cache stay shared. The release-binary smokes run before the debug ones, and no step runs `cargo clean`.
  #
  # Same failure contract as `xtask-gates`: every step runs after a red one (`if: !cancelled()`, never
  # `continue-on-error`), the last step lists every step that was not `success` and fails the job, no retry, and
  # the per-step outcomes are job `outputs`.
  smoke-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ !cancelled() }}
    outputs:
      smoke-deps: ${{ steps.smoke-deps.outcome }}
      build-maos-bin-fixture-replay: ${{ steps.build-maos-bin-fixture-replay.outcome }}
      smoke-orchestrator-fanout-6-2: ${{ steps.smoke-orchestrator-fanout-6-2.outcome }}
      smoke-a2a-loopback-6-3: ${{ steps.smoke-a2a-loopback-6-3.outcome }}
      smoke-a2a-consent-vocab-8-7: ${{ steps.smoke-a2a-consent-vocab-8-7.outcome }}
      smoke-a2a-fail-closed-8-8: ${{ steps.smoke-a2a-fail-closed-8-8.outcome }}
      smoke-a2a-tcp-8-6: ${{ steps.smoke-a2a-tcp-8-6.outcome }}
      smoke-schedule-6-4: ${{ steps.smoke-schedule-6-4.outcome }}
      server-exit-drain: ${{ steps.server-exit-drain.outcome }}
      audit-query-fr4-smoke: ${{ steps.audit-query-fr4-smoke.outcome }}
      maosctl-smoke: ${{ steps.maosctl-smoke.outcome }}
      cap-registry-smoke: ${{ steps.cap-registry-smoke.outcome }}
      smoke-skill-7-4: ${{ steps.smoke-skill-7-4.outcome }}
      smoke-abi-7-5a: ${{ steps.smoke-abi-7-5a.outcome }}
      smoke-registry-7-2: ${{ steps.smoke-registry-7-2.outcome }}
      smoke-compliance-7-3: ${{ steps.smoke-compliance-7-3.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-suite-${{ hashFiles('**/Cargo.lock') }}
      - name: Install the smoke harness dependencies (sqlite3, jq)
        id: smoke-deps
        run: sudo apt-get update && sudo apt-get install -y sqlite3 jq
      # The six MAOS_ONE_SHOT demos run the binary directly, so they need the fixture_replay build.
      - name: Build maos-bin (release, fixture_replay)
        id: build-maos-bin-fixture-replay
        if: ${{ !cancelled() }}
        run: cargo build -p maos-bin --release --features fixture_replay
      # Story 6.2 AC7 — smoke-orchestrator-fanout-6-2 end-to-end demo arm.
      - name: smoke-orchestrator-fanout-6-2
        id: smoke-orchestrator-fanout-6-2
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-orchestrator-fanout-6-2
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 6.3 AC7 — smoke-a2a-loopback-6-3 A2A wedge demo.
      - name: smoke-a2a-loopback-6-3
        id: smoke-a2a-loopback-6-3
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-a2a-loopback-6-3
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 8.7 AC6 — smoke-a2a-consent-vocab-8-7 fine-grained typed-intent consent demo (one fine-grained admit +
      # one fine-grained code-mutation-directive deny).
      - name: smoke-a2a-consent-vocab-8-7
        id: smoke-a2a-consent-vocab-8-7
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-a2a-consent-vocab-8-7
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 8.8 AC4 — smoke-a2a-fail-closed-8-8: fail-closed cross-Host consent demo (classified admit +
      # absent-deny -32009 + non-canonical-deny -32009).
      - name: smoke-a2a-fail-closed-8-8
        id: smoke-a2a-fail-closed-8-8
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-a2a-fail-closed-8-8
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 8.6 AC-T13/AC-A7 — smoke-a2a-tcp-8-6: live cross-Host Mira(host_a) → Nash(host_b) advisory over a REAL
      # TCP/mTLS socket (genuine handshake + wire, NOT the in-process loopback shortcut).
      - name: smoke-a2a-tcp-8-6
        id: smoke-a2a-tcp-8-6
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-a2a-tcp-8-6
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 6.4 AC5 — end-to-end wedge demo: ScheduleWatchdog firing + rate-limit cap + ConsentRupture detection +
      # RateLimited frame emission.
      - name: smoke-schedule-6-4
        id: smoke-schedule-6-4
        if: ${{ !cancelled() && steps.build-maos-bin-fixture-replay.outcome == 'success' }}
        env:
          MAOS_ONE_SHOT: smoke-schedule-6-4
          MAOS_SCHEDULE_FAST: "1"
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          ./target/release/maos
      # Story 2.5 AC1 — verifies cap-audit drain on SIGTERM in both one-shot and long-running server paths. The drain
      # block is identical in both arms of main.rs, so row persistence is tested via the one-shot path (which
      # generates cap-audit rows deterministicly), and the server path is structurally validated for drain-block
      # reachability. Hermetic since CI release-ready program W1b: the one-shot runs under
      # `MAOS_INFERENCE_MODE=replay` against the committed seed cassette, so the leg needs no provider key and the
      # script has no skip branch.
      - name: server-exit-drain
        id: server-exit-drain
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          bash tests/integration/server_exit_drain.sh
      # Story 1b.5b AC4 — end-to-end `maosctl audit query` mechanical verification path. Seeds the on-disk
      # Transparency Log via the one-shot hello-Spirit binary, then asserts the FR4 NDJSON schema via jq.
      # Complementary to the `fr4_1000_call_fixture` test (kernel-side mediation; run by workspace-test-suite) —
      # this gate exercises the read-side surface.
      - name: audit-query-fr4-smoke
        id: audit-query-fr4-smoke
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          bash tests/integration/audit_query_fr4_smoke.sh
      # Story 1b.5c AC1 — end-to-end `maosctl` lifecycle smoke. Drives all five v0.1 verbs
      # (install/run/start/stop/unload) against the reference `hello-spirit` and asserts each side-effect
      # mechanically (FR58 JSON on run; one Lifecycle Journal NDJSON line per lifecycle verb; exit 2 + zero journal
      # mutation on unknown-spirit).
      - name: maosctl-smoke
        id: maosctl-smoke
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          bash tests/integration/maosctl_smoke.sh
      - name: cap-registry-smoke
        id: cap-registry-smoke
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          bash tests/integration/cap_registry_smoke.sh
      # Story 18-7 — library-only skill smoke (4 deterministic JSON lines).
      - name: smoke-skill-7-4
        id: smoke-skill-7-4
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          cargo build -p maos-bin
          out="$(MAOS_ONE_SHOT=smoke-skill-7-4 cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 4 || { echo "expected 4 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"total":210' || { echo "LCAS total != 210"; exit 1; }
      # Story 7.5a AC6 — ABI Stability Triple observability smoke (5 deterministic JSON lines).
      - name: smoke-abi-7-5a
        id: smoke-abi-7-5a
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          cargo build -p maos-bin
          out="$(MAOS_ONE_SHOT=smoke-abi-7-5a cargo run -q -p maos-bin)"
          echo "$out"
          lines="$(printf '%s\n' "$out" | grep -c '"step"')"
          test "$lines" -eq 5 || { echo "expected 5 JSON step lines, got $lines"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"ESubstrateTooOld"' || { echo "missing ESubstrateTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"error":"EAbiTooOld"' || { echo "missing EAbiTooOld refusal"; exit 1; }
          printf '%s\n' "$out" | grep -q '"outcome":"in_sync"' || { echo "STABILITY.md not in sync"; exit 1; }
      # Story 7.2 AC6 — end-to-end v1.0 binding round-trip (publish → search → install → yank → audit → import).
      # maos-cli produces the `maosctl` binary the smoke's step-8 air-gap import invokes (resolved as a
      # daemon-sibling). Without it, maosctl is absent in CI and the smoke aborts at `maosctl import`.
      - name: smoke-registry-7-2
        id: smoke-registry-7-2
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          cargo build -p maos-bin -p maos-spirit-cli -p maos-cli
          MAOS_ONE_SHOT=smoke-registry-7-2 cargo run -p maos-bin
      # Story 7.3 AC6 — Layer-1.5 observability: v1.0 admission-verification demo.
      - name: smoke-compliance-7-3
        id: smoke-compliance-7-3
        if: ${{ !cancelled() }}
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$(mktemp -d)"
          cargo build -p maos-bin -p maos-spirit-cli
          MAOS_ONE_SHOT=smoke-compliance-7-3 cargo run -p maos-bin
      - name: Report every smoke result; fail if any did not pass
        if: ${{ !cancelled() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          # Steps without an `id` (checkout, toolchain, cache, this step) carry a generated `__…` key: not smokes.
          smokes="$(jq -c 'with_entries(select(.key | startswith("__") | not))' <<< "$STEPS_JSON")"
          # An empty or reshaped context must never read as green: the dependency step is always in it.
          if ! jq -e 'has("smoke-deps")' <<< "$smokes" > /dev/null; then
            echo "::error title=smoke-suite::the steps context does not carry smoke-deps; refusing a vacuous pass"
            exit 1
          fi
          {
            echo "| Step | Outcome |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$smokes"
          } >> "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r 'to_entries[] | select(.value.outcome != "success") | "\(.key)=\(.value.outcome)"' <<< "$smokes")"
          if [ -n "$failed" ]; then
            echo "smoke-suite: every smoke ran; these steps did not pass:"
            while IFS= read -r line; do
              echo "  $line"
              echo "::error title=smoke-suite::$line"
            done <<< "$failed"
            exit 1
          fi
          echo "smoke-suite: all $(jq 'length' <<< "$smokes") steps passed"

  # Epic 12 retro B4 (Option C Blocking, hermetic) — a `cargo fmt` reflow must
  # red at its ORIGIN commit, not drift silently into a later story's kernel
  # baseline. Story 12.2's fmt reflow moved the baseline 23081->23082 and shipped
  # un-caught into 12.3 precisely because there was no fmt gate. Blocking.
  check-fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run cargo fmt --check
        run: cargo fmt --all -- --check

  kloc-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # BLOCKING since 2026-07-25 (founder-ratified ceiling-policy replacement).
    # Was ADVISORY from 2026-06-11 under the "tight measured residual" rule, whose
    # own revert condition read: "revert to blocking once the kernel-core
    # decomposition lands and the ceilings can be met honestly."
    # HONEST STATUS OF THAT CONDITION: the second half is met, the first is NOT.
    # Decomposition Phase 3/4 has still not landed (kernel-core is 17,890 against
    # an Epic-5 target of ~5,400 — a target whose own named extractions only ever
    # totalled ~13,627 LOC, so it was never reachable as written). What changed is
    # that ceilings are now set by a rule that leaves real operating capacity
    # (`measured + max(100, ceil(0.02 * measured))`, see xtask/kloc.toml), so the
    # gate can be met honestly and is therefore enforceable. It was advisory
    # BECAUSE tight-residual made it unshippable, not because breaches were
    # acceptable. Slack is capacity, NOT authorization: kernel-core changes still
    # require a measured FLAG-Winston grant plus a kernel-core-baseline.toml
    # HISTORY row, enforced separately by the BLOCKING check-kernel-baseline job.
    # Phase 4 decomposition remains tracked architectural debt in kloc.toml.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install tokei
        run: |
          # tokei v14.0.0 ships no pre-built release assets (the previous
          # curl-from-release-tarball path now 404s). cargo install builds from
          # source (~30s); subsequent runs hit the Swatinem/rust-cache layer
          # and skip the build. --locked pins to the registry-published
          # Cargo.lock for reproducibility.
          cargo install --locked --version ${TOKEI_VERSION} tokei
      - name: Run kloc-check
        run: cargo run -p xtask -- kloc-check --json

  abi-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-public-api
        run: |
          cargo install cargo-public-api --version ${CARGO_PUBLIC_API_VERSION}
      - name: Run abi-diff
        run: cargo run -p xtask -- abi-diff --base abi-baseline/v1-pre-bump.txt --json


  gen-abi-docs:
