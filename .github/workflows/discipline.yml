  # RETIRED 2026-06-12 by Story 8.16 per ADR-043 — `check-epic-6-bridge` was a
  # 4504-line Epic-6 debt-visibility beacon whose §A2/§A3/§A5/§A6 enforcement was
  # migrated to live hard-fail gates in Story 7.1.5 (check-serde-error-handling; the
  # story-record gates were deleted by lean-gates WP-06). Its last red
  # (A4-Debt-1) was a stale entry-counting predicate, not real debt; I9 holder-path
  # discipline is enforced live by check-empty-kernel + check-service-boundary.
  # Story 20-3b deletes the archived module; its live controls remain folded into
  # the successor gates. Removed rather than parked
  # `if: false` (no fake-green). See ADR-043 for the item-by-item successor map.

  # D12 (Story 14-0 AC3.3) — `audit_query_latency` had been BROKEN SINCE 9.1 and
  # had run ZERO times. It filtered on `"capability.invoke"`, which is not a
  # frame kind, so `query` returned `UnknownKind` and the bench panicked. Nothing
  # noticed, because the bench was declared in `crates/maos-bench/Cargo.toml` and
  # appeared in NO workflow and NO xtask.
  #
  # The story's ruling is REPAIR, not retire: this measures the audit-query
  # read-path floor NFR-Aud-13 rests on, and deleting it removes a real control.
  # But repairing the string alone would leave a bench that still never runs —
  # a D11(b) instance in its own right, and explicitly NOT a closure. This job
  # is the execution path.
  #
  # NOT `continue-on-error`, unlike the nfr-perf-* benches (now nightly, in ci-nightly.yml): `-- --test`
  # is criterion's single-iteration correctness mode, so it is deterministic and
  # hermetic rather than wall-clock-sensitive. It asserts the kind filter matches
  # a non-empty set BEFORE timing anything — a valid-but-wrong kind would
  # otherwise time an empty scan and report it as a latency measurement.
  bench-audit-query-latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      - name: Run audit-query-latency in correctness mode (D12)
        run: cargo bench -p maos-bench --bench audit_query_latency -- --test

