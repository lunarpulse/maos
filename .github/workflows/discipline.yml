  # Pre-merge coverage for the HERMETIC journey suite. The full
  # `maos-journey-test` crate runs only in journey-nightly.yml (scheduled),
  # never here — so push/PR CI was green while a Story-8.15 self-contradiction
  # (j0 polled the PTY with raw Instant::now(), violating its own JB-7/H4
  # no-wallclock guard) sat latent until the first nightly fired. This job runs
  # the suite in REPLAY mode (no secrets, no network — cassette/MockMcp only),
  # so the JB-7 guards + j0/j1/j4/researcher/butler deterministic floors gate
  # every PR. The secret-gated live re-record stays nightly-only.
  journey-hermetic-tier-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
      # The PTY journey tests spawn the real `maos` binary, resolved via
      # `target/debug/maos` (CARGO_BIN_EXE_maos is unset — the binary lives in a
      # SEPARATE package, maos-bin, so Cargo does not inject it for this crate's
      # integration tests). `cargo test -p maos-journey-test` does NOT build that
      # sibling binary, so it MUST be built first — exactly what nightly does
      # (journey-nightly.yml builds the workspace before the suite). Omitting this
      # makes maos_bin() panic "maos binary not found" → exit 101.
      # Also pre-build `worker-cli-fixture` (separate `worker` package): building
      # maos-bin alone does not produce it, and the journey suite spawns the real
      # `maos` binary from target/debug (see above). (The founder-loop journey smoke
      # that originally needed it was retired by Story 9.6; the build is retained as
      # a defensive pre-build.)
      - name: Build the maos binary + worker-cli-fixture (debug — journey tests spawn target/debug)
        run: cargo build --locked -p maos-bin --bin maos && cargo build --locked -p worker --bin worker-cli-fixture
      - name: Hermetic journey suite (replay mode — JB-7 guards + deterministic floors)
        run: cargo test -p maos-journey-test --locked

