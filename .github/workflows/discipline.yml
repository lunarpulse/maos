      - cgroup-ceiling-undelegated
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Build results table
        id: results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "gad=${{ needs.gen-abi-docs.result }}" >> $GITHUB_OUTPUT
          echo "kc=${{ needs.kloc-check.result }}" >> $GITHUB_OUTPUT
          echo "ad=${{ needs.abi-diff.result }}" >> $GITHUB_OUTPUT
          echo "il=${{ needs.invariant-lock.result }}" >> $GITHUB_OUTPUT
          echo "cc=${{ needs.check-corpus.result }}" >> $GITHUB_OUTPUT
          echo "mar=${{ needs.maos-audit-read-only.result }}" >> $GITHUB_OUTPUT
          echo "ctvb=${{ needs.cap-token-verify-bench.result }}" >> $GITHUB_OUTPUT
          echo "hsb=${{ needs.hello-spirit-bench.result }}" >> $GITHUB_OUTPUT
          echo "onb=${{ needs.onb-nfr2-timing.result }}" >> $GITHUB_OUTPUT
          echo "est=${{ needs.example-spirit-tests.result }}" >> $GITHUB_OUTPUT
          echo "estts=${{ needs.example-spirit-ts-tests.result }}" >> $GITHUB_OUTPUT
          echo "stt=${{ needs.spirit-test-tests.result }}" >> $GITHUB_OUTPUT
          echo "cmn3=${{ needs.coverage-matrix-nfr-test-3.result }}" >> $GITHUB_OUTPUT
          echo "lct=${{ needs.lcas-corpus-tests.result }}" >> $GITHUB_OUTPUT
          echo "ift=${{ needs.isolation-framework-tests.result }}" >> $GITHUB_OUTPUT
          echo "cpc=${{ needs.calibrate-per-commit.result }}" >> $GITHUB_OUTPUT
          echo "cwc=${{ needs.check-workspace-count.result }}" >> $GITHUB_OUTPUT
          echo "ccrc=${{ needs.check-composition-root-completeness.result }}" >> $GITHUB_OUTPUT
          echo "ckb=${{ needs.check-kernel-baseline.result }}" >> $GITHUB_OUTPUT
          echo "jht1=${{ needs.journey-hermetic-tier-1.result }}" >> $GITHUB_OUTPUT
          echo "rdr=${{ needs.release-dry-run.result }}" >> $GITHUB_OUTPUT
          echo "| Required 17-2 job | Result | Scope |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| cgroup-ceiling-delegated | ${{ needs.cgroup-ceiling-delegated.result }} | 4-image real cgroup-v2 enforcement; x64 rootless T3 checks |" >> "$GITHUB_STEP_SUMMARY"
          echo "| cgroup-ceiling-undelegated | ${{ needs.cgroup-ceiling-undelegated.result }} | 4-image Delegate=no refusal/fallback proof |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Discipline prerequisite | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "skipped" then "NOT RUN — skipped" else .value.result end) |"' \
            <<< "$NEEDS_JSON" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | select(.key == "xtask-gates" or .key == "smoke-suite") | .key as $job | (.value.outputs // {}) | to_entries[] | "| \($job) / \(.key) | \(.value) |"' \
            <<< "$NEEDS_JSON" >> "$GITHUB_STEP_SUMMARY"
      # Story 20-6 AC3 — a skipped macOS guard is NOT-APPLICABLE, said out loud.
      # `needs.*.result == 'skipped'` is not a failure, so without this step a
      # filtered-out guard would read as an unremarkable green and the
      # rehearsal could then be assumed to have covered it.
      - name: macOS guard disposition (Story 20-6 AC3)
        id: macos_guard
        env:
          SCOPE_RESULT: ${{ needs.macos-scope.result }}
          SCOPE_APPLICABLE: ${{ needs.macos-scope.outputs.applicable }}
          SCOPE_REASON: ${{ needs.macos-scope.outputs.reason }}
          CHECK_RESULT: ${{ needs.macos-check.result }}
        run: |
          case "$CHECK_RESULT" in
            success)
              line="macos-check: RAN and PASSED — $SCOPE_REASON" ;;
            skipped)
              if [ "$SCOPE_APPLICABLE" = "false" ]; then
                line="macos-check: NOT APPLICABLE (not a pass) — $SCOPE_REASON. The pre-tag rehearsal (docs/release/tag-procedure.md step 6) stays mandatory."
              elif [ "$SCOPE_RESULT" != "success" ]; then
                line="macos-check: NOT RUN because macos-scope was $SCOPE_RESULT — that failure already reds this aggregate."
              else
                # Applicable, yet skipped: the guard did not run. Recorded as an
                # output and failed by the LAST step, so the PR comment (which
                # sits between) is still refreshed instead of left stale.
                line="macos-check: SKIPPED although macos-scope judged it applicable ($SCOPE_REASON) — the guard did not run; this reds the aggregate."
                echo "unran=true" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              line="macos-check: $CHECK_RESULT — $SCOPE_REASON" ;;
          esac
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - name: Check for failures
        id: status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # macos-check is the ONLY skipped-job exemption; its 20-6 disposition step owns applicability.
          failed=$(jq -r 'to_entries | any(.value.result == "failure" or .value.result == "cancelled" or (.key != "macos-check" and .value.result == "skipped"))' <<< "$NEEDS_JSON")
          if [[ "$failed" == "true" ]]; then
            echo "overall=failure" >> $GITHUB_OUTPUT
          else
            echo "overall=success" >> $GITHUB_OUTPUT
          fi
      - name: Post/update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          XTASK_GATE_OUTCOMES: ${{ toJSON(needs.xtask-gates.outputs) }}
          SMOKE_OUTCOMES: ${{ toJSON(needs.smoke-suite.outputs) }}
        with:
          script: |
            // CI release-ready program W2: the deterministic xtask gates and the maos-bin smokes are named steps of
            // `xtask-gates` / `smoke-suite`, which publish one outcome per step as job outputs. A job that published
            // none (skipped, cancelled, failed before its steps) reads as the job's own result, so a missing outcome
            // is never a green-looking cell.
            const outcomes = (json) => JSON.parse(json || '{}') || {};
            const xtaskGatesResult = '${{ needs.xtask-gates.result }}';
            const smokeSuiteResult = '${{ needs.smoke-suite.result }}';
            const xtaskGateOutcomes = outcomes(process.env.XTASK_GATE_OUTCOMES);
            const smokeOutcomes = outcomes(process.env.SMOKE_OUTCOMES);
            const xg = (gate) => xtaskGateOutcomes[gate] || xtaskGatesResult;
            const sm = (step) => smokeOutcomes[step] || smokeSuiteResult;
            // A gate whose old job also ran xtask-only vector steps shows the first non-success of the gate step and
            // its vectors step, as the old per-job result did.
            const both = (...results) => results.find((r) => r !== 'success') || 'success';
            const cu = xg('check-unsafe');
            const cek = xg('check-empty-kernel');
            const cl = xg('check-loom');
            const csb = xg('check-service-boundary');
            const kc = '${{ needs.kloc-check.result }}';
            const ad = '${{ needs.abi-diff.result }}';
            const gad = '${{ needs.gen-abi-docs.result }}';
            const il = '${{ needs.invariant-lock.result }}';
            const cc = '${{ needs.check-corpus.result }}';
            const mar = '${{ needs.maos-audit-read-only.result }}';
            const cjc = xg('check-judge-config');
            const csm = both(xg('check-security-md'), xg('check-security-md-vectors'));
            const ctc = both(xg('check-test-cost'), xg('check-test-cost-vectors'));
            const sed = sm('server-exit-drain');
            const ctvb = '${{ needs.cap-token-verify-bench.result }}';
            const crs = sm('cap-registry-smoke');
            const aqfs = sm('audit-query-fr4-smoke');
            const ms = sm('maosctl-smoke');
            const hsb = '${{ needs.hello-spirit-bench.result }}';
            const onb = '${{ needs.onb-nfr2-timing.result }}';
            const est = '${{ needs.example-spirit-tests.result }}';
            const esd = xg('example-spirit-drift');
            const estts = '${{ needs.example-spirit-ts-tests.result }}';
            const stt = '${{ needs.spirit-test-tests.result }}';
            const cmn3 = '${{ needs.coverage-matrix-nfr-test-3.result }}';
            const lct = '${{ needs.lcas-corpus-tests.result }}';
            const ift = '${{ needs.isolation-framework-tests.result }}';
            const cm = xg('coverage-matrix');
            const cs = xg('corpus-staleness');
            const cpc = '${{ needs.calibrate-per-commit.result }}';  // conditionally skipped until Story 0.4
            const cf47 = xg('check-fr47');
            const cwc = '${{ needs.check-workspace-count.result }}';
            const cpfc = xg('check-pub-field-constructors');
            const ccrc = '${{ needs.check-composition-root-completeness.result }}';
            const casc = xg('check-a2a-sender-completeness');
            const safc = sm('smoke-a2a-fail-closed-8-8');
            const ckb = '${{ needs.check-kernel-baseline.result }}';
            const jht1 = '${{ needs.journey-hermetic-tier-1.result }}';
            const cgd = '${{ needs.cgroup-ceiling-delegated.result }}';
            const cgu = '${{ needs.cgroup-ceiling-undelegated.result }}';
            const rdr = '${{ needs.release-dry-run.result }}';
            const mcs = '${{ needs.macos-check.result }}';
            const mcsScope = '${{ needs.macos-scope.result }}';
            const mcsApplicable = '${{ needs.macos-scope.outputs.applicable }}';
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '❌ NOT RUN —' : '❌');
            // A skip is "not applicable" ONLY when the filter ran and said so; a skip behind a failed
            // filter, or behind `applicable=true`, is a guard that did not run — never a green-looking cell.
            // Declared AFTER `icon`: reading a `const` above its declaration throws (TDZ) and reds aggregate.
            const mcsCell = mcs === 'skipped'
              ? ((mcsScope === 'success' && mcsApplicable === 'false')
                  ? '➖ NOT APPLICABLE (not a pass) — no platform-sensitive path in this diff; the pre-tag rehearsal stays mandatory'
                  : '❌ NOT RUN — macos-scope ' + mcsScope + ', applicable=' + (mcsApplicable || 'unset'))
              : icon(mcs) + ' ' + mcs;

            const body = `## MAOS Discipline Gate Results

            | Gate | Result |
            |------|--------|
            | check-unsafe | ${icon(cu)} ${cu} |
            | check-empty-kernel | ${icon(cek)} ${cek} |
            | check-loom | ${icon(cl)} ${cl} |
            | check-service-boundary | ${icon(csb)} ${csb} |
            | kloc-check | ${icon(kc)} ${kc} |
            | abi-diff | ${icon(ad)} ${ad} |
            | gen-abi-docs | ${icon(gad)} ${gad} |
            | invariant-lock | ${icon(il)} ${il} |
            | check-corpus | ${icon(cc)} ${cc} |
            | maos-audit-read-only | ${icon(mar)} ${mar} |
            | check-judge-config | ${icon(cjc)} ${cjc} |
            | check-security-md | ${icon(csm)} ${csm} |
            | check-test-cost | ${icon(ctc)} ${ctc} |
            | server-exit-drain | ${icon(sed)} ${sed} |
            | cap-token-verify-bench | ${icon(ctvb)} ${ctvb} |
            | cap-registry-smoke | ${icon(crs)} ${crs} |
            | audit-query-fr4-smoke | ${icon(aqfs)} ${aqfs} |
            | maosctl-smoke | ${icon(ms)} ${ms} |
            | hello-spirit-bench | ${icon(hsb)} ${hsb} |
            | onb-nfr2-timing | ${icon(onb)} ${onb} |
            | example-spirit-tests | ${icon(est)} ${est} |
            | example-spirit-drift | ${icon(esd)} ${esd} |
            | example-spirit-ts-tests | ${icon(estts)} ${estts} |
            | cgroup-ceiling-delegated | ${icon(cgd)} ${cgd} |
            | cgroup-ceiling-undelegated | ${icon(cgu)} ${cgu} |
            | spirit-test-tests | ${icon(stt)} ${stt} |
            | coverage-matrix-nfr-test-3 | ${icon(cmn3)} ${cmn3} |
            | lcas-corpus-tests | ${icon(lct)} ${lct} |
            | isolation-framework-tests | ${icon(ift)} ${ift} |
            | coverage-matrix | ${icon(cm)} ${cm} |
            | corpus-staleness | ${icon(cs)} ${cs} |
            | calibrate-per-commit | ${icon(cpc)} ${cpc} |
            | check-fr47 | ${icon(cf47)} ${cf47} |
            | check-workspace-count | ${icon(cwc)} ${cwc} |
            | check-pub-field-constructors | ${icon(cpfc)} ${cpfc} |
            | check-composition-root-completeness | ${icon(ccrc)} ${ccrc} |
            | check-a2a-sender-completeness | ${icon(casc)} ${casc} |
            | smoke-a2a-fail-closed-8-8 | ${icon(safc)} ${safc} |
            | check-kernel-baseline | ${icon(ckb)} ${ckb} |
            | journey-hermetic-tier-1 | ${icon(jht1)} ${jht1} |
            | release-dry-run | ${icon(rdr)} ${rdr} |
            | xtask-gates (job) | ${icon(xtaskGatesResult)} ${xtaskGatesResult} |
            | smoke-suite (job) | ${icon(smokeSuiteResult)} ${smokeSuiteResult} |
            | macos-check (path-filtered, Story 20-6) | ${mcsCell} |

            <!-- discipline-gate-comment -->`;

            // Upsert: find existing comment and update, or create new.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- discipline-gate-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail if any gate failed
        if: ${{ steps.status.outputs.overall == 'failure' }}
        run: |
          echo "One or more discipline gates failed."
          exit 1
      # Story 20-6 AC3 — LAST on purpose (after the PR comment): an applicable
      # guard that was skipped is a red aggregate, and the comment still says why.
      - name: Fail if the macOS guard was applicable but did not run
        if: ${{ steps.macos_guard.outputs.unran == 'true' }}
        run: |
          echo "macos-check was judged applicable by macos-scope but did not run — the guard is unverified."
          exit 1

  # CI release-ready program W4 (2026-11-15; `_bmad-output/planning-artifacts/ci-release-ready-program-2026-11-14.md`
  # §2 and §4, operator decision 1 of `decisions-2026-11-14-release-ci.md`) — the release-critical fan-in.
  # `check-release-precondition` reads THIS check-run for a release candidate (`-rc.N`); GA requires `aggregate`
  # (strict, every gate) AND this one; the alpha line stays `aggregate`-only. `aggregate` is unchanged and stays the
  # branch-protection check.
  #
  # A SUBSET of `aggregate`: its `needs` are `aggregate.needs` with `v1-0-ship-gate` expanded into the jobs it fans in,
  # MINUS the exclusion table in `xtask/src/check_ship_gate_completeness.rs` (`RELEASE_READY_EXCLUDED`, one reason per
  # row; plan §4 merge-hygiene gates). `check-ship-gate-completeness` fails the merge path when this list drifts from
  # that table, when an excluded gate is still listed, when a release-critical gate (`RELEASE_READY_R_SET`) is
  # excluded, or when `EXCLUDED_XTASK_GATES` below is not the excluded `xtask-gates` steps. Everything not excluded
  # stays required: workspace-test-suite, the epic exits, the cgroup / wasm-host legs, nfr-rel-1/2/9, the air-gap
  # witness, the package and container builds, and the R-set xtask gates (check-stability-matrix, check-breaking-md,
  # ...), which are read per step from `xtask-gates`.
  #
  # Result rule, as `aggregate`: failure, cancelled and skipped are red (`macos-check` is the one skipped exemption;
  # its applicability is judged as 20-6 AC3 does). `xtask-gates` is read per step output: a red excluded step does
  # NOT red this job, but it is never hidden (job summary plus a warning annotation), and a `xtask-gates` failure that
  # no step output explains is red. The excluded JOBS are neither waited for nor read here; `aggregate` carries them.
  # No PR comment: `aggregate` already posts the one comment of the run.
  release-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - cargo-deny
      - xtask-gates
      - smoke-suite
      - check-fmt
      - kloc-check
      - abi-diff
      - gen-abi-docs
      - check-workspace-count
      - check-composition-root-completeness
      - invariant-lock
      - invariant-ledger-proofs
      - check-corpus
      - maos-audit-read-only
      - cap-token-verify-bench
      - hello-spirit-bench
      - example-spirit-tests
      - founder-loop-bench
      - example-spirit-ts-tests
      - coverage-matrix-nfr-test-3
      - spirit-test-tests
      - lcas-corpus-tests
      - isolation-framework-tests
      - onb-nfr2-timing
      - calibrate-per-commit
      - nfr-aud-7-distillate-five-metrics-floor
      - nfr-sec-14-cross-spirit-isolation-200
      - nfr-rel-3-hsis-95pct
      - nfr-rel-1-crash-detection-2s
      - nfr-rel-2-hang-detection-60s
      - nfr-rel-4-silent-failure-detection
      - nfr-rel-10-cold-restart
      - nfr-rel-9-revocation-5s-p99
      - nfr-rel-11-halt-receipt-999pct
      - expensive-tests
      - upgrade-policy-corpus
      - revocation-corpus
      - t3-escape-corpus
      - nfr-sec-1-t3-image-signature
      - t3-smoke-busybox
      - epic-17-exit
      - epic-18-exit
      - epic-19-exit
      - epic-20-exit
      - nfr-aud-14-intent-lineage-corpus
      - a2a-tcp-tests-8-6
      - a2a-loopback-corpus-v0
      - intent-lineage-a2a-extension-6-3
      - fr26-schedule-firing-corpus
      - adr-034-consent-rupture-corpus
      - nfr-scale-4-rate-limit-isolation
      - intent-lineage-6-4-extension
      - manifest-n-minus-1-test
      - check-kernel-baseline
      - journey-hermetic-tier-1
      - fr59-yank-propagation-5min
      - air-gap-import-corpus
      - ccac-n600-ship-gate
      - smoke-onb-1-7-5b
      - check-owasp-freeze-hash
      - check-trial-attestation
      - check-migration-merkle
      - workspace-test-suite
      - release-dry-run
      - air-gap-netns-witness
      - container-build
      - package-recipes
      - cargo-install
      - macos-scope
      - macos-check
      - cgroup-ceiling-delegated
      - cgroup-ceiling-undelegated
      # The `v1-0-ship-gate.needs` members `aggregate` reaches through that fan-in, minus the excluded merge-path ones.
      - check-export-control
      - check-host-surface
      - check-ko-coverage
      - check-live-bilateral-consent
      - check-rotation-real-timing
      - check-j4-latency
      - check-j1-loopback-delegation
      - check-j1-two-host-signed-run
      - check-mobile-push-on-halt
      - check-ff-j6
      - check-skill-conformance
      - wasm-host-tests
      - check-wasm-form-equiv
      - check-cross-region-consensus
      - check-multi-region-slo
      - check-scale-churn
      - check-cohort-mesh
      - check-multi-tenant-loom
      - check-reza-production-path
      - check-enterprise-pdp
      - check-enterprise-identity
      - check-fkcs
      - check-escape-detector
      - check-vetting-attestation
    if: always()
    steps:
      - name: Judge the release-critical set
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # The `xtask-gates` steps this job does not require (their failure is recorded, never hidden). Pinned to
          # `RELEASE_READY_EXCLUDED` by `check-ship-gate-completeness`.
          EXCLUDED_XTASK_GATES: "check-env-contract check-test-cost check-test-cost-vectors"
          # EVERY other step of `xtask-gates` (gates and vector steps, build included): each must be PRESENT in the job
          # outputs and `success`, so a dropped output is a red, never an invisible failure. Pinned by
          # `check-ship-gate-completeness` to (all `xtask-gates` step ids) minus `RELEASE_READY_EXCLUDED`.
          REQUIRED_XTASK_STEPS: "build-xtask check-stability-matrix check-serde-error-handling check-manifest-schema-version check-skill-schema check-coverage-matrix-completeness check-unsafe check-service-boundary check-breaking-md check-pub-field-constructors check-dependency-closure coverage-matrix check-empty-kernel check-loom check-fr47 check-a2a-sender-completeness check-judge-config check-security-md check-security-md-vectors example-spirit-drift corpus-staleness check-pentest-gate check-third-party-trial check-red-team-gate nfr-onb-1-gate"
        run: |
          set -euo pipefail
          excluded="$(jq -c -n --arg s "$EXCLUDED_XTASK_GATES" '$s | split(" ") | map(select(length > 0))')"
          required="$(jq -c -n --arg s "$REQUIRED_XTASK_STEPS" '$s | split(" ") | map(select(length > 0))')"
          red=""
          # 1. Every needed job but xtask-gates. `macos-check` is the ONLY skipped-job exemption (as in aggregate).
          red_jobs="$(jq -r '
            to_entries
            | map(select(.key != "xtask-gates"))
            | map(select(.value.result == "failure" or .value.result == "cancelled" or (.key != "macos-check" and .value.result == "skipped")))
            | map("\(.key)=\(.value.result)") | join(" ")' <<< "$NEEDS_JSON")"
          if [ -n "$red_jobs" ]; then red="$red; jobs: $red_jobs"; fi
          # 2. xtask-gates, read per step output. An empty output (step never ran) is not success.
          xg_result="$(jq -r '.["xtask-gates"].result' <<< "$NEEDS_JSON")"
          xg_outputs="$(jq -c '.["xtask-gates"].outputs // {}' <<< "$NEEDS_JSON")"
          # A required step whose output is absent is "missing", never skipped over.
          required_bad="$(jq -r -n --argjson req "$required" --argjson out "$xg_outputs" '
            $req | map(. as $k | {key: $k, value: (($out | .[$k]) // "missing")}) | map(select(.value != "success"))
            | map("\(.key)=\(.value)") | join(" ")')"
          excluded_bad="$(jq -r --argjson ex "$excluded" '
            to_entries | map(select(.key as $k | any($ex[]; . == $k))) | map(select(.value != "success"))
            | map("\(.key)=\(.value)") | join(" ")' <<< "$xg_outputs")"
          if ! jq -e 'has("build-xtask")' <<< "$xg_outputs" > /dev/null; then
            red="$red; xtask-gates published no build-xtask outcome (result: $xg_result)"
          elif [ -n "$required_bad" ]; then
            red="$red; xtask-gates required step(s): $required_bad"
          else
            case "$xg_result" in
              success) ;;
              failure)
                if [ -z "$excluded_bad" ]; then
                  red="$red; xtask-gates failed but no gate step output explains it"
                fi ;;
              *) red="$red; xtask-gates=$xg_result" ;;
            esac
          fi
          # 3. macOS guard disposition (Story 20-6 AC3, same rule as aggregate).
          macos_result="$(jq -r '.["macos-check"].result' <<< "$NEEDS_JSON")"
          scope_result="$(jq -r '.["macos-scope"].result' <<< "$NEEDS_JSON")"
          scope_applicable="$(jq -r '.["macos-scope"].outputs.applicable // ""' <<< "$NEEDS_JSON")"
          macos_line="macos-check: $macos_result"
          if [ "$macos_result" = skipped ]; then
            if [ "$scope_applicable" = false ]; then
              macos_line="macos-check: NOT APPLICABLE (not a pass); the pre-tag rehearsal (docs/release/tag-procedure.md step 6) stays mandatory"
            elif [ "$scope_result" != success ]; then
              macos_line="macos-check: NOT RUN because macos-scope was $scope_result (reds this check)"
            else
              macos_line="macos-check: SKIPPED although macos-scope judged it applicable; the guard did not run"
              red="$red; macos-check applicable but did not run"
            fi
          fi
          {
            echo "## release-ready (release-critical subset of aggregate)"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | select(.key != "xtask-gates") | "| \(.key) | \(if .value.result == "skipped" then "NOT RUN, skipped" else .value.result end) |"' <<< "$NEEDS_JSON"
            echo "| xtask-gates (job) | $xg_result |"
            jq -r --argjson ex "$excluded" 'to_entries[] | .key as $k | "| xtask-gates / \($k) | \(.value)\(if any($ex[]; . == $k) then " (EXCLUDED: not required here)" else "" end) |"' <<< "$xg_outputs"
            echo
            echo "$macos_line"
            echo
            echo "Excluded merge-path JOBS are neither waited for nor read here: \`aggregate\` carries them (table: \`RELEASE_READY_EXCLUDED\` in xtask/src/check_ship_gate_completeness.rs)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$macos_line"
          # An excluded step that is not green never turns this check red and is never hidden.
          if [ -n "$excluded_bad" ]; then
            note="EXCLUDED merge-path xtask-gates step(s) not green: $excluded_bad. Not required for a release candidate; GA also requires aggregate."
            echo "::warning title=release-ready records an excluded gate failure::$note"
            { echo; echo "**$note**"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$red" ]; then
            echo "release-ready FAILED:${red#;}"
            exit 1
          fi
          echo "release-ready: every required gate passed"

  # Story 10.2 D3/F3→B — v1.5 Ship-Gate Aggregate: the phase-graduation mechanism.
  # Mirrors v1.0-ship-gate membership but enforces gates whose registry disposition
  # flips to "blocking-when-present" at v1.5 (currently: check-red-team-gate).
  # This job exists NOW (advisory at v1.0 — all sub-gates pass advisory) so the
  # v1.5 cutover is a disposition flip in gate-registry.toml, not an infrastructure
  # fire-drill. Promoted to the top-level aggregate needs once phase == v1.5.
  v1-5-ship-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - v1-0-ship-gate
      - xtask-gates
      - check-enterprise-identity
      - check-fkcs
      - check-trial-attestation
    if: always()
    steps:
      - name: v1.5 ship gate summary
        run: |
          echo "=== v1.5 Ship Gate Results ==="
          echo ""
          echo "| Gate | Status | Disposition @ v1.5 |"
          echo "|------|--------|---------------------|"
          echo "| v1-0-ship-gate | ${{ needs.v1-0-ship-gate.result }} | blocking (inherited) |"
          echo "| check-red-team-gate | ${{ needs.xtask-gates.outputs.check-red-team-gate }} | blocking-when-present |"
          echo "| check-third-party-trial | ${{ needs.xtask-gates.outputs.check-third-party-trial }} | blocking-when-present |"
          echo "| check-enterprise-identity | ${{ needs.check-enterprise-identity.result }} | advisory |"
          echo "| check-fkcs | ${{ needs.check-fkcs.result }} | advisory |"
          echo "| check-trial-attestation | ${{ needs.check-trial-attestation.result }} | advisory |"
          echo ""
          echo "Phase disposition source: xtask/gate-registry.toml [[ship_gate]] entries."
      - name: Fail if any v1.5-blocking gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "v1.5 ship gate FAILED: one or more v1.5-blocking sub-gates did not pass."
          echo "  check-red-team-gate: ${{ needs.xtask-gates.outputs.check-red-team-gate }}"
          echo "  xtask-gates: ${{ needs.xtask-gates.result }}"
          exit 1
