            | kloc-check | ${icon(kc)} ${kc} |
            | abi-diff | ${icon(ad)} ${ad} |
            | gen-abi-docs | ${icon(gad)} ${gad} |
            | invariant-lock | ${icon(il)} ${il} |
            | check-corpus | ${icon(cc)} ${cc} |
            | maos-audit-read-only | ${icon(mar)} ${mar} |
            | check-judge-config | ${icon(cjc)} ${cjc} |
