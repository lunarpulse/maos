name: release
on:
  push:
    tags: ['v*']
  # Pre-tag build rehearsals. `sign-and-publish` is guarded on
  # `github.event_name == 'push'`, so NEITHER of these can publish.
  #
  #  * workflow_dispatch — rehearse at `main` after a merge.
  #  * pull_request      — rehearse BEFORE a merge, label-gated (see `build.if`).
  #    Added 2026-09-12 (Epic-15 retrospective, operator-ratified) so that
  #    `aarch64-apple-darwin`'s first compile in this project's history happens
  #    on a PR rather than on `main`. `workflow_dispatch` is unusable until the
  #    workflow reaches the default branch — GitHub only exposes a dispatch
  #    trigger for workflows present on it — which is exactly the merge the
  #    rehearsal is supposed to de-risk. A `pull_request` run uses the workflow
  #    file from the merge commit, so this trigger works on the PR that adds it.
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # D-15-4-F (amended 2026-09-12, Epic-15 retrospective): macOS bills ~10x and
    # `aggregate` is the branch-protection check, so macOS stays out of the
    # discipline matrix and OFF ordinary pull requests. The ruling's own purpose
    # was to give `aarch64-apple-darwin` a first build BEFORE the tag; this gate
    # serves that purpose one merge earlier at the same cost — one operator-
    # triggered run, never a per-PR tax.
    #
    # Push (tags) and workflow_dispatch are unaffected. A pull request builds
    # only when it carries the `release-rehearsal` label.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release-rehearsal')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Operator hold 2026-10-15: Windows is not release-supported.
        # Do not add Windows build/package/publish targets until an explicit
        # operator command reopens docs/release/windows-deferral.md.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # For arm64 Linux cross-compile
      - name: Install cross-compile deps (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
        run: cargo build --release -p maos-bin -p maos-cli -p maos-registry -p maos-spirit-cli --locked --target ${{ matrix.target }}
      - name: Check mock-not-in-release
        run: cargo run -p xtask -- check-mock-not-in-release --binary target/${{ matrix.target }}/release/maos --json
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/maos dist/maos-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/maosctl dist/maosctl-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/maos-registry-server dist/maos-registry-server-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/maos-spirit dist/maos-spirit-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: maos-${{ matrix.suffix }}
          path: dist/maos-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: maosctl-${{ matrix.suffix }}
          path: dist/maosctl-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: maos-registry-server-${{ matrix.suffix }}
          path: dist/maos-registry-server-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: maos-spirit-${{ matrix.suffix }}
          path: dist/maos-spirit-${{ matrix.suffix }}

  sign-and-publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          # Review GLM F3: every gate below is compiled from the tagged tree, so a tag on an
          # unreviewed side-branch commit must be refused before any of them runs.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release refused: $GITHUB_SHA is not an ancestor of origin/main"; exit 1
          fi
      - name: Classify the tag (fail closed)
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Review GLM F2: the ONE decision point. Every control below reads `kind`; any tag
          # that is not exactly an rc, a GA or the explicit v0.x alpha line is refused.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then kind=rc
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then kind=ga
          elif [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then kind=alpha
          else
            echo "release refused: tag '$TAG' is not vX.Y.Z, vX.Y.Z-rc.N or the v0.x.y-alpha.N line"; exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Require rc tree readiness (rc tags only)
        if: steps.tag.outputs.kind == 'rc'
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --locked -p xtask -- check-rc-readiness --tag "$TAG"
      - name: Require successful main discipline aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          set -euo pipefail
          # Story 20-5 AC4: a release candidate or GA tag also needs a complete T3 fuzz
          # chain (3 targets x 5 links x >= 24 h measured) for this exact SHA in the
          # `fuzz-ledger` branch; the operator dispatches `fuzz-prerelease` before
          # tagging. The alpha line keeps the aggregate-only rule; an unclassified kind
          # is refused (it cannot reach here through the classify step).
          # Operator ruling 2026-11-12 (rc = b): perf verdicts are judged for rc and GA
          # from the `perf-ledger` branch (an absent branch is an empty ledger: every
          # metric ABSENT; ONLY the branch lookup's HTTP 404 means that). A release
          # candidate accepts ABSENT (`--perf-absent-ok`; the notes label it,
          # `check-rc-readiness`, and the next step reconciles the label with the
          # verdicts); FAIL and INDETERMINATE are always refused, and GA needs every
          # metric PASS.
          fuzz_args=()
          perf_args=()
          case "$KIND" in
            rc) fuzz_args=(--fuzz-ledger "$RUNNER_TEMP/fuzz-ledger.json"); perf_args=(--perf-verdicts "$RUNNER_TEMP/perf-verdicts.json" --perf-absent-ok) ;;
            ga) fuzz_args=(--fuzz-ledger "$RUNNER_TEMP/fuzz-ledger.json"); perf_args=(--perf-verdicts "$RUNNER_TEMP/perf-verdicts.json") ;;
            alpha) ;;
            *) echo "release refused: unclassified tag kind '$KIND'"; exit 1 ;;
          esac
          if [ "${#fuzz_args[@]}" -gt 0 ]; then
            # Review GLM F4: the consumed ledger commit is logged and pinned, so the file
            # that was judged is identifiable after the branch moves. (The ledger is still
            # unsigned and operator-owned: see the deferred-work row.)
            tip="$(gh api "repos/${{ github.repository }}/commits/fuzz-ledger" --jq .sha)"
            echo "fuzz-ledger tip consumed: $tip"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${{ github.repository }}/contents/fuzz-ledger.json?ref=$tip" > "$RUNNER_TEMP/fuzz-ledger.json"
          fi
          if [ "${#perf_args[@]}" -gt 0 ]; then
            perf_err="$RUNNER_TEMP/perf-ledger.err"
            # Review F1: the branch lookup is judged ALONE. Only ITS HTTP 404 is an absent
            # branch (an empty ledger). Once the branch exists, a `ledger.jsonl` that cannot
            # be fetched (404 included) is a broken ledger and refuses publication.
            if tip="$(gh api "repos/${{ github.repository }}/branches/perf-ledger" --jq .commit.sha 2> "$perf_err")"; then
              echo "perf-ledger tip consumed: $tip"
              if ! gh api -H "Accept: application/vnd.github.raw+json" "repos/${{ github.repository }}/contents/ledger.jsonl?ref=$tip" > "$RUNNER_TEMP/perf-ledger.jsonl" 2> "$perf_err"; then
                cat "$perf_err"; echo "release refused: cannot read the perf-ledger"; exit 1
              fi
            elif grep -q 'HTTP 404' "$perf_err"; then
              echo "perf-ledger branch absent (HTTP 404): empty ledger, every metric ABSENT"
              : > "$RUNNER_TEMP/perf-ledger.jsonl"
            else
              cat "$perf_err"; echo "release refused: cannot read the perf-ledger"; exit 1
            fi
            # The verdict JSON (stdout) is what is judged; `check-perf-verdict` exits 1 on a
            # blocking metric. A crash prints no JSON, which the precondition refuses: it is
            # never read as ABSENT.
            cargo run --locked -p xtask -- check-perf-verdict --sha "${{ github.sha }}" --ledger "$RUNNER_TEMP/perf-ledger.jsonl" --json > "$RUNNER_TEMP/perf-verdicts.json" || true
          fi
          # Review GLM F6: no status filter, so a newer run still in progress is the run
          # judged (and refused) instead of an older green one.
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=aggregate&filter=latest" |
            cargo run --locked -p xtask -- check-release-precondition "${fuzz_args[@]}" "${perf_args[@]}"
      - name: Require the rc notes perf label to agree with the perf verdicts (rc tags only)
        if: steps.tag.outputs.kind == 'rc'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Review F2: `check-rc-readiness` requires the notes line `Perf verdicts: ABSENT` but
          # cannot see the ledger, and the precondition accepts PASS rows for an rc. A notes
          # file that says ABSENT while the computed report has any PASS/FAIL/INDETERMINATE
          # row is a contradictory disclosure: refuse it. No exact label line = no opinion
          # here (the readiness gate refuses a missing label).
          python3 - "docs/release/${TAG}.md" "$RUNNER_TEMP/perf-verdicts.json" <<'PY'
          import json
          import sys

          LABEL = "Perf verdicts: ABSENT"
          notes_path, report_path = sys.argv[1], sys.argv[2]
          try:
              with open(notes_path, encoding="utf-8") as notes:
                  labelled = any(line.rstrip() == LABEL for line in notes.read().splitlines())
          except OSError:
              labelled = False  # the notes guard below owns a missing notes file
          if not labelled:
              print("no exact `" + LABEL + "` line in " + notes_path + ": nothing to reconcile")
              sys.exit(0)
          try:
              with open(report_path, encoding="utf-8") as report:
                  rows = [(row["metric"], row["verdict"]) for row in json.load(report)["verdicts"]]
          except (OSError, ValueError, KeyError, TypeError) as error:
              print("release refused: cannot read the perf verdicts " + report_path + ": " + repr(error))
              sys.exit(1)
          if not rows:
              print("release refused: the perf verdict report " + report_path + " has no rows")
              sys.exit(1)
          real = [str(metric) + "=" + str(verdict) for metric, verdict in rows if verdict != "ABSENT"]
          if real:
              print("release refused: notes say ABSENT but the ledger has PASS/FAIL/INDETERMINATE verdicts: update the notes (" + notes_path + " carries `" + LABEL + "`): " + ", ".join(real))
              sys.exit(1)
          print("perf label agrees: every metric is ABSENT")
          PY
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'maos*'
          merge-multiple: true
      - name: Generate SHA256SUMS and sign
        run: |
          cargo run -p xtask -- release-dry-run --manifest-only --dist-dir dist --targets x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,aarch64-apple-darwin
          cargo run -p xtask -- release-verify --sign --key-env RELEASE_SIGNING_KEY --sha256sums dist/SHA256SUMS --output dist/SHA256SUMS.sig
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
      - name: "Guardrail: production pubkey must differ from dev seed"
        run: |
          cargo test -p maos-audit production_pubkey_must_differ_from_dev_seed
        env:
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
      - name: Refuse bundled development release key
        run: |
          chmod +x dist/maosctl-linux-amd64
          embedded_pubkey="$(dist/maosctl-linux-amd64 release-pubkey)"
          if [[ "$embedded_pubkey" == "bedd2ba634da724027983f369149f108541f43e624a846438c01452ca7f469e7" ]]; then
            echo "release refused: maosctl embeds the documented development release key"
            exit 1
          fi
      - name: Verify artifacts (self-test)
        run: cargo run -p xtask -- release-verify --verify --sha256sums dist/SHA256SUMS --sig dist/SHA256SUMS.sig --artifacts-dir dist
        env:
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
      - name: Render recipes from signed artifacts and the trusted built maosctl
        env:
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
        run: |
          cargo build --locked -p maos-cli
          cargo run --locked -p xtask -- render-packages --maosctl target/debug/maosctl
          cp dist/recipes/verify-release.py dist/
      - uses: docker/setup-qemu-action@v3
      - name: Build deb and RPM for both Linux architectures without rewriting binaries
        run: |
          set -euo pipefail
          # The runner must own the source directory for later atomic renames.
          mkdir -p dist/packages
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" -v "$PWD:$PWD" -w "$PWD" ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential debhelper python3-cryptography rpm
              packaging/build-packages.sh dist deb dist/packages
              packaging/build-packages.sh dist rpm-ubuntu dist/packages
            '
          done
          python3 packaging/assemble-release-packaging.py dist
      - name: Sign and self-verify package metadata and payloads
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          MAOS_RELEASE_PUBKEY: ${{ secrets.MAOS_RELEASE_PUBKEY }}
        run: |
          cargo run --locked -p xtask -- release-verify --sign --key-env RELEASE_SIGNING_KEY --sha256sums dist/SHA256SUMS-packages --output dist/SHA256SUMS-packages.sig
          cargo run --locked -p xtask -- release-verify --verify --sha256sums dist/SHA256SUMS-packages --sig dist/SHA256SUMS-packages.sig --artifacts-dir dist
      - name: Require the release notes file (rc tags only)
        if: steps.tag.outputs.kind == 'rc'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # softprops/action-gh-release silently falls back to generated notes when
          # `body_path` cannot be read, so a missing rc notes file must fail here, loudly.
          if [[ ! -s "docs/release/${TAG}.md" ]]; then
            echo "release refused: docs/release/${TAG}.md is missing or empty (an rc tag needs its notes)"; exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/maos-linux-amd64
            dist/maosctl-linux-amd64
            dist/maos-registry-server-linux-amd64
            dist/maos-spirit-linux-amd64
            dist/maos-linux-arm64
            dist/maosctl-linux-arm64
            dist/maos-registry-server-linux-arm64
            dist/maos-spirit-linux-arm64
            dist/maos-darwin-arm64
            dist/maosctl-darwin-arm64
            dist/maos-registry-server-darwin-arm64
            dist/maos-spirit-darwin-arm64
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS-packages
            dist/SHA256SUMS-packages.sig
            dist/maos.rb
            dist/PKGBUILD
            dist/maos.spec
            dist/debian-recipes.tar.gz
            dist/verify-release.py
          fail_on_unmatched_files: true
          # The committed notes (`docs/release/<tag>.md`) come first; GitHub's generated
          # notes are appended after them (the action prepends `body` to the generated text).
          # A non-rc tag with no notes file falls back to the generated notes alone.
          body_path: docs/release/${{ github.ref_name }}.md
          generate_release_notes: true
          # SemVer: a hyphenated tag (v0.1.0-alpha.1) is a pre-release and must never
          # be served as `latest`. Derived from the tag so GA needs no edit here.
          prerelease: ${{ contains(github.ref_name, '-') }}
