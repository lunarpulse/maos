  corpus-merge:
    needs: [fuzz-link-1, fuzz-link-2, fuzz-link-3, fuzz-link-4, fuzz-link-5]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manifest_parser
            fuzz_dir: crates/maos-manifest/fuzz
            rss_flag: ''
          - target: frame_deser
