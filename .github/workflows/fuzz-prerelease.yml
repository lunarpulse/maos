  t3-ledger-collect:
    needs: [fuzz-link-1, fuzz-link-2, fuzz-link-3, fuzz-link-4, fuzz-link-5]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FUZZ_LEDGER_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: t3-record-*-${{ github.run_id }}
          merge-multiple: true
          path: records
      - name: Append completed links (never fabricate failed-link evidence)
        run: bash scripts/collect-ledger.sh fuzz records
      - name: Require all five links and at least 24h per target
        env:
          LINK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          results = json.loads(os.environ['LINK_RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), 'T3 link failed or did not run'
          records = [json.loads(path.read_text()) for path in pathlib.Path('records').glob('record-*.json')]
          for target in ['manifest_parser', 'frame_deser', 'fuzz_exec_deps_parse_elf']:
              links = [row for row in records if row['target'] == target]
              assert len(links) == 5, f'{target}: expected five measured link records'
              assert all(row['tier'] == 'T3' and row['commit'] == os.environ['GITHUB_SHA'] for row in links), 'tier/SHA mismatch'
              seconds = sum(row['cpu_seconds'] for row in links)
              assert seconds >= 86400, f'{target}: only {seconds} measured seconds (<24h)'
              print(f'{target}: {seconds} libFuzzer seconds; five links, zero crashes')
          PY
