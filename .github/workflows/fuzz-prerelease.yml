# T3 pre-release: PRD NFR-Sec-5/6, >=24h measured fuzzing per target, zero crashes.
# Four <=6h links cannot hold 24h plus setup under the hosted 6h job cap.
# Operator ruling: link COUNT yields to 24h; five 5h soaks leave setup headroom.
# The final assertion checks libFuzzer-measured seconds, never configured time.
# The rc release precondition is owned by 20-5, not implemented here.
name: fuzz-prerelease
on:
  workflow_dispatch:
  push:
    tags: ['v*-rc*']
permissions:
  contents: write
  actions: read
jobs:
  fuzz-link-1:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manifest_parser
            fuzz_dir: crates/maos-manifest/fuzz
            rss_flag: ''
          - target: frame_deser
            fuzz_dir: crates/maos-domain/fuzz
            rss_flag: '-rss_limit_mb=0'
          - target: fuzz_exec_deps_parse_elf
            fuzz_dir: crates/maos-exec-deps/fuzz
            rss_flag: ''
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-25 --component rust-src
          cargo install cargo-fuzz --locked
      - name: T3 link 1 (5h, runner-core workers, zero crashes)
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
        run: bash scripts/run-fuzz-link.sh '${{ matrix.fuzz_dir }}' '${{ matrix.target }}' 18000 T3 1 '${{ matrix.rss_flag }}'
      - name: Save corpus for next link
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-corpus-${{ matrix.target }}-1-${{ github.run_id }}
          path: ${{ matrix.fuzz_dir }}/corpus/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 90
      - name: Save one measured record per target and link
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-record-${{ matrix.target }}-1-${{ github.run_id }}
          path: out/record-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve worker logs and crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-logs-${{ matrix.target }}-1-${{ github.run_id }}
          path: out/
          retention-days: 90
