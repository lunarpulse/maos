# T3 pre-release: PRD NFR-Sec-5/6, >=24h measured fuzzing per target, zero crashes.
# Five 5h shards per target run IN PARALLEL (no `needs:` between links, no corpus hand-off
# between them; every shard starts from the same checked-in seed corpus). The evidence is
# unchanged: five link records per target of one run at the exact commit, >=86,400
# libFuzzer-measured seconds summed per target, zero crashes (check_release_precondition.rs).
# Each link hands its corpus to `corpus-merge` as ONE tar.zst archive (an artifact of 600k
# files exceeds upload-artifact's limits). `corpus-merge` unions the five archives into the
# next chain's seed; it is NOT a `needs` of `t3-ledger-collect`, so it can never void evidence.
# The final assertion checks libFuzzer-measured seconds, never configured time.
# The rc release precondition (`check-release-precondition --fuzz-ledger`, 20-5) reads
# this chain from the `fuzz-ledger` branch; it never starts it. The operator dispatches
# this workflow at the candidate SHA (`gh workflow run fuzz-prerelease.yml --ref main`)
# and waits for `t3-ledger-collect` BEFORE tagging: a tag push trigger would start a
# second ~26 h chain after the tag it was meant to precede.
name: fuzz-prerelease
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  fuzz-link-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manifest_parser
            fuzz_dir: crates/maos-manifest/fuzz
            rss_flag: ''
          - target: frame_deser
            fuzz_dir: crates/maos-domain/fuzz
            rss_flag: '-rss_limit_mb=0'
          - target: fuzz_exec_deps_parse_elf
            fuzz_dir: crates/maos-exec-deps/fuzz
            rss_flag: ''
          - target: cap_token_verify
            fuzz_dir: crates/maos-kernel-core/fuzz
            rss_flag: ''
          - target: i11_digest_chain
            fuzz_dir: crates/maos-kernel-core/fuzz
            rss_flag: ''
          - target: i8_consent_intent
            fuzz_dir: crates/maos-a2a-core/fuzz
            rss_flag: ''
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-25 --component rust-src
          cargo install cargo-fuzz --locked
      - name: T3 link 1 (5h, runner-core workers, zero crashes)
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
        run: bash scripts/run-fuzz-link.sh '${{ matrix.fuzz_dir }}' '${{ matrix.target }}' 18000 T3 1 '${{ matrix.rss_flag }}'
      - name: Minimize corpus before hand-off
        timeout-minutes: 30
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
        run: bash scripts/minimize-fuzz-corpus.sh '${{ matrix.fuzz_dir }}' '${{ matrix.target }}' '${{ matrix.rss_flag }}'
      # The measured record is saved BEFORE the corpus hand-off, so a hand-off failure (pack,
      # upload) can never skip it. It still only runs when the fuzz step AND the minimizer
      # (which fails on a confirmed crash) succeeded: no `always()`, a crash leaves no record.
      - name: Save one measured record per target and link
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-record-${{ matrix.target }}-1-${{ github.run_id }}
          path: out/record-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Pack corpus into one archive (one artifact file, never one file per input)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          corpus='${{ matrix.fuzz_dir }}/corpus/${{ matrix.target }}'
          archive='${{ runner.temp }}/t3-corpus-${{ matrix.target }}-1.tar.zst'
          count=$(find "$corpus" -type f | wc -l)
          echo "corpus files to pack: $count"
          test "$count" -gt 0
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$corpus" -cf - . | zstd -T0 -3 -q -f -o "$archive"
          zstd -tq "$archive"
          echo "archive bytes: $(stat -c %s "$archive") sha256: $(sha256sum "$archive" | cut -d' ' -f1) files: $count"
      - name: Save corpus for next link
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-corpus-${{ matrix.target }}-1-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-corpus-${{ matrix.target }}-1.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve worker logs and crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-logs-${{ matrix.target }}-1-${{ github.run_id }}
          path: out/
          retention-days: 90
