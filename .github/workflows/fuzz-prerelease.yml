            fuzz_dir: crates/maos-a2a-core/fuzz
            rss_flag: ''
    steps:
      - uses: actions/checkout@v5
      - name: Download the five shard corpus archives
        uses: actions/download-artifact@v4
        with:
          pattern: t3-corpus-${{ matrix.target }}-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/corpus-archives
      - name: Extract and union the five shard corpora
        timeout-minutes: 30
        run: |
          set -euo pipefail
          corpus='${{ matrix.fuzz_dir }}/corpus/${{ matrix.target }}'
          mkdir -p "$corpus"
          shopt -s nullglob
          archives=('${{ runner.temp }}/corpus-archives/t3-corpus-${{ matrix.target }}-'?.tar.zst)
          echo "shard archives found: ${#archives[@]}"
          test "${#archives[@]}" -eq 5
          for archive in "${archives[@]}"; do
            zstd -tq "$archive"
            tar --zstd --no-same-owner -xf "$archive" -C "$corpus"
            rm -f "$archive"
            echo "after $(basename "$archive"): $(find "$corpus" -type f | wc -l) files in the union"
          done
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-25 --component rust-src
          cargo install cargo-fuzz --locked
      - name: Minimize the union (libFuzzer -merge=1, the repo's guarded corpus minimizer)
        timeout-minutes: 60
        env:
          ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
        run: bash scripts/minimize-fuzz-corpus.sh '${{ matrix.fuzz_dir }}' '${{ matrix.target }}' '${{ matrix.rss_flag }}' 2400
      - name: Pack the merged corpus into one archive (one artifact file, never one file per input)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          corpus='${{ matrix.fuzz_dir }}/corpus/${{ matrix.target }}'
          archive='${{ runner.temp }}/t3-corpus-merged-${{ matrix.target }}.tar.zst'
          count=$(find "$corpus" -type f | wc -l)
          echo "corpus files to pack: $count"
          test "$count" -gt 0
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$corpus" -cf - . | zstd -T0 -3 -q -f -o "$archive"
          zstd -tq "$archive"
          echo "archive bytes: $(stat -c %s "$archive") sha256: $(sha256sum "$archive" | cut -d' ' -f1) files: $count"
      - name: Save merged corpus as the next chain seed
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-corpus-merged-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/t3-corpus-merged-${{ matrix.target }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Report a failed corpus merge (the T3 ledger evidence does not depend on it)
        if: failure()
        run: |
          echo "::warning::corpus-merge for ${{ matrix.target }} failed; it only feeds a LATER chain's seed and is not a needs of t3-ledger-collect, so the T3 ledger evidence of this run is unaffected"
          echo "corpus-merge ${{ matrix.target }} FAILED: next-chain seed missing; T3 ledger evidence is unaffected (t3-ledger-collect does not need corpus-merge)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve merge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: t3-merge-logs-${{ matrix.target }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
  t3-ledger-collect:
    needs: [fuzz-link-1, fuzz-link-2, fuzz-link-3, fuzz-link-4, fuzz-link-5]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FUZZ_LEDGER_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: t3-record-*-${{ github.run_id }}
          merge-multiple: true
          path: records
      - name: Append completed links (never fabricate failed-link evidence)
        run: bash scripts/collect-ledger.sh fuzz records
      - name: Require all five links and at least 24h per target
        env:
          LINK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          results = json.loads(os.environ['LINK_RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), 'T3 link failed or did not run'
          records = [json.loads(path.read_text()) for path in pathlib.Path('records').glob('record-*.json')]
          for target in ['manifest_parser', 'frame_deser', 'fuzz_exec_deps_parse_elf']:
              links = [row for row in records if row['target'] == target]
              assert len(links) == 5, f'{target}: expected five measured link records'
              assert all(row['tier'] == 'T3' and row['commit'] == os.environ['GITHUB_SHA'] for row in links), 'tier/SHA mismatch'
              seconds = sum(row['cpu_seconds'] for row in links)
              assert seconds >= 86400, f'{target}: only {seconds} measured seconds (<24h)'
              print(f'{target}: {seconds} libFuzzer seconds; five links, zero crashes')
          PY
