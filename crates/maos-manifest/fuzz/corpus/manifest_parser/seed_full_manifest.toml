[class]
name = "hello-spirit"
version = "0.1.0"
abi = "1.0"
manifest_schema_version = 1
min_substrate_version = "0.1.0-alpha"
forms = ["rust-inproc"]
trust_tier = "local"
description = "MAOS reference Spirit — structured acknowledgement"

[capabilities.required]
provider.complete = ["anthropic.claude-3-haiku-20240307"]

[posture]
default = "assistive"
allowed_max = "assistive"

[output_shape]
required_fields = ["introduction", "capability_scope", "posture", "halt_tags", "transparency_log"]

[budget]
context_window_size = 4096
time_cap_seconds = 30

[resources]
cpu_max_pct = 10
memory_max_mb = 64

[sandbox]
tier = "T0"

[author]
name = "MAOS Project"
homepage = "https://github.com/lunarpulse/maos"

[epistemic_policy]
default_action = "verbalize_only"
