[package]
name = "maos-manifest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
maos-manifest = { path = ".." }

[[bin]]
name = "manifest_parser"
path = "fuzz_targets/manifest_parser.rs"

# Standalone cargo-fuzz workspace root (keeps this fuzz project out of the
# repository root workspace — standard cargo-fuzz convention for in-tree crates).
[workspace]
