[package]
name = "maos-kernel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS kernel core — capability mediation, IAC bus, journal"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi", features = ["mock"] }
maos-providers = { path = "../maos-providers" }
maos-director-surface = { path = "../maos-director-surface" }
ciborium = "0.2"
hex = "0.4"
# Story 1b.1 — SQLite audit spine (Transparency Log + Approval Decision Log).
# Bundled feature statically links libsqlite3-sys; no system libsqlite3 dep.
# Eliminates per-host library-version drift risk (relevant to NFR-Onb-2).
rusqlite = { version = "0.31", features = ["bundled"] }
# Story 1b.1 — ULID frame IDs for Transparency Log rows.
# Zero new dep alternative: (boot_nonce ^ monotonic_counter) [u8; 16] newtype.
# ULID chosen for log greppability and sortability.
ulid = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2", features = ["tls"] }
# Story 1a.3 — default CryptoProvider adapter (FR48 / NFR-Sec-15 / §8.6).
# `ring` 0.17 is the canonical Rust crypto-primitives crate; pulled
# in by rustls, quinn, webpki, tokio-rustls in the Rust ecosystem.
# Pinned via the workspace's `Cargo.lock` to a specific patch version
# at PR-open time.
ring = "0.17"
# rustls 0.23 with explicit `ring` provider — types are declared so
# the v0.5+ mTLS A2A peer mesh (Story 6.3) can land without re-doing
# the dep introduction. At v0.1-α no rustls API is actually exercised;
# the dep is the future-story slot.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
arc-swap = "1.7"
dashmap = "6.1"
parking_lot = "0.12"
subtle = "2.6"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
maos-attrs = { path = "../maos-attrs" }
toml = "0.8"
sha2 = "0.10"
# Story 4.5 — cross-Spirit isolation corpus loader (runner-only; no runtime cost in --release).
maos-eval = { path = "../maos-eval" }
# Story 4.3 — optional cross-Spirit isolation framework (spirit_test feature).
maos-spirit-sdk = { path = "../maos-spirit-sdk", optional = true, features = ["spirit_test"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
win32job = "2"
windows = { version = "0.58", features = ["Win32_Security", "Win32_System_Threading", "Win32_Foundation"] }

[features]
default = []
# Story 4.3 — cross-Spirit isolation framework hooks for Story 4.5 corpus.
spirit_test = ["maos-spirit-sdk"]

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"] }
maos-spirit-hello = { path = "../maos-spirit-hello" }
smallvec = "1"

[[bench]]
name = "journal_fsync_p99"
harness = false

[[bench]]
name = "cap_token_verify_p99"
harness = false

[[bench]]
name = "hello_spirit_p95"
harness = false

[[bench]]
name = "hot_swap_latency"
harness = false
