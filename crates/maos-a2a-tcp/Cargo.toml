[package]
name = "maos-a2a-tcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS A2A TCP — live cross-Host JSON-RPC-over-mTLS/TCP transport (FR23b v1.5, Story 8.6)"

[dependencies]
# First-party/transport deps EXACTLY per epic AC-A2: core only (NOT the loopback
# crate, NOT the kernel crate) + tokio + tokio-rustls + rustls + tokio-util(codec).
# maos-domain types (IacFrame/HostId) ride through maos-a2a-core re-exports.
# (AC-T12(a) grep-asserts the kernel crate name is absent from this manifest.)
maos-a2a-core = { path = "../maos-a2a-core" }
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
# Implementation-necessity utility deps (beyond AC-A2's first-party/transport
# list): PEM/PKCS#8 loaders, the leaf-validity WebPKI step for the ca_roots=None
# posture, JSON-RPC (de)serialization onto the wire, and Sink/Stream ext traits
# for the Framed codec. Documented in the Dev Agent Record.
rustls-pemfile = "2"
webpki = { package = "rustls-webpki", version = "0.103" }
futures-util = { version = "0.3", features = ["sink"] }
tracing = "0.1"

[dev-dependencies]
maos-a2a-core = { path = "../maos-a2a-core" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-domain = { path = "../maos-domain" }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1"
rcgen = "0.13"
time = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
