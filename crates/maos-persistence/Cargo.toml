[package]
name = "maos-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS persistence — storage adapters for journal, transparency log, and memory tiers"

[dependencies]
# Story 21-3 — `FilePinStore` implements the `PinPersistence` port of the TOFU pin store.
maos-a2a-core = { path = "../maos-a2a-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
