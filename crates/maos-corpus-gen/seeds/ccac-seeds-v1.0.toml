# CCAC (ComplianceClaim Adversarial Corpus) Seed Corpus v1.0 — Story 7.3 / NFR-Aud-9.
# 64 SHA-pinned seed templates × 10 deterministic variations = N=640 envelopes.
#   * 20 well-formed templates (5 classes × 4)        → 200 admit envelopes
#   * 44 malformed templates                          → 440 reject envelopes
#       - 10 non-drift malformed classes × 3 templates × 10 = 300
#       - context_drift: 14 templates × 10             = 140 (exactly)
#         (7 DriftField families × 2 templates each)
# Per-class floor >=30 members; gate floor >=27/30 (>=90% expected verdict).
# Each envelope is bound to one of 3 reference Spirit contexts (hello / template-7-1 / synth-pu),
# rotated by variation index for the +-2% cross-validation gate.
# SHA-pinned; any edit requires updating CCAC_SEED_FILE_SHA256 + regenerating the JSONL.
# See: crates/maos-corpus-gen/src/ccac/mod.rs

