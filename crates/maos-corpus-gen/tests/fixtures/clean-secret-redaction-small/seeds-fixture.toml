# Clean smoke-scale fixture: 22 seeds (2 per class × 11 classes) producing 200 items.
# validate_all() MUST return all Valid; coverage_report() floor_satisfied MUST
# be true for all classes (proportional floor).

[[seeds]]
id = "api_key_anthropic-seed-001"
class = "api_key_anthropic"
pattern_regex = 'sk-ant-(api\d{2}|TEST)-[A-Za-z0-9_-]{10,}'
false_positive_negative_anchors = []
example_redacted_form = "<REDACTED:type=api_key_anthropic,len=N,hash=HEX>"

