[package]
name = "maos-corpus-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS parameterized corpus generators — secret-redaction + red-team frameworks (Story 0.5)"
build = "build.rs"

[lib]
name = "maos_corpus_gen"
path = "src/lib.rs"

[[bin]]
name = "maos-corpus-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
