[package]
name = "maos-corpus-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS parameterized corpus generators — secret-redaction + red-team frameworks (Story 0.5)"
build = "build.rs"

[lib]
name = "maos_corpus_gen"
path = "src/lib.rs"

[[bin]]
name = "maos-corpus-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
walkdir = "2.5"
# Story 7.3 CCAC generator — build REAL envelopes against the frozen schema
# using the SAME canonical encoder the admission evaluator uses.
maos-compliance = { path = "../maos-compliance" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
ring = "0.17"
hex = "0.4"
serde_cbor = "0.11"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
