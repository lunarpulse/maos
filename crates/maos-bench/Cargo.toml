[package]
name = "maos-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS §13.1 rust-inproc measurement gate — J1 founder-loop IPC + J4 Mira-Nash colocation latency benchmarks"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
maos-kernel-core = { path = "../maos-kernel-core", optional = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "rt-multi-thread", "time"], optional = true }

[dev-dependencies]
maos-spirit-hello = { path = "../maos-spirit-hello" }
criterion = "0.5"
tempfile = "3"

[features]
fixture_replay = []
kernel_measurement = ["maos-kernel-core", "tokio"]

[[bin]]
name = "section_13_1_run"
path = "src/bin/section_13_1_run.rs"

[[bench]]
name = "section_13_1"
harness = false
