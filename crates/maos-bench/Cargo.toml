[package]
name = "maos-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS §13.1 rust-inproc measurement gate — J1 founder-loop IPC + J4 Mira-Nash colocation latency benchmarks"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
maos-kernel-core = { path = "../maos-kernel-core" }
butler = { path = "../../spirits/butler" }
researcher = { path = "../../spirits/researcher" }
tempfile = "3"

[dev-dependencies]
maos-spirit-hello = { path = "../maos-spirit-hello" }
maos-audit = { path = "../maos-audit" }
# Story 11.2b (F7): cross-region round-trip SLO probe lives in the maos-bench
# test file; it pulls maos-loom-lite as a dev-dep (keeps loom-lite's manifest
# free of a leak-risk toggle — the slo-fault-inject feature is HERE, not there).
maos-loom-lite = { path = "../maos-loom-lite" }
# Story 11.2b (AC3): per-region halt-receipt PRESENCE observability reuses the
# termination corpus (NFR-Rel-11 ≥99.9% receipt presence, partitioned per region).
maos-eval = { path = "../maos-eval" }
# #[tokio::test] for the async round-trip probe (clean path, no feature).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# raw tokio_postgres::connect for the round-trip probe's leaf reads (the probe
# mirrors cross_region_live.rs: raw NoTls connect, not the deadpool wrapper).
tokio-postgres = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
criterion = "0.5"
smallvec = { version = "1", features = ["serde"] }
parking_lot = "0.12"
[features]
fixture_replay = []
kernel_measurement = ["tokio"]
# Story 10.4c AC2/D3: fault-injection for falsifiability gate. Implies
# kernel_measurement so injection lands on the real path, not smoke. MUST NOT
# appear in any release/GA feature set (compile_error! + CI cargo-tree check).
bench-fault-inject = ["kernel_measurement"]
# Story 11.2b AC2/F7: cross-region round-trip SLO fault injection (Arm-1,
# latency ONLY). Injects a fixed 15ms delay INSIDE the measured A→B→A span so a
# mutation test asserts p95 >= 14_000µs && !budget_met. Arm-1/latency only — it
# does NOT imply kernel_measurement (the round-trip uses loom-lite, not the
# kernel). MUST NOT appear in any release/GA feature set (compile_error! +
# CI cargo-tree --release absence check — SHIP-BLOCKER).
slo-fault-inject = []

[dependencies.tokio]
version = "1"
features = ["sync", "rt", "macros", "rt-multi-thread", "time"]
optional = true

[[bin]]
name = "section_13_1_run"
path = "src/bin/section_13_1_run.rs"

[[bench]]
name = "section_13_1"
harness = false

# Story 6.2 AC1 Task 0.1 — Story 6.1 D-4.* carry-forward closure.
# Measures per-frame IAC routing latency budget; NFR-Perf-1 baseline that
# Story 6.2 AC3 NFR-Perf-8 fan-out bench inherits.
# Gated behind `kernel_measurement` (same as section_13_1) because it needs
# real `maos-kernel-core` types at compile time.
[[bench]]
name = "iac_routing_budget"
harness = false
required-features = ["kernel_measurement"]

# Story 6.2 AC3 — NFR-Perf-8 orchestrator fan-out bench
# (50 concurrent Workers / 10 tasks/sec / 1h sustained / P99 ≤500ms / 0 dropped).
[[bench]]
name = "orchestrator_fanout_nfr_perf_8"
harness = false
required-features = ["kernel_measurement"]

# Story 9.1 — audit query read-path latency bench.
# Measures `maos_audit::query()` with single-spirit and global filters against
# a 12k-row temp-file SQLite fixture. No `kernel_measurement` feature needed.
[[bench]]
name = "audit_query_latency"
harness = false

# Story 10.4c AC3 (review D3) — J4 §13.1 latency regression track (Gate 2a).
# Mirrors iac_routing_budget / orchestrator_fanout_nfr_perf_8 (NFR-Perf-* idiom).
[[bench]]
name = "j4_latency_regression"
harness = false
required-features = ["kernel_measurement"]
