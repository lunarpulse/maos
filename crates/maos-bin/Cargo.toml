[package]
name = "maos-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS binary — the maos Host executable (Story 1a.2)"

[[bin]]
name = "maos"
path = "src/main.rs"

[features]
default = ["network"]
network = [
    "dep:maos-registry",
    "dep:maos-providers",
    "dep:maos-mcp",
    "dep:maos-a2a-tcp",
    "dep:maos-cohort",
    "dep:maos-notify-push",
    "dep:rcgen",
    "dep:maos-a2a",
    "dep:maos-sso",
    "dep:maos-secrets",
    "dep:maos-siem",
]
air-gap = []  # Compile-out all networking: reqwest, hyper client, tokio::net, DNS resolvers
wasm-host = ["dep:maos-wasm-host"]  # Story 11.1a — OFF by default. Gates the vendored `wasmtime` engine + maos-wasm-host/maos-wasm-runner. OFF-by-default is the export-control precondition (5D002.c.1) — see docs/compliance/export-counsel-precondition.md.
spirit_test = ["network", "maos-kernel-core/spirit_test", "maos-spirit-sdk/spirit_test"]
fixture_replay = ["network", "maos-mcp/fixture_replay", "maos-acp/fixture_replay", "maos-providers/fixture_replay", "maos-registry/fixture_replay", "maos-bench/fixture_replay"]
smoke_schedule = ["tokio/test-util"]

[dependencies]
maos-shell = { path = "../maos-shell" }
maos-cli = { path = "../maos-cli" }
maos-audit = { path = "../maos-audit" }
maos-director-surface = { path = "../maos-director-surface" }
maos-domain = { path = "../maos-domain" }
maos-kernel-core = { path = "../maos-kernel-core" }
maos-loom-lite = { path = "../maos-loom-lite" }
maos-pdp = { path = "../maos-pdp" }   # Story 11.4a — enterprise PDP (Cedar) adapter; composed at the root, optional via MAOS_PDP_POLICY
maos-escape-detector = { path = "../maos-escape-detector" }   # Story 11.4b — out-of-kernel sandbox-escape detector (ADR-024); read-only TL consumer wired at the composition root (NOT a kernel-core adapter; stays out of api.rs)
maos-sso = { path = "../maos-sso", optional = true }   # Story 11.4c — OIDC verify adapter (network-gated; composed at the root)
maos-secrets = { path = "../maos-secrets", optional = true }   # Story 11.4c — at-rest envelope AEAD (network-gated; composed at the root)
maos-siem = { path = "../maos-siem", optional = true }   # Story 11.4c — read-only TL projection + localhost SIEM sink (network-gated; composed at the root, stays out of api.rs)
maos-host = { path = "../maos-host" }   # Story 11.1a — Spirit Host Port trait types (needed even without wasmtime; the host abstraction is engine-agnostic)
maos-wasm-host = { path = "../maos-wasm-host", optional = true }   # Story 11.1a — wasmtime component adapter, behind `wasm-host` feature (export-control OFF-by-default, AC6)
maos-mcp = { path = "../maos-mcp", optional = true }
maos-notify-push = { path = "../maos-notify-push", optional = true }
maos-registry = { path = "../maos-registry", optional = true }
maos-acp = { path = "../maos-acp" }
maos-providers = { path = "../maos-providers", optional = true }
maos-bench = { path = "../maos-bench" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-spirit-hello = { path = "../maos-spirit-hello" }
maos-spirit-sdk = { path = "../maos-spirit-sdk" }
maos-a2a = { path = "../maos-a2a", optional = true }  # Story 6.3 — composition-root A2A router wiring + smoke arm
maos-iac = { path = "../maos-iac" }              # Story 12.1 — daemon-owned Transparency Log for cohort audit
maos-a2a-core = { path = "../maos-a2a-core" }  # Story 8.6 — protocol substrate (config/pin types for the daemon binding)
maos-a2a-tcp = { path = "../maos-a2a-tcp", optional = true }    # Story 8.6 — live cross-Host TCP/mTLS transport + smoke-a2a-tcp-8-6
maos-cohort = { path = "../maos-cohort", optional = true }      # Story 12.1 — signed cohort manifest state + distribution
rcgen = { version = "0.13", optional = true }  # Story 8.6 — runtime self-signed cert gen for the smoke-a2a-tcp-8-6 demo
maos-compliance = { path = "../maos-compliance" }   # Story 7.3 — v0.9-binding evaluator (smoke-compliance-7-3)
maos-spirit-cli = { path = "../maos-spirit-cli" }   # Story 7.3 — REAL producer round-trip in the smoke arm
maos-corpus-gen = { path = "../maos-corpus-gen" }   # Story 7.3 — CCAC slice replay + reference contexts
maos-skill = { path = "../maos-skill" }   # Story 7.4 — skill ecosystem (smoke-skill-7-4)
orchestrator = { path = "../../spirits/orchestrator" }   # Story 8.4 — founder-loop wedge (smoke-founder-loop-8-4)
architect = { path = "../../spirits/architect" }   # Story 8.4 — founder-loop wedge
reviewer = { path = "../../spirits/reviewer" }   # Story 8.4 — founder-loop wedge
worker = { path = "../../spirits/worker" }   # Story 8.4 — founder-loop wedge (canned CLI output)
mira = { path = "../../spirits/mira" }   # Story 8.5 — Mira+Nash bilateral pair (smoke-mira-nash-8-5)
nash = { path = "../../spirits/nash" }   # Story 8.5 — Mira+Nash bilateral pair
butler = { path = "../../spirits/butler" }       # Story 8.11 — `maos run butler` daemon load + boot-loud EpistemicScalarPort
researcher = { path = "../../spirits/researcher" }   # Story 8.11 — `maos run researcher` daemon load + live inference seam
maos-digest = { path = "../../spirits/digest" }   # Story 12.4b — J3 day-30 narrative digest render + I11 persist tail
# Story 8.14b — async-trait for LiveButlerMcpPort (ButlerMcpPort impl in composition root).
async-trait = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hex = "0.4"
sha2 = "0.10"
ring = "0.17"
serde_cbor = "0.11"
tar = { version = "0.4", default-features = false }
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
# Story 11.4c — the out-of-kernel `identity.asserted` (kind 30) write helper
# (`enterprise_identity::append_identity_asserted`) opens the Transparency Log
# read-write from the composition root. Moved here from `maos-audit` (Epic-12
# retro 2026-07-14) to keep that crate read-only per Story 9.2 Decision A.2 /
# the `maos-audit-read-only` gate. Already in maos-bin's link closure transitively
# via the kernel-core TL adapter — a direct dep just exposes the API.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", features = ["std"] }   # Story 12.3 — sign a cohort manifest fixture for the Fact-2 provenance test
