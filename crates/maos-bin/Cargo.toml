[package]
name = "maos-bin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS binary — the maos Host executable (Story 1a.2)"

[[bin]]
name = "maos-bin"
path = "src/main.rs"

[features]
spirit_test = ["maos-kernel-core/spirit_test", "maos-spirit-sdk/spirit_test"]
fixture_replay = ["maos-mcp/fixture_replay", "maos-acp/fixture_replay", "maos-providers/fixture_replay", "maos-registry/fixture_replay", "maos-bench/fixture_replay"]
smoke_schedule = ["tokio/test-util"]

[dependencies]
maos-audit = { path = "../maos-audit" }
maos-director-surface = { path = "../maos-director-surface" }
maos-domain = { path = "../maos-domain" }
maos-kernel-core = { path = "../maos-kernel-core" }
maos-mcp = { path = "../maos-mcp" }
maos-registry = { path = "../maos-registry" }
maos-acp = { path = "../maos-acp" }
maos-providers = { path = "../maos-providers" }
maos-bench = { path = "../maos-bench" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-spirit-hello = { path = "../maos-spirit-hello" }
maos-spirit-sdk = { path = "../maos-spirit-sdk" }
maos-a2a = { path = "../maos-a2a" }  # Story 6.3 — composition-root A2A router wiring + smoke arm
maos-compliance = { path = "../maos-compliance" }   # Story 7.3 — v0.9-binding evaluator (smoke-compliance-7-3)
maos-spirit-cli = { path = "../maos-spirit-cli" }   # Story 7.3 — REAL producer round-trip in the smoke arm
maos-corpus-gen = { path = "../maos-corpus-gen" }   # Story 7.3 — CCAC slice replay + reference contexts
maos-skill = { path = "../maos-skill" }   # Story 7.4 — skill ecosystem (smoke-skill-7-4)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"
serde_json = "1.0"
toml = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hex = "0.4"
sha2 = "0.10"
ring = "0.17"
serde_cbor = "0.11"
tar = { version = "0.4", default-features = false }
smallvec = { version = "1", features = ["serde"] }
