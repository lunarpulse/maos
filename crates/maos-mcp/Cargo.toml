[package]
name = "maos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS MCP — Model Context Protocol gateway and adapters"

[dependencies]
maos-domain = { path = "../maos-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
fixture_replay = []

# The integration test consumes `maos_mcp::fixture_replay`, which is gated
# behind `#[cfg(any(test, feature = "fixture_replay"))]`. `cfg(test)` does NOT
# propagate to integration tests (they link the lib as an external crate), so
# the module is only visible here when the feature is enabled. `required-features`
# makes `cargo build --all-targets` skip this target unless the feature is on,
# instead of failing with an unresolved import.
[[test]]
name = "mcp_client_trait_test"
required-features = ["fixture_replay"]
