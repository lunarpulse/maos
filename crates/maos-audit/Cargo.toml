[package]
name = "maos-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS audit — read-side SQLite query adapter for Transparency Log + Approval Decision Log"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
maos-domain = { path = "../maos-domain" }
# Story 9.1 FR44 — sealed-export Ed25519 signing (Decision B: NOT ring)
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
# Story 9.4b AC-5 (re-ratification R3) — region-bound TL signing-key derivation.
# RustCrypto `hkdf` (HKDF-SHA256 over the existing `sha2`, pulls `hmac`) —
# consistent with Decision B (NOT ring) and the audited RustCrypto stack;
# no hand-rolled KDF (Winston ruling).
hkdf = "0.12"

[dev-dependencies]
tempfile = "3"
maos-kernel-core = { path = "../maos-kernel-core" }
# Story 1b.5b — fixture generator binary. Synthetic FR4 NDJSON producer that
# never touches `maos-kernel-core`; uses only existing deps (`serde_json`)
# plus a hand-rolled LCG for determinism. Lives under `src/bin/` so it does
# NOT enter the library dependency graph — `cargo tree -p maos-audit` is
# unaffected.
[[bin]]
name = "gen_fixture"
path = "src/bin/gen_fixture.rs"
[[bin]]
name = "gen_gdpr_cascade"
path = "src/bin/gen_gdpr_cascade.rs"

