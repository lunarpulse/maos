[package]
name = "maos-spirit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS Spirit-author CLI — `maos-spirit publish` (FR35) producer-side CLI (Story 7.2 v1.0)"

[[bin]]
name = "maos-spirit"
path = "src/bin/maos-spirit.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

maos-domain = { path = "../maos-domain" }
maos-mcp = { path = "../maos-mcp" }
maos-registry = { path = "../maos-registry" }
maos-spirit-abi = { path = "../maos-spirit-abi" }

[features]
default = []
fixture_replay = ["maos-mcp/fixture_replay", "maos-registry/fixture_replay"]
