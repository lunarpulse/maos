[package]
name = "maos-domain-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
maos-domain = { path = ".." }
serde_json = "1.0"
serde_cbor = "0.11"

[[bin]]
name = "frame_deser"
path = "fuzz_targets/frame_deser.rs"

# Standalone cargo-fuzz workspace root (keeps this fuzz project out of the
# repository root workspace — standard cargo-fuzz convention for in-tree crates).
[workspace]
