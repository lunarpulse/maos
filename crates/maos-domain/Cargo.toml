[package]
name = "maos-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS domain core — pure types, invariants, and pure functions (ADR-010)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
maos-spirit-abi = { path = "../maos-spirit-abi" }
smallvec = { version = "1", features = ["serde"] }
serde_json = "1.0"
hex = "0.4"
# Story 6.3 — A2ARouter port trait (async via tokio::sync — kept minimal).
# Per ADR-010, `maos-domain` carries the trait shapes; adapters in
# `maos-a2a` implement. The `async-trait` macro is already pulled in by
# `IacBusPort::deliver` (Story 6.1 broke the sync-only constraint).
async-trait = "0.1"

[dev-dependencies]
