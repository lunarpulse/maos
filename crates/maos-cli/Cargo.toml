[package]
name = "maos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS CLI — maosctl command-line interface (Story 1a.4)"

[[bin]]
name = "maosctl"
path = "src/main.rs"

[lib]
name = "maos_cli"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"    # Story 9.3b — calendar-safe month-range parsing
clap = { version = "4.5", features = ["derive"] }
maos-audit = { path = "../maos-audit" }
maos-domain = { path = "../maos-domain" }  # Story 9.1 FR44 — audit key loader
maos-registry = { path = "../maos-registry" }
maos-compliance = { path = "../maos-compliance" }
maos-skill = { path = "../maos-skill" }   # Story 7.4 — `maosctl skills` discovery + admission exit
maos-iac = { path = "../maos-iac" }       # Story 9.7 AC-7 — write-capable TL adapter for skill admission journal
rusqlite = { version = "0.31", features = ["bundled", "backup"] }  # Story 9.4 AC-3 — TL backup/restore
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
thiserror = "2"  # Story 9.4 AC-3 — typed backup/DR errors
toml = "0.8"
hex = "0.4"       # Story 9.1 FR44 — pubkey hex encoding in verify-bundle
maos-loom-lite = { path = "../maos-loom-lite" }  # Story 10.4a — SQLite→Postgres migration CLI
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }  # Story 10.4a — async runtime for migration engine
tokio-postgres = "0.7"  # Story 10.4a — Postgres client for migration target
# `j1-crosshost-2e` AC2 (F1) — `maosctl cohort sign`. `maos-cohort` owns the
# canonical manifest form (`to_canonical_bytes`) and `signed_with`; `ed25519-dalek`
# is DIRECT because `signed_with` takes an `ed25519_dalek::SigningKey` and
# `maos-cohort` re-exports the manifest types but not `SigningKey`, so the
# transitive dependency is not importable.
maos-cohort = { path = "../maos-cohort" }
ed25519-dalek = { version = "2", features = ["std"] }
[dev-dependencies]
# Story 1b.5b — accessibility ANSI test. Both crates are already in the
# workspace via `maos-audit`, so `Cargo.lock` may grow by maos-iac's transitive deps.
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
