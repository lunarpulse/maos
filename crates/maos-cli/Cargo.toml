[package]
name = "maos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS CLI — maosctl command-line interface (Story 1a.4)"

[[bin]]
name = "maosctl"
path = "src/main.rs"

[lib]
name = "maos_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
maos-audit = { path = "../maos-audit" }
maos-registry = { path = "../maos-registry" }
serde_json = "1"

[dev-dependencies]
# Story 1b.5b — accessibility ANSI test. Both crates are already in the
# workspace via `maos-audit`, so `Cargo.lock` does NOT grow.
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
