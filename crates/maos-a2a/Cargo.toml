[package]
name = "maos-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS A2A — Agent-to-Agent cross-Host bilateral communication (ADR-012)"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-capability = { path = "../maos-capability" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dashmap = "6.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
smallvec = "1"
toml = "0.8"

[features]
default = []
# Calibration-phase mode for chaos + churn harnesses (v0.5 — report, do not enforce).
calibration_phase = []
