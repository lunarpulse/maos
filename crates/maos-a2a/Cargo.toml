[package]
name = "maos-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS A2A — in-process loopback A2A router over the maos-a2a-core protocol substrate (ADR-012)"

[dependencies]
maos-a2a-core = { path = "../maos-a2a-core" }
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0"
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
smallvec = "1"
toml = "0.8"

[features]
default = []
# Calibration-phase mode for chaos + churn harnesses (v0.5 — report, do not enforce).
# Forwarded to maos-a2a-core where the harness lives.
calibration_phase = ["maos-a2a-core/calibration_phase"]
