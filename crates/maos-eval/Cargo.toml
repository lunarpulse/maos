[package]
name = "maos-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS evaluation harness — corpora + measurement gates (halt-recall, halt-precision, receipt-rate)"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-audit = { path = "../maos-audit", optional = true }
maos-spirit-sdk = { path = "../maos-spirit-sdk", features = ["local_runner"], optional = true }
serde = { version = "1.0", features = ["derive"] }
# Story 18-2 review (BH-1/EC-1) — `raw_value`: the halt benchmark sidecar keeps its
# body's exact signed bytes, so verification never re-encodes a float.
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
walkdir = "2"
# Story 7.5b — SHA-256 pinning of the Butler-class fixture corpus (the resolver
# logs which corpus + digest it scored against; mirrors xtask's sha2 usage).
sha2 = "0.10"

[features]
trial-attestation = ["maos-audit", "maos-spirit-sdk"]
# Story 18-2 (D-18-2-04 A) — Ed25519 signing/verification of the halt benchmark sidecar.
benchmark-sidecar = ["maos-audit"]

[dev-dependencies]
maos-kernel-core = { path = "../maos-kernel-core" }
tempfile = "3"
# Story 7.5b AC8 — the dry-run self-trial runs a real Spirit through LocalRunner
# and scores it via this crate's harness (tests/onb_1_self_trial.rs).
maos-spirit-sdk = { path = "../maos-spirit-sdk", features = ["local_runner"] }
toml = "0.8"
