[package]
name = "maos-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS secrets — OS keyring and secret-provider adapters (NFR-Sec-16)"

[dependencies]
maos-domain = { path = "../maos-domain" }
getrandom = "0.3"
ring = "0.17"
sha2 = "0.10"
tempfile = { version = "3.8", optional = true }
# Story 23-8 (D-23-8-06 A, D-23-8-09 A) — the external KMS adapter and its timed transport. Enabled only by maos-bin's `online-adapters`.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
serde_json = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.8"
maos-kernel-core = { path = "../maos-kernel-core" }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]
encrypted-file = ["dep:tempfile"]
http-kms = ["dep:ureq", "dep:serde_json", "dep:base64", "encrypted-file"]  # the external KMS's production reader is the encrypted-file store (D-23-8-05 A)
kms-fault-inject = []

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2", optional = true, default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", optional = true, default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", optional = true, default-features = false, features = ["v1", "windows-native-keyring-store"] }
