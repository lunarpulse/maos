[package]
name = "maos-orchestrator-buffer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FR20 Orchestrator instruction buffer (user-space; moved out of maos-kernel-core by 21-5)"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-iac = { path = "../maos-iac" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-manifest = { path = "../maos-manifest" }
maos-attrs = { path = "../maos-attrs" }
maos-capability = { path = "../maos-capability" }  # cap_tokens::monotonic_now_ns (gateway uninstall timestamp)
dashmap = "6.1"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread"] }
serde_json = "1.0"
