[package]
name = "maos-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS shell — J0 evaluator surface (init, REPL, audit query)"

[dependencies]
maos-audit = { path = "../maos-audit" }
maos-cli = { path = "../maos-cli" }
maos-director-surface = { path = "../maos-director-surface" }
maos-domain = { path = "../maos-domain" }
maos-kernel-core = { path = "../maos-kernel-core" }
maos-spirit-hello = { path = "../maos-spirit-hello" }
maos-skill = { path = "../maos-skill" }
maos-providers = { path = "../maos-providers" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
