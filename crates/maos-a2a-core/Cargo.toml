[package]
name = "maos-a2a-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAOS A2A core — transport-agnostic ADR-012 protocol substrate (extracted from maos-a2a, Story 8.6)"

[dependencies]
maos-domain = { path = "../maos-domain" }
maos-spirit-abi = { path = "../maos-spirit-abi" }
maos-capability = { path = "../maos-capability" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
# NOTE (epic AC-A2): this crate is transport-agnostic — it deliberately omits
# tokio's socket feature and the live-wire async-TLS / codec crates (those are
# maos-a2a-tcp-only). It carries `sync`/`time`/`rt` only for the in-memory
# engine + chaos harness, and `rustls` for the verifier-driven mTLS config
# types in `mtls`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
dashmap = "6.1"
sha2 = "0.10"
hex = "0.4"
# Story 8.7 / AC5 — structured `warn!` for unreachable ADR-012 allowlist
# entries (the "silent never-match" failure mode made loud). `tracing 0.1` is
# the workspace-standard facade (maos-skill / maos-manifest / maos-registry).
tracing = "0.1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
smallvec = "1"
toml = "0.8"
# Story 8.7 / AC5 — capture the unreachable-entry `warn!` so the diagnostic is
# regression-pinned (Murat round-1 condition), using the already-vendored
# `tracing-subscriber` (no new external crate) rather than `tracing-test`.
tracing-subscriber = "0.3"
# j1-crosshost-2c AC3.5 — test-only fake correlation ports whose interior
# mutability is locked and immediately used; `parking_lot` avoids the poisoning
# unwrap boilerplate the project rule forbids. Already vendored via maos-iac.
parking_lot = "0.12"

[features]
default = []
# Calibration-phase mode for chaos + churn harnesses (v0.5 — report, do not enforce).
calibration_phase = []
